<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whac-A-Bunny</title>

<!-- ============================================================
     STYLES
     ============================================================ -->
<style>
  :root {
    --sky: #aee7ff;
    --grass: #7ec850;
    --grass-dark: #5ea83c;
    --dirt: #6b4226;
    --dirt-dark: #4a2c17;
    --accent: #ff8c42;
    --text: #2d2a26;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background: linear-gradient(to bottom, var(--sky) 0%, #d8f5b8 18%, var(--grass) 18%, var(--grass-dark) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }

  /* ---------- HUD ---------- */
  #hud {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .hud-box {
    background: #fffbe8;
    border: 3px solid var(--dirt);
    border-radius: 14px;
    padding: 6px 18px;
    font-size: clamp(16px, 3.5vw, 24px);
    font-weight: bold;
    box-shadow: 0 3px 0 var(--dirt-dark);
    min-width: 110px;
    text-align: center;
  }

  #timer-box.low { color: #d0342c; animation: pulse .5s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

  #sound-btn {
    background: #fffbe8;
    border: 3px solid var(--dirt);
    border-radius: 14px;
    padding: 6px 14px;
    font-size: clamp(16px, 3.5vw, 24px);
    cursor: pointer;
    box-shadow: 0 3px 0 var(--dirt-dark);
  }
  #sound-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--dirt-dark); }

  /* ---------- GAME BOARD ---------- */
  #game {
    position: relative;
    width: min(92vw, 66vh, 560px);
    aspect-ratio: 1;
    cursor: none; /* replaced by hammer cursor */
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4%;
    width: 100%;
    height: 100%;
  }

  .burrow {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* dark hole opening (BEHIND the bunny) */
  .hole {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 38%;
    background: radial-gradient(ellipse at 50% 40%, #1e120a 0%, var(--dirt-dark) 55%, var(--dirt) 85%);
    border-radius: 50%;
    z-index: 1;
  }

  /* front lip of the hole (IN FRONT of the bunny) — lower half only */
  .hole-front {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 38%;
    background: radial-gradient(ellipse at 50% 30%, var(--dirt-dark) 0%, var(--dirt) 70%);
    border-radius: 50%;
    box-shadow: inset 0 6px 10px rgba(0,0,0,.45), 0 4px 0 var(--grass-dark);
    clip-path: inset(48% 0 0 0);
    z-index: 3;
  }

  /* grass tufts on mound edge */
  .hole::before, .hole::after {
    content: "";
    position: absolute;
    top: -8px;
    width: 18%;
    height: 14px;
    background: var(--grass-dark);
    clip-path: polygon(0 100%, 20% 20%, 35% 100%, 50% 0, 65% 100%, 80% 30%, 100% 100%);
  }
  .hole::before { left: 8%; }
  .hole::after  { right: 8%; transform: scaleX(-1); }

  /* clipping window so bunny rises out of the hole's opening */
  .bunny-window {
    position: absolute;
    bottom: 19%;
    width: 70%;
    height: 81%;
    left: 15%;
    overflow: hidden;
    z-index: 2;
    pointer-events: none;
  }

  .bunny {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 78%;
    transform: translateX(-50%) translateY(105%);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1); /* springy pop */
    pointer-events: none;
  }
  .bunny.up   { transform: translateX(-50%) translateY(0); }
  .bunny.bonk { transform: translateX(-50%) translateY(30%) scaleY(.75); transition: transform .1s ease-in; }

  /* hit star burst */
  .burst {
    position: absolute;
    left: 50%;
    top: 30%;
    width: 34%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%) scale(0);
    z-index: 6;
    pointer-events: none;
  }
  .burst.show { animation: burst .35s ease-out forwards; }
  @keyframes burst {
    0%   { transform: translate(-50%,-50%) scale(.2) rotate(0deg);   opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1.4) rotate(40deg); opacity: 0; }
  }

  /* floating +1 */
  .plus-one {
    position: absolute;
    left: 50%;
    top: 20%;
    transform: translateX(-50%);
    font-size: clamp(16px, 3vw, 26px);
    font-weight: bold;
    color: #ff5722;
    text-shadow: 1px 1px 0 #fff;
    opacity: 0;
    z-index: 7;
    pointer-events: none;
  }
  .plus-one.show { animation: rise .6s ease-out forwards; }
  @keyframes rise {
    0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-45px); }
  }

  /* ---------- HAMMER CURSOR ---------- */
  #hammer {
    position: fixed;
    width: clamp(56px, 9vw, 84px);
    pointer-events: none;
    z-index: 50;
    transform: translate(-30%, -75%) rotate(-25deg);
    transform-origin: 75% 85%;
    transition: transform .07s ease-out;
    display: none;
  }
  #hammer.swing { transform: translate(-30%, -75%) rotate(28deg); }

  /* ---------- OVERLAYS (start / game over) ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 251, 232, .93);
    border: 4px solid var(--dirt);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    z-index: 20;
    cursor: default;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: clamp(26px, 6vw, 44px); color: var(--dirt); }
  .overlay p  { font-size: clamp(15px, 3vw, 20px); }
  #final-score { font-size: clamp(34px, 8vw, 60px); color: var(--accent); font-weight: bold; }

  .big-btn {
    font-family: inherit;
    font-size: clamp(18px, 4vw, 26px);
    font-weight: bold;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 16px;
    padding: 12px 34px;
    cursor: pointer;
    box-shadow: 0 5px 0 #c9611f;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c9611f; }
</style>
</head>
<body>

<!-- ============================================================
     HUD
     ============================================================ -->
<div id="hud">
  <div class="hud-box">🥕 <span id="score">0</span></div>
  <div class="hud-box" id="timer-box">⏱ <span id="timer">60</span>s</div>
  <button id="sound-btn" title="Toggle sound">🔊</button>
</div>

<!-- ============================================================
     GAME BOARD
     ============================================================ -->
<div id="game">
  <div id="grid"></div>

  <div class="overlay" id="start-screen">
    <h1>Whac-A-Bunny!</h1>
    <p>Bonk the bunnies before they hide!<br>You have 60 seconds. 🐰🔨</p>
    <button class="big-btn" id="start-btn">Start</button>
  </div>

  <div class="overlay hidden" id="gameover-screen">
    <h1>Time's Up!</h1>
    <p>Your score:</p>
    <div id="final-score">0</div>
    <button class="big-btn" id="restart-btn">Restart</button>
  </div>
</div>

<!-- ============================================================
     HAMMER CURSOR (SVG)
     ============================================================ -->
<svg id="hammer" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="44" y="34" width="12" height="58" rx="5" fill="#c98a4b" stroke="#8a5a2b" stroke-width="3"/>
  <rect x="18" y="8" width="64" height="30" rx="10" fill="#9e9e9e" stroke="#5c5c5c" stroke-width="3"/>
  <rect x="24" y="13" width="14" height="8" rx="4" fill="#cfcfcf"/>
</svg>

<!-- ============================================================
     BUNNY SVG TEMPLATE
     ============================================================ -->
<template id="bunny-template">
  <svg class="bunny" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <!-- ears -->
    <ellipse cx="35" cy="26" rx="10" ry="24" fill="#f5f0ea" stroke="#b7a99a" stroke-width="3"/>
    <ellipse cx="65" cy="26" rx="10" ry="24" fill="#f5f0ea" stroke="#b7a99a" stroke-width="3"/>
    <ellipse cx="35" cy="28" rx="5" ry="16" fill="#ffb6c1"/>
    <ellipse cx="65" cy="28" rx="5" ry="16" fill="#ffb6c1"/>
    <!-- head/body -->
    <ellipse cx="50" cy="78" rx="34" ry="38" fill="#f5f0ea" stroke="#b7a99a" stroke-width="3"/>
    <!-- eyes -->
    <circle cx="38" cy="70" r="5" fill="#2d2a26"/>
    <circle cx="62" cy="70" r="5" fill="#2d2a26"/>
    <circle cx="40" cy="68" r="1.8" fill="#fff"/>
    <circle cx="64" cy="68" r="1.8" fill="#fff"/>
    <!-- nose + mouth -->
    <ellipse cx="50" cy="82" rx="5" ry="4" fill="#ff8fa3"/>
    <path d="M50 86 Q50 92 44 93 M50 86 Q50 92 56 93" fill="none" stroke="#b7a99a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- teeth -->
    <rect x="45" y="90" width="5" height="8" rx="2" fill="#fff" stroke="#b7a99a" stroke-width="1.5"/>
    <rect x="50" y="90" width="5" height="8" rx="2" fill="#fff" stroke="#b7a99a" stroke-width="1.5"/>
    <!-- cheeks -->
    <circle cx="26" cy="82" r="6" fill="#ffd3dc" opacity=".8"/>
    <circle cx="74" cy="82" r="6" fill="#ffd3dc" opacity=".8"/>
  </svg>
</template>

<!-- ============================================================
     STAR BURST SVG TEMPLATE
     ============================================================ -->
<template id="burst-template">
  <svg class="burst" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <polygon points="50,0 61,35 98,35 68,57 79,91 50,70 21,91 32,57 2,35 39,35"
             fill="#ffd700" stroke="#ff8c42" stroke-width="4"/>
  </svg>
</template>

<script>
"use strict";

/* ============================================================
   CONSTANTS & STATE
   ============================================================ */
const GAME_LENGTH   = 60;          // seconds
const BUNNY_VISIBLE = 1100;        // ms bunny stays up
const SPAWN_MIN     = 700;         // ms between spawns
const SPAWN_MAX     = 1600;

const state = {
  playing: false,
  score: 0,
  timeLeft: GAME_LENGTH,
  soundOn: true,
  activeCell: -1,        // index of cell with a live bunny, -1 = none
  spawnTimer: null,
  hideTimer: null,
  clockTimer: null,
};

/* ============================================================
   DOM SETUP — build the 3x3 grid of burrows
   ============================================================ */
const grid  = document.getElementById("grid");
const cells = [];

for (let i = 0; i < 9; i++) {
  const cell = document.createElement("div");
  cell.className = "burrow";
  cell.dataset.index = i;

  const windowEl = document.createElement("div");
  windowEl.className = "bunny-window";
  windowEl.appendChild(document.getElementById("bunny-template").content.firstElementChild.cloneNode(true));

  const hole = document.createElement("div");
  hole.className = "hole";

  const holeFront = document.createElement("div");
  holeFront.className = "hole-front";

  const burst = document.getElementById("burst-template").content.firstElementChild.cloneNode(true);

  const plusOne = document.createElement("div");
  plusOne.className = "plus-one";
  plusOne.textContent = "+1";

  cell.append(hole, windowEl, holeFront, burst, plusOne);
  grid.appendChild(cell);
  cells.push({
    el: cell,
    bunny: windowEl.querySelector(".bunny"),
    burst,
    plusOne,
  });
}

const gameEl     = document.getElementById("game");
const scoreEl    = document.getElementById("score");
const timerEl    = document.getElementById("timer");
const timerBox   = document.getElementById("timer-box");
const hammer     = document.getElementById("hammer");
const soundBtn   = document.getElementById("sound-btn");
const startScr   = document.getElementById("start-screen");
const overScr    = document.getElementById("gameover-screen");
const finalScore = document.getElementById("final-score");

/* ============================================================
   AUDIO — tiny WebAudio synth (no external files)
   ============================================================ */
let audioCtx = null;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function tone(freq, duration, type = "sine", volume = 0.25, slideTo = null) {
  if (!state.soundOn) return;
  const ctx  = getCtx();
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + duration);
  gain.gain.setValueAtTime(volume, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}

const sfx = {
  pop:  () => tone(300, 0.12, "sine", 0.2, 600),                 // rising blip
  hit:  () => { tone(880, 0.08, "square", 0.18); tone(1320, 0.12, "square", 0.12); },
  miss: () => tone(220, 0.2, "sawtooth", 0.12, 110),             // sad slide down
};

/* ============================================================
   BUNNY SPAWN / HIDE LOGIC
   ============================================================ */
function randomDelay() {
  return SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN);
}

function spawnBunny() {
  if (!state.playing) return;

  // pick a random cell different from the last one
  let idx;
  do { idx = Math.floor(Math.random() * 9); } while (idx === state.activeCell);

  state.activeCell = idx;
  cells[idx].bunny.classList.remove("bonk");
  cells[idx].bunny.classList.add("up");
  sfx.pop();

  // bunny retreats after BUNNY_VISIBLE ms
  state.hideTimer = setTimeout(() => hideBunny(idx), BUNNY_VISIBLE);

  // schedule next spawn
  state.spawnTimer = setTimeout(spawnBunny, randomDelay());
}

function hideBunny(idx) {
  cells[idx].bunny.classList.remove("up");
  if (state.activeCell === idx) state.activeCell = -1;
}

/* ============================================================
   INPUT — hammer cursor + click handling
   ============================================================ */
function moveHammer(x, y) {
  hammer.style.display = "block";
  hammer.style.left = x + "px";
  hammer.style.top  = y + "px";
}

gameEl.addEventListener("pointermove", e => moveHammer(e.clientX, e.clientY));
gameEl.addEventListener("pointerleave", () => { hammer.style.display = "none"; });

gameEl.addEventListener("pointerdown", e => {
  moveHammer(e.clientX, e.clientY);

  // hammer swing animation
  hammer.classList.add("swing");
  setTimeout(() => hammer.classList.remove("swing"), 90);

  if (!state.playing) return;

  const cell = e.target.closest(".burrow");
  const idx  = cell ? Number(cell.dataset.index) : -1;

  if (idx !== -1 && idx === state.activeCell) {
    hitBunny(idx);
  } else {
    sfx.miss();
  }
});

function hitBunny(idx) {
  state.activeCell = -1;
  clearTimeout(state.hideTimer);

  state.score++;
  scoreEl.textContent = state.score;
  sfx.hit();

  const c = cells[idx];

  // squash then retreat
  c.bunny.classList.add("bonk");
  setTimeout(() => { c.bunny.classList.remove("up", "bonk"); }, 110);

  // star burst + floating +1 (restart animations)
  for (const el of [c.burst, c.plusOne]) {
    el.classList.remove("show");
    void el.offsetWidth; // reflow to retrigger animation
    el.classList.add("show");
  }
}

/* ============================================================
   GAME FLOW — start, clock, game over
   ============================================================ */
function startGame() {
  state.playing  = true;
  state.score    = 0;
  state.timeLeft = GAME_LENGTH;
  state.activeCell = -1;

  scoreEl.textContent = "0";
  timerEl.textContent = GAME_LENGTH;
  timerBox.classList.remove("low");
  startScr.classList.add("hidden");
  overScr.classList.add("hidden");

  cells.forEach(c => c.bunny.classList.remove("up", "bonk"));

  state.clockTimer = setInterval(tick, 1000);
  state.spawnTimer = setTimeout(spawnBunny, randomDelay());
}

function tick() {
  state.timeLeft--;
  timerEl.textContent = state.timeLeft;
  if (state.timeLeft <= 10) timerBox.classList.add("low");
  if (state.timeLeft <= 0) endGame();
}

function endGame() {
  state.playing = false;
  clearInterval(state.clockTimer);
  clearTimeout(state.spawnTimer);
  clearTimeout(state.hideTimer);

  if (state.activeCell !== -1) hideBunny(state.activeCell);

  finalScore.textContent = state.score;
  overScr.classList.remove("hidden");
}

/* ============================================================
   UI BUTTONS
   ============================================================ */
document.getElementById("start-btn").addEventListener("click", () => { getCtx(); startGame(); });
document.getElementById("restart-btn").addEventListener("click", startGame);

soundBtn.addEventListener("click", () => {
  state.soundOn = !state.soundOn;
  soundBtn.textContent = state.soundOn ? "🔊" : "🔇";
});
</script>
</body>
</html>
