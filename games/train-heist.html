const Enemies = {
  list: [],
  clear() { this.list.length = 0; },
  add(e) { this.list.push(e); return e; },
  get aliveCount() {
    let n = 0;
    for (const e of this.list) if (e.alive) n++;
    return n;
  },
  aiming: 0,
  update(dt, P, mission, camCenter) {
    const l = this.list;
    let firing = 0;
    for (let i = 0; i < l.length; i++) {
      const e = l[i];
      if (e.alive && !e.d.boss && (e.aimT > 0 || e.burstLeft > 0)) firing++;
    }
    this.aiming = firing;
    for (let i = l.length - 1; i >= 0; i--) {
      const e = l[i];
      if (!e.alive && e.deathT <= 0) { l.splice(i, 1); continue; }
      if (e.revealFreeze) continue;
      const near = Math.abs(e.x - camCenter) < 900;
      e.active = near;
      if (near) e.update(dt, P, mission);
      else e.updateDistant(dt, P);
    }
  },
  draw(ctx, cam, t) {
    for (const e of this.list) if (!e.mounted) e.draw(ctx, cam, t);
  },
  drawMounted(ctx, cam, t) {
    for (const e of this.list) if (e.mounted) e.draw(ctx, cam, t);
  },
};







const Passengers = {
  list: [], props: [], case: null,

  build(caseData) {
    this.list.length = 0; this.props.length = 0;
    this.case = caseData;

     
    const rooms = [];
    for (const car of Train.cars) {
      if (car.kind === 'engine' || car.kind === 'tender') continue;
      const slots = Math.max(2, Math.floor((car.w - 70) / 62));
      for (let i = 0; i < slots; i++) {
        rooms.push({ car, x: car.x + 42 + i * ((car.w - 84) / Math.max(1, slots - 1 || 1)) });
      }
    }
    for (let i = rooms.length - 1; i > 0; i--) { const j = randInt(0, i); const t = rooms[i]; rooms[i] = rooms[j]; rooms[j] = t; }

    const seated = ['passenger', 'dining', 'sleeper'];
    let idx = 0;
    for (const p of caseData.people) {
      const slot = rooms[idx++ % rooms.length];
      const canSit = seated.indexOf(slot.car.kind) >= 0;
      const pose = canSit && rand() < 0.55 ? 'sit' : (rand() < 0.32 ? 'walk' : 'stand');
      this.list.push({
        data: p, x: slot.x, y: FLOOR_Y, car: slot.car, pose,
        homeX: slot.x, dir: rand() < 0.5 ? -1 : 1, phase: rand(0, TAU),
        state: 'idle', talkT: 0, duck: 0, bubble: 0,
      });
    }
     
    for (let i = 0; i < this.list.length - 1; i++) {
      const a = this.list[i], b = this.list[i + 1];
      if (a.pose === 'stand' && b.pose === 'stand' && a.car === b.car && Math.abs(a.x - b.x) < 110 && rand() < 0.6) {
        a.pose = b.pose = 'talk';
        a.dir = sign(b.x - a.x) || 1; b.dir = -a.dir;
      }
    }

     
    for (let ci = 0; ci < caseData.clues.length; ci++) {
      const c = caseData.clues[ci];
      if (!c.source || c.source.type !== 'object') continue;
      const slot = rooms[idx++ % rooms.length];
      this.props.push({
        clue: ci, def: c.source.def, x: slot.x + rand(-16, 16), y: FLOOR_Y,
        car: slot.car, taken: false, glow: 0,
      });
    }
  },

  clear() { this.list.length = 0; this.props.length = 0; this.case = null; },

   
  focusTarget(P) {
    let best = null, bd = 78;
    for (const q of this.list) {
      if (q.state === 'gone') continue;
      const d = Math.abs(q.x - P.x);
      if (d < bd && Math.abs(q.y - P.y) < 56) { bd = d; best = { kind: 'person', ref: q }; }
    }
    for (const pr of this.props) {
      if (pr.taken) continue;
      const d = Math.abs(pr.x - P.x);
      if (d < bd && Math.abs(pr.y - P.y) < 56) { bd = d; best = { kind: 'prop', ref: pr }; }
    }
    return best;
  },

  update(dt, P, phase) {
    for (const q of this.list) {
      q.phase += dt;
      q.bubble = Math.max(0, q.bubble - dt);
      if (q.pose === 'talk' && rand() < dt * 0.7) q.bubble = 0.8;

      if (phase === 'showdown' && q.state === 'idle') q.state = 'flee';

      if (q.state === 'flee') {
         
        const away = sign(q.x - P.x) || 1;
        const targetX = clamp(q.homeX + away * 150, Train.x0 + 20, Train.x1 - 20);
        if (Math.abs(q.x - targetX) > 4) {
          q.x += away * 170 * dt;
          q.dir = away;
          q.pose = 'run';
        } else {
          q.pose = 'duck';
          q.duck = Math.min(1, q.duck + dt * 3);
        }
        continue;
      }
      if (q.pose === 'walk') {
        q.x += q.dir * 26 * dt;
        if (Math.abs(q.x - q.homeX) > 52) q.dir *= -1;
        if (q.car && (q.x < q.car.x + 26 || q.x > q.car.x + q.car.w - 26)) q.dir *= -1;
      }
    }
    for (const pr of this.props) pr.glow = (pr.glow + dt) % TAU;

     
    for (const q of this.list) {
      if (q.state === 'gone') continue;
      if (Math.abs(q.x - P.x) < 150 && Math.abs(q.y - P.y) < 60) {
        const k = q.data.known;
        if (!k.scarf) { k.scarf = k.luggage = k.habit = true; q.noticed = 1; }
      }
    }
  },

   
  draw(ctx, cam, t, focus) {
    for (const pr of this.props) {
      if (pr.taken) continue;
      const sx = pr.x - cam;
      if (sx < -40 || sx > VIEW_W + 40) continue;
      this.drawProp(ctx, pr, sx, t);
      if (focus && focus.kind === 'prop' && focus.ref === pr) this.prompt(ctx, sx, pr.y - 44, 'E');
    }
    for (const q of this.list) {
      const sx = q.x - cam;
      if (sx < -50 || sx > VIEW_W + 50) continue;
      this.drawPerson(ctx, q, sx, t);
      if (focus && focus.kind === 'person' && focus.ref === q) {
        this.prompt(ctx, sx, q.y - (q.pose === 'sit' ? 44 : 58), 'E');
      }
    }
  },

  prompt(ctx, sx, sy, key) {
    const bob = Math.sin(performance.now() * 0.006) * 2;
    ctx.save();
    ctx.fillStyle = 'rgba(20,16,12,0.82)';
    ctx.fillRect(sx - 13, sy - 20 + bob, 26, 19);
    ctx.strokeStyle = '#e8c877'; ctx.lineWidth = 1.5;
    ctx.strokeRect(sx - 13, sy - 20 + bob, 26, 19);
    ctx.fillStyle = '#e8c877';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(key, sx, sy - 6 + bob);
    ctx.textAlign = 'left';
    ctx.restore();
  },

  drawProp(ctx, pr, sx, t) {
    const y = pr.y;
    const pulse = 0.5 + Math.sin(pr.glow * 2.2) * 0.5;
    ctx.save();
    ctx.globalAlpha = 0.18 + pulse * 0.22;
    ctx.fillStyle = '#ffd77a';
    ctx.beginPath(); ctx.ellipse(sx, y - 6, 20, 8, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    switch (pr.def.t) {
      case 'satchel':
        ctx.fillStyle = '#6b4a2c'; ctx.fillRect(sx - 13, y - 18, 26, 18);
        ctx.fillStyle = '#4d3520'; ctx.fillRect(sx - 13, y - 12, 26, 4);
        ctx.strokeStyle = '#4d3520'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx, y - 18, 8, Math.PI, 0); ctx.stroke();
        break;
      case 'coat':
        ctx.fillStyle = '#3f4a63'; ctx.fillRect(sx - 11, y - 34, 22, 34);
        ctx.fillStyle = '#333c50'; ctx.fillRect(sx - 3, y - 34, 6, 34);
        ctx.fillStyle = '#8a7a5a'; ctx.fillRect(sx - 2, y - 40, 4, 7);
        break;
      case 'stub':
        ctx.fillStyle = '#e8dcc0'; ctx.fillRect(sx - 9, y - 7, 18, 7);
        ctx.fillStyle = '#b8a884'; ctx.fillRect(sx - 9, y - 7, 18, 2);
        break;
      case 'telegram':
        ctx.fillStyle = '#f0e6cc';
        ctx.beginPath(); ctx.arc(sx, y - 7, 8, 0, TAU); ctx.fill();
        ctx.fillStyle = '#cbbf9f';
        ctx.beginPath(); ctx.arc(sx - 3, y - 9, 3, 0, TAU); ctx.fill();
        break;
      case 'ledger':
        ctx.fillStyle = '#5a3a2c'; ctx.fillRect(sx - 12, y - 16, 24, 16);
        ctx.fillStyle = '#e8dcc0'; ctx.fillRect(sx - 10, y - 14, 20, 12);
        ctx.fillStyle = '#5a3a2c'; ctx.fillRect(sx - 1, y - 16, 2, 16);
        break;
      case 'bottle':
        ctx.fillStyle = '#4a5a3a'; ctx.fillRect(sx - 14, y - 20, 28, 20);
        ctx.fillStyle = '#63764c'; ctx.fillRect(sx - 14, y - 20, 28, 4);
        ctx.fillStyle = '#e8dcc0'; ctx.fillRect(sx - 6, y - 14, 12, 7);
        break;
    }
    ctx.restore();
  },

  drawPerson(ctx, q, sx, t) {
    const d = q.data, L = d.look;
    const sitting = q.pose === 'sit';
    const ducking = q.pose === 'duck';
    const h = (sitting ? 30 : ducking ? 26 : 44) * L.build;
    const y = q.y;
    const top = y - h;
    const f = q.dir;
    const walkPhase = (q.pose === 'walk' || q.pose === 'run') ? Math.sin(q.phase * (q.pose === 'run' ? 14 : 5)) : 0;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(sx, y + 2, 12, 4, 0, 0, TAU); ctx.fill();

     
    ctx.fillStyle = '#2f2a30';
    if (sitting) {
      ctx.fillRect(sx - 8, y - 14, 18, 7);
      ctx.fillRect(sx + 6 * f, y - 14, 6, 14);
    } else {
      ctx.fillRect(sx - 7 + walkPhase * 3, y - h * 0.42, 6, h * 0.42);
      ctx.fillRect(sx + 1 - walkPhase * 3, y - h * 0.42, 6, h * 0.42);
    }

     
    ctx.fillStyle = L.coat;
    if (L.female) {
      ctx.beginPath();
      ctx.moveTo(sx - 8, top + h * 0.26);
      ctx.lineTo(sx + 8, top + h * 0.26);
      ctx.lineTo(sx + 12, y - (sitting ? 12 : 2));
      ctx.lineTo(sx - 12, y - (sitting ? 12 : 2));
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(sx - 9, top + h * 0.26, 18, h * (sitting ? 0.5 : 0.52));
    }
     
    ctx.fillStyle = { red: '#c8443c', blue: '#4a6a9c', green: '#4f8a5a', grey: '#9a9a9a', yellow: '#d9b74a' }[d.attrs.scarf] || '#999';
    ctx.fillRect(sx - 7, top + h * 0.24, 14, 5);

     
    const headY = top + h * 0.15;
    ctx.fillStyle = L.skin;
    ctx.fillRect(sx - 6, headY - 6, 12, 12);
    ctx.fillStyle = L.hair;
    ctx.fillRect(sx - 6, headY - 7, 12, 4);
    if (L.female) ctx.fillRect(sx - 8, headY - 6, 3, 11);
    ctx.fillStyle = '#2a2028';
    ctx.fillRect(sx + (f > 0 ? 1 : -4), headY - 2, 2.5, 2.5);

     
    if (L.hat !== 'none') {
      ctx.fillStyle = L.hatColor;
      if (L.hat === 'wide') { ctx.fillRect(sx - 15, headY - 8, 30, 3); ctx.fillRect(sx - 8, headY - 15, 16, 8); }
      else if (L.hat === 'bowler') { ctx.fillRect(sx - 11, headY - 8, 22, 3); ctx.fillRect(sx - 7, headY - 14, 14, 7); }
      else if (L.hat === 'bonnet') { ctx.fillStyle = '#d9cbb4'; ctx.fillRect(sx - 9, headY - 12, 18, 8); ctx.fillRect(sx - 11, headY - 6, 5, 5); }
      else { ctx.fillRect(sx - 8, headY - 11, 16, 6); ctx.fillRect(sx - 11, headY - 7, 6, 3); }
    }

     
    if (d.attrs.luggage > 0 && !ducking) {
      ctx.fillStyle = '#6b4a2c';
      ctx.fillRect(sx + 11 * f - 5, y - 15, 12, 15);
      ctx.fillStyle = '#4d3520';
      ctx.fillRect(sx + 11 * f - 5, y - 11, 12, 3);
      if (d.attrs.luggage > 1) {
        ctx.fillStyle = '#5a4a6b';
        ctx.fillRect(sx + 11 * f - 3, y - 26, 9, 11);
      }
    }

     
    if (q.bubble > 0 && q.pose === 'talk') {
      ctx.globalAlpha = Math.min(1, q.bubble * 2);
      ctx.fillStyle = 'rgba(240,232,210,0.9)';
      ctx.beginPath(); ctx.ellipse(sx + 12 * f, top - 10, 13, 8, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#4a4038';
      for (let i = 0; i < 3; i++) ctx.fillRect(sx + 12 * f - 6 + i * 5, top - 11, 3, 2);
      ctx.globalAlpha = 1;
    }
     
    if (d.met) {
      ctx.fillStyle = 'rgba(120,190,130,0.85)';
      ctx.beginPath(); ctx.arc(sx, top - 22, 3, 0, TAU); ctx.fill();
    }
    ctx.restore();
  },
};




const Dialogue = {
  active: false, target: null, kind: null,
  speaker: '', text: '', options: [], mode: 'line',
  reveal: 0, justClosed: 0,

  openPerson(q, mission) {
    const d = q.data;
    this.active = true; this.kind = 'person'; this.target = q;
    this.speaker = d.name;
    this.mode = 'line';
    if (!d.met) {
      d.met = true;
      mission.case.questioned++;
      this.text = pick(GREETINGS[d.role === 'witness' ? 'witness' : d.role === 'culprit' ? 'culprit' : 'bystander']);
    } else {
      this.text = pick(['Something else, Sheriff?', 'You again.', 'Ask away.']);
    }
    this.reveal = 0;
    Sound.sfx('ui');
  },

  openProp(pr, mission) {
    this.active = true; this.kind = 'prop'; this.target = pr;
    const clue = mission.case.clues[pr.clue];
    this.speaker = pr.def.name.toUpperCase();
    this.text = pr.def.line + '  “' + clue.text + '”';
    this.mode = 'line';
    this.options = [];
    this.reveal = 0;
    pr.taken = true;
    mission.foundClue(pr.clue);
    Sound.sfx('objective');
  },

  buildOptions(mission) {
    const q = this.target;
    if (!q || this.kind !== 'person') return [];
    const d = q.data;
    const opts = [];
    for (const key of ['boarded', 'destination', 'trade', 'ticket']) {
      opts.push({ label: ATTRS[key].q, key, done: !!d.asked[key] });
    }
    opts.push({ label: 'Look them over.', key: 'look', done: !!d.asked.look });
    opts.push({ label: 'Seen anything unusual?', key: 'tip', done: !!d.asked.tip });
    return opts;
  },

  choose(i, mission) {
    const opt = this.options[i];
    if (!opt) return;
    const q = this.target, d = q.data;
    d.asked[opt.key] = true;
    if (opt.key === 'look') {
      d.known.hands = true; d.known.boots = true;
      this.speaker = 'YOU';
      this.text = lookLine(d);
    } else if (opt.key === 'tip') {
      this.speaker = d.name;
      if (d.holdsClue >= 0) {
        const c = mission.case.clues[d.holdsClue];
        this.text = 'Now that you mention it — ' + c.text;
        mission.foundClue(d.holdsClue);
        Sound.sfx('objective');
      } else {
        this.text = d.gossip + '  (Talk, not proof.)';
      }
    } else {
      d.known[opt.key] = true;
      this.speaker = d.name;
      this.text = attrAnswer(d, opt.key);
    }
    this.mode = 'line';
    this.reveal = 0;
    Sound.sfx('ui');
  },

  update(dt, mission) {
    if (!this.active) return;
    this.reveal += dt * 46;
    this.justClosed = Math.max(0, this.justClosed - dt);

    if (this.mode === 'line') {
      const skipping = Input.pressed('interact') || Input.pressed('confirm');
      if (skipping && this.reveal < this.text.length) { this.reveal = this.text.length; return; }
      if (this.kind === 'prop') {
        if (skipping) this.close();
        return;
      }
       
      if (this.reveal >= this.text.length) {
        this.options = this.buildOptions(mission);
        this.mode = 'menu';
      }
      return;
    } else {
      for (let i = 0; i < 6; i++) {
        if (Input.pressed('opt' + (i + 1))) { this.choose(i, mission); return; }
      }
      if (Input.pressed('interact') || Input.pressed('confirm')) { this.close(); return; }
    }
    if (Input.pressed('pause')) this.close();
  },

  close() { this.active = false; this.target = null; this.justClosed = 0.2; Sound.sfx('uiBack'); },

  draw(ctx) {
    if (!this.active) return;
    const menu = this.mode === 'menu';
    const boxH = menu ? 132 : 92;
    const y = VIEW_H - boxH - 8;
    const px = 34, pw = 52;
    const tx = px + pw + 16;
    ctx.save();
    ctx.fillStyle = 'rgba(14,11,16,0.93)';
    ctx.fillRect(20, y, VIEW_W - 40, boxH);
    ctx.strokeStyle = '#8a6a3c'; ctx.lineWidth = 2;
    ctx.strokeRect(21, y + 1, VIEW_W - 42, boxH - 2);

     
    this.drawPortrait(ctx, px, y + 12, pw);

    ctx.fillStyle = '#e8c877';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText(this.speaker, tx, y + 24);

    ctx.fillStyle = '#e4dac4';
    ctx.font = '14px Georgia, serif';
    const shown = this.text.slice(0, Math.floor(this.reveal));
    this.wrap(ctx, shown, tx, y + 46, VIEW_W - tx - 60, 18, menu ? 2 : 3);

    if (menu) {
      ctx.font = '12.5px "Courier New", monospace';
      const colW = (VIEW_W - tx - 60) / 2;
      for (let i = 0; i < this.options.length; i++) {
        const o = this.options[i];
        const col = i % 2, row = (i / 2) | 0;
        ctx.fillStyle = o.done ? '#7d7364' : '#cfe0c0';
        ctx.fillText((i + 1) + ')  ' + o.label + (o.done ? '  ✓' : ''), tx + col * colW, y + 88 + row * 16);
      }
    }
    ctx.fillStyle = '#8d8272';
    ctx.font = '11px "Courier New", monospace';
    ctx.fillText(menu ? 'E — step away' : 'E — continue', VIEW_W - 130, y + boxH - 10);
    ctx.restore();
  },

  drawPortrait(ctx, x, y, size) {
    ctx.save();
    ctx.fillStyle = '#241d24';
    ctx.fillRect(x, y, size, size);
    ctx.strokeStyle = '#6b5230'; ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
    const cx = x + size * 0.5, cy = y + size * 0.62;
    if (this.kind === 'person' && this.target) {
      const d = this.target.data, L = d.look;
      ctx.fillStyle = L.coat; ctx.fillRect(cx - 16, cy + 6, 32, 18);
      ctx.fillStyle = { red: '#c8443c', blue: '#4a6a9c', green: '#4f8a5a', grey: '#9a9a9a', yellow: '#d9b74a' }[d.attrs.scarf] || '#999';
      ctx.fillRect(cx - 11, cy + 4, 22, 6);
      ctx.fillStyle = L.skin; ctx.fillRect(cx - 9, cy - 14, 18, 19);
      ctx.fillStyle = L.hair; ctx.fillRect(cx - 9, cy - 16, 18, 5);
      ctx.fillStyle = '#2a2028';
      ctx.fillRect(cx - 5, cy - 7, 3, 3); ctx.fillRect(cx + 2, cy - 7, 3, 3);
      if (L.hat !== 'none') {
        ctx.fillStyle = L.hatColor;
        if (L.hat === 'wide') { ctx.fillRect(cx - 21, cy - 18, 42, 4); ctx.fillRect(cx - 11, cy - 28, 22, 11); }
        else if (L.hat === 'bowler') { ctx.fillRect(cx - 15, cy - 18, 30, 4); ctx.fillRect(cx - 10, cy - 27, 20, 10); }
        else if (L.hat === 'bonnet') { ctx.fillStyle = '#d9cbb4'; ctx.fillRect(cx - 12, cy - 25, 24, 11); }
        else { ctx.fillRect(cx - 11, cy - 24, 22, 8); }
      }
    } else {
       
      ctx.strokeStyle = '#c9a961'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx - 2, cy - 6, 11, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 6, cy + 2); ctx.lineTo(cx + 15, cy + 12); ctx.stroke();
    }
    ctx.restore();
  },

  wrap(ctx, text, x, y, maxW, lh, maxLines) {
    const words = text.split(' ');
    let line = '', ly = y, n = 1;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, x, ly); line = w; ly += lh;
        if (maxLines && ++n > maxLines) { line = ''; break; }
      } else line = test;
    }
    if (line) ctx.fillText(line, x, ly);
  },
};






const Game = {
  mission: null,
  player: null,
  cam: 0,
  running: false,
  paused: false,
  ended: false,

   
  kills: 0, escaped: 0, elapsed: 0, cargo: 100, passengers: 100,
  bossAlive: false, boss: null,

   
  phase: 'showdown',       
  case: null, focus: null, revealT: 0, investigateTime: 0,
  accusedIds: null, uiPause: false,

  

  diff: { dmg: 1, rate: 1, spread: 1, tell: 1 },
  setDifficulty(risk) {
    this.diff = {
      dmg: 0.6 + risk * 0.08,         
      rate: 1.5 - risk * 0.1,         
      spread: 1.9 - risk * 0.18,      
      tell: 1.5 - risk * 0.1,         
    };
  },

  shakeAmt: 0,
  announceText: '', announceSub: '', announceT: 0,
  hitFlash: 0,
  trainSpeed: 260,

  env: { dark: 0, darkTarget: 0, tunnel: 0, tunnelTarget: 0, bridge: 0, bridgeTarget: 0, town: 0, townTarget: 0, rain: 0, rainTarget: 0, snow: 0, lightning: 0 },
  weather: [],

  waveIndex: 0, waveTimer: 0, waveActive: false, spawnQueue: [], allWavesDone: false,
  maxActive: 12,
  attackCap: 4,
  objectiveDone: false,
  reachHold: 0,

   
  start(missionDef) {
    this.mission = missionDef;
    rng = makeRng((Date.now() ^ (missionDef.id.length * 7919)) >>> 0);

    Train.build(missionDef.cars);
    Backdrop.setEnv(missionDef.env);
    Backdrop.dist = 0;

    this.player = new Player();
    Enemies.clear(); Bullets.clear(); Particles.clear(); FloatText.clear(); Grenades.clear();

    this.cam = clamp(this.player.x - VIEW_W * 0.5, this.camMin(), this.camMax());
    this.kills = 0; this.escaped = 0; this.elapsed = 0;
    this.cargo = 100; this.passengers = 100;
    this.bossAlive = false; this.boss = null;
    this.shakeAmt = 0; this.hitFlash = 0;
    this.waveIndex = 0; this.waveTimer = missionDef.waves[0] ? missionDef.waves[0].delay : 2;
    this.waveActive = false; this.allWavesDone = false;
    this.spawnQueue.length = 0;
    this.objectiveDone = false;
    this.reachHold = 0; this.clearT = 0;
    this.eventsFired = new Array(missionDef.events.length).fill(false);
    this.maxActive = 4 + missionDef.risk * 2;
    this.attackCap = 2 + missionDef.risk;
    this.setDifficulty(missionDef.risk);
    this.env = { dark: 0, darkTarget: 0, tunnel: 0, tunnelTarget: 0, bridge: 0, bridgeTarget: 0, town: 0, townTarget: 0, rain: 0, rainTarget: 0, snow: 0, lightning: 0 };
    if (missionDef.env === 'snow') this.env.snow = 1;
    if (missionDef.env === 'night') this.env.darkTarget = 0.35;
    this.buildWeather();

    this.runId = (this.runId || 0) + 1;
    this.running = true; this.paused = false; this.ended = false;
    this.uiPause = false;
    this.tutorial = missionDef.tutorial ? 0 : -1;

    

    Passengers.clear();
    Dialogue.active = false;
    this.case = null; this.focus = null; this.revealT = 0;
    this.investigateTime = 0; this.accusedIds = null;
    this.accusationCorrect = null; this.nudgeAt = 60;
    this.phase = missionDef.mystery === false ? 'showdown' : 'investigate';

    if (this.phase === 'investigate') {
      this.case = makeCase(missionDef);
      Passengers.build(this.case);
      this.player.holstered = true;
      this.player.x = Train.x1 - 70;
      this.announce('INVESTIGATION', this.case.briefing, 4.6);
      Sound.music('calm');
      Sound.sfx('door');
    } else {
      this.announce(missionDef.name, missionDef.flavour, 3.4);
      Sound.music(missionDef.legendary ? 'boss' : 'combat');
      Sound.sfx('whistle');
    }
  },

  camMin() { return Train.x0 - 60; },
  camMax() { return Math.max(this.camMin(), Train.x1 + 60 - VIEW_W); },

  buildWeather() {
    this.weather.length = 0;
    for (let i = 0; i < 90; i++) {
      this.weather.push({ x: rand(0, VIEW_W), y: rand(0, VIEW_H), s: rand(0.6, 1.6) });
    }
  },

  shake(a) { if (Save.data.settings.shake === false) return; this.shakeAmt = Math.min(16, this.shakeAmt + a); },
  announce(text, sub, dur) { this.announceText = text; this.announceSub = sub || ''; this.announceT = dur || 2.4; },

   
  spawnAt(type, x, y, lane) {
    const e = new Enemy(type, x, y);
    if (type === 'rider') { e.opts.side = rand() < 0.5 ? -1 : 1; e.y = 470; }
    Enemies.add(e);
    return e;
  },

  spawnPoint(at) {
    const P = this.player;
    const lo = Train.spawnMinX, hi = Train.x1 - 30;
    const fit = (x) => clamp(x, lo, hi);
    const dirAway = P.x > (lo + hi) * 0.5 ? -1 : 1;
    switch (at) {
      case 'front':
        return { x: fit(lo + 10), y: FLOOR_Y };
      case 'back':
        return { x: fit(Train.x1 - 40), y: FLOOR_Y };
      case 'roofAhead': {
         
        let x = fit(P.x + dirAway * rand(420, 760));
        for (let i = 0; i < 6; i++) {
          if (Train.roofYAt(x) !== null) break;
          x = fit(x + dirAway * 90);
        }
        const ry = Train.roofYAt(x);
        return ry === null ? { x, y: FLOOR_Y } : { x, y: ry };
      }
      case 'ride':
        return { x: P.x + (rand() < 0.5 ? -1 : 1) * rand(420, 620), y: 470 };
      case 'near':
      default: {
        const side = rand() < 0.5 ? -1 : 1;
        let x = fit(P.x + side * rand(430, 620));
        if (Math.abs(x - P.x) < 300) x = fit(P.x - side * 460);
        const onRoof = laneOf(P.y) === 1 && Train.roofYAt(x) !== null && rand() < 0.6;
        return { x, y: onRoof ? Train.roofYAt(x) : FLOOR_Y };
      }
    }
  },

  queueWave(wave) {
    for (const s of wave.spawn) {
      for (let i = 0; i < s.count; i++) this.spawnQueue.push({ type: s.type, at: s.at });
    }
    if (wave.announce) this.announce(wave.announce, '', 2.2);
    if (wave.boss) {
      Sound.music('boss');
      this.announce('WANTED: BLACK JACK', 'Dead or alive.', 3.2);
    }
  },

  drainQueue(dt) {
    this.spawnDrip = (this.spawnDrip || 0) - dt;
    if (this.spawnDrip > 0) return;
    while (this.spawnQueue.length && Enemies.aliveCount < this.maxActive) {
      const s = this.spawnQueue.shift();
      const p = this.spawnPoint(s.at);
      const e = this.spawnAt(s.type, p.x, p.y);
      if (s.at === 'ride') { e.mounted = true; e.y = 470; }
      if (s.type === 'boss') {
        this.boss = e; this.bossAlive = true;
        this.shake(12);
        Particles.emit(e.x, e.y - 20, 20, { speed: [60, 260], life: [0.4, 0.9], size: [3, 7], color: ['#d9b45a', '#2a2230'], grav: 400 });
      }
      this.spawnDrip = 0.22;
      break;
    }
  },

  updateWaves(dt) {
    const m = this.mission;
    this.drainQueue(dt);

    if (this.spawnQueue.length > 0) return;

    const remaining = Enemies.aliveCount;
    if (this.waveIndex >= m.waves.length) {
       
      if ((m.objective.type === 'survive' || m.objective.type === 'eliminate') && !this.objectiveDone && remaining <= 2) {
        this.waveTimer -= dt;
        if (this.waveTimer <= 0) {
          const w = m.waves[m.waves.length - 1];
          this.queueWave(w);
          this.waveTimer = 4;
        }
      } else if (remaining === 0) {
        this.allWavesDone = true;
      }
      return;
    }

    const w = m.waves[this.waveIndex];
    const gate = this.waveIndex === 0 ? true : remaining <= Math.max(1, Math.floor(this.maxActive * 0.25));
    this.waveTimer -= dt * (gate ? 1 : 0.35);
    if (this.waveTimer <= 0) {
      this.queueWave(w);
      this.waveIndex++;
      this.waveTimer = m.waves[this.waveIndex] ? m.waves[this.waveIndex].delay + 1.5 : 4;
    }
  },

   
  onKill(e) {
    this.kills++;
    Save.data.stats.kills++;
    if (e.d.boss) {
      this.bossAlive = false;
      this.announce('BLACK JACK IS DOWN', '', 3);
      Game.shake(14);
      Particles.emit(e.x, e.y - 30, 40, { speed: [80, 380], life: [0.4, 1.0], size: [2, 6], color: ['#d9b45a', '#ffffff', '#c8443c'], grav: 700 });
      Sound.sfx('explode');
    }
  },

  pickSabotageTarget(x) {
    const list = this.mission.objective.type === 'protect_passengers' ? Train.passengers : Train.cargo;
    if (!list.length) return { x: Train.engineX, done: false };
    let best = null, bd = 1e9;
    for (const t of list) {
      const d = Math.abs(t.x - x);
      if (d < bd) { bd = d; best = t; }
    }
    return best;
  },

  sabotage(target, e) {
    const isPax = this.mission.objective.type === 'protect_passengers';
    const dmg = isPax ? 9 : 11;
    if (isPax) this.passengers = Math.max(0, this.passengers - dmg);
    else this.cargo = Math.max(0, this.cargo - dmg);
    Sound.sfx('explode');
    this.shake(9);
    Particles.emit(target.x, FLOOR_Y - 20, 24, { speed: [80, 340], life: [0.3, 0.8], size: [2, 6], color: ['#ffb347', '#ff6a3c', '#4a3a30'], grav: 620 });
    FloatText.add(target.x, FLOOR_Y - 60, isPax ? 'PASSENGERS HIT!' : 'CARGO HIT!', '#ff7a5a', 15);
  },

   
  fireEvent(type) {
    const run = this.runId;
    const later = (ms, fn) => setTimeout(() => { if (this.running && this.runId === run) fn(); }, ms);
    switch (type) {
      case 'tunnel':
        this.env.tunnelTarget = 1; this.announce('TUNNEL', 'Watch your footing.', 1.8);
        Sound.sfx('tunnel');
        later(7000, () => { this.env.tunnelTarget = 0; });
        break;
      case 'bridge':
        this.env.bridgeTarget = 1; this.announce('TRESTLE BRIDGE', 'Long way down.', 1.8);
        Sound.sfx('whistle');
        later(9000, () => { this.env.bridgeTarget = 0; });
        break;
      case 'storm':
        this.env.rainTarget = 1; this.announce('HEAVY WEATHER', '', 1.8);
        Sound.sfx('thunder');
        break;
      case 'town':
        this.env.townTarget = 1; this.announce('PASSING THROUGH TOWN', '', 1.8);
        Sound.sfx('whistle');
        later(11000, () => { this.env.townTarget = 0; });
        break;
      case 'horseback':
        this.announce('RIDERS!', 'They mean to board.', 2.0);
        for (let i = 0; i < 3; i++) this.spawnQueue.push({ type: 'rider', at: 'ride' });
        break;
      case 'reinforcements':
        this.announce('REINFORCEMENTS', '', 2.0);
        for (let i = 0; i < 3; i++) this.spawnQueue.push({ type: 'outlaw', at: 'near' });
        this.spawnQueue.push({ type: 'shotgun', at: 'front' });
        break;
      case 'cargoSpill': {
        this.announce('CARGO BREAKING LOOSE', '', 1.8);
        this.shake(8);
        const x = this.player.x + rand(-200, 200);
        Particles.emit(x, ROOF_Y - 40, 18, { speed: [60, 260], life: [0.6, 1.2], size: [3, 7], color: ['#8a6a3c', '#6b5230'], grav: 900 });
        Sound.sfx('door');
        break;
      }
    }
  },

  updateEvents(dt) {
    const m = this.mission;
    for (let i = 0; i < m.events.length; i++) {
      if (!this.eventsFired[i] && this.elapsed >= m.events[i].at) {
        this.eventsFired[i] = true;
        this.fireEvent(m.events[i].type);
      }
    }
    const e = this.env;
    const sp = 0.5;
    e.dark = approach(e.dark, e.darkTarget, sp * dt);
    e.tunnel = approach(e.tunnel, e.tunnelTarget, 1.3 * dt);
    e.bridge = approach(e.bridge, e.bridgeTarget, sp * dt);
    e.town = approach(e.town, e.townTarget, sp * dt);
    e.rain = approach(e.rain, e.rainTarget, sp * dt);
    if (e.rain > 0.5 && rand() < dt * 0.25) { e.lightning = 1; Sound.sfx('thunder'); }
    e.lightning = Math.max(0, e.lightning - dt * 2.2);
  },

   
  handleBullets(dt) {
    const P = this.player;
    Bullets.update(dt, (b) => {
      if (Physics.blocked(b.x, b.y)) {
        b.alive = false;
        Sound.sfx('ricochet');
        Particles.emit(b.x, b.y, 4, { speed: [60, 200], life: [0.1, 0.25], size: [1, 3], color: ['#ffe9a8', '#c9a06a'], angle: Math.atan2(-b.vy, -b.vx), spread: 1.0, kind: 1 });
        return;
      }
      if (b.friendly) {
        for (const e of Enemies.list) {
          if (!e.alive) continue;
          const top = e.y - e.h;
          if (b.x > e.x - e.hw - 2 && b.x < e.x + e.hw + 2 && b.y > top && b.y < e.y) {
            b.alive = false;
            P.shotsHit++;
            Save.data.stats.shotsHit++;
            e.hurt(b.dmg, sign(b.vx) || 1, this);
            Particles.emit(b.x, b.y, 5, { speed: [50, 190], life: [0.1, 0.25], size: [2, 4], color: ['#ffd97a', '#ff8a5a'], angle: Math.atan2(b.vy, b.vx), spread: 1.2, kind: 1 });
            break;
          }
        }
      } else {
        const top = P.y - P.h;
        if (b.x > P.x - P.hw - 2 && b.x < P.x + P.hw + 2 && b.y > top && b.y < P.y) {
          if (P.damage(b.dmg, sign(b.vx) || 1)) { b.alive = false; this.hitFlash = 1; }
        }
      }
    });
  },

  explode(x, y, radius, dmg) {
    Particles.emit(x, y, 26, { speed: [80, 400], life: [0.3, 0.8], size: [2, 7], color: ['#ffd36a', '#ff7a3c', '#5a4a44'], grav: 500 });
    Particles.emit(x, y, 8, { speed: [20, 90], life: [0.6, 1.2], size: [8, 16], color: '#6a5a56', kind: 2 });
    Sound.sfx('explode');
    this.shake(12);
    const P = this.player;
    const d = Math.hypot(P.x - x, (P.y - P.h * 0.5) - y);
    if (d < radius) P.damage(dmg * (1 - d / radius), sign(P.x - x) || 1);
    for (const e of Enemies.list) {
      if (!e.alive || e.d.boss) continue;
      const de = Math.hypot(e.x - x, (e.y - e.h * 0.5) - y);
      if (de < radius * 0.8) e.hurt(dmg * 0.6, sign(e.x - x) || 1, this);
    }
  },

   
  update(dt) {
    if (!this.running || this.paused || this.ended) return;
    const P = this.player;
    this.elapsed += dt;

    if (Input.pressed('pause')) { this.paused = true; Input.releaseAll(); return; }

    if (this.phase === 'investigate') { this.updateInvestigation(dt); return; }
    if (this.revealT > 0) { this.updateReveal(dt); return; }

    P.update(dt, this);
    Passengers.update(dt, P, 'showdown');
    Enemies.update(dt, P, this, this.cam + VIEW_W * 0.5);
    this.handleBullets(dt);
    Grenades.update(dt, (g) => this.explode(g.x, g.y - 6, 110, 34));
    Particles.update(dt);
    FloatText.update(dt);
    this.updateWaves(dt);
    this.updateEvents(dt);

     
    this.trainSpeed = 250 + Math.sin(this.elapsed * 0.35) * 26;
    Backdrop.update(dt, this.trainSpeed);

     
    if (this.env.rain > 0.02 || this.env.snow > 0.02) {
      const snowy = this.env.snow > 0.5;
      for (const w of this.weather) {
        w.y += (snowy ? 90 : 900) * w.s * dt;
        w.x -= (snowy ? 120 : 320) * w.s * dt;
        if (w.y > VIEW_H) { w.y = -10; w.x = rand(0, VIEW_W + 200); }
        if (w.x < -20) { w.x = VIEW_W + rand(0, 120); w.y = rand(-40, VIEW_H); }
      }
    }

     
    const look = clamp(P.vx * 0.28, -110, 110);
    const targetCam = clamp(P.x + look - VIEW_W * 0.5, this.camMin(), this.camMax());
    this.cam += (targetCam - this.cam) * Math.min(1, dt * 7);
    this.shakeAmt = Math.max(0, this.shakeAmt - dt * 26);
    this.hitFlash = Math.max(0, this.hitFlash - dt * 2.6);
    this.announceT -= dt;

    if (this.tutorial >= 0) this.updateTutorial(dt);
    this.checkObjective(dt);
  },

  updateTutorial(dt) {
    const P = this.player;
    const steps = [
      { t: 'A / D  or  ←  → to move along the train', done: () => Math.abs(P.vx) > 120 },
      { t: 'SPACE to jump — gaps between cars lead to the roofs', done: () => !P.onGround },
      { t: 'Aim with the mouse (or hold ↑), J or click to fire', done: () => P.shotsFired > 2 },
      { t: 'R reloads. Six shots, then you are a target.', done: () => P.ammo < P.magSize },
      { t: 'Hold SHIFT to plant your feet — aim and fire freely without moving', done: () => P.locked },
    ];
    if (this.tutorial >= steps.length) { this.tutorialText = ''; return; }
    this.tutorialText = steps[this.tutorial].t;
    if (steps[this.tutorial].done()) { this.tutorial++; Sound.sfx('objective'); }
    if (this.elapsed > 34) this.tutorial = steps.length;
  },

  checkObjective(dt) {
    const P = this.player;
    const o = this.mission.objective;
    if (this.phase === 'investigate' || this.revealT > 0) return;

    if (!P.alive) { this.finish(false, 'The sheriff went down.'); return; }
    if (o.type === 'protect_cargo' && this.cargo < o.threshold) { this.finish(false, 'The cargo was destroyed.'); return; }
    if (o.type === 'protect_passengers' && this.passengers < o.threshold) { this.finish(false, 'Too many passengers were hurt.'); return; }

    switch (o.type) {
      case 'eliminate':
        if (this.kills >= o.count) this.objectiveDone = true;
        break;
      case 'survive':
        if (this.elapsed >= o.time) this.objectiveDone = true;
        break;
      case 'reach_engine': {
        const eng = Train.cars[0];
        if (P.x < eng.x + eng.w * 0.55) {
          this.reachHold += dt;
          if (this.reachHold > 1.2) this.objectiveDone = true;
        } else this.reachHold = Math.max(0, this.reachHold - dt);
        break;
      }
      case 'boss':
        if (this.waveIndex >= this.mission.waves.length && !this.bossAlive && this.boss) this.objectiveDone = true;
        break;
      case 'protect_cargo':
      case 'protect_passengers':
        if (this.allWavesDone) this.objectiveDone = true;
        break;
    }

    if (this.objectiveDone) {
      this.clearT = (this.clearT || 0) + dt;
       
       
       
      const instant = o.type === 'survive' || o.type === 'reach_engine' || o.type === 'eliminate';
      const bossDone = o.type === 'boss' && this.clearT > 2.2;
      if (instant || bossDone || Enemies.aliveCount === 0 || this.clearT > 16) this.finish(true, '');
    }
  },

  finish(success, reason) {
    if (this.ended) return;
    this.ended = true;
    this.running = false;
    const P = this.player;
    const m = this.mission;
    const acc = P.shotsFired > 0 ? (P.shotsHit / P.shotsFired) : 0;

    let bounty = 0, bonuses = [];
    if (success) {
      bounty = m.reward;
      if (m.objective.type === 'protect_cargo') {
        const b = Math.round(m.reward * 0.25 * (this.cargo / 100));
        bounty += b; bonuses.push(['Cargo saved ' + Math.round(this.cargo) + '%', b]);
      }
      if (m.objective.type === 'protect_passengers') {
        const b = Math.round(m.reward * 0.25 * (this.passengers / 100));
        bounty += b; bonuses.push(['Passengers safe ' + Math.round(this.passengers) + '%', b]);
      }
      if (acc > 0.55) {
        const b = Math.round(m.reward * 0.15 * ((acc - 0.55) / 0.45));
        bounty += b; bonuses.push(['Marksmanship', b]);
      }
      const noHit = P.hp >= P.maxHp;
      if (noHit) { const b = Math.round(m.reward * 0.2); bounty += b; bonuses.push(['Untouched', b]); }
      if (this.case && this.case.found < this.case.clues.length) {
        const b = Math.round(m.reward * 0.2 * (1 - this.case.found / this.case.clues.length));
        bounty += b; bonuses.push(['Sharp deduction', b]);
      }
    }

    Sound.music(null);
    Sound.sfx(success ? 'win' : 'fail');

    App.showResults({
      success, reason, mission: m,
      caseFile: this.case ? {
        clues: this.case.found, totalClues: this.case.clues.length,
        questioned: this.case.questioned, people: this.case.people.length,
        time: this.investigateTime, correct: this.accusationCorrect,
        culprits: this.case.culpritIds.map((id) => this.case.people[id].name),
      } : null,
      kills: this.kills, accuracy: acc, time: this.elapsed,
      cargo: this.cargo, passengers: this.passengers,
      bounty, bonuses, escaped: this.escaped,
      hp: P.hp, maxHp: P.maxHp,
    });
  },

   
  updateInvestigation(dt) {
    const P = this.player;
    this.investigateTime += dt;
    P.holstered = true;

    Backdrop.update(dt, this.trainSpeed);
    Particles.update(dt);
    FloatText.update(dt);

     
    if (Input.pressed('notes')) {
      if (Dialogue.active) Dialogue.close();
      App.openCaseFile();
      return;
    }

    if (Dialogue.active) {
      P.vx = 0;
      Dialogue.update(dt, this);
      Passengers.update(dt, P, 'investigate');
      return;
    }

    P.update(dt, this);
    Passengers.update(dt, P, 'investigate');
    this.focus = Passengers.focusTarget(P);

    if (Input.pressed('interact') && this.focus && Dialogue.justClosed <= 0) {
      if (this.focus.kind === 'person') Dialogue.openPerson(this.focus.ref, this);
      else Dialogue.openProp(this.focus.ref, this);
    }
     
    if (this.investigateTime > this.nudgeAt && this.case.found < this.case.required) {
      this.nudgeAt += 45;
      const missing = this.case.clues.filter((c) => !c.found);
      if (missing.length) {
        const c = pick(missing);
        if (c.source.type === 'object') {
          const pr = Passengers.props.find((x) => this.case.clues[x.clue] === c);
          this.announce('KEEP LOOKING', pr ? 'There is something worth seeing in the ' + pr.car.label + '.' : 'Search the cars.', 3.4);
        } else {
          this.announce('KEEP ASKING', 'Somebody aboard has more to say. Ask what they have seen.', 3.4);
        }
      }
    }

    Dialogue.justClosed = Math.max(0, Dialogue.justClosed - dt);

    const look = clamp(P.vx * 0.28, -110, 110);
    const targetCam = clamp(P.x + look - VIEW_W * 0.5, this.camMin(), this.camMax());
    this.cam += (targetCam - this.cam) * Math.min(1, dt * 7);
    this.announceT -= dt;
  },

  foundClue(i) {
    const c = this.case.clues[i];
    if (!c || c.found) return;
    c.found = true;
    this.case.found++;
    FloatText.add(this.player.x, this.player.y - 70, 'CLUE FOUND', '#ffd97a', 14);
    this.announce('CLUE ' + this.case.found + ' / ' + this.case.clues.length, c.text, 3.6);
  },

  canAccuse() { return this.case && this.case.found >= this.case.required; },

   
  resolveAccusation(ids) {
    const c = this.case;
    this.accusedIds = ids.slice();
    const correct = ids.length === c.culpritCount &&
      ids.every((id) => c.culpritIds.indexOf(id) >= 0);
    this.accusationCorrect = correct;
    if (correct) this.beginShowdown();
    else this.finish(false, 'WRONG ACCUSATION — THE BANDITS GOT THE DROP ON YOU.');
  },

   
  beginShowdown() {
    const m = this.mission;
    this.phase = 'showdown';
    this.player.holstered = false;
    this.revealT = 2.4;
    this.revealLine = pick(['You figured it out...', 'Should have kept riding, Sheriff.',
      'Well. That took you long enough.', 'You just made a mistake, badge.']);

    const bossMission = m.objective.type === 'boss';
    let first = true;
    for (const q of Passengers.list.slice()) {
      if (!q.data.culprit) continue;
      const type = (bossMission && first) ? 'boss'
        : m.risk >= 3 ? 'captain'
          : (rand() < 0.5 ? 'shotgun' : 'outlaw');
      const e = this.spawnAt(type, q.x, FLOOR_Y);
      e.revealFreeze = true;
      if (type === 'boss') { this.boss = e; this.bossAlive = true; }
      first = false;
      Particles.emit(q.x, q.y - 24, 14, {
        speed: [50, 180], life: [0.3, 0.7], size: [2, 5],
        color: ['#c8443c', '#e8c877'], grav: 420,
      });
      const idx = Passengers.list.indexOf(q);
      if (idx >= 0) Passengers.list.splice(idx, 1);
    }
     
    for (let i = 0; i < 1 + m.risk; i++) this.spawnQueue.push({ type: i % 2 ? 'outlaw' : 'gunslinger', at: 'near' });

    this.waveIndex = 0;
    this.waveTimer = (m.waves[0] ? m.waves[0].delay : 2) + 2.5;
    this.announce('SHOWDOWN', m.name, 3.0);
    Sound.music(m.legendary ? 'boss' : 'combat');
    Sound.sfx('whistle');
    this.shake(10);
  },

   
  updateReveal(dt) {
    this.revealT -= dt;
    const P = this.player;
    P.update(dt, this);
    Passengers.update(dt, P, 'showdown');
    Particles.update(dt);
    FloatText.update(dt);
    Backdrop.update(dt, this.trainSpeed);
    const targetCam = clamp(P.x - VIEW_W * 0.5, this.camMin(), this.camMax());
    this.cam += (targetCam - this.cam) * Math.min(1, dt * 6);
    this.announceT -= dt;
    this.shakeAmt = Math.max(0, this.shakeAmt - dt * 26);
    if (this.revealT <= 0) {
      for (const e of Enemies.list) e.revealFreeze = false;
    }
  },

  drawInvestigationHUD(ctx) {
    const c = this.case;
    if (!c) return;
    ctx.save();
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.textAlign = 'center';

    const otext = 'IDENTIFY THE BANDITS — ' + c.culpritCount + ' aboard';
    const ow = Math.max(300, ctx.measureText(otext).width + 40);
    ctx.fillStyle = 'rgba(12,10,14,0.62)';
    ctx.fillRect(VIEW_W * 0.5 - ow * 0.5, 10, ow, 26);
    ctx.fillStyle = '#e8c877';
    ctx.fillText(otext, VIEW_W * 0.5, 27);

    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = 'rgba(12,10,14,0.62)';
    ctx.fillRect(VIEW_W * 0.5 - 150, 40, 300, 22);
    ctx.fillStyle = c.found >= c.required ? '#9adb8a' : '#cfc3ad';
    ctx.fillText('CLUES ' + c.found + '/' + c.clues.length +
      '    QUESTIONED ' + c.questioned + '/' + c.people.length, VIEW_W * 0.5, 55);

    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(12,10,14,0.62)';
    ctx.fillRect(12, 12, 186, 46);
    ctx.fillStyle = '#e8dcc0';
    ctx.font = '12px "Courier New", monospace';
    ctx.fillText('TAB — case file', 22, 30);
    ctx.fillStyle = this.canAccuse() ? '#9adb8a' : '#8d8272';
    ctx.fillText(this.canAccuse() ? 'accusation ready' : 'need ' + (c.required - c.found) + ' more clue(s)', 22, 48);

    if (this.investigateTime < 22) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(VIEW_W * 0.5 - 290, VIEW_H - 40, 580, 26);
      ctx.fillStyle = '#e8dcc0';
      ctx.font = '12.5px "Courier New", monospace';
      ctx.fillText('Walk the train · E to question a passenger or search a clue · TAB for the case file', VIEW_W * 0.5, VIEW_H - 22);
    }

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(12,10,14,0.62)';
    ctx.fillRect(VIEW_W - 150, 12, 140, 40);
    ctx.fillStyle = '#9adb8a';
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText(fmtMoney(this.mission.reward), VIEW_W - 20, 30);
    ctx.fillStyle = '#cfc3ad';
    ctx.font = '12px "Courier New", monospace';
    ctx.fillText('revolver holstered', VIEW_W - 20, 46);
    ctx.textAlign = 'left';
    ctx.restore();
  },

   
  draw(ctx) {
    const shakeX = this.shakeAmt > 0 ? rand(-this.shakeAmt, this.shakeAmt) : 0;
    const shakeY = this.shakeAmt > 0 ? rand(-this.shakeAmt, this.shakeAmt) * 0.6 : 0;
    ctx.save();
    ctx.translate(shakeX, shakeY);

    Backdrop.draw(ctx, this.env);

    const cam = this.cam;
    Enemies.drawMounted(ctx, cam, this.elapsed);
    TrainRenderer.draw(ctx, cam, this.elapsed, this.env);
    this.drawSmoke(ctx, cam);
    Passengers.draw(ctx, cam, this.elapsed, this.focus);
    Enemies.draw(ctx, cam, this.elapsed);
    this.player.draw(ctx, cam, this.elapsed);
    Grenades.draw(ctx, cam);
    Bullets.draw(ctx, cam);
    Particles.draw(ctx, cam);
    FloatText.draw(ctx, cam);
    Backdrop.drawForeground(ctx);

     
    if (this.env.snow > 0.5) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const gust = 1 + this.env.rain * 1.4;
      for (const w of this.weather) ctx.fillRect(w.x, w.y, 2.2 * w.s * gust, 2.2 * w.s * gust);
      if (this.env.rain > 0.02) {
        ctx.fillStyle = 'rgba(228,238,250,' + this.env.rain * 0.2 + ')';
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      }
    } else if (this.env.rain > 0.02) {
      ctx.strokeStyle = 'rgba(190,210,240,0.55)';
      ctx.lineWidth = 1.4;
      ctx.globalAlpha = this.env.rain;
      ctx.beginPath();
      for (const w of this.weather) { ctx.moveTo(w.x, w.y); ctx.lineTo(w.x + 7, w.y - 18); }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

     
    const tn = this.env.tunnel;
    if (tn > 0.01) {
      const th = 190 * tn;
      const d = Backdrop.dist;
      ctx.fillStyle = '#171220';
      ctx.beginPath();
      ctx.moveTo(0, -2); ctx.lineTo(VIEW_W, -2); ctx.lineTo(VIEW_W, th);
      for (let x = VIEW_W; x >= -40; x -= 40) {
        ctx.lineTo(x, th + Math.sin((x + d) * 0.021) * 16 + Math.sin((x + d) * 0.061) * 8);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#241c30';
      for (let i = 0; i < 7; i++) {
        const px = ((i * 190 - d * 0.9) % (VIEW_W + 380) + VIEW_W + 380) % (VIEW_W + 380) - 190;
        ctx.fillRect(px, 0, 26, th * 0.8);
      }
    }

     
    const darkness = Math.max(this.env.dark, tn * 0.66);
    if (darkness > 0.01) {
      ctx.fillStyle = 'rgba(4,6,14,' + darkness + ')';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
       
      const px = this.player.x - cam, py = this.player.y - 24;
      const g = ctx.createRadialGradient(px, py, 12, px, py, 300);
      g.addColorStop(0, 'rgba(255,222,158,' + (0.62 * darkness) + ')');
      g.addColorStop(0.45, 'rgba(255,208,140,' + (0.22 * darkness) + ')');
      g.addColorStop(1, 'rgba(255,220,150,0)');
      ctx.fillStyle = g;
      ctx.fillRect(px - 300, py - 300, 600, 600);
       
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.10 * darkness;
      ctx.fillStyle = '#ffca7a';
      for (const e of Enemies.list) {
        if (!e.alive) continue;
        const ex = e.x - cam;
        if (ex < -40 || ex > VIEW_W + 40) continue;
        ctx.beginPath(); ctx.arc(ex, e.y - e.h * 0.5, 46, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    if (this.env.lightning > 0.02) {
      ctx.fillStyle = 'rgba(220,235,255,' + this.env.lightning * 0.5 + ')';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }

    ctx.restore();

    if (this.hitFlash > 0.01) {
      ctx.fillStyle = 'rgba(190,40,30,' + this.hitFlash * 0.35 + ')';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    const hpFrac = this.player.hp / this.player.maxHp;
    if (hpFrac < 0.34) {
      const pulse = 0.16 + Math.sin(this.elapsed * 5) * 0.05;
      ctx.fillStyle = 'rgba(150,20,15,' + pulse * (1 - hpFrac / 0.34) + ')';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }

    if (this.phase === 'investigate') this.drawInvestigationHUD(ctx);
    else this.drawHUD(ctx);

    if (this.revealT > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(this.revealT / 2.4, 0, 1);
      ctx.fillStyle = 'rgba(120,20,16,0.22)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(10,8,12,0.8)';
      ctx.fillRect(VIEW_W * 0.5 - 250, 246, 500, 44);
      ctx.fillStyle = '#e8c877';
      ctx.font = 'italic 20px Georgia, serif';
      ctx.fillText('“' + this.revealLine + '”', VIEW_W * 0.5, 274);
      ctx.textAlign = 'left';
      ctx.restore();
    }

    Dialogue.draw(ctx);
    if (this.paused) this.drawPause(ctx);
  },

  drawSmoke(ctx, cam) {
     
    const eng = Train.cars[0];
    if (!eng) return;
    const sx = eng.x + 40 - cam;
    if (sx < -260 || sx > VIEW_W + 80) return;
    if (rand() < 0.5) {
      Particles.emit(eng.x + 40, eng.roofY - 42, 1, {
        speed: [30, 70], life: [1.1, 1.9], size: [7, 13], color: ['#d8d2cc', '#b9b2ac'],
        angle: -Math.PI * 0.5 - 0.5, spread: 0.35, kind: 2, grav: -30, drag: 0.4,
      });
    }
  },

  drawHUD(ctx) {
    const P = this.player;
    const m = this.mission;
    ctx.save();
    ctx.font = 'bold 13px "Courier New", monospace';

     
    const hw = 190, hx = 16, hy = 16;
    ctx.fillStyle = 'rgba(12,10,14,0.62)';
    ctx.fillRect(hx - 5, hy - 5, hw + 10, 44);
    ctx.fillStyle = '#2a1c1c';
    ctx.fillRect(hx, hy, hw, 14);
    const frac = clamp(P.hp / P.maxHp, 0, 1);
    ctx.fillStyle = frac > 0.5 ? '#4fae5a' : frac > 0.25 ? '#d9a53c' : '#c8443c';
    ctx.fillRect(hx, hy, hw * frac, 14);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    ctx.strokeRect(hx + 0.5, hy + 0.5, hw - 1, 13);
    ctx.fillStyle = '#efe6d2';
    ctx.fillText(Math.ceil(P.hp) + ' / ' + P.maxHp, hx + 2, hy + 32);

     
    const ax = hx + 92, ay = hy + 22;
    for (let i = 0; i < P.magSize; i++) {
      const filled = i < P.ammo;
      ctx.fillStyle = filled ? '#e8c877' : 'rgba(120,110,95,0.5)';
      ctx.fillRect(ax + i * 9, ay, 5, 11);
      if (filled) { ctx.fillStyle = '#b8985a'; ctx.fillRect(ax + i * 9, ay, 5, 3); }
    }
    if (P.reloadT > 0) {
      const t = 1 - P.reloadT / P.stats.reloadTime;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(ax, ay + 14, P.magSize * 9 - 4, 4);
      ctx.fillStyle = '#e8c877';
      ctx.fillRect(ax, ay + 14, (P.magSize * 9 - 4) * t, 4);
    } else if (P.ammo === 0) {
      ctx.fillStyle = Math.floor(this.elapsed * 4) % 2 ? '#ff6a4a' : '#a83a2a';
      ctx.fillText('RELOAD  [R]', ax, ay + 26);
    }

     
    if (P.locked) {
      ctx.fillStyle = '#e8c877';
      ctx.fillRect(hx - 5 + 200, hy - 5, 74, 20);
      ctx.fillStyle = '#2a2118';
      ctx.font = 'bold 11px "Courier New", monospace';
      ctx.fillText('PLANTED', hx + 203, hy + 9);
      ctx.font = 'bold 13px "Courier New", monospace';
    }

     
    const otext = OBJECTIVE_TEXT[m.objective.type] ? OBJECTIVE_TEXT[m.objective.type](m.objective, this) : '';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(12,10,14,0.62)';
    const ow = Math.max(240, ctx.measureText(otext).width + 40);
    ctx.fillRect(VIEW_W * 0.5 - ow * 0.5, 10, ow, 26);
    ctx.fillStyle = '#e8c877';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(otext, VIEW_W * 0.5, 27);

     
    if (m.objective.type === 'protect_cargo' || m.objective.type === 'protect_passengers') {
      const v = m.objective.type === 'protect_cargo' ? this.cargo : this.passengers;
      const bw = 200;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(VIEW_W * 0.5 - bw * 0.5, 40, bw, 8);
      ctx.fillStyle = v / 100 > 0.6 ? '#6aa9c8' : v / 100 > 0.35 ? '#d9a53c' : '#c8443c';
      ctx.fillRect(VIEW_W * 0.5 - bw * 0.5, 40, bw * (v / 100), 8);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.strokeRect(VIEW_W * 0.5 - bw * 0.5 + 0.5, 40.5, bw - 1, 7);
       
      const th = m.objective.threshold / 100;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(VIEW_W * 0.5 - bw * 0.5 + bw * th, 38, 2, 12);
    }

     
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(12,10,14,0.62)';
    ctx.fillRect(VIEW_W - 156, 11, 146, 46);
    ctx.fillStyle = '#9adb8a';
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText(fmtMoney(m.reward), VIEW_W - 18, 29);
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#cfc3ad';
    ctx.fillText('KILLS ' + this.kills + '   ' + fmtTime(this.elapsed), VIEW_W - 18, 48);

     
    if (this.bossAlive && this.boss) {
      const bw = 420, bx = VIEW_W * 0.5 - bw * 0.5, by = VIEW_H - 42;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx - 6, by - 20, bw + 12, 38);
      ctx.fillStyle = '#e8c877';
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillText('BLACK JACK', VIEW_W * 0.5, by - 6);
      ctx.fillStyle = '#3a1a1a';
      ctx.fillRect(bx, by, bw, 12);
      ctx.fillStyle = '#c8443c';
      ctx.fillRect(bx, by, bw * clamp(this.boss.hp / this.boss.maxHp, 0, 1), 12);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, 11);
    }

     
    ctx.textAlign = 'center';
    for (const e of Enemies.list) {
      if (!e.alive) continue;
      const sx = e.x - this.cam;
      if (sx > -20 && sx < VIEW_W + 20) continue;
      const side = sx < 0 ? 0 : 1;
      const mx = side ? VIEW_W - 14 : 14;
      const my = clamp(e.y - 40, 80, VIEW_H - 80);
      ctx.fillStyle = e.d.boss ? '#ffd36a'
        : (e.d.sabotage ? (Math.floor(this.elapsed * 6) % 2 ? '#ffd36a' : '#e0a03a')
          : 'rgba(230,90,70,0.85)');
      ctx.beginPath();
      ctx.moveTo(mx + (side ? 8 : -8), my);
      ctx.lineTo(mx + (side ? -6 : 6), my - 7);
      ctx.lineTo(mx + (side ? -6 : 6), my + 7);
      ctx.closePath(); ctx.fill();
    }

     
    if (this.announceT > 0) {
      const a = clamp(this.announceT, 0, 1);
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 150, VIEW_W, this.announceSub ? 76 : 48);
      ctx.fillStyle = '#f0d79a';
      ctx.font = 'bold 30px Georgia, serif';
      ctx.fillText(this.announceText, VIEW_W * 0.5, 184);
      if (this.announceSub) {
        ctx.fillStyle = '#cbb894';
        ctx.font = 'italic 14px Georgia, serif';
        ctx.fillText(this.announceSub, VIEW_W * 0.5, 210);
      }
      ctx.globalAlpha = 1;
    }

     
    if (this.tutorial >= 0 && this.tutorialText) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(VIEW_W * 0.5 - 250, VIEW_H - 62, 500, 28);
      ctx.fillStyle = '#e8dcc0';
      ctx.font = '13px "Courier New", monospace';
      ctx.fillText(this.tutorialText, VIEW_W * 0.5, VIEW_H - 43);
    }

    ctx.textAlign = 'left';
    ctx.restore();
  },

  drawPause(ctx) {
    ctx.fillStyle = 'rgba(8,6,12,0.78)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f0d79a';
    ctx.font = 'bold 44px Georgia, serif';
    ctx.fillText('PAUSED', VIEW_W * 0.5, 220);
    ctx.font = '15px "Courier New", monospace';
    ctx.fillStyle = '#cbb894';
    ctx.fillText('ESC — resume        Q — abandon the bounty', VIEW_W * 0.5, 268);
    ctx.fillStyle = '#8d8272';
    ctx.font = '13px "Courier New", monospace';
    ctx.fillText('Move A/D · Jump SPACE · Hold SHIFT to plant · Fire J or click · Reload R', VIEW_W * 0.5, 320);
    ctx.fillText('Investigating: E to talk or search · TAB for the case file', VIEW_W * 0.5, 344);
    ctx.textAlign = 'left';
  },
};







const UI = (function () {
  let root = null;

  function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  function header() {
    const d = Save.data;

      '<div class="th-brand">TRAIN&nbsp;HEIST</div>' +
      '<div class="th-stats">' +
      '<span class="th-money">' + fmtMoney(d.money) + '</span>' +
      '<span class="th-rank">SHERIFF RANK ' + rank + ' · ' + (RANK_TITLES[rank - 1] || 'Legend') + '</span>' +

          : '<p class="th-hint">Find a clue first — then it is worth writing down what each passenger says.</p>') +

        '</div></div></div>';

  function objectiveBrief(m) {
    switch (m.objective.type) {
      case 'eliminate': return 'Defeat ' + m.objective.count + ' bandits';
      case 'protect_cargo': return 'Keep cargo above ' + m.objective.threshold + '%';
      case 'protect_passengers': return 'Keep passengers above ' + m.objective.threshold + '%';
      case 'reach_engine': return 'Reach the locomotive';
      case 'survive': return 'Survive ' + m.objective.time + ' seconds';
      case 'boss': return 'Bring down ' + m.objective.bossName;
      default: return '—';
    }
  }

  const picked = [];
  function togglePick(btn) {
    const id = Number(btn.getAttribute('data-id'));
    const need = Game.case.culpritCount;
    const at = picked.indexOf(id);
    if (at >= 0) { picked.splice(at, 1); btn.classList.remove('on'); }
    else {
      if (picked.length >= need) {
        const drop = picked.shift();
        const el = root.querySelector('[data-act="pick"][data-id="' + drop + '"]');
        if (el) el.classList.remove('on');
      }
      picked.push(id); btn.classList.add('on');
    }
    const counter = root.querySelector('#th-picked');
    if (counter) counter.textContent = String(picked.length);
    Sound.sfx('ui');
  }

  function mount(el) { root = el; root.addEventListener('click', onClick); }

  function show(name, payload) {
    if (!screens[name]) return;
    if (name !== 'accuse') picked.length = 0;
    root.innerHTML = screens[name](payload);
    root.classList.remove('hidden');
    root.scrollTop = 0;
  }
  function hide() { root.classList.add('hidden'); root.innerHTML = ''; }

  function onClick(ev) {
    const btn = ev.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.getAttribute('data-act');
    Sound.resume();
    if (act !== 'take' && act !== 'retry') Sound.sfx(act === 'menu' || act === 'board' ? 'uiBack' : 'ui');
    switch (act) {
      case 'play': App.show(Save.data.seenIntro ? 'bounty' : 'bounty'); break;
      case 'bounty': App.show('bounty'); break;
      case 'upgrades': App.show('upgrades'); break;
      case 'settings': App.show('settings'); break;
      case 'menu': App.show('menu'); break;
      case 'board': App.show('bounty'); break;
      case 'take':
      case 'retry': App.startMission(btn.getAttribute('data-mission')); break;
      case 'closecase': App.closeCaseFile(); break;
      case 'casefile': show('casefile'); break;
      case 'accuse': App.openAccusation(); break;
      case 'pick': togglePick(btn); break;
      case 'confirmAccuse': {
        const need = Game.case.culpritCount;
        if (picked.length !== need) { Sound.sfx('dryFire'); return; }
        const ids = picked.slice();
        picked.length = 0;
        App.submitAccusation(ids);
        break;
      }
      case 'buy': App.buyUpgrade(btn.getAttribute('data-upg')); break;
      case 'toggle': App.toggleSetting(btn.getAttribute('data-key')); break;
      case 'wipe':
        if (btn.dataset.confirm) { Save.reset(); App.show('menu'); }
        else { btn.dataset.confirm = '1'; btn.textContent = 'ARE YOU SURE?'; }
        break;
    }
  }

  return { mount, show, hide };
})();





const App = {
  canvas: null, ctx: null, dpr: 1,
  screen: 'menu',
  playing: false,
  idleCam: 0,
  lastResults: null,

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d', { alpha: false });
    this.ctx.imageSmoothingEnabled = false;
    UI.mount(document.getElementById('overlay'));
    Input.attach(this.canvas);

    Sound.setMusic(Save.data.settings.music !== false);
    Sound.setSfx(Save.data.settings.sfx !== false);

    window.addEventListener('resize', () => this.resize());
    this.resize();

     
    Train.build(['engine', 'tender', 'cargo', 'passenger', 'caboose']);
    Backdrop.setEnv('desert');

    const kick = () => { Sound.resume(); Sound.music('menu'); window.removeEventListener('pointerdown', kick); window.removeEventListener('keydown', kick); };
    window.addEventListener('pointerdown', kick);
    window.addEventListener('keydown', kick);

    this.show('menu');
    this.last = performance.now();
    this.acc = 0;
    requestAnimationFrame((t) => this.frame(t));
  },

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.dpr = dpr;
    this.canvas.width = VIEW_W * dpr;
    this.canvas.height = VIEW_H * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.ctx.imageSmoothingEnabled = false;

    const wrap = document.getElementById('app');
    const aw = wrap.clientWidth, ah = wrap.clientHeight;
    const scale = Math.min(aw / VIEW_W, ah / VIEW_H);
    this.canvas.style.width = Math.floor(VIEW_W * scale) + 'px';
    this.canvas.style.height = Math.floor(VIEW_H * scale) + 'px';
  },

  show(name, payload) {
    this.screen = name;
    this.playing = false;
    Game.running = false;
    UI.show(name, payload);
    if (name !== 'results') Sound.music('menu');
  },

  startMission(id) {
    const m = MISSIONS.find((x) => x.id === id);
    if (!m) return;
    if (rankFromRep(Save.data.rep) < m.rankReq) return;
    UI.hide();
    this.screen = 'play';
    this.playing = true;
    Game.start(m);
    Input.releaseAll();
  },

  showResults(r) {
    this.playing = false;
    const d = Save.data;
    if (r.success) {
      const repeat = (d.completed[r.mission.id] || 0) > 0;
      const money = Math.round(r.bounty * (repeat ? 0.6 : 1));
      const repGain = Math.round(r.mission.rep * (repeat ? 0.35 : 1));
      const oldRank = rankFromRep(d.rep);
      d.money += money;
      d.rep += repGain;
      d.completed[r.mission.id] = (d.completed[r.mission.id] || 0) + 1;
      d.stats.missions++;
      d.stats.earned += money;
      const newRank = rankFromRep(d.rep);
      r.bounty = money;
      r.repGain = repGain;
      r.rankUp = newRank > oldRank;
      r.newRank = newRank;
      Save.write();
      if (r.rankUp) setTimeout(() => Sound.sfx('cash'), 400);
    }
    this.lastResults = r;
    this.screen = 'results';
    UI.show('results', r);
  },

  


  openCaseFile() {
    if (!Game.case) return;
    Game.uiPause = true;
    Input.releaseAll();
    Sound.sfx('ui');
    UI.show('casefile');
  },
  closeCaseFile() {
    Game.uiPause = false;
    Input.releaseAll();
    UI.hide();
  },
  openAccusation() {
    if (!Game.canAccuse()) { Sound.sfx('dryFire'); return; }
    Sound.sfx('ui');
    UI.show('accuse');
  },
  submitAccusation(ids) {
    UI.hide();
    Game.uiPause = false;
    Input.releaseAll();
    Game.resolveAccusation(ids);
  },

  buyUpgrade(id) {
    const u = UPGRADES.find((x) => x.id === id);
    if (!u) return;
    const d = Save.data;
    const lv = d.upgrades[id] || 0;
    if (lv >= u.levels) return;
    const cost = u.cost[lv];
    if (d.money < cost) { Sound.sfx('dryFire'); return; }
    d.money -= cost;
    d.upgrades[id] = lv + 1;
    Save.write();
    Sound.sfx('cash');
    UI.show('upgrades');
  },

  toggleSetting(key) {
    const s = Save.data.settings;
    s[key] = !s[key];
    if (key === 'music') Sound.setMusic(s.music);
    if (key === 'sfx') Sound.setSfx(s.sfx);
    Save.write();
    UI.show('settings');
  },

   
  frame(now) {
    requestAnimationFrame((t) => this.frame(t));
    let dt = (now - this.last) / 1000;
    this.last = now;
    if (dt > 0.1) dt = 0.1;          
    this.acc += dt;

    const STEP = 1 / 60;
    let steps = 0;
    while (this.acc >= STEP && steps < 4) {
      this.step(STEP);
      this.acc -= STEP;
      steps++;
    }
    if (steps === 4) this.acc = 0;

    this.render();
    Input.clearFrame();
  },

  step(dt) {
    if (this.playing) {
      if (Game.uiPause) return;           
      if (Game.paused) {
        if (Input.pressed('pause')) { Game.paused = false; }
        else if (Input.pressed('quit')) {
          Game.paused = false; Game.running = false; this.playing = false;
          Sound.music(null);
          this.show('bounty');
        }
        return;
      }
      Game.update(dt);
    } else {
       
      Backdrop.update(dt, 150);
      this.idleCam += dt * 26;
      const span = Math.max(1, Train.x1 - VIEW_W + 120);
      if (this.idleCam > span) this.idleCam = -60;
      Particles.update(dt);
      if (rand() < 0.5) {
        const eng = Train.cars[0];
        if (eng) Particles.emit(eng.x + 40, eng.roofY - 42, 1, {
          speed: [30, 70], life: [1.2, 2.0], size: [7, 14], color: ['#e2dcd4', '#c2bcb4'],
          angle: -Math.PI * 0.5 - 0.5, spread: 0.35, kind: 2, grav: -28, drag: 0.4,
        });
      }
    }
  },

  render() {
    const ctx = this.ctx;
    if (this.playing) {
      Game.draw(ctx);
    } else {
      Backdrop.draw(ctx, null);
      TrainRenderer.draw(ctx, this.idleCam, 0, null);
      Particles.draw(ctx, this.idleCam);
      Backdrop.drawForeground(ctx);
      ctx.fillStyle = 'rgba(14,10,18,0.55)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  },
};

 
window.TrainHeist = { App, Game, Enemies, Train, Backdrop, Save, Physics, Bullets, Passengers, Dialogue, UI, makeCase, ATTRS, MISSIONS, ENEMY_TYPES, CAR_TYPES, UPGRADES };

if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', () => App.init());
else App.init();
</script>
