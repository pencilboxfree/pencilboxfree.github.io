<!DOCTYPE html>
<html lang="en">
<head>

<title>Train Heist</title>
<meta name="description" content="Train Heist — a Wild West browser game. Ride as the sheriff, question the passengers and work out who the bandits are, then fight them the length of a moving train. Bounties, upgrades and a legendary outlaw.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%9A%82</text></svg>">
<style>





 
* { box-sizing: border-box; }

  margin: 0; padding: 0; height: 100%; background: #0c0a10; overflow: hidden;

}

}

  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

}

.th-menu { text-align: center; padding: 30px 0; }
.th-title {

  color: #f2d99a; text-shadow: 0 5px 0 #6b2f22, 0 8px 22px rgba(0,0,0,.7); margin-bottom: 6px;
}

}

.th-actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }

 
.th-upg-list { display: flex; flex-direction: column; gap: 8px; }
.th-upg {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  background: rgba(40,30,24,.75); border: 1px solid #5d4630; border-radius: 3px; padding: 12px 14px;
}
.th-upg-name { font-size: 15px; color: #f0d79a; letter-spacing: 1px; }

.th-set-list { display: flex; flex-direction: column; gap: 8px; max-width: 520px; margin: 0 auto; }
.th-set {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(40,30,24,.75); border: 1px solid #5d4630; padding: 10px 14px; font-size: 14px;
}

.th-stats-block { margin: 20px auto 0; max-width: 520px; font-size: 12px; color: #9d8f79; line-height: 1.9; text-align: center; }

 
.th-results { display: flex; justify-content: center; }
.th-res-card {
  width: min(520px, 94vw); background: linear-gradient(#1d1720, #14101a);
  border: 3px solid #6b5230; border-radius: 4px; padding: 22px 26px; text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,.7);
}
.th-res-card.bad { border-color: #7a2f26; }
.th-res-card h2 { font-family: Georgia, serif; letter-spacing: 5px; font-size: 26px; margin: 0 0 4px; color: #9adb8a; }
.th-res-card.bad h2 { color: #e07a6a; }
.th-res-mission { font-family: Georgia, serif; font-style: italic; color: #c7b494; margin-bottom: 12px; }
.th-res-reason { color: #e09a8a; font-size: 13px; margin-bottom: 12px; }
.th-res-rows { text-align: left; border-top: 1px dashed #5d4630; border-bottom: 1px dashed #5d4630; padding: 10px 0; margin-bottom: 12px; }
.th-res-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: #cfc3ad; }
.th-res-bounty { font-size: 20px; color: #9adb8a; letter-spacing: 2px; font-weight: bold; }
.th-res-rep { font-size: 12px; color: #e8c877; margin-top: 6px; letter-spacing: 1px; }

.th-res-card .th-btn { min-width: 170px; }

@media (max-width: 620px) {
  .th-cards { grid-template-columns: 1fr; }
  .th-btn { min-width: 180px; }
}

 
.th-case { display: flex; justify-content: center; }
.th-case-card {
  width: min(860px, 96vw); background: linear-gradient(#efe2c2, #ddcda6);
  color: #2e2418; border: 3px solid #7a5c34; border-radius: 4px;
  padding: 18px 22px; box-shadow: 0 12px 44px rgba(0,0,0,.72);
}
.th-case-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
  border-bottom: 2px solid #a98c5c; padding-bottom: 8px; margin-bottom: 12px; }
.th-case-head h2 { font-family: Georgia, serif; letter-spacing: 4px; margin: 0; font-size: 22px; color: #5c2f18; }
.th-case-head span { font-size: 12px; color: #6b5636; }
.th-case h3 { font-family: Georgia, serif; font-size: 13px; letter-spacing: 3px; color: #6b3a1c;
  margin: 14px 0 6px; text-transform: uppercase; }
.th-clues { display: flex; flex-direction: column; gap: 5px; }
.th-clue { background: rgba(255,255,255,.42); border-left: 4px solid #7a2c1c; padding: 7px 10px;
  font-family: Georgia, serif; font-size: 13.5px; line-height: 1.4; }
.th-clue.unknown { border-left-color: #a89878; color: #8a7c60; font-style: italic; }
.th-clue-list { margin: 0 0 12px; padding-left: 20px; font-family: Georgia, serif; font-size: 13px; color: #4a3a26; }
.th-clue-list li { margin: 3px 0; }
.th-table-wrap { max-height: 250px; overflow-y: auto; border: 1px solid #b09a70; }
.th-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.th-table th { position: sticky; top: 0; background: #c8b58a; color: #3a2c18; text-align: left; padding: 6px 8px; letter-spacing: 1px; }
.th-table td { padding: 5px 8px; border-top: 1px solid #c2ad84; }
.th-table tr.unmet { opacity: .62; }
.th-table td.nm { font-weight: bold; white-space: nowrap; }
.th-table .q { color: #8a7c60; }
.th-hint { font-size: 11.5px; color: #6b5636; font-style: italic; margin: 8px 0 0; }
.th-suspects { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; }
.th-suspect {
  text-align: left; cursor: pointer; background: rgba(255,255,255,.45);
  border: 2px solid #a98c5c; border-radius: 3px; padding: 8px 10px;
  font-family: "Courier New", monospace; color: #2e2418; transition: background .12s, border-color .12s;
  display: flex; flex-direction: column; gap: 3px;
}
.th-suspect:hover { background: rgba(255,255,255,.72); }
.th-suspect.on { background: #7a2c1c; border-color: #4a1a10; color: #f5e3bb; }
.th-suspect .nm { font-weight: bold; font-size: 13px; }
.th-suspect .fx { font-size: 10.5px; opacity: .85; }
.th-case .th-actions { margin-top: 16px; }

.th-case .th-ghost { border-color: #8a6f45; color: #5c4a2c; background: rgba(255,255,255,.28); }
.th-case .th-ghost:hover { background: rgba(255,255,255,.5); box-shadow: none; }
.th-case .th-btn.disabled { opacity: .45; }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="overlay"></div>
</div>

<script>
"use strict";





'use strict';

const VIEW_W = 960;
const VIEW_H = 540;

 
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const approach = (v, target, amt) => (v < target ? Math.min(v + amt, target) : Math.max(v - amt, target));
const TAU = Math.PI * 2;

 
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = makeRng((Math.random() * 1e9) | 0);
const rand = (a = 1, b) => (b === undefined ? rng() * a : a + rng() * (b - a));
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[(rng() * arr.length) | 0];

function fmtMoney(n) {
  return '$' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtTime(s) {
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60);
  return m + ':' + (r < 10 ? '0' : '') + r;
}
function stars(n) { return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }





const Input = (function () {
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    Space: 'jump',
    KeyJ: 'shoot', KeyK: 'shoot', Enter: 'confirm',
    KeyR: 'reload',
    KeyE: 'interact',
    ShiftLeft: 'lock', ShiftRight: 'lock',
    Tab: 'notes', KeyN: 'notes',
    Digit1: 'opt1', Digit2: 'opt2', Digit3: 'opt3',
    Digit4: 'opt4', Digit5: 'opt5', Digit6: 'opt6',
    Escape: 'pause', KeyP: 'pause', KeyQ: 'quit',
  };
  const down = Object.create(null);
  const pressedSet = Object.create(null);
  const releasedSet = Object.create(null);
  const state = {
    mx: VIEW_W * 0.5, my: VIEW_H * 0.5,
    mouseDown: false,
    usingMouse: false,
    anyKeyThisFrame: false,
  };

  function setAction(act, v) {
    if (v) { if (!down[act]) pressedSet[act] = true; down[act] = true; }
    else { if (down[act]) releasedSet[act] = true; down[act] = false; }
  }

  function attach(canvas) {
    window.addEventListener('keydown', (e) => {
      const act = KEYMAP[e.code];
      if (act) {
        if (['left', 'right', 'up', 'down', 'jump', 'notes'].indexOf(act) >= 0) e.preventDefault();
        if (!e.repeat) setAction(act, true);
        state.anyKeyThisFrame = true;
         
         
        if (act === 'up' || act === 'down') state.usingMouse = false;
      }
    });
    window.addEventListener('keyup', (e) => {
      const act = KEYMAP[e.code];
      if (act) setAction(act, false);
    });
    window.addEventListener('blur', () => {
      for (const k in down) setAction(k, false);
      state.mouseDown = false;
    });
    canvas.addEventListener('mousemove', (e) => {
      const r = canvas.getBoundingClientRect();
      state.mx = (e.clientX - r.left) * (VIEW_W / r.width);
      state.my = (e.clientY - r.top) * (VIEW_H / r.height);
      state.usingMouse = true;
    });
    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) { state.mouseDown = true; setAction('shoot', true); state.usingMouse = true; }
      e.preventDefault();
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) { state.mouseDown = false; setAction('shoot', false); }
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  return {
    attach, state,
    down: (a) => !!down[a],
    pressed: (a) => !!pressedSet[a],
    released: (a) => !!releasedSet[a],
    clearFrame() {
      for (const k in pressedSet) delete pressedSet[k];
      for (const k in releasedSet) delete releasedSet[k];
      state.anyKeyThisFrame = false;
    },
    releaseAll() { for (const k in down) setAction(k, false); },
  };
})();




const Sound = (function () {
  let ctx = null, master = null, sfxGain = null, musGain = null, noiseBuf = null;
  let enabled = true, musicOn = true, sfxOn = true;
  let started = false;

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { enabled = false; return; }
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.75; master.connect(ctx.destination);
    sfxGain = ctx.createGain(); sfxGain.gain.value = 0.85; sfxGain.connect(master);
    musGain = ctx.createGain(); musGain.gain.value = 0.34; musGain.connect(master);
     
    const len = ctx.sampleRate * 1.2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function resume() {
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    started = true;
  }
  const now = () => (ctx ? ctx.currentTime : 0);

  function noise(dur, vol, filterType, f0, f1, dest) {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    src.loop = true;
    const flt = ctx.createBiquadFilter(); flt.type = filterType || 'lowpass';
    flt.frequency.setValueAtTime(f0, now());
    if (f1 !== undefined) flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), now() + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, now());
    g.gain.exponentialRampToValueAtTime(0.0008, now() + dur);
    src.connect(flt); flt.connect(g); g.connect(dest || sfxGain);
    src.start(); src.stop(now() + dur + 0.02);
    return g;
  }
  function tone(type, f0, f1, dur, vol, dest, delay) {
    const t = now() + (delay || 0);
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== undefined && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
    return o;
  }

   
  const SFX = {
    shot() { noise(0.16, 0.5, 'bandpass', 2600, 400); tone('square', 320, 60, 0.1, 0.28); },
    shotEnemy() { noise(0.13, 0.24, 'bandpass', 1700, 300); tone('square', 220, 50, 0.09, 0.13); },
    shotgun() { noise(0.3, 0.55, 'lowpass', 1800, 180); tone('sawtooth', 160, 40, 0.18, 0.2); },
    dryFire() { noise(0.05, 0.22, 'highpass', 3000); },
    reloadStart() { noise(0.05, 0.18, 'highpass', 2200); tone('square', 900, 700, 0.04, 0.06); },
    reloadEnd() { tone('square', 700, 1200, 0.06, 0.1); noise(0.06, 0.2, 'highpass', 2600); },
    hit() { noise(0.1, 0.4, 'lowpass', 1200, 300); tone('triangle', 180, 90, 0.09, 0.16); },
    hitPlayer() { noise(0.22, 0.5, 'lowpass', 800, 160); tone('sawtooth', 150, 60, 0.24, 0.2); },
    kill() { noise(0.3, 0.35, 'lowpass', 900, 120); tone('sawtooth', 200, 55, 0.28, 0.16); },
    ricochet() { tone('sine', 2400, 700, 0.11, 0.09); },
    jump() { tone('square', 340, 620, 0.08, 0.08); },
    land() { noise(0.07, 0.16, 'lowpass', 500, 200); },
    whistle() {
      tone('square', 620, 600, 1.1, 0.11); tone('square', 930, 900, 1.1, 0.08);
      tone('sawtooth', 466, 452, 1.1, 0.05);
    },
    door() { noise(0.28, 0.2, 'bandpass', 900, 300); },
    explode() { noise(0.7, 0.6, 'lowpass', 900, 60); tone('sawtooth', 90, 30, 0.6, 0.24); },
    dynamite() { tone('square', 1500, 1500, 0.03, 0.07); },
    horse() { noise(0.09, 0.2, 'bandpass', 500, 200); },
    ui() { tone('square', 660, 880, 0.05, 0.09); },
    uiBack() { tone('square', 500, 300, 0.06, 0.08); },
    cash() { tone('square', 880, 1320, 0.08, 0.1); tone('square', 1320, 1760, 0.1, 0.08, null, 0.08); },
    win() {
      const seq = [392, 523, 659, 784];
      seq.forEach((f, i) => { tone('square', f, f, 0.28, 0.13, null, i * 0.13); tone('triangle', f / 2, f / 2, 0.3, 0.09, null, i * 0.13); });
    },
    fail() {
      [330, 262, 208, 165].forEach((f, i) => tone('sawtooth', f, f * 0.98, 0.45, 0.12, null, i * 0.16));
    },
    objective() { tone('square', 523, 784, 0.16, 0.1); },
    thunder() { noise(1.4, 0.4, 'lowpass', 400, 60); },
    tunnel() { noise(0.9, 0.25, 'lowpass', 600, 120); },
  };

  function sfx(name) {
    if (!enabled || !sfxOn || !ctx) return;
    const f = SFX[name];
    if (f) { try { f(); } catch (e) {   } }
  }

   
  const SCALE = [0, 3, 5, 7, 10];  
  const ROOTS = { menu: 55, calm: 55, combat: 58.27, boss: 51.91 };  
  let mus = { mode: null, next: 0, step: 0, timer: null };

  function midiHz(semi, base) { return base * Math.pow(2, semi / 12); }

  function scheduleStep(t, mode, step) {
    const root = ROOTS[mode] || 55;
    const bar = Math.floor(step / 16) % 4;
    const s = step % 16;
    const intense = mode === 'combat' || mode === 'boss';

     
    if (s % 2 === 0) {
      const deg = (s === 0 || s === 8) ? 0 : (bar === 2 ? 3 : (s === 6 ? 5 : 0));
      const f = midiHz(deg + (bar === 3 && s >= 12 ? 5 : 0), root);
      const o = ctx.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(f, t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(intense ? 0.30 : 0.22, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.19);
      o.connect(g); g.connect(musGain); o.start(t); o.stop(t + 0.22);
    }
     
    if (s === 0 || s === 3 || s === 6 || s === 10 || (intense && s === 13)) {
      const deg = SCALE[(bar + (s >> 2)) % SCALE.length] + 24 + (bar === 3 ? 12 : 0);
      const f = midiHz(deg, root);
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t);
      const flt = ctx.createBiquadFilter(); flt.type = 'bandpass';
      flt.frequency.setValueAtTime(f * 2.4, t); flt.Q.value = 3.2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
      o.connect(flt); flt.connect(g); g.connect(musGain);
      o.start(t); o.stop(t + 0.36);
    }
     
    if (s % 2 === 1) {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const flt = ctx.createBiquadFilter(); flt.type = 'highpass'; flt.frequency.value = 6500;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0008, t + 0.05);
      src.connect(flt); flt.connect(g); g.connect(musGain);
      src.start(t); src.stop(t + 0.07);
    }
    if (s === 4 || s === 12 || (intense && s === 14)) {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const flt = ctx.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = 1800; flt.Q.value = 1.2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0008, t + 0.12);
      src.connect(flt); flt.connect(g); g.connect(musGain);
      src.start(t); src.stop(t + 0.14);
    }
     
    if (mode === 'boss' && s === 0) {
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(midiHz(-12, root), t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.07, t + 0.6);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.9);
      o.connect(g); g.connect(musGain); o.start(t); o.stop(t + 2);
    }
  }

  function tick() {
    if (!ctx || !mus.mode) return;
    const spb = mus.mode === 'boss' ? 0.115 : mus.mode === 'combat' ? 0.125 : 0.145;
    const ahead = now() + 0.25;
    let guard = 0;
    while (mus.next < ahead && guard++ < 40) {
      if (mus.next < now()) mus.next = now() + 0.02;
      try { scheduleStep(mus.next, mus.mode, mus.step); } catch (e) {   }
      mus.step = (mus.step + 1) % 64;
      mus.next += spb;
    }
  }

  function music(mode) {
    init();
    if (!enabled) return;
    if (mus.mode === mode) return;
    mus.mode = mode;
    if (!mode) { if (mus.timer) { clearInterval(mus.timer); mus.timer = null; } return; }
    mus.step = 0; mus.next = now() + 0.06;
    if (!mus.timer) mus.timer = setInterval(tick, 60);
    if (musGain) musGain.gain.value = musicOn ? 0.34 : 0;
  }

  return {
    init, resume, sfx, music,
    get ready() { return started; },
    setMusic(v) { musicOn = v; if (musGain) musGain.gain.value = v ? 0.34 : 0; },
    setSfx(v) { sfxOn = v; },
    setMaster(v) { if (master) master.gain.value = v; },
    get musicOn() { return musicOn; },
    get sfxOn() { return sfxOn; },
  };
})();




const Save = (function () {
  const KEY = 'pbx.trainheist.save';
  const DEFAULTS = {
    money: 0,
    rep: 0,
    rank: 1,
    completed: {},       
    upgrades: {},        
    stats: { kills: 0, missions: 0, earned: 0, shotsFired: 0, shotsHit: 0 },
    settings: { music: true, sfx: true, shake: true },
    seenIntro: false,
  };
  let data = JSON.parse(JSON.stringify(DEFAULTS));
  let backing = null;

  try {
    if (typeof localStorage !== 'undefined') {
      const probe = 'pbx.trainheist.__t';
      localStorage.setItem(probe, '1'); localStorage.removeItem(probe);
      backing = localStorage;
    }
  } catch (e) { backing = null; }

  function load() {
    if (!backing) return;
    try {
      const raw = backing.getItem(KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      data = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), parsed);
      data.stats = Object.assign({}, DEFAULTS.stats, parsed.stats || {});
      data.settings = Object.assign({}, DEFAULTS.settings, parsed.settings || {});
    } catch (e) {   }
  }
  function write() {
    if (!backing) return;
    try { backing.setItem(KEY, JSON.stringify(data)); } catch (e) {   }
  }
  function reset() { data = JSON.parse(JSON.stringify(DEFAULTS)); write(); }

  load();
  return {
    get data() { return data; },
    write, reset,
    get persistent() { return !!backing; },
  };
})();

function rankFromRep(rep) {

}

function makeCase(mission) {
  const cfg = mysteryConfig(mission);
  const n = cfg.passengers;
  const K = Math.min(cfg.culprits, n - 2);

   
  const usedNames = {};
  const people = [];
  for (let i = 0; i < n; i++) {
    let name;
    do { name = pick(FIRST_NAMES) + ' ' + pick(SURNAMES); } while (usedNames[name]);
    usedNames[name] = true;
    const attrs = {};
    for (const k of ATTR_KEYS) attrs[k] = pick(ATTRS[k].values);
    people.push({
      id: i, name, attrs, culprit: false, role: 'bystander',
      look: randomAppearance(), known: {}, met: false, asked: {},
      gossip: pick(GOSSIP), holdsClue: -1,
    });
  }

   
  const order = people.map((p) => p.id);
  for (let i = order.length - 1; i > 0; i--) { const j = randInt(0, i); const t = order[i]; order[i] = order[j]; order[j] = t; }
  const culpritIds = order.slice(0, K);
  for (const id of culpritIds) { people[id].culprit = true; people[id].role = 'culprit'; }
  const culprits = culpritIds.map((id) => people[id]);

   
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  

  const plain = shuffle(CLUE_ATTRS.filter((a) => ATTRS[a].reveal === 'notice'));
  const subtle = shuffle(CLUE_ATTRS.filter((a) => ATTRS[a].reveal !== 'notice'));
  const want = clamp(cfg.clues, 2, CLUE_ATTRS.length);
  const nSubtle = clamp(Math.round(want * cfg.hiddenBias), 0, subtle.length);
  const clueAttrs = subtle.slice(0, nSubtle).concat(plain).concat(subtle.slice(nSubtle)).slice(0, want);
  const clues = [];
  for (const attr of clueAttrs) {
    const value = culprits[0].attrs[attr];
    for (const c of culprits) c.attrs[attr] = value;
    clues.push({ attr, value, text: CLUE_TEXT[attr](value), found: false });
  }

   
  const satisfiesAll = (p) => clues.every((c) => p.attrs[c.attr] === c.value);
  let guard = 0;
  for (const p of people) {
    if (p.culprit) continue;
    while (satisfiesAll(p) && guard++ < 500) {
      const c = pick(clues);
      const alt = ATTRS[c.attr].values.filter((v) => v !== c.value);
      p.attrs[c.attr] = pick(alt);
    }
  }
   
  const innocents = people.filter((p) => !p.culprit);
  const herrings = Math.min(innocents.length, 1 + Math.floor(cfg.clues / 2));
  for (let i = 0; i < herrings; i++) {
    const p = innocents[i];
    const skip = randInt(0, clues.length - 1);
    for (let j = 0; j < clues.length; j++) {
      if (j === skip) continue;
      p.attrs[clues[j].attr] = clues[j].value;
    }
    if (satisfiesAll(p)) {    
      const c = clues[skip];
      p.attrs[c.attr] = pick(ATTRS[c.attr].values.filter((v) => v !== c.value));
    }
    p.herring = true;
  }
   
  const matches = people.filter(satisfiesAll);
  const solvable = matches.length === K && matches.every((p) => p.culprit);

   
  const witnessPool = innocents.filter((p) => !p.herring);
  let wi = 0;
  clues.forEach((c, i) => {
    const asObject = (i % 2 === 1) || witnessPool.length === 0;
    if (asObject) {
      c.source = { type: 'object', def: CLUE_OBJECTS[i % CLUE_OBJECTS.length] };
    } else {
      const w = witnessPool[wi++ % witnessPool.length];
      w.role = 'witness'; w.holdsClue = i;
      c.source = { type: 'witness', who: w.id, name: w.name };
    }
  });

  return {
    people, clues, culpritIds, culpritCount: K,
    required: Math.max(2, clues.length - 1),
    found: 0, questioned: 0, solvable,
    briefing: 'The marshal\'s wire says ' + (K === 1 ? 'one of them is' : K + ' of them are') +
      ' riding this train. Find out who before they make their move.',
  };
}

function Pool(factory, cap) {
  this.items = new Array(cap);
  for (let i = 0; i < cap; i++) this.items[i] = factory();
  this.cap = cap;
  this.cursor = 0;
}
Pool.prototype.spawn = function () {
   
  for (let i = 0; i < this.cap; i++) {
    const idx = (this.cursor + i) % this.cap;
    if (!this.items[idx].alive) { this.cursor = (idx + 1) % this.cap; return this.items[idx]; }
  }
  const idx = this.cursor; this.cursor = (this.cursor + 1) % this.cap;
  return this.items[idx];
};

 
const Particles = (function () {
  const pool = new Pool(() => ({
    alive: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1,
    size: 2, color: '#fff', grav: 0, kind: 0, rot: 0, vr: 0,
  }), 320);

  function emit(x, y, n, opt) {
    for (let i = 0; i < n; i++) {
      const p = pool.spawn();
      p.alive = true; p.x = x; p.y = y;
      const a = opt.angle !== undefined ? opt.angle + rand(-opt.spread, opt.spread) : rand(0, TAU);
      const sp = rand(opt.speed[0], opt.speed[1]);
      p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
      p.max = p.life = rand(opt.life[0], opt.life[1]);
      p.size = rand(opt.size[0], opt.size[1]);
      p.color = Array.isArray(opt.color) ? pick(opt.color) : opt.color;
      p.grav = opt.grav || 0;
      p.kind = opt.kind || 0;
      p.rot = rand(0, TAU); p.vr = rand(-8, 8);
      p.drag = opt.drag || 0;
    }
  }
  function update(dt) {
    const it = pool.items;
    for (let i = 0; i < it.length; i++) {
      const p = it[i];
      if (!p.alive) continue;
      p.life -= dt;
      if (p.life <= 0) { p.alive = false; continue; }
      p.vy += p.grav * dt;
      if (p.drag) { p.vx -= p.vx * p.drag * dt; p.vy -= p.vy * p.drag * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
  }
  function draw(ctx, cam) {
    const it = pool.items;
    for (let i = 0; i < it.length; i++) {
      const p = it[i];
      if (!p.alive) continue;
      const sx = p.x - cam;
      if (sx < -30 || sx > VIEW_W + 30) continue;
      const t = p.life / p.max;
      ctx.globalAlpha = p.kind === 2 ? t * 0.55 : Math.min(1, t * 1.6);
      ctx.fillStyle = p.color;
      if (p.kind === 1) {  
        ctx.fillRect(sx - p.size, p.y - p.size * 0.5, p.size * 2.4, p.size);
      } else if (p.kind === 2) {  
        ctx.beginPath();
        ctx.arc(sx, p.y, p.size * (1.7 - t * 0.7), 0, TAU);
        ctx.fill();
      } else {
        ctx.fillRect(sx - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
      }
    }
    ctx.globalAlpha = 1;
  }
  function clear() { for (const p of pool.items) p.alive = false; }
  return { emit, update, draw, clear };
})();

 
const FloatText = (function () {
  const pool = new Pool(() => ({ alive: false, x: 0, y: 0, vy: 0, life: 0, max: 1, text: '', color: '#fff', size: 14 }), 40);
  function add(x, y, text, color, size) {

    }

  }

})();

 
const Bullets = (function () {
  const pool = new Pool(() => ({
    alive: false, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0,
    life: 0, dmg: 0, friendly: false, size: 3, color: '#ffd97a',
  }), 220);

  function fire(x, y, angle, speed, dmg, friendly, color) {
    const b = pool.spawn();
    b.alive = true; b.x = b.px = x; b.y = b.py = y;
    b.vx = Math.cos(angle) * speed; b.vy = Math.sin(angle) * speed;

    b.color = color || (friendly ? '#ffe9a8' : '#ff9a6a');
    b.size = friendly ? 3.4 : 3;
    return b;
  }

  function update(dt, onHit) {
    for (const b of pool.items) {
      if (!b.alive) continue;
      b.life -= dt;
      if (b.life <= 0) { b.alive = false; continue; }
      b.px = b.x; b.py = b.y;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < Train.x0 - 700 || b.x > Train.x1 + 700 || b.y > VIEW_H + 60 || b.y < -80) { b.alive = false; continue; }

    }

    for (const b of pool.items) {
      if (!b.alive) continue;
      const sx = b.x - cam;
      if (sx < -40 || sx > VIEW_W + 40) continue;
      const tx = b.px - cam;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = b.size;
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.moveTo(tx, b.py); ctx.lineTo(sx, b.y); ctx.stroke();
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = b.size * 2.2;
      ctx.beginPath(); ctx.moveTo(tx, b.py); ctx.lineTo(sx, b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineCap = 'butt';
  }
  function clear() { for (const b of pool.items) b.alive = false; }
  return { fire, update, draw, clear, items: pool.items };
})();

 
const Physics = {
  

  landOn(x, prevFeet, feet, dropping, halfW) {
    let best = null;
    const pl = Train.platforms;
    for (let i = 0; i < pl.length; i++) {
      const p = pl[i];
      if (x + halfW < p.x1 || x - halfW > p.x2) continue;
      if (p.oneWay && dropping) continue;
      if (prevFeet <= p.y + 0.5 && feet >= p.y) {
        if (!best || p.y < best.y) best = p;
      }
    }
    return best;
  },
   
  surfaceBelow(x, feet) {
    let best = null;
    for (const p of Train.platforms) {
      if (x < p.x1 || x > p.x2) continue;
      if (p.y >= feet - 2) { if (!best || p.y < best.y) best = p; }
    }
    return best;
  },
  supportAt(x, y) {
     
    for (const p of Train.platforms) {
      if (x >= p.x1 && x <= p.x2 && Math.abs(p.y - y) < 2) return p;
    }
    return null;
  },
  

  clampCeiling(e) {
    const c = Train.carAt(e.x);
    if (!c || c.roofY === null) return;
    const ceil = c.roofY + 12;
    if (e.y > c.roofY + 8 && e.y - e.h < ceil) {
      e.y = ceil + e.h;
      if (e.vy < 0) e.vy = 0;
    }
  },
   
  blocked(x, y) {
    const b = Train.blockers;
    for (let i = 0; i < b.length; i++) {
      const s = b[i];
      if (x > s.x1 && x < s.x2 && y > s.y1 && y < s.y2) return true;
    }
    return false;
  },
  resolveSolids(e) {
    const top = e.y - e.h, bot = e.y;
    for (const s of Train.moveSolids) {
      if (bot <= s.y1 + 2 || top >= s.y2) continue;
      const l = e.x - e.hw, r = e.x + e.hw;
      if (r <= s.x1 || l >= s.x2) continue;
      const penR = r - s.x1, penL = s.x2 - l;
      if (penR < penL) { e.x = s.x1 - e.hw; if (e.vx > 0) e.vx = 0; }
      else { e.x = s.x2 + e.hw; if (e.vx < 0) e.vx = 0; }
    }
  },
};

 
function Player() {
  this.reset(playerStats());
}
Player.prototype.reset = function (stats) {
  this.stats = stats;
  this.x = Train.x1 - 90;
  this.y = FLOOR_Y;
  this.vx = 0; this.vy = 0;
  this.hw = 12; this.h = 46; this.crouchH = 30;
  this.facing = -1;
  this.onGround = true;
  this.coyote = 0; this.buffer = 0; this.jumps = 0;
  this.crouching = false; this.dropTimer = 0;
  this.locked = false; this.lockX = this.x; this.lockPulse = 0;
  this.holstered = false;
  this.hp = stats.maxHp; this.maxHp = stats.maxHp;
  this.ammo = stats.magSize; this.magSize = stats.magSize;
  this.reloadT = 0; this.fireCd = 0;
  this.invuln = 0; this.hurtFlash = 0;
  this.aim = Math.PI; this.recoil = 0;
  this.runPhase = 0; this.muzzle = 0;
  this.alive = true;
  this.shotsFired = 0; this.shotsHit = 0;
  this.interactTarget = null;
};

Player.prototype.update = function (dt, mission) {
  if (!this.alive) return;
  const s = this.stats;
  const wantLeft = Input.down('left'), wantRight = Input.down('right');
  const moveDir = (wantRight ? 1 : 0) - (wantLeft ? 1 : 0);

  this.crouching = Input.down('down') && this.onGround;
  const h = this.crouching ? this.crouchH : this.h;

  


  const wasLocked = this.locked;
  this.locked = Input.down('lock');
  if (this.locked) {
    if (!wasLocked) {
      this.lockX = this.x;
      this.lockPulse = 1;
      Sound.sfx('reloadStart');
      Particles.emit(this.x, this.y, 5, { speed: [30, 90], life: [0.15, 0.3], size: [2, 3], color: '#e8c877', angle: 0, spread: Math.PI, grav: 260 });
    }
  } else if (wasLocked) {
    this.lockPulse = 0.6;
  }

   
  const targetVx = this.locked ? 0 : moveDir * s.speed * (this.crouching ? 0.42 : 1);
  const accel = this.locked ? 9999 : (this.onGround ? 2600 : 1500);
  this.vx = approach(this.vx, targetVx, accel * dt);
  if (moveDir !== 0 && !Input.state.usingMouse) this.facing = moveDir;

   
  if (Input.pressed('jump')) this.buffer = 0.12;
  this.buffer -= dt;
  if (this.onGround) { this.coyote = 0.09; this.jumps = 0; } else this.coyote -= dt;

  if (this.buffer > 0) {
    const canGround = this.onGround || this.coyote > 0;
    const canAir = s.doubleJump && this.jumps < 1 && !canGround;
    if (canGround || canAir) {
       
      const plat = Physics.supportAt(this.x, this.y);
      if (Input.down('down') && plat && plat.oneWay && !this.locked) {
        this.dropTimer = 0.18; this.onGround = false; this.vy = 40;
      } else {
         
        this.vy = canAir ? -JUMP_VEL * 0.86 : -JUMP_VEL;
        this.onGround = false;
        this.jumps += canAir ? 1 : 0;
        Sound.sfx('jump');
        Particles.emit(this.x, this.y, 5, { speed: [40, 120], life: [0.15, 0.3], size: [2, 4], color: '#d9c9a8', angle: -Math.PI / 2, spread: 1.2, grav: 500 });
      }
      this.buffer = 0; this.coyote = 0;
    }
  }
   
  if (Input.released('jump') && this.vy < -480) this.vy = -480;

   
  this.vy += (this.vy < 0 ? GRAVITY_UP : GRAVITY_DOWN) * dt;
  if (this.vy > 1350) this.vy = 1350;

  const prevFeet = this.y;
  this.x += this.vx * dt;
  this.y += this.vy * dt;
  this.dropTimer -= dt;

  if (this.locked) this.x = this.lockX;
  this.x = clamp(this.x, Train.x0 + 10, Train.x1 - 10);
  this.hw = 12; this.h = h;
  Physics.resolveSolids(this);
  Physics.clampCeiling(this);
   
  if (this.locked) { this.lockX = clamp(this.lockX, Train.x0 + 10, Train.x1 - 10); this.x = this.lockX; this.vx = 0; }

   
  this.onGround = false;
  if (this.vy >= 0) {
    const p = Physics.landOn(this.x, prevFeet, this.y, this.dropTimer > 0, this.hw);
    if (p) {
      this.y = p.y; this.vy = 0; this.onGround = true;
      if (prevFeet < p.y - 60) {
        Sound.sfx('land');
        Particles.emit(this.x, this.y, 6, { speed: [50, 150], life: [0.15, 0.3], size: [2, 4], color: '#cdbb96', angle: 0, spread: Math.PI, grav: 300 });
      }
    }
  }
   
  if (this.y > VIEW_H + 40) { this.y = FLOOR_Y; this.vy = 0; this.damage(10, 0); }

   
  const gunY = this.y - (this.crouching ? 20 : 30);
  if (Input.state.usingMouse) {
    const tx = Input.state.mx + mission.cam, ty = Input.state.my;
    this.aim = Math.atan2(ty - gunY, tx - this.x);
    this.facing = Math.cos(this.aim) >= 0 ? 1 : -1;
  } else {
     
    const ax = moveDir;
    let ay = 0;
    if (Input.down('up')) ay = -1;
    else if (Input.down('down') && !this.onGround) ay = 1;
    if (this.locked && ax !== 0) this.facing = ax;
    if (this.locked && ax === 0 && ay !== 0) {
      this.aim = ay < 0 ? -Math.PI / 2 : Math.PI / 2;
    } else {
      const fx = ax !== 0 ? ax : this.facing;
      this.aim = fx > 0 ? Math.atan2(ay * 0.72, 1) : Math.PI - Math.atan2(ay * 0.72, 1);
    }
  }

   
  this.fireCd -= dt;
  this.muzzle = Math.max(0, this.muzzle - dt);
  this.recoil = Math.max(0, this.recoil - dt * 5);
  if (this.reloadT > 0) {
    this.reloadT -= dt;
    if (this.reloadT <= 0) { this.ammo = this.magSize; Sound.sfx('reloadEnd'); }
  }
  if (Input.pressed('reload') && !this.holstered && this.ammo < this.magSize && this.reloadT <= 0) this.startReload();
  if (Input.down('shoot') && !this.holstered && this.fireCd <= 0 && this.reloadT <= 0) {
    if (this.ammo > 0) this.shoot(gunY);
    else { Sound.sfx('dryFire'); this.fireCd = 0.25; this.startReload(); }
  }

  this.invuln -= dt;
  this.hurtFlash = Math.max(0, this.hurtFlash - dt * 3);
  this.lockPulse = Math.max(0, (this.lockPulse || 0) - dt * 2.4);
  if (Math.abs(this.vx) > 20 && this.onGround && !this.locked) this.runPhase += dt * Math.abs(this.vx) * 0.045;
  else this.runPhase = 0;
};

Player.prototype.startReload = function () {
  if (this.reloadT > 0 || this.ammo >= this.magSize) return;
  this.reloadT = this.stats.reloadTime;
  Sound.sfx('reloadStart');
};

Player.prototype.shoot = function (gunY) {
  this.ammo--;
  this.fireCd = 0.155;
  this.muzzle = 0.06;
  this.recoil = 1;
  this.shotsFired++;
  Save.data.stats.shotsFired++;
  const a = this.aim + rand(-0.018, 0.018);
  const mx = this.x + Math.cos(a) * 22;
  const my = gunY + Math.sin(a) * 22;
  Bullets.fire(mx, my, a, 1450, this.stats.damage, true);
  Sound.sfx('shot');
  Particles.emit(mx, my, 4, { speed: [90, 240], life: [0.08, 0.16], size: [2, 4], color: ['#ffe9a8', '#ffb347'], angle: a, spread: 0.35, kind: 1 });
  Particles.emit(mx, my, 2, { speed: [10, 40], life: [0.4, 0.7], size: [3, 6], color: '#cfc4b4', angle: a, spread: 1.0, kind: 2, grav: -30 });
  this.vx -= Math.cos(a) * 26;
  Game.shake(2.4);
};

Player.prototype.damage = function (amount, dir) {
  if (this.invuln > 0 || !this.alive) return false;
  const dmg = amount * (1 - this.stats.dr);
  this.hp -= dmg;
  this.invuln = 0.65;
  this.hurtFlash = 1;
  this.vx += dir * 130;
  Sound.sfx('hitPlayer');
  Game.shake(7);
  Particles.emit(this.x, this.y - 24, 8, { speed: [80, 220], life: [0.2, 0.45], size: [2, 4], color: ['#c8443c', '#8c2a26'], angle: dir > 0 ? 0 : Math.PI, spread: 1.1, grav: 620 });
  if (this.hp <= 0) { this.hp = 0; this.alive = false; }
  return true;
};

  const legSwing = this.locked ? 0 : (this.onGround ? Math.sin(this.runPhase) * 8 : (this.vy < 0 ? -5 : 5));

  ctx.fillStyle = '#2b3550';

  ctx.fillStyle = '#c2a06a';
  ctx.fillRect(sx - 17, headY - 8, 34, 4);
  ctx.fillStyle = '#a9884f';
  ctx.fillRect(sx - 9, headY - 17, 18, 10);
  ctx.fillStyle = '#7d6338';
  ctx.fillRect(sx - 9, headY - 10, 18, 3);

   
  const gy = y - (this.crouching ? 20 : 30);
  const ga = this.aim;
  const kick = this.recoil * 4;
  const shoulderX = sx, shoulderY = gy - 2;
  const handX = shoulderX + Math.cos(ga) * (16 - kick);
  const handY = shoulderY + Math.sin(ga) * (16 - kick);
  ctx.strokeStyle = '#48598a'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY); ctx.lineTo(handX, handY); ctx.stroke();
  ctx.strokeStyle = '#d9a878'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(handX - Math.cos(ga) * 3, handY - Math.sin(ga) * 3); ctx.lineTo(handX, handY); ctx.stroke();
  ctx.lineCap = 'butt';
   
  ctx.save();
  ctx.translate(handX, handY); ctx.rotate(ga);
  ctx.fillStyle = '#3b3b46'; ctx.fillRect(0, -3, 15, 5);
  ctx.fillStyle = '#8a6a3c'; ctx.fillRect(-4, -2, 6, 8);
  ctx.restore();

   
  if (this.muzzle > 0) {
    const fx = handX + Math.cos(ga) * 17, fy = handY + Math.sin(ga) * 17;
    ctx.save();
    ctx.translate(fx, fy); ctx.rotate(ga);
    ctx.fillStyle = '#fff2c4';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(16, -7); ctx.lineTo(24, 0); ctx.lineTo(16, 7);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,190,90,0.6)';
    ctx.beginPath(); ctx.arc(6, 0, 9, 0, TAU); ctx.fill();
    ctx.restore();
  }

  if (this.hurtFlash > 0) {
    ctx.globalAlpha = this.hurtFlash * 0.5;
    ctx.fillStyle = '#ff3a2a';
    ctx.fillRect(sx - 14, top, 28, h);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
};





function laneOf(y) { return y < 382 ? 1 : 0; }    

 
function hasLOS(x0, y0, x1, y1) {
  const steps = 10;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (Physics.blocked(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false;
  }
  return true;
}

 
const Grenades = (function () {
  const list = [];
  function throwAt(x, y, tx, ty, owner) {
    const dx = tx - x;
    const t = clamp(Math.abs(dx) / 380, 0.5, 1.5);
    list.push({
      x, y, vx: dx / t, vy: (ty - y) / t - 0.5 * 1500 * t,
      fuse: t + 0.25, owner, rot: 0,
    });
    Sound.sfx('dynamite');
  }
  function update(dt, onExplode) {
    for (let i = list.length - 1; i >= 0; i--) {
      const g = list[i];
      g.vy += 1500 * dt;
      g.x += g.vx * dt; g.y += g.vy * dt;
      g.rot += dt * 12;
      g.fuse -= dt;
      const surf = Physics.surfaceBelow(g.x, g.y);
      if (surf && g.y >= surf.y && g.vy > 0) { g.y = surf.y; g.vy = 0; g.vx *= 0.4; }
      if (g.fuse <= 0 || g.y > VIEW_H) {
        onExplode(g);
        list.splice(i, 1);
      }
    }
  }
  function draw(ctx, cam) {
    for (const g of list) {
      const sx = g.x - cam;
      if (sx < -30 || sx > VIEW_W + 30) continue;
      ctx.save();
      ctx.translate(sx, g.y - 6); ctx.rotate(g.rot);
      ctx.fillStyle = '#b83b2c'; ctx.fillRect(-9, -4, 18, 8);
      ctx.fillStyle = '#e8d9a8'; ctx.fillRect(-9, -4, 18, 2);
      ctx.restore();
      const blink = Math.sin(g.fuse * 30) > 0;
      if (blink) {
        ctx.fillStyle = '#ffd36a';
        ctx.beginPath(); ctx.arc(sx + 9, g.y - 12, 3, 0, TAU); ctx.fill();
      }
    }
  }
  function clear() { list.length = 0; }
  return { throwAt, update, draw, clear, list };
})();

 
function Enemy(typeKey, x, y, opts) {
  const d = ENEMY_TYPES[typeKey];
  this.type = typeKey; this.d = d;
  this.x = x; this.y = y;
  this.vx = 0; this.vy = 0;
  this.hw = d.w * 0.5; this.h = d.h;
  this.hp = d.hp; this.maxHp = d.hp;
  this.facing = -1;
  this.onGround = false;
  this.alive = true;
  this.flash = 0; this.stagger = 0;
  this.fireT = rand(0.4, 1.2);
  this.burstLeft = 0; this.burstT = 0;
  this.state = 'approach'; this.stateT = 0;
  this.mounted = !!d.mounted;
  this.boardT = rand(2.2, 4.5);
  this.plantT = 0; this.target = null;
  this.runPhase = 0;
  this.buff = 0;
  this.active = true;
  this.shoutT = rand(3, 6);
  this.summoned = 0;
  this.phase = 1;
  this.dashT = 0;
  this.deathT = 0;
  this.opts = opts || {};
  this.aim = Math.PI;
  this.muzzle = 0;
  this.crouch = false;
  this.aimT = 0; this.lockX = x; this.lockY = y; this.burstFired = false;
  this.stuckT = 0; this.movedLast = 99;
}

Enemy.prototype.gunY = function () { return this.y - (this.crouch ? this.h * 0.4 : this.h * 0.62); };

Enemy.prototype.hurt = function (dmg, dirX, mission) {
  if (!this.alive) return;
  this.hp -= dmg;
  this.flash = 1;
  Sound.sfx('hit');
  Particles.emit(this.x, this.y - this.h * 0.55, 6, {
    speed: [70, 210], life: [0.15, 0.35], size: [2, 4],
    color: ['#c8443c', '#e0715f', '#8c2a26'], angle: dirX > 0 ? 0 : Math.PI, spread: 1.0, grav: 700,
  });
  if (!this.d.boss) {
    this.stagger = 0.16;
    this.vx += dirX * 90;
  }
  if (this.hp <= 0) {
    this.alive = false;
    this.deathT = 0.75;
    Sound.sfx('kill');
    Particles.emit(this.x, this.y - this.h * 0.5, 12, {
      speed: [60, 260], life: [0.3, 0.7], size: [2, 5],
      color: ['#c8443c', '#8c2a26', '#3a2a28'], angle: dirX > 0 ? 0 : Math.PI, spread: 1.6, grav: 800,
    });
    FloatText.add(this.x, this.y - this.h - 6, '+' + this.d.score, '#ffd97a', 13);
    if (mission) mission.onKill(this);
  }
};

 
Enemy.prototype.walkTo = function (tx, dt, speedMul) {
  const d = this.d;
  const dir = sign(tx - this.x);
  const spd = d.speed * (speedMul === undefined ? 1 : speedMul) * (this.buff > 0 ? 1.15 : 1);
  if (Math.abs(tx - this.x) < 6) { this.vx = approach(this.vx, 0, 1800 * dt); return true; }
  this.vx = approach(this.vx, dir * spd, 1600 * dt);
  this.facing = dir;
  



  if (this.onGround && this.movedLast < 0.6 && Math.abs(tx - this.x) > 20) {
    this.vy = -700; this.onGround = false;
  }
  return false;
};

 
Enemy.prototype.syncLane = function (P, dt) {
  const myLane = laneOf(this.y), pLane = laneOf(P.y);
  if (myLane === pLane) return false;
  const dir = sign(P.x - this.x) || 1;
  const gx = Train.nearestGap(this.x, dir);
  if (gx === null || gx === undefined) return false;
  if (pLane === 1) {
     
    if (Math.abs(this.x - gx) > 12) { this.walkTo(gx, dt); return true; }
    if (this.onGround) { this.vy = -700; this.vx = dir * 40; }
    else { this.vx = approach(this.vx, dir * this.d.speed * 0.8, 1200 * dt); }
    return true;
  }
   
  this.walkTo(gx, dt);
  return true;
};

Enemy.prototype.canShoot = function (P) {
  const gy = this.gunY();
  const py = P.y - P.h * 0.55;
  if (!hasLOS(this.x, gy, P.x, py)) return false;
  return true;
};

Enemy.prototype.fireAt = function (P, mission) {
  const d = this.d;
  const D = Game.diff;
  const gy = this.gunY();
   
   
  const track = this.burstFired ? 0.45 : 0;
  const tx = lerp(this.lockX, P.x, track);
  const ty = lerp(this.lockY, P.y - P.h * 0.5, track);
  this.burstFired = true;
  const py = ty;
  const base = Math.atan2(py - gy, tx - this.x);
  this.aim = base;
  this.facing = Math.cos(base) >= 0 ? 1 : -1;
  this.muzzle = 0.07;
  const pellets = d.pellets || 1;
  const spread = d.spread * D.spread;
  for (let i = 0; i < pellets; i++) {
    const a = base + rand(-spread, spread) * (pellets > 1 ? 1.4 : 1);
    const bx = this.x + Math.cos(a) * 18, by = gy + Math.sin(a) * 18;
    Bullets.fire(bx, by, a, d.bulletSpeed, d.damage * D.dmg, false, d.boss ? '#ff6a4a' : undefined);
  }
  Particles.emit(this.x + Math.cos(base) * 20, gy + Math.sin(base) * 20, 3, {
    speed: [80, 190], life: [0.06, 0.14], size: [2, 3], color: ['#ffd9a8', '#ff9a4a'], angle: base, spread: 0.4, kind: 1,
  });
  Sound.sfx(pellets > 1 ? 'shotgun' : 'shotEnemy');
};

Enemy.prototype.tickWeapon = function (dt, P, mission, delayMul) {
  const d = this.d;
  const D = Game.diff;

   
  if (this.aimT > 0 || this.burstLeft > 0) this.facing = sign(P.x - this.x) || this.facing;

  if (this.burstLeft > 0) {
    this.burstT -= dt;
    if (this.burstT <= 0) {
      this.fireAt(P, mission);
      this.burstLeft--;
      this.burstT = d.burstGap || 0.12;
      if (this.burstLeft <= 0) this.burstFired = false;
    }
    return;
  }
  if (this.aimT > 0) {
    this.aimT -= dt;
    this.aim = Math.atan2((this.lockY) - this.gunY(), this.lockX - this.x);
    if (this.aimT <= 0) { this.burstLeft = d.burst || 1; this.burstT = 0; this.burstFired = false; }
    return;
  }
  this.fireT -= dt * (this.buff > 0 ? 1.45 : 1);
  if (this.fireT <= 0) {
     
     
    if (!d.boss && Enemies.aiming >= Game.attackCap) { this.fireT = 0.22; return; }
    if (this.canShoot(P)) {
      this.aimT = (d.telegraph || 0.34) * D.tell;
      this.lockX = P.x; this.lockY = P.y - P.h * 0.5;
      this.fireT = d.fireDelay * (delayMul || 1) * D.rate * rand(0.85, 1.2);
    } else {
      this.fireT = 0.25;
    }
  }
};

 
Enemy.prototype.think = function (dt, P, mission) {
  const d = this.d;
  const adx = Math.abs(P.x - this.x);
  const dir = sign(P.x - this.x) || 1;

  if (d.sabotage) return this.thinkRunner(dt, P, mission);
  if (this.mounted) return this.thinkRider(dt, P, mission);
  if (d.boss) return this.thinkBoss(dt, P, mission);

   
  if (this.aimT > 0 || this.burstLeft > 0) {
    this.vx = approach(this.vx, 0, 2200 * dt);
    this.tickWeapon(dt, P, mission);
    return;
  }

  if (this.syncLane(P, dt)) return;

  const r0 = d.range[0], r1 = d.range[1];

  if (d.charge) {
     
    if (adx > r1 * 0.7) this.walkTo(P.x, dt, 1.0);
    else { this.vx = approach(this.vx, 0, 2000 * dt); this.facing = dir; }
    this.tickWeapon(dt, P, mission);
    return;
  }

  if (d.kite) {
     
    if (adx < r0 * 0.8) this.walkTo(this.x - dir * 120, dt, 1.15);
    else if (adx > r1) this.walkTo(P.x, dt, 0.9);
    else { this.vx = approach(this.vx, 0, 1800 * dt); this.facing = dir; }
    this.tickWeapon(dt, P, mission);
    return;
  }

   
  const losOK = this.canShoot(P);
  if (!losOK && adx < 520) {
    this.walkTo(P.x, dt, 1.05);           
  } else if (adx > r1) {
    this.walkTo(P.x, dt);
  } else if (adx < r0) {
    this.walkTo(this.x - dir * 90, dt, 0.8);
  } else {
    this.vx = approach(this.vx, 0, 1700 * dt);
    this.facing = dir;
  }
  this.tickWeapon(dt, P, mission);

  if (d.leader) {
    this.shoutT -= dt;
    if (this.shoutT <= 0) {
      this.shoutT = rand(7, 11);
      FloatText.add(this.x, this.y - this.h - 10, 'ON HIM!', '#ffb347', 13);
      for (const e of Enemies.list) {
        if (e !== this && e.alive && Math.abs(e.x - this.x) < 420) e.buff = 4.5;
      }
      if (this.summoned < 2 && mission) {
        this.summoned++;
        mission.spawnAt('outlaw', this.x + dir * -140, this.y, 2);
      }
    }
  }
};

Enemy.prototype.thinkRunner = function (dt, P, mission) {
  if (!this.target || this.target.done) this.target = mission.pickSabotageTarget(this.x);
  if (!this.target) { this.walkTo(Train.engineX, dt); return; }
  const tx = this.target.x;
  if (laneOf(this.y) === 1) { if (this.syncLane({ x: tx, y: FLOOR_Y, h: 40 }, dt)) return; }
  if (Math.abs(this.x - tx) > 14) {
    this.walkTo(tx, dt, 1.0);
    this.plantT = 0;
  } else {
    this.vx = approach(this.vx, 0, 2400 * dt);
    if (this.plantT === 0) {
      Sound.sfx('dynamite');
      FloatText.add(this.x, this.y - this.h - 8, 'PLANTING!', '#ffd36a', 13);
    }
    this.plantT += dt;
    if (this.plantT > 1.9) {
      this.plantT = 0;
      mission.sabotage(this.target, this);
       
      this.state = 'flee';
    }
  }
  if (this.state === 'flee') {
    const away = this.x > Train.len * 0.5 ? Train.x1 + 60 : Train.x0 - 60;
    this.walkTo(away, dt, 1.2);
    if (this.x < Train.x0 - 40 || this.x > Train.x1 + 40) { this.alive = false; this.deathT = 0; mission.escaped++; }
  }
};

Enemy.prototype.thinkRider = function (dt, P, mission) {
   
  const targetX = P.x + (this.opts.side || 1) * 150;
  this.vx = approach(this.vx, clamp((targetX - this.x) * 2.2, -230, 230), 900 * dt);
  this.facing = sign(P.x - this.x) || 1;
  this.y = 470 + Math.sin(this.runPhase * 2) * 2;
  this.runPhase += dt * 9;
  this.boardT -= dt;
  this.tickWeapon(dt, P, mission);
  if (this.boardT <= 0) {
    this.mounted = false;
    this.onGround = false;
    this.vy = -880;
    this.vx = 0;
    Sound.sfx('horse');
    Particles.emit(this.x, this.y, 8, { speed: [60, 200], life: [0.2, 0.5], size: [2, 5], color: ['#c9a06a', '#8a6a3c'], angle: -Math.PI / 2, spread: 1.4, grav: 600 });
  }
};

Enemy.prototype.thinkBoss = function (dt, P, mission) {
  const d = this.d;
  const frac = this.hp / this.maxHp;
  const newPhase = frac > 0.66 ? 1 : frac > 0.33 ? 2 : 3;
  if (newPhase !== this.phase) {
    this.phase = newPhase;
    this.stateT = 0;
    FloatText.add(this.x, this.y - this.h - 14, newPhase === 2 ? 'YOU\'LL REGRET THAT' : 'ENOUGH!', '#ffcf5a', 16);
    Particles.emit(this.x, this.y - this.h * 0.5, 22, { speed: [90, 320], life: [0.3, 0.7], size: [2, 5], color: ['#d9b45a', '#ffffff'], grav: 500 });
    Sound.sfx('explode');
    Game.shake(10);
  }
  if (this.syncLane(P, dt)) return;

  const adx = Math.abs(P.x - this.x);
  const dir = sign(P.x - this.x) || 1;
  this.stateT -= dt;

  if (this.phase === 3) {
    this.dashT -= dt;
    if (this.dashT <= 0 && adx > 120) {
      this.dashT = rand(2.2, 3.2);
      this.vx = dir * 460;
      Particles.emit(this.x, this.y - 6, 8, { speed: [60, 180], life: [0.2, 0.4], size: [2, 4], color: '#d9b45a', angle: -dir > 0 ? 0 : Math.PI, spread: 0.8, grav: 400 });
    }
    if (Math.abs(this.vx) > 300) { this.facing = sign(this.vx); this.vx = approach(this.vx, dir * d.speed, 500 * dt); }
    else this.walkTo(P.x - dir * 180, dt, 1.25);
    this.tickWeapon(dt, P, mission, 0.62);
    return;
  }

  if (this.phase === 2) {
    if (this.stateT <= 0) {
      this.stateT = rand(3.0, 4.2);
      Grenades.throwAt(this.x, this.gunY(), P.x, P.y, this);
      if (this.summoned < 6) {
        this.summoned += 2;
        mission.spawnAt('outlaw', this.x - dir * 200, this.y, 2);
      }
    }
    if (adx > 300) this.walkTo(P.x, dt, 1.0);
    else if (adx < 160) this.walkTo(this.x - dir * 140, dt);
    else { this.vx = approach(this.vx, 0, 1500 * dt); this.facing = dir; }
    this.tickWeapon(dt, P, mission, 0.9);
    return;
  }

   
  if (adx > d.range[1]) this.walkTo(P.x, dt);
  else if (adx < d.range[0]) this.walkTo(this.x - dir * 150, dt);
  else { this.vx = approach(this.vx, 0, 1500 * dt); this.facing = dir; }
  this.tickWeapon(dt, P, mission, 1.0);
};

Enemy.prototype.update = function (dt, P, mission) {
  if (!this.alive) { this.deathT -= dt; return; }
  this.flash = Math.max(0, this.flash - dt * 5);
  this.muzzle = Math.max(0, this.muzzle - dt);
  this.buff = Math.max(0, this.buff - dt);
  this.stagger -= dt;

  if (this.stagger <= 0) this.think(dt, P, mission);
  else this.vx = approach(this.vx, 0, 900 * dt);

   
  if (!this.mounted) {
    const far = Math.abs(P.x - this.x) > (this.d.range[1] || 200) + 60;
    if (far && this.movedLast < 0.6 && this.onGround) {
      this.stuckT = (this.stuckT || 0) + dt;
      if (this.stuckT > 1.4) {
        this.stuckT = 0;
        this.vy = -700;
        this.vx = (sign(P.x - this.x) || 1) * this.d.speed;
      }
    } else this.stuckT = 0;
  }

  if (this.mounted) {
    this.x += this.vx * dt;
    if (this.x < Train.x0 - 900) this.x = Train.x0 - 900;
    if (this.x > Train.x1 + 900) this.x = Train.x1 + 900;
    if (Math.abs(this.vx) > 10) this.runPhase += dt * 10;
    return;
  }

  this.vy += 1900 * dt;
  if (this.vy > 1100) this.vy = 1100;
  const prevFeet = this.y;
  const prevX = this.x;
  this.x += this.vx * dt;
  this.y += this.vy * dt;
  this.x = clamp(this.x, Train.x0 - 80, Train.x1 + 80);
  Physics.resolveSolids(this);
  Physics.clampCeiling(this);
  this.movedLast = Math.abs(this.x - prevX);

  this.onGround = false;
  if (this.vy >= 0) {
    const p = Physics.landOn(this.x, prevFeet, this.y, false, this.hw);
    if (p) { this.y = p.y; this.vy = 0; this.onGround = true; }
  }
  if (this.y > VIEW_H + 60) { this.alive = false; this.deathT = 0; if (mission) mission.escaped++; }
  if (this.onGround && Math.abs(this.vx) > 20) this.runPhase += dt * Math.abs(this.vx) * 0.05;
};

 
Enemy.prototype.updateDistant = function (dt, P) {
  if (!this.alive) { this.deathT -= dt; return; }
   
  const goal = (this.d.sabotage && this.target && !this.target.done) ? this.target : P;
  const dir = sign(goal.x - this.x) || 1;
  this.x += dir * this.d.speed * 0.75 * dt;
  this.facing = dir;
  if (!this.mounted) {
    const surf = Physics.surfaceBelow(this.x, this.y + 4);
    if (surf) this.y = surf.y;
  }
  this.runPhase += dt * 6;
};

Enemy.prototype.draw = function (ctx, cam, t) {
  const d = this.d;
  const sx = this.x - cam;
  if (sx < -80 || sx > VIEW_W + 80) return;

  if (!this.alive) {
     
    const a = clamp(this.deathT / 0.75, 0, 1);
    if (a <= 0) return;
    ctx.globalAlpha = a * 0.8;
    ctx.fillStyle = '#2a1f22';
    ctx.fillRect(sx - this.hw - 6, this.y - 12, this.hw * 2 + 12, 12);
    ctx.fillStyle = d.hat;
    ctx.fillRect(sx - 12, this.y - 16, 24, 5);
    ctx.globalAlpha = 1;
    return;
  }

  const h = this.h;
  const top = this.y - h;
  const f = this.facing;

  ctx.save();
   
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(sx, this.y + 2, this.hw + 3, 4, 0, 0, TAU); ctx.fill();

  if (this.mounted) this.drawHorse(ctx, sx);

  const bob = this.onGround || this.mounted ? Math.abs(Math.sin(this.runPhase)) * 2 : 0;
  const bodyTop = top + bob;

   
  ctx.fillStyle = '#2c2c34';
  const swing = Math.sin(this.runPhase) * 7;
  ctx.fillRect(sx - 8, this.y - h * 0.4, 6, h * 0.4);
  ctx.fillRect(sx + 2, this.y - h * 0.4, 6, h * 0.4);
  ctx.fillRect(sx - 9 + swing * 0.4, this.y - 5, 9, 5);
  ctx.fillRect(sx + swing * -0.4, this.y - 5, 9, 5);

   
  ctx.fillStyle = d.color;
  ctx.fillRect(sx - this.hw, bodyTop + h * 0.24, this.hw * 2, h * 0.5);
  ctx.fillStyle = d.accent;
  ctx.fillRect(sx - this.hw, bodyTop + h * 0.24, this.hw * 2, 4);

  if (d.boss) {
     
    ctx.fillStyle = '#15151c';
    ctx.beginPath();
    ctx.moveTo(sx - this.hw, bodyTop + h * 0.42);
    ctx.lineTo(sx - this.hw - 10, this.y);
    ctx.lineTo(sx + this.hw + 10, this.y);
    ctx.lineTo(sx + this.hw, bodyTop + h * 0.42);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = d.accent;
    ctx.fillRect(sx - this.hw, bodyTop + h * 0.5, this.hw * 2, 3);
  }

   
  const headY = bodyTop + h * 0.16;
  ctx.fillStyle = '#c99a6f';
  ctx.fillRect(sx - 6, headY - 6, 12, 12);
  ctx.fillStyle = d.boss ? '#8a1f28' : '#c8443c';
  ctx.fillRect(sx - 7, headY, 14, 7);
  ctx.fillStyle = '#1e1e26';
  ctx.fillRect(sx + (f > 0 ? 1 : -4), headY - 3, 3, 3);
   
  ctx.fillStyle = d.hat;
  ctx.fillRect(sx - (d.boss ? 18 : 14), headY - 8, d.boss ? 36 : 28, 4);
  ctx.fillRect(sx - 8, headY - 16, 16, 9);

   
  const gy = this.gunY();
  const ga = this.aim;
  const hx = sx + Math.cos(ga) * 15, hy = gy + Math.sin(ga) * 15;
  ctx.strokeStyle = d.color; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sx, gy); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.save();
  ctx.translate(hx, hy); ctx.rotate(ga);
  ctx.fillStyle = '#33333d';
  ctx.fillRect(0, -2.5, d.pellets ? 20 : 13, 5);
  ctx.restore();

   
  if (this.aimT > 0) {
    const total = (d.telegraph || 0.34) * Game.diff.tell;
    const k = 1 - this.aimT / total;
    ctx.save();
    ctx.globalAlpha = 0.16 + k * 0.3;
    ctx.strokeStyle = d.boss ? '#ffb347' : '#ff8a6a';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 6]);
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(hx + Math.cos(ga) * 560 * k, hy + Math.sin(ga) * 560 * k);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.5 + k * 0.5;
    ctx.fillStyle = '#fff0c0';
    ctx.beginPath();
    ctx.arc(hx + Math.cos(ga) * 15, hy + Math.sin(ga) * 15, 1.5 + k * 2.5, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  if (this.muzzle > 0) {
    ctx.save();
    ctx.translate(hx + Math.cos(ga) * 14, hy + Math.sin(ga) * 14); ctx.rotate(ga);
    ctx.fillStyle = '#ffe1a0';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(13, -6); ctx.lineTo(19, 0); ctx.lineTo(13, 6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

   
  if (d.sabotage && this.plantT > 0) {
    ctx.fillStyle = '#b83b2c';
    ctx.fillRect(sx - 4, this.y - 12, 8, 10);
    ctx.fillStyle = '#ffd36a';
    ctx.fillRect(sx - 1, this.y - 18, 2, 6);
  }

   
  if (this.flash > 0) {
    ctx.globalAlpha = this.flash * 0.85;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sx - this.hw - 2, top - 2, this.hw * 2 + 4, h + 4);
    ctx.globalAlpha = 1;
  }

   
  if ((d.leader || d.boss) && this.hp < this.maxHp) {
    const w = d.boss ? 60 : 40;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(sx - w / 2, top - 12, w, 5);
    ctx.fillStyle = d.boss ? '#d9b45a' : '#e06a4a';
    ctx.fillRect(sx - w / 2, top - 12, w * (this.hp / this.maxHp), 5);
  }
  if (this.buff > 0) {
    ctx.globalAlpha = 0.5 + Math.sin(t * 12) * 0.2;
    ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 2;
    ctx.strokeRect(sx - this.hw - 3, top - 3, this.hw * 2 + 6, h + 6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
};

Enemy.prototype.drawHorse = function (ctx, sx) {
