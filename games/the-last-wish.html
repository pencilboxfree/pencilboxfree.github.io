function setupTouch() {
  const root = document.getElementById('touch');
  const zone = document.getElementById('stickZone'), base = document.getElementById('stickBase'), knob = document.getElementById('stickKnob');
  let sid = null, ox = 0, oy = 0;
  const enable = () => { if (!Input.touchMode) { Input.touchMode = true; Input.mouse.used = false; root.classList.remove('hidden'); } };
  window.addEventListener('touchstart', enable, { passive: true });
  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0]; sid = t.identifier;
    const r = zone.getBoundingClientRect();
    ox = t.clientX; oy = t.clientY;
    base.style.left = (t.clientX - r.left - 60) + 'px';
    base.style.bottom = (r.bottom - t.clientY - 60) + 'px';
    Input.stick.on = true; Input.stick.x = Input.stick.y = 0;
  }, { passive: false });
  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === sid) {
      let dx = t.clientX - ox, dy = t.clientY - oy;
      const l = Math.hypot(dx, dy), m = 46;
      if (l > m) { dx = dx / l * m; dy = dy / l * m; }
      knob.style.left = (33 + dx) + 'px'; knob.style.top = (33 + dy) + 'px';
      const dz = 8;
      Input.stick.x = Math.abs(dx) < dz ? 0 : dx / m; Input.stick.y = Math.abs(dy) < dz ? 0 : dy / m;
    }
  }, { passive: false });
  const end = e => {
    for (const t of e.changedTouches) if (t.identifier === sid) {
      sid = null; Input.stick.on = false; Input.stick.x = Input.stick.y = 0;
      knob.style.left = '33px'; knob.style.top = '33px';
    }
  };
  zone.addEventListener('touchend', end); zone.addEventListener('touchcancel', end);
  root.querySelectorAll('.tb').forEach(b => {
    const act = b.dataset.act;
    b.addEventListener('touchstart', e => {
      e.preventDefault();
      if (act === 'pause' || act === 'interact') { if (Input.uiHandler && Input.uiHandler({ code: act === 'pause' ? 'Escape' : 'Enter', key: '', touch: true, preventDefault() {} })) return; }
      b.classList.add('on'); Input.press(act);
    }, { passive: false });
    const up = e => { e.preventDefault(); b.classList.remove('on'); Input.release(act); };
    b.addEventListener('touchend', up, { passive: false }); b.addEventListener('touchcancel', up, { passive: false });
  });
}

 
function makePool(size, factory) {
  const items = [];
  for (let i = 0; i < size; i++) { const o = factory(); o.on = false; items.push(o); }
  return {
    items,
    get() { for (let i = 0; i < items.length; i++) if (!items[i].on) { items[i].on = true; return items[i]; } return null; },
    clear() { for (const o of items) o.on = false; },
    count() { let n = 0; for (const o of items) if (o.on) n++; return n; }
  };
}

 
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

const OPP = { N: 'S', S: 'N', W: 'E', E: 'W' };

const World = {
  tiles: new Uint8Array(WORLD_TW * WORLD_TH),
  regions: [],           
  regionById: {},
  structs: [],           
  ents: [],              
  entsByRegion: [],
  footprints: [],
  dirtyChunks: new Set(),
  seals: [],             
  sealOwnerAt: new Map()  
};

function tileAt(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= WORLD_TW || ty >= WORLD_TH) return T.WALL;
  return World.tiles[ty * WORLD_TW + tx];
}
function setTile(tx, ty, t) {
  if (tx < 0 || ty < 0 || tx >= WORLD_TW || ty >= WORLD_TH) return;
  World.tiles[ty * WORLD_TW + tx] = t;
  World.dirtyChunks.add((tx >> 4) + ',' + (ty >> 4));
}
function solidAt(tx, ty) { return SOLID[tileAt(tx, ty)] === 1; }
function solidPx(x, y) { return solidAt(Math.floor(x / TILE), Math.floor(y / TILE)); }
function regionIndexAt(px, py) {
  const c = clamp(Math.floor(px / (RW * TILE)), 0, GRID_W - 1), r = clamp(Math.floor(py / (RH * TILE)), 0, GRID_H - 1);
  return r * GRID_W + c;
}

 
function circleHitsTiles(x, y, r) {
  const x0 = Math.floor((x - r) / TILE), x1 = Math.floor((x + r) / TILE);
  const y0 = Math.floor((y - r) / TILE), y1 = Math.floor((y + r) / TILE);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (!solidAt(tx, ty)) continue;
    const cx = clamp(x, tx * TILE, tx * TILE + TILE), cy = clamp(y, ty * TILE, ty * TILE + TILE);
    if (dist2(x, y, cx, cy) < r * r) return true;
  }
  return false;
}
function moveCircle(e, dx, dy, r, hitFn) {
  const hit = hitFn || circleHitsTiles;
  let moved = false;
   
   
  if (dx) {
    if (!hit(e.x + dx, e.y, r)) { e.x += dx; moved = true; }
    else {
       
      for (const n of [3, -3, 6, -6]) { const nx = e.x + dx * 0.5, ny = e.y + n * 0.5; if (!hit(nx, ny, r)) { e.x = nx; e.y = ny; moved = true; break; } }
    }
  }
  if (dy) {
    if (!hit(e.x, e.y + dy, r)) { e.y += dy; moved = true; }
    else {
      for (const n of [3, -3, 6, -6]) { const nx = e.x + n * 0.5, ny = e.y + dy * 0.5; if (!hit(nx, ny, r)) { e.x = nx; e.y = ny; moved = true; break; } }
    }
  }
  return moved;
}

 
 
function connectionType(idA, idB) {
  for (const [a, b, t] of CONNECTIONS) if ((a === idA && b === idB) || (a === idB && b === idA)) return t;
  return null;
}
function regionConnected(c, r, dir) {
  const [dx, dy] = DIRS[dir];
  const nc = c + dx, nr = r + dy;
  if (nc < 0 || nr < 0 || nc >= GRID_W || nr >= GRID_H) return false;
  return connectionType(REGIONS[r][c].id, REGIONS[nr][nc].id) !== null;
}
 
function sealOwner(c, r, dir) {
  const [dx, dy] = DIRS[dir];
  const nr = r + dy, nc = c + dx;
  if (nc < 0 || nr < 0 || nc >= GRID_W || nr >= GRID_H) return null;
  const R = REGIONS[r][c], N = REGIONS[nr][nc];
  const t = connectionType(R.id, N.id);
  return t && t !== 'open' && t !== 'gate' && t === R.guardian ? t : null;
}

function astar(grid, w, h, sx, sy, gx, gy, costFn) {
   
  const N = w * h, g = new Float32Array(N).fill(Infinity), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const open = [];
  const hfn = (x, y) => Math.abs(x - gx) + Math.abs(y - gy);
  const si = sy * w + sx;
  g[si] = 0; open.push([hfn(sx, sy), si]);
  while (open.length) {
    let bi = 0;
    for (let i = 1; i < open.length; i++) if (open[i][0] < open[bi][0]) bi = i;
    const [, cur] = open[bi]; open[bi] = open[open.length - 1]; open.pop();
    if (closed[cur]) continue;
    closed[cur] = 1;
    const cx = cur % w, cy = (cur / w) | 0;
    if (cx === gx && cy === gy) {
      const out = []; let k = cur;
      while (k !== -1) { out.push([k % w, (k / w) | 0]); k = came[k]; }
      return out.reverse();
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const ni = ny * w + nx;
      if (closed[ni]) continue;
      const c = costFn(nx, ny);
      if (!isFinite(c)) continue;
      const ng = g[cur] + c;
      if (ng < g[ni]) { g[ni] = ng; came[ni] = cur; open.push([ng + hfn(nx, ny), ni]); }
    }
  }
  return null;
}

function generateWorld() {
  World.tiles.fill(T.WALL);
  World.regions = []; World.structs = []; World.ents = []; World.footprints = []; World.seals = []; World.sealOwnerAt.clear();
  World.regionById = {};
  for (let r = 0; r < GRID_H; r++) for (let c = 0; c < GRID_W; c++) {
    const R = REGIONS[r][c];
    const reg = genRegion(c, r, R);
    World.regions.push(reg);
    World.regionById[R.id] = reg;
  }
  addOuterSealMarkers();
  World.entsByRegion = World.regions.map(() => []);
  for (const e of World.ents) World.entsByRegion[e.ri].push(e);
  World.dirtyChunks.clear();
}

function genRegion(c, r, R) {
  const B = BIOMES[R.biome];
  const ox = c * RW, oy = r * RH;
  const seed = c * 31 + r * 977 + 7;
  const rng = mulberry32(seed * 2654435761);
  const L = new Uint8Array(RW * RH).fill(T.GROUND);
  const reserved = new Uint8Array(RW * RH);
  const noCross = new Uint8Array(RW * RH);
  const inb = (x, y) => x >= 0 && y >= 0 && x < RW && y < RH;
  const get = (x, y) => inb(x, y) ? L[y * RW + x] : T.WALL;
  const set = (x, y, t) => { if (inb(x, y)) L[y * RW + x] = t; };
  const reserve = (x, y, rad) => {
    for (let yy = Math.floor(y - rad); yy <= Math.ceil(y + rad); yy++) for (let xx = Math.floor(x - rad); xx <= Math.ceil(x + rad); xx++)
      if (inb(xx, yy) && dist2(xx, yy, x, y) <= rad * rad) reserved[yy * RW + xx] = 1;
  };
  const reg = { c, r, ri: r * GRID_W + c, def: R, biome: B, id: R.id, name: R.name, ox, oy, enemies: [], open: {} };

   
  for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
    const d = Math.min(x, y, RW - 1 - x, RH - 1 - y);
    const thick = 2 + (vnoise(x * 0.3, y * 0.3, seed) > 0.62 ? 1 : 0);
    if (d < thick) set(x, y, T.WALL);
  }
   
  const openings = [];
  for (const dir of ['N', 'S', 'W', 'E']) {
    if (!regionConnected(c, r, dir)) continue;
    reg.open[dir] = true;
    let pts;
    if (dir === 'N') pts = { x0: 21, x1: 26, y0: 0, y1: 3, cx: 23, cy: 0 };
    if (dir === 'S') pts = { x0: 21, x1: 26, y0: RH - 4, y1: RH - 1, cx: 23, cy: RH - 1 };
    if (dir === 'W') pts = { x0: 0, x1: 3, y0: 15, y1: 20, cx: 0, cy: 17 };
    if (dir === 'E') pts = { x0: RW - 4, x1: RW - 1, y0: 15, y1: 20, cx: RW - 1, cy: 17 };
    for (let y = pts.y0; y <= pts.y1; y++) for (let x = pts.x0; x <= pts.x1; x++) { set(x, y, T.PATH); reserved[y * RW + x] = 3; }
    pts.dir = dir;
    openings.push(pts);
  }

   
  if (R.biome === 'caverns' || R.biome === 'canyon' || R.biome === 'rift') {
    const th = R.biome === 'canyon' ? 0.66 : 0.68;
    for (let y = 3; y < RH - 3; y++) for (let x = 3; x < RW - 3; x++) {
      if (vnoise(x * 0.16, y * 0.16, seed + 5) > th) set(x, y, T.WALL);
    }
  }

  const hub = R.camp ? R.camp.slice() : [20, 22];
  const shrine = R.guardian ? (R.shrine ? R.shrine.slice() : [24, 9]) : null;
  const targets = [];    
  const addEnt = (e) => { e.ri = reg.ri; World.ents.push(e); return e; };
  const wpx = (x) => (ox + x) * TILE + TILE / 2, wpy = (y) => (oy + y) * TILE + TILE / 2;

   
  for (const f of (R.features || [])) {
    if (f.t === 'rooms') {
      for (let y = 2; y < RH - 2; y++) for (let x = 2; x < RW - 2; x++) if (!reserved[y * RW + x]) set(x, y, T.WALL);
      const cells = [[4, 3], [18, 3], [32, 3], [4, 14], [18, 14], [32, 14], [4, 25], [18, 25], [32, 25]];
      for (const [cx, cy] of cells) {
        const w = 8 + Math.floor(rng() * 4), h = 6 + Math.floor(rng() * 3);
        for (let y = cy; y < cy + h; y++) for (let x = cx; x < cx + w; x++) set(x, y, T.FLOOR);
      }
    } else if (f.t === 'houses') {
      for (const hd of f.list) {
        const [hx, hy, hw, hh, label] = hd;
        for (let y = hy; y < hy + hh; y++) for (let x = hx; x < hx + hw; x++) set(x, y, T.HOUSE);
        for (let y = hy - 1; y <= hy + hh + 1; y++) for (let x = hx - 1; x <= hx + hw; x++) if (inb(x, y)) reserved[y * RW + x] = 1;
        World.structs.push({ type: 'house', x: ox + hx, y: oy + hy, w: hw, h: hh, ruined: !!f.ruined, label: label || '', seed: hx * 7 + hy * 13 + seed });
        targets.push([hx + (hw >> 1), hy + hh, 1]);
      }
    } else if (f.t === 'lake') {
      for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
        const nx = (x - f.x) / f.rx, ny = (y - f.y) / f.ry;
        const wob = (vnoise(x * 0.4, y * 0.4, seed + 9) - 0.5) * 0.35;
        if (nx * nx + ny * ny < 1 + wob && get(x, y) !== T.PATH) set(x, y, T.WATER);
      }
    } else if (f.t === 'river') {
      for (let y = 0; y < RH; y++) for (let x = f.x; x < f.x + f.w; x++) { set(x, y, T.WATER); noCross[y * RW + x] = 1; }
    } else if (f.t === 'bridge') {
      for (let y = f.y; y < f.y + 2; y++) for (let x = f.x; x < f.x + f.w; x++) { set(x, y, f.broken ? T.BROKEN : T.BRIDGE); noCross[y * RW + x] = 0; }
      reg.bridge = { x: ox + f.x, y: oy + f.y, w: f.w, h: 2 };
      World.structs.push({ type: 'bridgeRails', x: ox + f.x, y: oy + f.y, w: f.w, h: 2 });
    } else if (f.t === 'dry') {
      for (let i = 0; i < f.pts.length - 1; i++) {
        const [x0, y0] = f.pts[i], [x1, y1] = f.pts[i + 1];
        const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2;
        for (let k = 0; k <= n; k++) {
          const px = lerp(x0, x1, k / n), py = lerp(y0, y1, k / n);
          for (let yy = -1; yy <= f.w - 2; yy++) for (let xx = -1; xx <= f.w - 2; xx++) {
            const tx = Math.round(px + xx), ty = Math.round(py + yy);
            if (inb(tx, ty) && get(tx, ty) !== T.HOUSE) set(tx, ty, T.DRY);
          }
        }
      }
    } else if (f.t === 'floor') {
      for (let y = f.y; y < f.y + f.h; y++) for (let x = f.x; x < f.x + f.w; x++) set(x, y, T.FLOOR);
    } else if (f.t === 'ruins') {
      for (let y = f.y; y < f.y + f.h; y++) for (let x = f.x; x < f.x + f.w; x++) {
        const edge = x === f.x || y === f.y || x === f.x + f.w - 1 || y === f.y + f.h - 1;
        if (!edge) { if (get(x, y) === T.GROUND) set(x, y, T.FLOOR); continue; }
        const gap = f.solid ? (y === f.y + f.h - 1 && x >= 21 && x <= 26) : rng() < 0.22;
        set(x, y, gap ? T.FLOOR : T.RUIN);
        if (f.solid && !gap) noCross[y * RW + x] = 1;
      }
    } else if (f.t === 'pillars') {
      for (const [px, py] of f.list) { set(px, py, T.PILLAR); reserve(px, py, 1); }
    } else if (f.t === 'crops') {
      for (let y = f.y; y < f.y + f.h; y++) for (let x = f.x; x < f.x + f.w; x++) set(x, y, f.dead ? T.DEADCROP : T.CROP);
    } else if (f.t === 'lava') {
      for (let y = f.y; y < f.y + f.h; y++) for (let x = f.x; x < f.x + f.w; x++) if (dist2(x + 0.5, y + 0.5, f.x + f.w / 2, f.y + f.h / 2) < (f.w * f.w) / 4.2) set(x, y, T.LAVA);
    } else if (f.t === 'deep') {
      for (let y = f.y; y < f.y + f.h; y++) for (let x = f.x; x < f.x + f.w; x++) set(x, y, T.DEEP);
    } else if (f.t === 'well') {
      set(f.x, f.y, T.STRUCT); reserve(f.x, f.y, 2);
      World.structs.push({ type: 'well', x: ox + f.x, y: oy + f.y, w: 1, h: 1, dry: R.id === 'thornvale' });
      addEnt({ kind: 'well', x: wpx(f.x), y: wpy(f.y), rad: 30 });
      targets.push([f.x, f.y + 1, 1]);
    } else if (f.t === 'fountain') {
      for (let y = f.y - 1; y <= f.y + 1; y++) for (let x = f.x - 1; x <= f.x + 1; x++) set(x, y, T.STRUCT);
      reserve(f.x, f.y, 3);
      World.structs.push({ type: 'fountain', x: ox + f.x - 1, y: oy + f.y - 1, w: 3, h: 3 });
    } else if (f.t === 'statue') {
      set(f.x, f.y, T.STRUCT); reserve(f.x, f.y, 2);
      World.structs.push({ type: 'statue', x: ox + f.x, y: oy + f.y, w: 1, h: 1 });
      addEnt({ kind: 'sign', id: f.id, x: wpx(f.x), y: wpy(f.y), rad: 34, statue: true });
      targets.push([f.x, f.y + 1, 1]);
    } else if (f.t === 'sign') {
      set(f.x, f.y, T.STRUCT); reserve(f.x, f.y, 1.6);
      World.structs.push({ type: 'stone', x: ox + f.x, y: oy + f.y, w: 1, h: 1 });
      addEnt({ kind: 'sign', id: f.id, x: wpx(f.x), y: wpy(f.y), rad: 34 });
      targets.push([f.x, f.y + 1, 1]);
    } else if (f.t === 'item') {
      reserve(f.x, f.y, 1.6);
      addEnt({ kind: 'item', id: f.id, x: wpx(f.x), y: wpy(f.y), rad: 26 });
      targets.push([f.x, f.y, 1]);
    } else if (f.t === 'forge') {
      for (let y = f.y; y <= f.y + 1; y++) for (let x = f.x - 1; x <= f.x + 1; x++) set(x, y, T.STRUCT);
      reserve(f.x, f.y, 2.5);
      World.structs.push({ type: 'forge', x: ox + f.x - 1, y: oy + f.y, w: 3, h: 2 });
    } else if (f.t === 'cave') {
      for (let y = f.y - 5; y <= f.y - 1; y++) for (let x = f.x - 3; x <= f.x + 3; x++) set(x, y, T.WALL);
      for (let y = f.y - 2; y <= f.y - 1; y++) for (let x = f.x - 1; x <= f.x + 1; x++) set(x, y, T.FLOOR);
      reserve(f.x, f.y + 1, 2.5);
      World.structs.push({ type: 'cave', x: ox + f.x - 1, y: oy + f.y - 2, w: 3, h: 2 });
    } else if (f.t === 'lanterns') {
      reg.gate = { x: ox + 21, y: oy, w: 6, h: 2 };
      for (let y = 0; y <= 1; y++) for (let x = 21; x <= 26; x++) set(x, y, T.GATE);
      World.structs.push({ type: 'lanterns', x: ox + f.x, y: oy + f.y, w: f.w, h: 1 });
      addEnt({ kind: 'gate', x: wpx(24), y: wpy(3), rad: 60 });
      reserve(24, 3, 2.5);
      targets.push([24, 3, 2]);
    } else if (f.t === 'steps') {
      for (let y = f.y; y < f.y + f.h; y++) for (let x = f.x; x < f.x + f.w; x++) set(x, y, T.STEPS);
      World.structs.push({ type: 'throne', x: ox + 23, y: oy + f.y - 2, w: 2, h: 2 });
    } else if (f.t === 'clearing') {
      reserve(f.x, f.y, f.r);
      targets.push([f.x, f.y, 1]);
    } else if (f.t === 'footprints') {
      reg.footprints = f;
    }
  }

   
  for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
    const d = Math.min(x, y, RW - 1 - x, RH - 1 - y);
    if (d < 2 && reserved[y * RW + x] !== 3 && get(x, y) !== T.GATE) set(x, y, T.WALL);
  }

   
  if (shrine && R.guardian !== 'king') {
    for (let y = shrine[1] - 3; y <= shrine[1] + 3; y++) for (let x = shrine[0] - 3; x <= shrine[0] + 3; x++)
      if (dist2(x, y, shrine[0], shrine[1]) <= 11 && get(x, y) !== T.PILLAR) set(x, y, T.SHRINE);
    World.structs.push({ type: 'shrine', x: ox + shrine[0], y: oy + shrine[1], w: 1, h: 1, col: GUARDIAN_BY_ID[R.guardian].col.glow, big: 4 });
  }
  if (shrine) {
    reserve(shrine[0], shrine[1], 5);
    targets.push([shrine[0], shrine[1] + 3, 2]);
    addEnt({ kind: 'guardian', id: R.guardian, x: wpx(shrine[0]), y: wpy(shrine[1]), rad: R.guardian === 'king' ? 150 : 130 });
  }
  if (!R.noCamp) {
    reserve(hub[0], hub[1], 2.2);
    addEnt({ kind: 'camp', x: wpx(hub[0]), y: wpy(hub[1]), rad: 36 });
    reg.camp = { x: wpx(hub[0]), y: wpy(hub[1]) + 30 };
  }
  for (const n of NPCS) if (n.region === R.id) {
    reserve(n.x, n.y, 1.5);
    targets.push([n.x, n.y, 1]);
    addEnt({ kind: 'npc', id: n.id, def: n, x: wpx(n.x), y: wpy(n.y), rad: n.giant ? 56 : 34 });
  }
  for (const o of openings) targets.push([clamp(o.cx, 1, RW - 2), clamp(o.cy, 1, RH - 2), 2]);

   
  const costFn = (x, y) => {
    if (noCross[y * RW + x]) return Infinity;
    const t = get(x, y);
    switch (t) {
      case T.PATH: return 0.6;
      case T.GROUND: case T.FLOOR: case T.SHRINE: case T.DRY: case T.CROP: case T.DEADCROP: case T.STEPS: case T.BRIDGE: case T.BROKEN: return 1 + vnoise(x * 0.5, y * 0.5, seed + 3) * 1.4;
      case T.OBST: return 3;
      case T.WALL: return (x < 2 || y < 2 || x > RW - 3 || y > RH - 3) ? Infinity : 4;
      case T.RUIN: return 5;
      case T.WATER: return 18;
      default: return Infinity;
    }
  };
  for (const [tx, ty, w] of targets) {
    const p = astar(L, RW, RH, hub[0], hub[1], clamp(tx, 0, RW - 1), clamp(ty, 0, RH - 1), costFn);
    if (!p) continue;
    for (const [px, py] of p) {
      for (let yy = 0; yy < w; yy++) for (let xx = 0; xx < w; xx++) {
        const qx = px + xx, qy = py + yy;
        if (!inb(qx, qy)) continue;
        const t = get(qx, qy);
        if (t === T.WATER && !noCross[qy * RW + qx]) set(qx, qy, T.BRIDGE);
        else if (t === T.RUIN || (t === T.WALL && qx > 1 && qy > 1 && qx < RW - 2 && qy < RH - 2)) set(qx, qy, R.biome === 'undercroft' ? T.FLOOR : T.PATH);
        else if (t === T.GROUND || t === T.OBST) set(qx, qy, T.PATH);
        reserved[qy * RW + qx] = 2;
      }
    }
  }
   
  if (reg.footprints) {
    const f = reg.footprints;
    const p = astar(L, RW, RH, f.from[0], f.from[1], f.to[0], f.to[1], (x, y) => { const t = get(x, y); return SOLID[t] && t !== T.OBST ? Infinity : 1 + vnoise(x * 0.4, y * 0.4, seed + 11) * 2; });
    if (p) p.forEach(([px, py], i) => {
      if (get(px, py) === T.OBST) set(px, py, T.GROUND);
      reserved[py * RW + px] = 2;
      if (i % 2 === 0) World.footprints.push({ x: (ox + px) * TILE + 16 + (i % 4 === 0 ? -6 : 6), y: (oy + py) * TILE + 16, a: 0, ri: reg.ri, i });
    });
    for (let i = 0; i < World.footprints.length - 1; i++) {
      const a = World.footprints[i], b = World.footprints[i + 1];
      if (a.ri === reg.ri && b.ri === reg.ri) a.a = angTo(a.x, a.y, b.x, b.y);
    }
    addEnt({ kind: 'prints', x: wpx(f.from[0]), y: wpy(f.from[1]), rad: 90 });
  }

   
  for (const o of openings) {
    const owner = sealOwner(c, r, o.dir);
    if (!owner) continue;
    let sx0, sx1, sy0, sy1;
    if (o.dir === 'N') { sx0 = 21; sx1 = 26; sy0 = 0; sy1 = 1; }
    if (o.dir === 'S') { sx0 = 21; sx1 = 26; sy0 = RH - 2; sy1 = RH - 1; }
    if (o.dir === 'W') { sx0 = 0; sx1 = 1; sy0 = 15; sy1 = 20; }
    if (o.dir === 'E') { sx0 = RW - 2; sx1 = RW - 1; sy0 = 15; sy1 = 20; }
    for (let y = sy0; y <= sy1; y++) for (let x = sx0; x <= sx1; x++) { set(x, y, T.SEAL); World.sealOwnerAt.set((oy + y) * WORLD_TW + ox + x, owner); }
    const seal = { owner, ri: reg.ri, dir: o.dir, x: ox + sx0, y: oy + sy0, w: sx1 - sx0 + 1, h: sy1 - sy0 + 1 };
    World.seals.push(seal);
     
    const ix = (sx0 + sx1) / 2, iy = (sy0 + sy1) / 2;
    const mx = o.dir === 'W' ? 3 : o.dir === 'E' ? RW - 4 : ix, my = o.dir === 'N' ? 3 : o.dir === 'S' ? RH - 4 : iy;
    addEnt({ kind: 'seal', owner, x: (ox + mx) * TILE + 16, y: (oy + my) * TILE + 16, rad: 70, seal });
  }

   
  for (let y = 2; y < RH - 2; y++) for (let x = 2; x < RW - 2; x++) {
    const i = y * RW + x;
    if (reserved[i] || get(x, y) !== T.GROUND) continue;
    let nearPath = false;
    for (let yy = -1; yy <= 1 && !nearPath; yy++) for (let xx = -1; xx <= 1; xx++) if (reserved[(y + yy) * RW + x + xx] === 2) { nearPath = true; break; }
    if (nearPath) continue;
    const n = vnoise(x * 0.17, y * 0.17, seed + 1);
    if (rng() < B.dens * (0.4 + n * 1.4)) set(x, y, T.OBST);
  }

   
  for (let k = 0, tries = 0; k < 0 && tries < 400; tries++) {
    const x = 4 + Math.floor(rng() * (RW - 8)), y = 4 + Math.floor(rng() * (RH - 8));
    const t = get(x, y);
    if (SOLID[t] || t === T.SHRINE) continue;
    if (shrine && dist2(x, y, shrine[0], shrine[1]) < 64) continue;
    if (dist2(x, y, hub[0], hub[1]) < 49) continue;
    if (openings.some(o => dist2(x, y, o.cx, o.cy) < 64)) continue;
    const type = R.biome === 'undercroft' || R.biome === 'caverns' ? (k % 2 ? 'wisp' : 'sentinel') : ['thornling', 'wisp', 'sentinel'][k % 3];
    reg.enemies.push({ x: wpx(x), y: wpy(y), type, alive: true });
    k++;
  }

   
  for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) World.tiles[(oy + y) * WORLD_TW + ox + x] = L[y * RW + x];
  reg.entry = { x: wpx(hub[0]), y: wpy(hub[1]) + 40 };
  if (shrine) reg.shrinePx = { x: wpx(shrine[0]), y: wpy(shrine[1]) };
  return reg;
}

 
function reachableFrom(px, py) {
  const seen = new Uint8Array(WORLD_TW * WORLD_TH);
  const q = [Math.floor(py / TILE) * WORLD_TW + Math.floor(px / TILE)];
  seen[q[0]] = 1;
  while (q.length) {
    const i = q.pop(), x = i % WORLD_TW, y = (i / WORLD_TW) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= WORLD_TW || ny >= WORLD_TH) continue;
      const ni = ny * WORLD_TW + nx;
      if (seen[ni] || SOLID[World.tiles[ni]]) continue;
      seen[ni] = 1; q.push(ni);
    }
  }
  return seen;
}

const CHUNK = 16, CHUNK_PX = CHUNK * TILE, CHUNK_CACHE_MAX = 36;
const chunkCache = new Map();

  const c = clamp(Math.floor(tx / RW), 0, GRID_W - 1), r = clamp(Math.floor(ty / RH), 0, GRID_H - 1);

}

function getChunk(cx, cy) {

  let ch = chunkCache.get(key);
  if (ch && !World.dirtyChunks.has(key)) { chunkCache.delete(key); chunkCache.set(key, ch); return ch; }
  World.dirtyChunks.delete(key);
  if (!ch) {
    const cv = document.createElement('canvas');
    cv.width = CHUNK_PX; cv.height = CHUNK_PX;
    ch = { cv, g: cv.getContext('2d') };
  }
  renderChunk(ch.g, cx, cy);

  g.clearRect(0, 0, CHUNK_PX, CHUNK_PX);
  const tx0 = cx * CHUNK, ty0 = cy * CHUNK;
  for (let y = 0; y < CHUNK; y++) for (let x = 0; x < CHUNK; x++) {
    const tx = tx0 + x, ty = ty0 + y;
    if (tx >= WORLD_TW || ty >= WORLD_TH) continue;
    drawTile(g, tileAt(tx, ty), tx, ty, x * TILE, y * TILE, biomeAtTile(tx, ty));
  }
  for (const s of World.structs) {
    const m = s.big || 1;
    if (s.x + s.w + m < tx0 - 1 || s.x - m > tx0 + CHUNK + 1 || s.y + s.h + m < ty0 - 2 || s.y - m > ty0 + CHUNK + 1) continue;
    if (s.type === 'lanterns' || s.type === 'bridgeRails') continue;

}

  P.drawing = false; P.drawT = 0; P.healT = 0; P.dead = false; P.pushX = P.pushY = 0;
  if (full) { P.hp = P.maxHp; P.potions = P.maxPotions; P.arrows = P.maxArrows; }
}

function playerRolling() { return P.rollT > 0; }
function playerInvulnerable() {
  if (P.iframes > 0) return true;
  if (P.rollT > 0) { const e = TUNE.player.rollTime - P.rollT; return e >= TUNE.player.rollIframeStart && e <= TUNE.player.rollIframeEnd; }
  return false;
}

 
function playerUpdate(dt, env) {
  const TP = TUNE.player, TS = TUNE.sword, TB = TUNE.bow;
  P.iframes = Math.max(0, P.iframes - dt);
  P.rollCd = Math.max(0, P.rollCd - dt);
  P.swingCd = Math.max(0, P.swingCd - dt);
  P.comboT = Math.max(0, P.comboT - dt);
  P.hurtFlash = Math.max(0, P.hurtFlash - dt);
  P.noArrowT = Math.max(0, P.noArrowT - dt);
  P.healT = Math.max(0, P.healT - dt);
  if (P.dead) return;

  const mv = Input.moveVec();
  const moving = mv.x !== 0 || mv.y !== 0;
  const mouseAim = Input.mouse.used && !Input.touchMode && performance.now() - Input.mouse.lastMove < 4000;
  const mouseAng = () => angTo(P.x - env.camX, P.y - 20 - env.camY, Input.mouse.x, Input.mouse.y);

   
  if (P.arrows < P.maxArrows && !P.drawing) { P.regen += dt; if (P.regen >= TB.regenTime) { P.regen = 0; P.arrows++; } }

   
  if (Input.pressed.heal && P.healT <= 0) {
    if (P.potions > 0 && P.hp < P.maxHp) {
      P.potions--; P.hp = Math.min(P.maxHp, P.hp + TP.potionHeal); P.healT = 0.45;
      Sound.sfx('heal'); burst(P.x, P.y - 16, 14, '#8fe08a', 90);
    } else if (P.potions <= 0) toast('No tonic left. Rest at a campfire to refill.');
  }

   
  if (Input.pressed.roll && P.rollCd <= 0 && P.rollT <= 0 && P.swingT <= 0.05) {
    P.rollT = TP.rollTime; P.rollCd = TP.rollTime + TP.rollCooldown;
    P.rollDir = moving ? Math.atan2(mv.y, mv.x) : P.dir;
    P.drawing = false; P.drawT = 0;
    Sound.sfx('roll');
    burst(P.x, P.y, 5, '#cbbfa8', 50);
  }

   
  if (Input.pressed.sword && P.rollT <= 0 && P.swingCd <= 0 && P.swingT <= 0) {
    P.swingIdx = P.comboT > 0 ? (P.swingIdx + 1) % 3 : 0;
    P.swingT = TS.time + (P.swingIdx === 2 ? 0.06 : 0);
    P.swingId++;
    P.drawing = false; P.drawT = 0;
    let a = mouseAim ? mouseAng() : (moving ? Math.atan2(mv.y, mv.x) : P.dir);
    if (Settings.assist) {
      let best = null, bd = 1e9;
      for (const tg of env.targets()) {
        const d = dist(P.x, P.y, tg.x, tg.y) - tg.r;
        if (d > 110) continue;
        const da = Math.abs(angDiff(a, angTo(P.x, P.y, tg.x, tg.y)));
        if (da < 1.25 && d < bd) { bd = d; best = tg; }
      }
      if (best) a = angTo(P.x, P.y, best.x, best.y);
    }
    P.swingAng = a; P.dir = a;
    P.vx += Math.cos(a) * TS.lunge; P.vy += Math.sin(a) * TS.lunge;
    Sound.sfx('swing');
  }

   
  if (Input.held.bow && P.rollT <= 0 && P.swingT <= 0) {
    if (!P.drawing) { P.drawing = true; P.drawT = 0; if (P.arrows > 0) Sound.sfx('draw'); }
    P.drawT += dt;
  }
  if (P.drawing && !Input.held.bow) {
    if (P.drawT >= TB.minDraw) {
      if (P.arrows > 0) {
        const k = clamp((P.drawT - TB.minDraw) / (TB.fullDraw - TB.minDraw), 0, 1);
        let a = P.aim;
        P.arrows--;
        fireArrow(P.x + Math.cos(a) * 14, P.y - 16 + Math.sin(a) * 14, a, lerp(TB.speedMin, TB.speedMax, k), lerp(TB.dmgMin, TB.dmgMax, k) * P.dmgMul, k >= 1);
        Sound.sfx('arrow');
      } else if (P.noArrowT <= 0) { toast('Out of arrows. They return over time.'); P.noArrowT = 3; }
    }
    P.drawing = false; P.drawT = 0;
  }

   
  if (P.drawing) {
    let a = mouseAim ? mouseAng() : (moving ? Math.atan2(mv.y, mv.x) : P.aim);
    if (!mouseAim && !moving && P.drawT < dt * 1.5) a = P.dir;
    if (Settings.assist && !mouseAim) {
      let best = null, bd = 1e9;
      for (const tg of env.targets()) {
        const d = dist(P.x, P.y, tg.x, tg.y);
        if (d > TB.assistRange) continue;
        const da = Math.abs(angDiff(a, angTo(P.x, P.y - 16, tg.x, tg.y)));
        if (da < TB.assistAngle && da + d / 2000 < bd) { bd = da + d / 2000; best = tg; }
      }
      if (best) a = angTo(P.x, P.y - 16, best.x, best.y);
    }
    P.aim = a; P.dir = a;
  } else if (!P.swingT) P.aim = P.dir;

   
  let tvx = 0, tvy = 0;
  if (P.rollT > 0) {
    P.rollT -= dt;
    const sp = TP.rollSpeed * (0.55 + 0.45 * (P.rollT / TP.rollTime));
    P.vx = Math.cos(P.rollDir) * sp; P.vy = Math.sin(P.rollDir) * sp;
  } else {
    let sp = TP.speed * (env.slow || 1);
    if (P.drawing) sp *= TB.slow;
    if (P.swingT > 0) sp *= 0.3;
    if (P.healT > 0) sp *= 0.5;
    tvx = mv.x * sp; tvy = mv.y * sp;
    const acc = (env.ice ? TP.iceAccel : TP.accel) * dt;
    const dvx = tvx - P.vx, dvy = tvy - P.vy, dl = Math.hypot(dvx, dvy);
    if (dl <= acc) { P.vx = tvx; P.vy = tvy; } else { P.vx += dvx / dl * acc; P.vy += dvy / dl * acc; }
    if (moving && P.swingT <= 0 && !P.drawing) P.dir = Math.atan2(mv.y, mv.x);
  }
  const fx = (P.vx + P.pushX) * dt, fy = (P.vy + P.pushY) * dt;
  P.pushX *= Math.pow(0.02, dt); P.pushY *= Math.pow(0.02, dt);
  moveCircle(P, fx, fy, TP.radius, env.hit);
  if (moving || P.rollT > 0) P.walk += dt * 11; else P.walk = 0;

   
  if (P.swingT > 0) {
    const total = TS.time + (P.swingIdx === 2 ? 0.06 : 0);
    const e = total - P.swingT;
    if (e >= TS.activeFrom && e <= TS.activeTo) {
      const reach = TS.reach + (P.swingIdx === 2 ? 10 : 0);
      for (const tg of env.targets()) {
        if (tg.lastSwing === P.swingId) continue;
        const d = dist(P.x, P.y - 12, tg.x, tg.y);
        if (d > reach + tg.r) continue;
        const da = Math.abs(angDiff(P.swingAng, angTo(P.x, P.y - 12, tg.x, tg.y)));
        if (da > TS.arc / 2 && d > tg.r + 6) continue;
        tg.lastSwing = P.swingId;
        tg.onHit(TS.dmg[P.swingIdx] * P.dmgMul, P.swingAng, 'sword');
      }
      cutBullets(P.x + Math.cos(P.swingAng) * 26, P.y - 12 + Math.sin(P.swingAng) * 26, reach * 0.8);
    }
    P.swingT -= dt;
    if (P.swingT <= 0) { P.swingT = 0; P.comboT = TS.comboWindow; P.swingCd = P.swingIdx === 2 ? TS.comboRecover : TS.cooldown; }
  }
}

function hurtPlayer(dmg, sx, sy) {
  if (P.dead || playerInvulnerable()) return false;
  if (G.godMode) { G.wouldHit = (G.wouldHit || 0) + dmg; P.iframes = TUNE.player.hurtIframes; return false; }
  const d = dmg * DIFF().dmgTaken;
  P.hp = Math.max(0, P.hp - d);
  P.iframes = TUNE.player.hurtIframes; P.hurtFlash = 0.25;
  if (sx != null) { const a = angTo(sx, sy, P.x, P.y); P.pushX += Math.cos(a) * TUNE.player.knockback; P.pushY += Math.sin(a) * TUNE.player.knockback; }
  P.drawing = false; P.drawT = 0;
  Sound.sfx('hurt'); shake(6);
  burst(P.x, P.y - 14, 8, '#ffd0a0', 120);
  if (P.hp <= 0) { P.dead = true; onPlayerDown(); }
  return true;
}

function drawPlayer(g, x, y, t) {
  if (P.iframes > 0 && Math.floor(t * 20) % 2 === 0 && !P.dead) return;
  const rolling = P.rollT > 0;
  g.save();
  if (rolling) {
    drawShadow(g, x, y, 10);
    g.translate(x, y - 10); g.rotate((1 - P.rollT / TUNE.player.rollTime) * TAU * (Math.cos(P.rollDir) < 0 ? -1 : 1));
    g.fillStyle = '#3e7f86'; g.beginPath(); g.arc(0, 0, 10, 0, TAU); g.fill();
    g.fillStyle = '#a8442a'; g.beginPath(); g.arc(0, 0, 10, 0, Math.PI); g.fill();
    g.fillStyle = '#e8c09a'; g.beginPath(); g.arc(4, -4, 4, 0, TAU); g.fill();
    g.restore(); return;
  }
  const behind = Math.sin(P.dir) < -0.3;
  if (behind) drawWeapons(g, x, y);
  drawPerson(g, x, y, { col: P.hurtFlash > 0 ? '#ffffff' : '#3e7f86', hair: '#5a3a22', dir: P.dir, walk: P.walk, cape: '#a8442a' });
  if (!behind) drawWeapons(g, x, y);
  g.restore();
}
function drawWeapons(g, x, y) {
  const cx = x, cy = y - 14;
  if (P.swingT > 0) {
    const total = TUNE.sword.time + (P.swingIdx === 2 ? 0.06 : 0);
    const k = 1 - P.swingT / total;
    const arc = TUNE.sword.arc, dirSign = P.swingIdx === 1 ? -1 : 1;
    const a0 = P.swingAng - arc / 2 * dirSign, a = a0 + arc * dirSign * easeOut(k);
    const reach = TUNE.sword.reach + (P.swingIdx === 2 ? 10 : 0);
    g.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - k)) + ')'; g.lineWidth = 10;
    g.beginPath(); g.arc(cx, cy, reach - 8, Math.min(a0, a), Math.max(a0, a)); g.stroke();
    g.strokeStyle = '#e8eef4'; g.lineWidth = 3.5;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * 8, cy + Math.sin(a) * 8); g.lineTo(cx + Math.cos(a) * (reach - 2), cy + Math.sin(a) * (reach - 2)); g.stroke();
    g.strokeStyle = '#c8a050'; g.lineWidth = 4; g.beginPath(); g.moveTo(cx + Math.cos(a + 1.57) * 5 + Math.cos(a) * 9, cy + Math.sin(a + 1.57) * 5 + Math.sin(a) * 9); g.lineTo(cx - Math.cos(a + 1.57) * 5 + Math.cos(a) * 9, cy - Math.sin(a + 1.57) * 5 + Math.sin(a) * 9); g.stroke();
  } else if (P.drawing) {
    const a = P.aim, k = clamp(P.drawT / TUNE.bow.fullDraw, 0, 1);
    const bx = cx + Math.cos(a) * 12, by = cy + Math.sin(a) * 12;
    g.strokeStyle = '#7a4a22'; g.lineWidth = 3;
    g.beginPath(); g.arc(bx, by, 13, a - 1.2, a + 1.2); g.stroke();
    const sx1 = bx + Math.cos(a - 1.2) * 13, sy1 = by + Math.sin(a - 1.2) * 13, sx2 = bx + Math.cos(a + 1.2) * 13, sy2 = by + Math.sin(a + 1.2) * 13;
    const px = bx - Math.cos(a) * (2 + k * 9), py = by - Math.sin(a) * (2 + k * 9);
    g.strokeStyle = '#eee'; g.lineWidth = 1; g.beginPath(); g.moveTo(sx1, sy1); g.lineTo(px, py); g.lineTo(sx2, sy2); g.stroke();
    if (P.arrows > 0) { g.strokeStyle = '#d8c8a0'; g.lineWidth = 2; g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(a) * 22, py + Math.sin(a) * 22); g.stroke(); }
    if (k >= 1) { g.fillStyle = 'rgba(255,230,120,0.8)'; g.beginPath(); g.arc(px + Math.cos(a) * 22, py + Math.sin(a) * 22, 3, 0, TAU); g.fill(); }
    if (Settings.hints) {
      g.strokeStyle = 'rgba(255,240,180,0.18)'; g.setLineDash([4, 6]); g.lineWidth = 1;
      g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + Math.cos(a) * 160, by + Math.sin(a) * 160); g.stroke(); g.setLineDash([]);
    }
  } else {
     
    const side = Math.cos(P.dir) < 0 ? 1 : -1;
    g.strokeStyle = '#9aa0a8'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(x + side * 6, y - 8); g.lineTo(x + side * 9, y - 26); g.stroke();
  }
}

 
 

const Arrows = makePool(40, () => ({ x: 0, y: 0, vx: 0, vy: 0, dmg: 0, life: 0, full: false }));
const Bullets = makePool(320, () => ({ x: 0, y: 0, vx: 0, vy: 0, r: 6, dmg: 1, life: 0, col: '#fff', kind: 'orb', homing: 0, spd: 0, bounce: 0, hp: 0, stop: 0, stopAt: 0, orbit: null, t: 0 }));
const Parts = makePool(360, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, col: '#fff', size: 2, grav: 0 }));
const Floaters = makePool(24, () => ({ x: 0, y: 0, life: 0, text: '', col: '#fff' }));
const Teles = [];
const Zones = [];
const Beams = [];
const Waves = [];
const Enemies = [];
const WeakPts = [];
 
const Space = { solid: (x, y) => false, onWeakDone: null, push: null };

function clearCombat() {
  Arrows.clear(); Bullets.clear(); Parts.clear(); Floaters.clear();
  Teles.length = 0; Zones.length = 0; Beams.length = 0; Waves.length = 0; WeakPts.length = 0;
  while (Enemies.length) releaseEnemy(Enemies.length - 1);
}

function shake(n) { if (Settings.shake) G.shake = Math.max(G.shake, n); }
function burst(x, y, n, col, spd, grav) {
  for (let i = 0; i < n; i++) {
    const p = Parts.get(); if (!p) return;
    const a = rnd() * TAU, s = (0.3 + rnd() * 0.7) * (spd || 80);
    p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s; p.max = p.life = 0.35 + rnd() * 0.4; p.col = col; p.size = 2 + rnd() * 2; p.grav = grav || 0;
  }
}
function floatText(x, y, text, col) { const f = Floaters.get(); if (!f) return; f.x = x; f.y = y; f.life = 1; f.text = text; f.col = col || '#fff'; }

function fireArrow(x, y, a, spd, dmg, full) {
  const ar = Arrows.get(); if (!ar) return;
  ar.x = x; ar.y = y; ar.vx = Math.cos(a) * spd; ar.vy = Math.sin(a) * spd; ar.dmg = dmg; ar.life = 1.4; ar.full = full;
}
function spawnBullet(x, y, a, spd, o) {
  const b = Bullets.get(); if (!b) return null;
  b.x = x; b.y = y; b.vx = Math.cos(a) * spd; b.vy = Math.sin(a) * spd; b.spd = spd;
  b.r = (o && o.r) || 7; b.dmg = (o && o.dmg) || 1; b.life = (o && o.life) || 6; b.col = (o && o.col) || '#fff'; b.kind = (o && o.kind) || 'orb';
  b.homing = (o && o.homing) || 0; b.bounce = (o && o.bounce) || 0; b.hp = (o && o.hp) || 0; b.stop = (o && o.stop) || 0; b.stopAt = (o && o.stopAt) || 0;
  b.orbit = (o && o.orbit) || null; b.t = 0;
  return b;
}
 
function cutBullets(x, y, r) {
  for (const b of Bullets.items) if (b.on && b.hp > 0 && dist2(b.x, b.y, x, y) < (r + b.r) * (r + b.r)) { b.on = false; burst(b.x, b.y, 6, b.col, 80); Sound.sfx('pop'); }
}

 
const FX_CAP = { teles: 160, zones: 32, beams: 12, waves: 16 };
function capPush(arr, item, cap) { if (arr.length >= cap) arr.shift(); arr.push(item); return item; }
function addTele(o) { const t = Object.assign({ t: 0, dur: 0.8, col: '#ffd27a', dmg: 2 }, o); t.dur *= DIFF().teleMult; return capPush(Teles, t, FX_CAP.teles); }
function addZone(o) { const z = Object.assign({ life: 8, t: 0 }, o); z.max = z.life; return capPush(Zones, z, FX_CAP.zones); }
function addBeam(o) { const b = Object.assign({ t: 0, tick: 0, dmg: 1, w: 22, len: 1400, sweep: 0 }, o); return capPush(Beams, b, FX_CAP.beams); }
function addWave(o) { const w = Object.assign({ r: 20, spd: 180, thick: 16, gapA: 0, gapW: 0, dmg: 2, hit: false, max: 900 }, o); return capPush(Waves, w, FX_CAP.waves); }

function playerInZone(kind) { for (const z of Zones) if (z.kind === kind && dist2(P.x, P.y, z.x, z.y) < z.r * z.r) return z; return null; }

function updateCombat(dt) {
  const px = P.x, py = P.y - 12;
  const slowField = (x, y) => { for (const z of Zones) if (z.kind === 'time' && dist2(x, y, z.x, z.y) < z.r * z.r) return 0.45; return 1; };
   
  for (const a of Arrows.items) {
    if (!a.on) continue;
    a.life -= dt; a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.life <= 0 || Space.solid(a.x, a.y + 12)) { a.on = false; burst(a.x, a.y, 3, '#d8c8a0', 40); continue; }
    let hit = false;
    for (const tg of G.targetsFn()) {
      if (dist2(a.x, a.y, tg.x, tg.y) < (tg.r + 4) * (tg.r + 4)) {
        const res = tg.onHit(a.dmg, Math.atan2(a.vy, a.vx), 'arrow');
        if (res === 'reflect') { a.vx = -a.vx; a.vy = -a.vy; a.life = 0.6; a.dmg = 0; Sound.sfx('clang'); hit = false; a.x += a.vx * dt * 2; a.y += a.vy * dt * 2; break; }
        hit = true; break;
      }
    }
    if (!hit) for (const b of Bullets.items) if (b.on && b.hp > 0 && dist2(a.x, a.y, b.x, b.y) < (b.r + 5) * (b.r + 5)) { b.hp -= a.dmg; if (b.hp <= 0) { b.on = false; burst(b.x, b.y, 6, b.col, 80); Sound.sfx('pop'); } hit = true; break; }
    if (hit) a.on = false;
  }
   
  for (const b of Bullets.items) {
    if (!b.on) continue;
    const sf = slowField(b.x, b.y);
    const bdt = dt * sf;
    b.t += bdt; b.life -= bdt;
    if (b.life <= 0) { b.on = false; continue; }
    if (b.orbit) {
      const o = b.orbit; o.a += o.av * bdt; o.r = Math.min(o.r + o.rv * bdt, o.max || 9999);
      b.x = o.cx + Math.cos(o.a) * o.r; b.y = o.cy + Math.sin(o.a) * o.r;
    } else {
      if (b.stop && b.t >= b.stopAt && b.t < b.stopAt + b.stop) continue;
      if (b.stop && b.t >= b.stopAt + b.stop && !b.refired) { b.refired = true; const a = angTo(b.x, b.y, px, py); b.vx = Math.cos(a) * b.spd * 1.15; b.vy = Math.sin(a) * b.spd * 1.15; }
      if (b.homing) {
        const cur = Math.atan2(b.vy, b.vx), want = angTo(b.x, b.y, px, py);
        const na = cur + clamp(angDiff(cur, want), -b.homing * bdt, b.homing * bdt);
        b.vx = Math.cos(na) * b.spd; b.vy = Math.sin(na) * b.spd;
      }
      const nx = b.x + b.vx * bdt, ny = b.y + b.vy * bdt;
      if (Space.solid(nx, ny + 10)) {
        if (b.bounce > 0) {
          b.bounce--;
          if (Space.solid(nx, b.y + 10)) b.vx = -b.vx; else b.vy = -b.vy;
          Sound.sfx('clang');
        } else { b.on = false; burst(b.x, b.y, 4, b.col, 50); continue; }
      } else { b.x = nx; b.y = ny; }
    }
    if (dist2(b.x, b.y, px, py) < (b.r + 8) * (b.r + 8)) {
      if (hurtPlayer(b.dmg, b.x, b.y)) { b.on = false; burst(b.x, b.y, 6, b.col, 80); }
    }
  }
   
  for (let i = Teles.length - 1; i >= 0; i--) {
    const t = Teles[i];
    t.t += dt;
    if (t.follow && t.t < t.dur * 0.55) { t.x = lerp(t.x, P.x, dt * 3); t.y = lerp(t.y, P.y, dt * 3); }
    if (t.t >= t.dur) {
      Teles.splice(i, 1);
      if (t.kind === 'circle' && t.dmg > 0) {
        if (dist2(P.x, P.y, t.x, t.y) < t.r * t.r) hurtPlayer(t.dmg, t.x, t.y);
        burst(t.x, t.y, 12, t.col, 140); shake(4);
      } else if (t.kind === 'line' && t.dmg > 0) {
        if (pointNearLine(P.x, P.y - 10, t.x, t.y, t.a, t.len, t.w / 2 + 8)) hurtPlayer(t.dmg, P.x - Math.cos(t.a) * 10, P.y - Math.sin(t.a) * 10);
      }
      if (t.onEnd) t.onEnd(t);
      if (t.kind === 'circle' && t.sfx !== false) Sound.sfx(t.sfx || 'boom');
    }
  }
   
  for (let i = Zones.length - 1; i >= 0; i--) {
    const z = Zones[i]; z.t += dt; z.life -= dt;
    if (z.life <= 0) { Zones.splice(i, 1); continue; }
    if (z.t < 0.6) continue;
    const inside = dist2(P.x, P.y, z.x, z.y) < z.r * z.r;

function gState(id) { return G.S.guardians[id] ? G.S.guardians[id].state : 'none'; }

function sealCount() { return countState('spared') + countState('abandoned'); }

function repairWorldState() {

  for (const sl of World.seals) if (!sl.open && S.guardians[sl.owner] && S.guardians[sl.owner].state !== 'none') { unlockSeals(sl.owner); n++; }
  if (S.flags.gate) for (const reg of World.regions) if (reg.gate && tileAt(reg.gate.x, reg.gate.y) === T.GATE) { openGate(); n++; }
  const bf = World.regionById.brokenford;
  if (S.quests.bridge >= 3 && bf && bf.bridge && tileAt(bf.bridge.x, bf.bridge.y) === T.BROKEN) { repairBridge(); n++; }

function unstickPlayerWorld() {
  if (!circleHitsTiles(P.x, P.y, TUNE.player.radius) && isFinite(P.x) && isFinite(P.y)) return false;
  const tx = Math.floor(P.x / TILE), ty = Math.floor(P.y / TILE);
  for (let r = 1; r <= 6; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    const x = (tx + dx) * TILE + 16, y = (ty + dy) * TILE + 16;
    if (isFinite(x) && !circleHitsTiles(x, y, TUNE.player.radius + 2)) { P.x = x; P.y = y; return true; }
  }
  const c = G.S.camp || World.regionById[START_REGION].camp; P.x = c.x; P.y = c.y; return true;
}

const Watch = { deadT: 0, defeatT: 0, doorT: 0, worldT: 0 };
function progressWatchdog(dt) {

  if (G.mode === 'passage' && PS.done) { Watch.doorT += dt; if (Watch.doorT > 2) { Watch.doorT = 0; console.warn('[TLW] opening the arena after the chase'); enterArena(G.fightDef, false); } } else Watch.doorT = 0;

const Spawner = { cd: 0, grace: 0, ri: -1 };
function regionSpawnRule(reg) {
  const sp = SPAWNS[reg.id]; if (!sp) return null;
  const tier = 5 - reg.r, TE = TUNE.enemy;
  let max = TE.maxByTier[tier] + (sp.ruins ? 1 : 0), cd = TE.cdByTier[tier];
  const gid = reg.def.guardian, st = gid && gid !== 'king' ? gState(gid) : 'none';
  if (st === 'abandoned') { max += 1; cd *= 0.75; }       
  else if (st === 'spared') max = Math.max(1, max - 1);   
  return { types: sp.types, max, cd, tier };
}
function refreshRegionEnemies(force) {
   
  for (let i = Enemies.length - 1; i >= 0; i--) {
    const e = Enemies[i];
    const far = dist2(e.x, e.y, P.x, P.y) > 700 * 700;
    if (force || (e.ri !== G.regionIdx && far)) releaseEnemy(i);
  }
  Spawner.ri = G.regionIdx; Spawner.grace = TUNE.enemy.grace; Spawner.cd = 0; Spawner.initial = true;
}
function findSpawnPoint(reg) {
  const TE = TUNE.enemy, camp = reg.camp, sh = reg.shrinePx;
  for (let k = 0; k < 24; k++) {
    const tx = reg.ox + 2 + Math.floor(rnd() * (RW - 4)), ty = reg.oy + 2 + Math.floor(rnd() * (RH - 4));
    const t = tileAt(tx, ty); if (SOLID[t] || t === T.SHRINE || t === T.BRIDGE) continue;
    const x = tx * TILE + 16, y = ty * TILE + 16;
    const d = dist(x, y, P.x, P.y);
    if (d < TE.spawnMin || d > TE.spawnMax) continue;
    const onScreen = x > G.camX - 40 && x < G.camX + View.w + 40 && y > G.camY - 40 && y < G.camY + View.h + 40;
    if (onScreen && k < 18) continue;    
    if (camp && dist2(x, y, camp.x, camp.y) < (TE.campClear * TILE) ** 2) continue;
    if (sh && dist2(x, y, sh.x, sh.y) < (TE.shrineClear * TILE) ** 2) continue;
    if (circleHitsTiles(x, y, 14)) continue;
    if (Enemies.some(e => dist2(e.x, e.y, x, y) < TE.spacing * TE.spacing)) continue;
    return { x, y };
  }
  return null;
}
function updateSpawner(dt) {
  const reg = World.regions[G.regionIdx]; if (!reg) return;
   
  for (let i = Enemies.length - 1; i >= 0; i--) if (dist2(Enemies[i].x, Enemies[i].y, P.x, P.y) > TUNE.enemy.despawnRange ** 2) releaseEnemy(i);
  const rule = regionSpawnRule(reg); if (!rule) return;
  if (Spawner.grace > 0) { Spawner.grace -= dt; return; }
  Spawner.cd -= dt;
  if (Spawner.cd > 0) return;
  const inRegion = Enemies.filter(e => e.ri === reg.ri).length;
  const want = Spawner.initial ? Math.ceil(rule.max / 2) : 1;
  Spawner.initial = false;
  Spawner.cd = rule.cd * (0.8 + rnd() * 0.4);
  for (let n = 0; n < want; n++) {
    if (inRegion + n >= rule.max || Enemies.length >= TUNE.enemy.maxWorld) break;
    const p = findSpawnPoint(reg); if (!p) { Spawner.cd = 1.5; break; }
    const e = spawnEnemy(pick(rule.types), p.x, p.y, null, rule.tier);
    e.ri = reg.ri; e.dyn = true;
  }
}

function drawEndScene(g, w, h, scene, t) {
  const sky = (a, b) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, a); gr.addColorStop(1, b); g.fillStyle = gr; g.fillRect(0, 0, w, h); };

    if (scene !== 'heart_pre') {
       
      GUARDIANS.forEach((gd, i) => {
        const a = Math.PI + (i + 0.5) / GUARDIANS.length * Math.PI;
        const x = cx + Math.cos(a) * w * 0.38, y = cy - 40 + Math.sin(a) * h * 0.32;
        const st = gState(gd.id);
        const k = clamp((t - i * 0.08) / 1.2, 0, 1);
        g.globalAlpha = k;
        g.save(); g.translate(x, y); g.scale(0.42, 0.42);

        g.restore();
        g.globalAlpha = 1;
      });
    }
    drawPerson(g, cx, cy + 70, { col: '#3e7f86', hair: '#5a3a22', dir: -Math.PI / 2, cape: '#a8442a', scale: 1.6, sit: true });
    return;
  }
   
  const dusk = scene === 'home_dusk', half = scene === 'home_half';
  if (dusk) sky('#2a1e3a', '#a0603a'); else if (half) sky('#4a6a8a', '#e0b88a'); else sky('#6ab0e0', '#f0e0b0');
  if (dusk) stars(40, 0.4);
  const sunY = dusk ? h * 0.62 : h * 0.25;
  g.fillStyle = dusk ? 'rgba(255,170,90,0.8)' : 'rgba(255,240,180,0.9)'; g.beginPath(); g.arc(w * 0.78, sunY, 40, 0, TAU); g.fill();
  g.fillStyle = dusk ? '#3a2e3a' : '#5a7a5a'; g.beginPath(); g.moveTo(0, h * 0.6);
  for (let x = 0; x <= w; x += 30) g.lineTo(x, h * 0.55 + Math.sin(x * 0.006) * 30 + Math.sin(x * 0.02) * 8);
  g.lineTo(w, h); g.lineTo(0, h); g.fill();
  const groundCol = dusk ? '#6a5a3a' : half ? '#8a9a5a' : '#6a9a4a';
  g.fillStyle = groundCol; g.fillRect(0, h * 0.68, w, h);
   
  const flow = dusk ? 0 : half ? 0.5 : 1;
  const ry = h * 0.82;
  g.fillStyle = '#7a5e3a'; g.fillRect(0, ry - 14, w, 28);
  if (flow > 0) {
    const k = clamp(t / 6, 0, 1) * flow;
    g.fillStyle = '#4a8ac0'; g.fillRect(0, ry - 12 * k, w, 24 * k);
    g.strokeStyle = 'rgba(255,255,255,0.4)'; for (let x = (t * 40) % 60 - 60; x < w; x += 60) { g.beginPath(); g.moveTo(x, ry); g.lineTo(x + 20, ry); g.stroke(); }
  }
   
  for (let i = 0; i < 5; i++) {
    const x = w * 0.08 + i * w * 0.19, y = h * 0.68;
    g.fillStyle = dusk ? '#4a3e36' : '#b89a72'; g.fillRect(x, y - 50, 70, 50);
    g.fillStyle = dusk ? '#2a2026' : '#8a4a3a'; g.beginPath(); g.moveTo(x - 8, y - 48); g.lineTo(x + 35, y - 80); g.lineTo(x + 78, y - 48); g.fill();
    g.fillStyle = dusk ? (i === 2 ? '#e8b060' : '#1a1418') : '#e8d088'; g.fillRect(x + 12, y - 36, 12, 10);
  }
   
  const n = dusk ? 1 : half ? 6 : 14;
  for (let i = 0; i < n; i++) {
    const x = dusk ? w * 0.42 : w * 0.12 + i * (w * 0.76 / Math.max(1, n - 1)), y = h * 0.76 + (i % 2) * 8;
    const dig = Math.sin(t * 3 + i) > 0;

    g.strokeStyle = '#6a4a2a'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(x + 8, y - 26); g.lineTo(x + 14 + (dig ? 6 : 0), y + 2); g.stroke();
  }
  if (!dusk) {
     
    const helpers = GUARDIANS.filter(gd => gState(gd.id) === 'spared').slice(0, half ? 3 : 6);
    helpers.forEach((gd, i) => { g.save(); g.translate(w * 0.05 + i * 60, h * 0.62); g.scale(0.45, 0.45); drawGuardian(g, gd, 0, 0, { t: t + i }); g.restore(); });
  }
}

  const hearts = Math.ceil(P.maxHp / 2);
  const shownHp = Math.ceil(P.hp * 2) / 2;
  for (let i = 0; i < hearts; i++) {
    const hv = shownHp / 2 - i;
    const fill = hv >= 1 ? 1 : hv >= 0.5 ? 0.5 : 0;
    drawHeart(g, 22 + (i % 10) * 22, 22 + Math.floor(i / 10) * 20, fill, 1.15);
  }
  const rowY = 22 + Math.ceil(hearts / 10) * 20 + 6;
  g.font = 'bold 13px Courier New'; g.textAlign = 'left';
   
  for (let i = 0; i < P.maxPotions; i++) {
    const x = 16 + i * 16, y = rowY;
    g.fillStyle = i < P.potions ? '#8fe08a' : 'rgba(255,255,255,0.15)';
    g.fillRect(x, y + 3, 10, 11); g.fillRect(x + 3, y, 4, 4);
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.strokeRect(x + 0.5, y + 3.5, 10, 11);
  }
   
  const ax = 22 + P.maxPotions * 16;
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(ax - 4, rowY - 1, 70, 17);
  g.fillStyle = P.arrows > 0 ? '#efe6d2' : '#c97a6a'; g.fillText('➶ ' + P.arrows + '/' + P.maxArrows, ax, rowY + 12);
   
  if (G.S) {
    const n = sealCount();
    const lx = View.w - 96;
    g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(lx - 6, 10, 88, 26);
    g.fillStyle = '#4a3a2a'; g.fillRect(lx, 15, 12, 3);
    g.fillStyle = n > 0 ? '#ffd27a' : '#555'; g.fillRect(lx + 1, 18, 10, 13);
    g.fillStyle = '#efe6d2'; g.fillText(n + ' / 20', lx + 20, 29);
  }
  if (G.mode === 'arena' && B.def) drawBossBar(g, t);
  if (G.mode === 'world' && G.prompt && !G.dlgOpen) {
    const label = (Input.touchMode ? 'E ▸ ' : '[E] ') + G.prompt;
    g.font = '15px Courier New'; g.textAlign = 'center';
    const w = g.measureText(label).width + 24;
    g.fillStyle = 'rgba(18,15,28,0.85)'; g.fillRect(View.w / 2 - w / 2, View.h - 62, w, 28);
    g.strokeStyle = '#d8b45e'; g.strokeRect(View.w / 2 - w / 2 + 0.5, View.h - 61.5, w - 1, 27);
    g.fillStyle = '#f3d98c'; g.fillText(label, View.w / 2, View.h - 43);
  }
  if (G.mode === 'passage' && PS.t < 6) {
    g.font = '14px Courier New'; g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,' + clamp(5 - PS.t, 0, 1) + ')';
    g.fillText(Input.touchMode ? 'Keep moving! Joystick to run · ↻ jump · ⚔ / ➶ to fight' : 'Keep moving! ← → run · Space / ↑ jump · J sword · K bow · reach the door', View.w / 2, View.h - 40);
  }
}
function drawBossBar(g, t) {
  const w = Math.min(520, View.w - 260), x = View.w / 2 - w / 2, y = 52;
  g.font = '15px Georgia'; g.textAlign = 'center'; g.fillStyle = '#f3d98c';
  g.fillText(B.def.name + ' ' + B.def.title, View.w / 2, y - 10);
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(x - 3, y - 3, w + 6, 16);
  const k = clamp(B.hp / B.maxHp, 0, 1);
  g.fillStyle = B.shielded ? '#7fb8c8' : B.openT > 0 ? '#ffe08a' : B.def.col.main; g.fillRect(x, y, w * k, 10);
  g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(x, y, w * k, 3);

  if (B.barkT > 0 && B.bark) {

function rebuildWorld() {
  generateWorld();

function startNewGame() {

function loadGame() {

  const ok = reachableFrom(home.x, home.y);

  } else if (G.S.camp && !ok[ti(G.S.camp.x, G.S.camp.y)]) G.S.camp = { x: home.x, y: home.y };

function nearbyEnts() {
  const ri = regionIndexAt(P.x, P.y), reg = World.regions[ri], out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const c = reg.c + dc, r = reg.r + dr;
    if (c < 0 || r < 0 || c >= GRID_W || r >= GRID_H) continue;
    for (const e of World.entsByRegion[r * GRID_W + c]) out.push(e);
  }
  return out;
}

function updateWorld(dt) {
  WORLD_ENV.camX = G.camX; WORLD_ENV.camY = G.camY;
  playerUpdate(dt, WORLD_ENV);
  updateCombat(dt);
  const ri = regionIndexAt(P.x, P.y);
  if (ri !== G.regionIdx) onEnterRegion(ri);
  updateSpawner(dt);
   
  let best = null, bd = 1e9;
  for (const e of nearbyEnts()) {
    if (!canInteract(e)) {
      if (e.kind === 'prints' && !G.S.flags.prints && dist2(P.x, P.y, e.x, e.y) < e.rad * e.rad) { G.S.flags.prints = 1; say('', TEXT.footprints); }
      continue;
    }
    const d = dist2(P.x, P.y, e.x, e.y);
    if (e.kind === 'guardian') {
      const isKing = e.id === 'king';
      const pending = isKing ? !G.S.king.defeated : gState(e.id) === 'none';
      if (pending) {
        if (d > (e.rad * 1.35) * (e.rad * 1.35)) e.armed = true;
        if (e.armed && d < (e.rad * 0.8) * (e.rad * 0.8) && !G.dlgOpen && !UI.fading) { e.armed = false; interact(e); return; }
      }
      const r2 = (pending ? e.rad * 0.6 : 60);
      if (d < r2 * r2 && d < bd) { bd = d; best = e; }
      continue;
    }
    if (d < e.rad * e.rad && d < bd) { bd = d; best = e; }
  }
  G.promptEnt = best; G.prompt = best ? interactLabel(best) : null;
  if (best && Input.pressed.interact && !G.dlgOpen) interact(best);
   
  for (let i = G.drops.length - 1; i >= 0; i--) {
    const d = G.drops[i]; d.t += dt;
    if (d.t > 20) { G.drops.splice(i, 1); continue; }
    if (dist2(P.x, P.y, d.x, d.y) < 26 * 26) {
      if (d.kind === 'heart') { P.hp = Math.min(P.maxHp, P.hp + 2); Sound.sfx('heal'); }
      else { P.arrows = Math.min(P.maxArrows, P.arrows + 4); Sound.sfx('pickup'); }
      G.drops.splice(i, 1);
    }
  }
   
  const tx = P.x - View.w / 2, ty = P.y - 16 - View.h / 2;
  G.camX = lerp(G.camX, tx, Math.min(1, dt * 7)); G.camY = lerp(G.camY, ty, Math.min(1, dt * 7));
  G.camX = clamp(G.camX, 0, WORLD_TW * TILE - View.w); G.camY = clamp(G.camY, 0, WORLD_TH * TILE - View.h);
}

 
function npcHasNews(def) {
  const S = G.S, Q = S.quests, F = S.flags;
  switch (def.id) {
    case 'oswin': return !F.oswin; case 'gran': return !F.gran;
    case 'mara': case 'tobin': case 'sela': case 'haldis': return !S.warnings[STORIES[def.id].warn];
    case 'wren': return Q.pell === 0 || Q.pell === 2;
    case 'pell': return Q.pell < 2;
    case 'pim': return Q.pim === 0 || (Q.pim === 1 && S.items.keepsake) || (Q.pim === 0 && S.items.keepsake);
    case 'odo': return Q.bridge === 0 || (Q.bridge === 1 && Q.joss && Q.bess);
    case 'joss': return Q.bridge === 1 && !Q.joss;
    case 'bess': return Q.bridge === 1 && !Q.bess;
    case 'qa': return !Q.quiet.a && !Q.quiet.done; case 'qb': return !Q.quiet.b && !Q.quiet.done; case 'qc': return !Q.quiet.c && !Q.quiet.done;
  }
  return false;
}

function drawWorld(g, t) {

    g.drawImage(getChunk(cx, cy).cv, cx * CHUNK_PX - camX, cy * CHUNK_PX - camY);
  }
  g.save(); g.translate(-camX, -camY);
  const vx0 = camX - 80, vy0 = camY - 120, vx1 = camX + View.w + 80, vy1 = camY + View.h + 160;
  const vis = (x, y) => x > vx0 && x < vx1 && y > vy0 && y < vy1;

    g.fillStyle = 'rgba(90,110,140,0.35)'; g.beginPath(); g.ellipse(0, 0, 7, 11, 0, 0, TAU); g.fill();

    g.restore();

  drawCombatLower(g, t);

      actors.push({ y: e.y, d: () => {

        else drawPerson(g, e.x, e.y, { col: d.col, hair: d.hair, dir: dist2(e.x, e.y, P.x, P.y) < 140 * 140 ? face : Math.PI / 2, sit: d.sitting });
        if (npcHasNews(d)) bubble(g, e.x, e.y - (d.giant ? 92 : 44), t, d.survivor || d.id === 'haldis' ? '…' : '!');
      } });
    } else if (e.kind === 'guardian') {

          drawGuardian(g, def, e.x, e.y, { t, face: Math.cos(angTo(e.x, e.y, P.x, P.y)) * 0.6 });
        } else if (st === 'spared') {

  actors.sort((a, b) => a.y - b.y);
  for (const a of actors) a.d();
   
  for (const sl of World.seals) {

    for (let k = 0; k < 3; k++) { const o = ((t * 30 + k * 40) % (Math.max(w, h))); if (w > h) { g.beginPath(); g.moveTo(sx + o, sy); g.lineTo(sx + o, sy + h); g.stroke(); } else { g.beginPath(); g.moveTo(sx, sy + o); g.lineTo(sx + w, sy + o); g.stroke(); } }
  }
   
  for (const s of World.structs) {

      else { g.fillRect(sx, sy - 2, 18, 4); g.fillRect(sx + s.w * TILE - 18, sy - 2, 18, 4); }

  }
  drawCombatUpper(g, t);
  g.restore();
  const reg = World.regions[G.regionIdx];
  if (reg) {
    if (reg.def.guardian && reg.def.guardian !== 'king' && gState(reg.def.guardian) === 'abandoned') {

function step(dt) {
  UI.tickDialogue(dt);
  G.shake = Math.max(0, G.shake - dt * 30);
  repairUiState();
  const blocked = G.paused || G.dlgOpen || UI.fading || !!UI.panel;
  if (blocked) return;
  if (G.mode !== 'world' && G.mode !== 'arena' && G.mode !== 'passage') return;
  try {
    if (G.mode === 'world') updateWorld(dt);
    else if (G.mode === 'arena') updateArena(dt);
    else updatePassage(dt);
    progressWatchdog(dt);
  } catch (err) { recoverFromError(err); }
  G.t += dt;
  if (G.S) G.S.playTime += dt;
}
 
function repairUiState() {
  if (G.dlgOpen && !UI.dlg && !UI.choice) { G.dlgOpen = false; $('dialogue').classList.add('hidden'); }
  if ((UI.dlg || UI.choice) && $('dialogue').classList.contains('hidden')) $('dialogue').classList.remove('hidden');
  if (G.paused && !UI.panel) G.paused = false;
}
 
 
const ErrLog = [];
function recoverFromError(err) {
  console.error('[TLW] recovered from error:', err);
  const now = performance.now();
  ErrLog.push(now); while (ErrLog.length && now - ErrLog[0] > 3000) ErrLog.shift();
  if (G.mode === 'arena' && B.act) { endBossAct(0.8); }
  if (ErrLog.length < 3) return;
  ErrLog.length = 0;
  if (G.mode === 'arena' || G.mode === 'passage') restartEncounter('error');
  else if (G.mode === 'world') returnToCampSafely();
}

function render(dt) {
  try { renderFrame(dt); } catch (err) { if (!render.warned) { render.warned = true; console.error('[TLW] draw error', err); setTimeout(() => { render.warned = false; }, 2000); } }
}
function renderFrame(dt) {
  beginFrame();
  const t = G.t;
  if (G.mode === 'title') { drawTitleBackdrop(ctx, dt); }
  else if (G.mode === 'world') { drawWorld(ctx, t); ambientDraw(ctx, G.paused || G.dlgOpen ? 0 : dt, t); }
  else if (G.mode === 'arena') drawArena(ctx, t);
  else if (G.mode === 'passage') drawPassage(ctx, t);
  else if (G.mode === 'ending') { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, View.w, View.h); UI.drawEnding(dt); }
  drawHUD(ctx, t);
  for (const f of RenderHooks) f(ctx, dt);
}
const RenderHooks = [];    

let lastT = performance.now(), accT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.25) dt = 0.25;
  if (dt < 0) dt = 0;
  accT += dt;
  let n = 0;
  while (accT >= STEP && n < 8) { step(STEP); accT -= STEP; Input.endStep(); n++; }
  if (n >= 8) accT = 0;
  render(dt);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && (G.mode === 'world' || G.mode === 'arena' || G.mode === 'passage') && !G.paused && !G.dlgOpen && !UI.panel) UI.openPause();
  Input.clearAll();
});
