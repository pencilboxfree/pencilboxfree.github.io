<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1017">
<meta name="color-scheme" content="dark">
<title>The Lost Sword of the Gods</title>
<meta name="description" content="The Lost Sword of the Gods — a turn-based browser RPG. Explore, fight, upgrade your gear, reach the Underworld and bring the stolen sword home. Two endings and a hidden final boss.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%E2%9A%94</text></svg>">
<style>
/* ============================================================
   THE LOST SWORD OF THE GODS
   Pencilbox Games - shared collection UI language
   ============================================================ */
:root{
  --ink:#0d1017; --ink2:#141a24; --panel:#1b2230; --panel2:#232c3d;
  --line:#33405a; --line2:#4a5b7d;
  --parch:#e8dcc0; --parch-dim:#b9ad92;
  --gold:#e0b862; --gold-dim:#a3853f;
  --teal:#4fd1c5; --crimson:#e0575b; --violet:#9a7ad1;
  --good:#6fcf7a; --warn:#e8b04b;
  --shadow:0 6px 22px rgba(0,0,0,.55);
  --r:10px;
  --fs:clamp(13px,1.6vw,15px);
}
/* realm tints */
body.realm-underworld{ --ink:#160c0e; --ink2:#220f12; --panel:#2a1418; --panel2:#361a1f;
  --line:#5a2f33; --line2:#7d4147; --gold:#f08a4b; --teal:#e07a5a; }
body.realm-clouds{ --ink:#141c2b; --ink2:#1d2740; --panel:#26334d; --panel2:#31405e;
  --line:#4a5e86; --line2:#6c85b5; --gold:#ffe9a8; --teal:#9fd8ff; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--ink); color:var(--parch);
  font-family:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;
  font-size:var(--fs); line-height:1.45;
  overscroll-behavior:none; -webkit-text-size-adjust:100%;
  transition:background .5s ease;
}
button{font-family:inherit; font-size:inherit; color:inherit;}
h1,h2,h3{margin:0 0 .4em; font-weight:700; letter-spacing:.5px;}
.small{font-size:.85em;} .dim{color:var(--parch-dim);}
.gold{color:var(--gold);} .teal{color:var(--teal);} .crim{color:var(--crimson);}
.good{color:var(--good);} .warn{color:var(--warn);}

/* ---------- app shell ---------- */
#app{
  max-width:1080px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  gap:8px;
}

/* ---------- topbar / HUD ---------- */
#topbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line); border-radius:var(--r);
  padding:7px 10px; box-shadow:var(--shadow);
}
#gameTitle{
  font-size:1em; font-weight:700; color:var(--gold); letter-spacing:1px;
  white-space:nowrap; margin-right:auto;
}
.chip{
  display:inline-flex; align-items:center; gap:5px;
  background:var(--ink2); border:1px solid var(--line);
  border-radius:999px; padding:3px 10px; font-size:.85em; white-space:nowrap;
}
.chip b{color:var(--gold); font-weight:700;}
.icobtn{
  background:var(--ink2); border:1px solid var(--line); border-radius:8px;
  min-width:38px; height:34px; cursor:pointer; padding:0 9px; font-size:.85em;
}
.icobtn:hover{border-color:var(--gold); color:var(--gold);}
.icobtn:active{transform:translateY(1px);}

/* ---------- stage ---------- */
#stage{
  position:relative; border:1px solid var(--line); border-radius:var(--r);
  background:var(--ink2); overflow:hidden; box-shadow:var(--shadow);
  aspect-ratio:16/9; width:100%;
}
#scene{display:block; width:100%; height:100%;}
/* location visualizer */
#locBox{
  position:absolute; right:8px; bottom:8px;
  width:clamp(88px,17%,140px);
  border:2px solid var(--line2); border-radius:8px; overflow:hidden;
  background:var(--ink); box-shadow:0 4px 14px rgba(0,0,0,.6);
}
#locCanvas{display:block; width:100%; aspect-ratio:4/3;}
#locName{
  font-size:.68em; text-align:center; padding:2px 3px; background:rgba(0,0,0,.55);
  color:var(--parch); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* speech bubble */
.bubble{
  position:absolute; max-width:64%; background:var(--parch); color:#20242e;
  border-radius:12px; padding:9px 12px; font-size:.92em; line-height:1.35;
  box-shadow:0 6px 18px rgba(0,0,0,.6); animation:pop .25s ease-out;
}
.bubble:after{
  content:""; position:absolute; bottom:-9px; left:26px;
  border:10px solid transparent; border-top-color:var(--parch); border-bottom:0;
}
.bubble.right:after{left:auto; right:26px;}
.bubble b{color:#7a4a12;}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

/* combat bars overlay */
.hpwrap{position:absolute; top:8px; width:38%; min-width:150px;}
.hpwrap.left{left:8px;} .hpwrap.right{right:8px; text-align:right;}
.hplabel{font-size:.78em; text-shadow:0 2px 4px #000; margin-bottom:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hpbar{height:11px; background:rgba(0,0,0,.6); border:1px solid var(--line2);
  border-radius:6px; overflow:hidden;}
.hpfill{height:100%; width:100%; transition:width .35s ease; border-radius:5px;}
.hpfill.you{background:linear-gradient(90deg,#2f8f7d,var(--teal));}
.hpfill.foe{background:linear-gradient(90deg,#8f2f36,var(--crimson));}
.fx{position:absolute; font-weight:700; font-size:1.5em; text-shadow:0 2px 6px #000;
  pointer-events:none; animation:floatUp 1s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}

/* ---------- log ---------- */
#log{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:8px 10px; height:clamp(92px,15vh,132px); overflow-y:auto;
  font-size:.9em; scroll-behavior:smooth;
}
#log p{margin:0 0 4px; padding-left:10px; text-indent:-10px;}
#log p:before{content:"› "; color:var(--line2);}
#log p.hi:before{color:var(--gold);}
#log p.hi{color:var(--gold);}
#log p.bad{color:var(--crimson);} #log p.ok{color:var(--good);}
#log p.story{color:var(--parch); font-style:italic;}

/* ---------- actions ---------- */
#actions{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:7px;}
.btn{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line2); border-radius:var(--r);
  padding:12px 10px; min-height:50px; cursor:pointer; text-align:center;
  font-weight:600; letter-spacing:.4px; transition:.13s;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.btn:hover:not(:disabled){border-color:var(--gold); color:var(--gold); transform:translateY(-1px);}
.btn:active:not(:disabled){transform:translateY(1px);}
.btn:disabled{opacity:.38; cursor:not-allowed;}
.btn .sub{font-size:.72em; font-weight:400; color:var(--parch-dim);}
.btn:hover:not(:disabled) .sub{color:inherit;}
.btn.primary{border-color:var(--gold-dim); color:var(--gold);
  background:linear-gradient(180deg,#3a3020,#282016);}
.btn.danger{border-color:#7d3339; color:#ffb9bb;}
.btn.wide{grid-column:1/-1;}
/* retreat: obvious, but visibly not one of the four combat actions */
.btn.flee{
  background:repeating-linear-gradient(135deg,var(--ink2),var(--ink2) 9px,rgba(255,255,255,.03) 9px,rgba(255,255,255,.03) 18px);
  border-style:dashed; border-color:var(--line2); color:var(--parch-dim);
  min-height:44px; font-weight:600; letter-spacing:1px;
}
.btn.flee:hover:not(:disabled){border-color:var(--teal); color:var(--teal);}
.btn.flee .sub{font-size:.7em;}

/* ---------- modal ---------- */
.modal{
  position:fixed; inset:0; background:rgba(4,6,10,.82); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:12px;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal[hidden]{display:none;}
.sheet{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line2); border-radius:14px; box-shadow:var(--shadow);
  width:min(680px,100%); max-height:min(88vh,780px); overflow-y:auto; padding:14px;
}
.sheet h2{color:var(--gold); font-size:1.15em; display:flex; align-items:center; gap:8px;}
.sheet .close{margin-left:auto;}
.row{
  display:flex; align-items:center; gap:10px; padding:9px;
  border:1px solid var(--line); border-radius:9px; background:var(--ink2); margin-bottom:7px;
}
.row .grow{flex:1; min-width:0;}
.row .t{font-weight:600;}
.row .d{font-size:.82em; color:var(--parch-dim);}
.row.sel{border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold-dim);}
.pill{
  border:1px solid var(--line2); background:var(--panel); border-radius:8px;
  padding:8px 12px; cursor:pointer; font-size:.85em; font-weight:600; white-space:nowrap;
  min-height:38px;
}
.pill:hover:not(:disabled){border-color:var(--gold); color:var(--gold);}
.pill:disabled{opacity:.4; cursor:not-allowed;}
.tabs{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
.tab{flex:1; min-width:90px; padding:8px; text-align:center; cursor:pointer;
  border:1px solid var(--line); border-radius:8px; background:var(--ink2); font-size:.85em;}
.tab.on{border-color:var(--gold); color:var(--gold); background:var(--panel2);}
#mapCanvas{width:100%; aspect-ratio:16/10; background:#0a0d13;
  border:1px solid var(--line); border-radius:9px; display:block;}

/* ---------- title / fullscreen story ---------- */
#screen{
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  padding:16px; overflow-y:auto; background:radial-gradient(ellipse at 50% 30%,#1c2434,#07090d 70%);
}
#screen[hidden]{display:none;}
body.realm-underworld #screen{background:radial-gradient(ellipse at 50% 30%,#3a1418,#0b0405 70%);}
body.realm-clouds #screen{background:radial-gradient(ellipse at 50% 35%,#5c7fb5,#16203a 72%);}
.card{width:min(620px,100%); text-align:center;}
.card h1{
  font-size:clamp(22px,5.4vw,40px); color:var(--gold); letter-spacing:2px; line-height:1.15;
  text-shadow:0 3px 18px rgba(224,184,98,.28);
}
.card .sub{color:var(--parch-dim); margin-bottom:16px; letter-spacing:3px; font-size:.8em; text-transform:uppercase;}
.card p{margin:0 0 12px;}
#titleArt{width:min(340px,72%); aspect-ratio:1/1; margin:0 auto 6px; display:block;}
.slotlist{text-align:left; margin:14px 0;}
.langbox{
  text-align:left; background:var(--ink2); border:1px solid var(--line);
  border-radius:10px; padding:10px 12px; margin:10px 0;
}
.langbox div{margin:0 0 8px;}
.langbox .lg{font-size:.72em; letter-spacing:2px; text-transform:uppercase; color:var(--gold-dim);}

/* ---------- misc ---------- */
.center{text-align:center;}
.hidden{display:none !important;}
hr.sep{border:0; border-top:1px solid var(--line); margin:12px 0;}
.badge{font-size:.7em; border:1px solid var(--line2); border-radius:5px; padding:1px 5px; color:var(--parch-dim);}
.badge.cd{border-color:var(--crimson); color:var(--crimson);}
.badge.rdy{border-color:var(--good); color:var(--good);}
.toast{
  position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
  background:var(--panel2); border:1px solid var(--gold-dim); color:var(--gold);
  border-radius:10px; padding:9px 16px; z-index:80; box-shadow:var(--shadow);
  animation:fade .2s ease; pointer-events:none; font-size:.9em;
}
/* scrollbars */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px}

@media (max-width:640px){
  #gameTitle{font-size:.85em; width:100%; margin-bottom:2px;}
  #actions{grid-template-columns:repeat(2,1fr);}
  .btn{min-height:56px; padding:9px 6px;}
  #log{height:88px;}
  .hpwrap{width:44%;}
}
@media (max-height:520px) and (orientation:landscape){
  #log{height:64px;}
  .btn{min-height:44px;}
}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <span id="gameTitle">THE LOST SWORD OF THE GODS</span>
    <span class="chip" id="chipHp">HP <b>—</b></span>
    <span class="chip" id="chipXp">XP <b>0</b></span>
    <span class="chip" id="chipWpn">—</span>
    <span class="chip" id="chipPot">Potions <b>0</b></span>
    <span class="chip" id="chipArm" title="Armour protection">No armour</span>
    <button class="icobtn" id="btnMap"   title="Map (M)">Map</button>
    <button class="icobtn" id="btnUp"    title="Upgrades (U)">Upgrades</button>
    <button class="icobtn" id="btnBag"   title="Items (I)">Items</button>
    <button class="icobtn" id="btnSound" title="Sound">&#9834;</button>
    <button class="icobtn" id="btnMenu"  title="Menu">&#9776;</button>
  </div>

  <div id="stage">
    <canvas id="scene" width="960" height="540"></canvas>
    <div id="fxLayer" style="position:absolute;inset:0;pointer-events:none"></div>
    <div id="bubbles" style="position:absolute;inset:0;pointer-events:none"></div>
    <div class="hpwrap left"  id="hpYou"  hidden>
      <div class="hplabel" id="hpYouLbl">You</div>
      <div class="hpbar"><div class="hpfill you" id="hpYouBar"></div></div>
    </div>
    <div class="hpwrap right" id="hpFoe" hidden>
      <div class="hplabel" id="hpFoeLbl">Enemy</div>
      <div class="hpbar"><div class="hpfill foe" id="hpFoeBar"></div></div>
    </div>
    <div id="locBox">
      <canvas id="locCanvas" width="200" height="150"></canvas>
      <div id="locName">—</div>
    </div>
  </div>

  <div id="log" aria-live="polite"></div>
  <div id="actions"></div>
</div>

<!-- ============ overlays ============ -->
<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<div id="screen">
  <div class="card" id="screenCard"></div>
</div>

<script>
"use strict";
/* ============================================================
   SAVE  —  localStorage with in-memory fallback (collection standard)
   Namespaced keys so it never collides with the other games.
   ============================================================ */
var SAVE = (function(){
  var NS = 'pbx.lostsword.';
  var SLOTS = 3;
  var mem = {};                       /* fallback when storage is blocked */
  var ok = (function(){
    try{ var k=NS+'__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  })();

  function raw(k){ try{ return ok ? localStorage.getItem(k) : (mem[k]||null); }catch(e){ return mem[k]||null; } }
  function put(k,v){ try{ if(ok) localStorage.setItem(k,v); else mem[k]=v; }catch(e){ mem[k]=v; } }
  function del(k){ try{ if(ok) localStorage.removeItem(k); else delete mem[k]; }catch(e){ delete mem[k]; } }

  function key(slot){ return NS+'slot'+slot; }

  function read(slot){
    var s = raw(key(slot)); if(!s) return null;
    try{ var o = JSON.parse(s); return (o && o.p) ? o : null; }catch(e){ return null; }
  }
  function write(slot, player, meta){
    var payload = { v:2, t:Date.now(), p:player, m:meta||{} };
    put(key(slot), JSON.stringify(payload));
    return payload;
  }
  function erase(slot){ del(key(slot)); }

  function list(){
    var out=[];
    for(var i=1;i<=SLOTS;i++){ out.push({ slot:i, data:read(i) }); }
    return out;
  }

  /* settings are global, not per-slot */
  function setting(k, v){
    if(v===undefined){ var s = raw(NS+'set.'+k); return s===null?null:s; }
    put(NS+'set.'+k, String(v)); return v;
  }

  return { SLOTS:SLOTS, read:read, write:write, erase:erase, list:list,
           setting:setting, available:ok };
})();
/* ============================================================
   AUDIO  —  small original chiptune engine (Web Audio API).
   All melodies written for this game. Nothing sampled, nothing borrowed.
   Completely optional: every call is a no-op if audio is off or fails.
   ============================================================ */
var AUDIO = (function(){
  var ctx=null, master=null, on=true, started=false;
  var timer=null, step=0, track=null, nextTime=0;
  var LOOK=0.10, AHEAD=25;

  /* note helper: semitone offset from A2 (110Hz) */
  function f(n){ return 110*Math.pow(2, n/12); }
  var _ = null;                                   /* rest */

  /* --- original loops. [bass 16 steps, lead 16 steps, bpm, leadWave] --- */
  var TRACKS = {
    village:   { bpm:96,  wave:'triangle', vol:.5,
      bass:[ 5,_,_,_, 12,_,_,_, 3,_,_,_, 10,_,_,_ ],
      lead:[ 24,_,28,_, 31,_,28,_, 27,_,24,_, 22,_,_,_ ] },
    explore:   { bpm:108, wave:'square', vol:.42,
      bass:[ 3,_,3,_, 10,_,_,_, 5,_,5,_, 8,_,_,_ ],
      lead:[ 22,_,_,25, 27,_,25,_, 22,_,20,_, 17,_,_,_ ] },
    combat:    { bpm:146, wave:'square', vol:.46,
      bass:[ 1,1,_,1, 8,_,1,_, 1,1,_,1, 6,_,4,_ ],
      lead:[ 25,_,24,_, 25,_,28,_, 25,_,24,_, 20,_,22,_ ] },
    boss:      { bpm:158, wave:'sawtooth', vol:.44,
      bass:[ 0,0,_,0, 0,_,3,_, 0,0,_,0, 6,_,5,_ ],
      lead:[ 24,27,_,24, 31,_,30,_, 24,27,_,24, 34,_,32,_ ] },
    underworld:{ bpm:88,  wave:'sawtooth', vol:.4,
      bass:[ 0,_,_,_, 1,_,_,_, 0,_,_,_, 6,_,5,_ ],
      lead:[ 12,_,_,13, _,_,12,_, 8,_,_,_, 6,_,_,_ ] },
    ending:    { bpm:84,  wave:'triangle', vol:.5,
      bass:[ 5,_,_,_, 0,_,_,_, 7,_,_,_, 5,_,_,_ ],
      lead:[ 29,_,31,_, 33,_,_,_, 31,_,29,_, 24,_,_,_ ] },
    hero:      { bpm:120, wave:'triangle', vol:.52,
      bass:[ 5,_,5,_, 12,_,_,_, 7,_,7,_, 0,_,_,_ ],
      lead:[ 29,31,33,_, 36,_,33,_, 31,_,29,_, 33,_,_,_ ] }
  };

  function init(){
    if(ctx) return true;
    try{
      var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = on?0.32:0; master.connect(ctx.destination);
      return true;
    }catch(e){ ctx=null; return false; }
  }
  function resume(){ if(ctx && ctx.state==='suspended'){ try{ctx.resume();}catch(e){} } }

  function tone(freq, t, dur, wave, vol, dest){
    if(!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = wave||'square'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(t, dur, vol, hp){
    if(!ctx) return;
    var len = Math.max(1, Math.floor(ctx.sampleRate*dur));
    var buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    var s = ctx.createBufferSource(); s.buffer = buf;
    var g = ctx.createGain(); g.gain.value = vol;
    var flt = ctx.createBiquadFilter(); flt.type = hp?'highpass':'lowpass'; flt.frequency.value = hp||900;
    s.connect(flt); flt.connect(g); g.connect(master); s.start(t);
  }

  function schedule(){
    if(!ctx || !track) return;
    var T = TRACKS[track]; if(!T) return;
    var spb = 60/T.bpm/4;                       /* 16th notes */
    while(nextTime < ctx.currentTime + LOOK){
      var i = step % 16;
      var b = T.bass[i], l = T.lead[i];
      if(b !== null && b !== undefined) tone(f(b), nextTime, spb*1.7, 'triangle', 0.22*T.vol);
      if(l !== null && l !== undefined) tone(f(l), nextTime, spb*1.5, T.wave,   0.13*T.vol);
      if(i%4===0) noise(nextTime, 0.05, 0.05*T.vol, 2000);      /* soft tick */
      if(i===8)   noise(nextTime, 0.11, 0.09*T.vol, 0);         /* backbeat */
      nextTime += spb; step++;
    }
  }

  function setTrack(name){
    if(name === track) return;
    track = name; step = 0;
    if(!on || !name){ stopLoop(); return; }
    if(!init()) return;
    resume(); nextTime = ctx.currentTime + 0.06;
    if(!timer) timer = setInterval(schedule, AHEAD);
  }
  function stopLoop(){ if(timer){ clearInterval(timer); timer=null; } }

  var SFX = {
    ui:      function(t){ tone(f(24), t, .06, 'square', .10); },
    hit:     function(t){ noise(t,.10,.16,0); tone(f(9),t,.10,'square',.12); },
    crit:    function(t){ noise(t,.16,.20,0); tone(f(16),t,.14,'sawtooth',.14); tone(f(23),t+.05,.14,'square',.10); },
    hurt:    function(t){ tone(f(6),t,.18,'sawtooth',.14); tone(f(2),t+.04,.20,'sawtooth',.10); },
    potion:  function(t){ tone(f(19),t,.09,'triangle',.12); tone(f(26),t+.07,.14,'triangle',.12); },
    chest:   function(t){ [17,21,24,29].forEach(function(n,k){ tone(f(n),t+k*.06,.14,'triangle',.12); }); },

/* ---------- weapon helpers ---------- */
/* the weapon's own damage stat, before the limit is applied */
function wpnRaw(P, id){
  var w = D.WEAPONS[id], lv = (P.weapons[id]&&P.weapons[id].lvl)||0;
  return w.dmg + w.gain*lv;
}
/* the current damage limit for this weapon, after XP reforging */
function wpnCap(P, id){
  var w = D.WEAPONS[id], r = (P.weapons[id]&&P.weapons[id].cap)||0;
  return Math.min(w.capMax, w.cap + w.capStep*r);
}
/* what a swing is actually worth: weapon + Might, clipped to the limit */
function wpnDamage(P, id){
  return Math.min(wpnRaw(P,id) + P.might, wpnCap(P,id));
}
function wpnCapped(P, id){ return wpnRaw(P,id) + P.might > wpnCap(P,id); }
function wpnCapCost(P, id){
  var w = D.WEAPONS[id], r = (P.weapons[id]&&P.weapons[id].cap)||0;
  if(!w.capUp || wpnCap(P,id) >= w.capMax) return null;
  return w.capUp + Math.round(w.capUp*0.45*r);
}
function reforgeWeapon(P, id){
  var c = wpnCapCost(P,id);
  if(c===null || !P.weapons[id] || !P.weapons[id].owned || P.xp < c) return false;
  P.xp -= c; P.xpSpent += c;
  P.weapons[id].cap = ((P.weapons[id].cap)||0) + 1;
  return true;
}

   Reduction only. Never attack. Total protection is hard-capped, and
   RULES.MIN_HIT_FRACTION guarantees every blow still lands for something. */
var ARMOUR_CAP = 22;
var MIN_HIT_FRACTION = 0.45;
function armourProt(P){
  if(!P.armour || !P.armours[P.armour] || !P.armours[P.armour].owned) return 0;
  var a = D.ARMOURS[P.armour], lv = P.armours[P.armour].lvl||0;
  return Math.min(ARMOUR_CAP, a.prot + a.gain*lv);
}
function armourUpCost(P, id){
  var a = D.ARMOURS[id], lv = (P.armours[id]&&P.armours[id].lvl)||0;
  if(!a.up) return null;
  if(a.prot + a.gain*(lv+1) > ARMOUR_CAP) return null;      /* at the ceiling */
  return a.up + Math.round(a.up*0.5*lv);

function buyArmour(P, id){
  var a = D.ARMOURS[id];
  if(!a || (P.armours[id]&&P.armours[id].owned) || P.xp < a.cost) return false;

/* ---------- combat setup ---------- */

    id:e.id, name:e.name, art:e.art, boss:!!e.boss, tier:e.tier,
    hp:e.hp, maxHp:e.hp, atk:e.atk, def:e.def, xp:e.xp,
    special:e.special||null, special2:e.special2||null, phases:!!e.phases,
    eGuard:0, eGuardT:0, burn:0, burnT:0, stunned:false, enraged:false,
    defending:false, cursed:0,

    cd:{},                       /* weapon cooldowns for THIS battle */
    turn:1, over:false, won:false, practice:!!opts.practice,

/* ============================================================

}

    var w = list.splice(i,1)[0];

/* ---------- player attack ---------- */
function playerAttack(P, C, id){
  var w = D.WEAPONS[id], out = { lines:[], dmg:0, crit:false, kind:'hit' };
  if(C.cd[id] > 0){ out.lines.push(['bad', w.name+' is still on cooldown.']); out.invalid=true; return out; }

  var raw = wpnDamage(P,id) + C.buff.might + ri(0,w.vary);   /* Might is already inside the cap */
  var pierce = (w.trait==='pierce' || w.trait==='divine');

  if(w.trait==='crit' && Math.random()<0.25){ raw *= 2; out.crit = true; }

  var def = pierce ? 0 : (C.def + C.eGuard);
  var dmg = Math.max(1, Math.round(raw) - def);
  C.hp = Math.max(0, C.hp - dmg);
  out.dmg = dmg;

  out.lines.push(['hi','You strike with the '+w.name+' for '+dmg+' damage'+
    (out.crit?' — a critical hit!':(pierce&&C.def>0?' (defence ignored).':'.'))]);

  if(w.trait==='burn'){ C.burn = 10; C.burnT = 3; out.lines.push(['','The '+w.name+' sets '+C.name+' alight.']); }
  if(w.trait==='stun' && Math.random()<0.35 && C.hp>0){ C.stunned = true; out.lines.push(['ok','A crushing blow — '+C.name+' is stunned!']); }
  if(w.trait==='leech'){ var h=Math.round(dmg*0.35); P.hp=Math.min(P.maxHp,P.hp+h); out.lines.push(['ok','Shadow Fang drinks deep. You recover '+h+' HP.']); }
  if(w.trait==='divine'){ P.hp=Math.min(P.maxHp,P.hp+10); out.lines.push(['ok','The Sword of the Gods mends you for 10 HP.']); }

  C.cd[id] = w.cd;
  return out;
}

/* ---------- potions ---------- */
function usePotion(P, C, id){
  var p = D.POTIONS[id], out = { lines:[] };
  if(!P.potions[id]){ out.invalid=true; return out; }
  if(C && C.cursed>0){ out.lines.push(['bad','A choking shadow stops you drinking this turn.']); out.invalid=true; return out; }
  P.potions[id]--; if(P.potions[id]<=0) delete P.potions[id];

  if(id==='heal'||id==='greater'){
    var amt = Math.round(P.maxHp * (id==='heal'?0.40:0.80));
    var before = P.hp; P.hp = Math.min(P.maxHp, P.hp+amt);
    out.lines.push(['ok','You drink the '+p.name+' and recover '+(P.hp-before)+' HP.']);
  } else if(!C){
    out.lines.push(['','Best saved for a fight.']); out.invalid=true; P.potions[id]=(P.potions[id]||0)+1; return out;
  } else if(id==='rage'){  C.buff.might=9; C.buff.mightT=3; out.lines.push(['ok','Fury burns in you. +9 attack for 3 turns.']); }
  else if(id==='ward'){    C.buff.ward=3;  out.lines.push(['ok','A shimmering ward halves incoming damage for 3 turns.']); }
  else if(id==='swift'){   for(var k in C.cd) C.cd[k]=0; out.lines.push(['ok','Quicksilver. Every weapon is ready again.']); }
  else if(id==='focus'){   C.buff.guard=6; C.buff.guardT=4; out.lines.push(['ok','Your skin hardens. +6 defence for 4 turns.']); }

/* ---------- enemy turn ---------- */

    out.lines.push(['','Flames eat at '+C.name+' for '+C.burn+' damage.']);
    C.burnT--;
    if(C.hp<=0){ return out; }
  }
  if(C.eGuardT>0){ C.eGuardT--; if(C.eGuardT===0){ C.eGuard=0; out.lines.push(['',C.name+"'s guard drops."]); } }

  /* phase shift for the big two */

    C.enraged = true; C.atk = Math.round(C.atk*1.18);
    out.lines.push(['bad',C.name+' roars and fights harder!']);
  }

  if(C.stunned){ C.stunned=false; out.lines.push(['ok',C.name+' is stunned and loses the turn.']); return out; }

  /* pick action */
  var act = null;
  if(C.special  && Math.random() < C.special.chance)  act = C.special;
  if(!act && C.special2 && Math.random() < C.special2.chance) act = C.special2;

  var mult = 1, hits = 1, name = null;
  if(act){
    name = act.name;
    if(act.kind==='heavy')    mult = 1.7;
    if(act.kind==='hellfire') mult = 2.1;
    if(act.kind==='multi'){ hits = 2; mult = 0.65; }
    if(act.kind==='drain')    mult = 1.0;
    if(act.kind==='curse')    mult = 0.8;
    if(act.kind==='guard'){
      C.eGuard = C.boss?5:3; C.eGuardT = 2;
      out.lines.push(['bad',C.name+' uses '+name+'. Its defence rises.']);
      return out;
    }
    if(act.kind==='regen'){
      var h = Math.round(C.maxHp*0.07); C.hp = Math.min(C.maxHp, C.hp+h);
      out.lines.push(['bad',C.name+' uses '+name+' and recovers '+h+' HP.']);
      return out;
    }
    if(act.kind==='siphon'){
      var any=false;
      for(var k in C.cd){ if(k!=='wooden_sword'){ C.cd[k] = Math.max(C.cd[k],0)+1; any=true; } }

    var hh = Math.round(total*0.6); C.hp = Math.min(C.maxHp, C.hp+hh);
    out.lines.push(['bad',C.name+' uses '+name+' for '+total+' damage and drains '+hh+' HP.']);
  } else if(act && act.kind==='curse'){
    C.cursed = 2;
    out.lines.push(['bad',C.name+' uses '+name+' for '+total+' damage. You cannot drink next turn.']);
  } else if(act){
    out.lines.push(['bad',C.name+' uses '+name+' for '+total+' damage'+(hits>1?' across '+hits+' hits.':'.')]);

/* ---------- exploration outcome ----------

/* ---------------- tiny helpers ---------------- */
function seeded(n){ var s=(n>>>0)||1; return function(){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function hash(str){ var h=2166136261,i; for(i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function grad(c,x0,y0,x1,y1,stops){ var g=c.createLinearGradient(x0,y0,x1,y1);
  for(var i=0;i<stops.length;i++) g.addColorStop(stops[i][0],stops[i][1]); return g; }
function rgrad(c,x,y,r0,r1,stops){ var g=c.createRadialGradient(x,y,r0,x,y,r1);
  for(var i=0;i<stops.length;i++) g.addColorStop(stops[i][0],stops[i][1]); return g; }
function poly(c,pts){ c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]); c.closePath(); }
function ell(c,x,y,rx,ry,fill){ c.beginPath(); c.ellipse(x,y,rx,ry,0,0,6.2832); c.fillStyle=fill; c.fill(); }
function line(c,x0,y0,x1,y1,col,w,cap){ c.strokeStyle=col; c.lineWidth=w; c.lineCap=cap||'round';
  c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1,y1); c.stroke(); }

/* ============================================================
   BACKGROUNDS   paint(ctx, W, H)   — never contain characters
   ============================================================ */
function starfield(c,W,H,horizon,n,col,seed){
  var r=seeded(seed); c.fillStyle=col;
  for(var i=0;i<n;i++){ var x=r()*W, y=r()*horizon, s=r()*1.6+.4;
    c.globalAlpha=.25+r()*.65; c.fillRect(x,y,s,s); }
  c.globalAlpha=1;
}
function hills(c,W,H,base,amp,col,seed){
  var r=seeded(seed); c.fillStyle=col; c.beginPath(); c.moveTo(0,H);
  c.lineTo(0,base);
  for(var x=0;x<=W;x+=W/14){ c.lineTo(x, base - Math.sin(x/W*7+r()*2)*amp - r()*amp*.5); }
  c.lineTo(W,H); c.closePath(); c.fill();
}
function tree(c,x,y,h,trunk,leaf,seed){
  var r=seeded(seed);
  c.fillStyle=trunk; c.fillRect(x-h*.045,y-h*.42,h*.09,h*.42);
  for(var i=0;i<4;i++){
    var yy=y-h*.34-i*h*.17, w=h*(.34-i*.055);
    poly(c,[[x-w,yy],[x+w,yy],[x,yy-h*.30]]); c.fillStyle=leaf; c.fill();
  }
  c.globalAlpha=.18; c.fillStyle='#000';
  poly(c,[[x-h*.3,y-h*.34],[x,y-h*.34],[x,y-h*.9]]); c.fill(); c.globalAlpha=1;
  return r;
}
function house(c,x,y,w,h,wall,roof,lit){
  c.fillStyle=wall; c.fillRect(x-w/2,y-h,w,h);
  c.fillStyle='rgba(0,0,0,.16)'; c.fillRect(x,y-h,w/2,h);
  poly(c,[[x-w*.62,y-h],[x+w*.62,y-h],[x,y-h*1.62]]); c.fillStyle=roof; c.fill();
  c.strokeStyle='rgba(0,0,0,.3)'; c.lineWidth=1.5; c.stroke();
  if(lit){ c.fillStyle='#ffcf70'; c.fillRect(x-w*.30,y-h*.72,w*.24,h*.26);
    c.fillStyle='rgba(255,207,112,.14)'; c.beginPath();
    c.ellipse(x-w*.18,y-h*.6,w*.7,h*.7,0,0,6.2832); c.fill(); }
  c.fillStyle='#4a3526'; c.fillRect(x+w*.12,y-h*.52,w*.2,h*.52);
}
function crack(c,x,y,len,ang,col,w,depth,rnd){
  if(depth<=0) return;
  var x2=x+Math.cos(ang)*len, y2=y+Math.sin(ang)*len;
  line(c,x,y,x2,y2,col,w);
  crack(c,x2,y2,len*.65,ang+(rnd()-.5)*1.1,col,w*.7,depth-1,rnd);
  if(rnd()<.55) crack(c,x2,y2,len*.55,ang+(rnd()-.5)*1.4,col,w*.6,depth-1,rnd);
}

var SCENES = {

  /* shelves + bottles */
  c.fillStyle='#4a3423'; c.fillRect(W*.06,H*.24,W*.38,8); c.fillRect(W*.06,H*.40,W*.38,8);
  var cols=['#7fbf9a','#c98f4a','#8f6fbf','#bf6a6a','#d8c47a'];

    c.fillStyle='rgba(255,255,255,.18)'; c.fillRect(bx+1,row-bh+3,2,bh-6); }
  /* barrels behind the counter */
  for(i=0;i<3;i++){ var x=W*(.60+i*.13), y=H*.62;
    c.fillStyle='#6b4728'; rr(c,x,y-H*.20,W*.085,H*.20,10); c.fill();

    c.fillStyle='#4a3018';
    c.beginPath(); c.ellipse(x-s*.68,y-s*.13,s*.16,s*.06,0,0,6.2832); c.fill();
    c.fillRect(x-s*.72,y-s*.13,s*.08,s*.13);

  c.fillStyle=rgrad(c,W*.5,H*.80,20,W*.55,[[0,'rgba(255,190,110,.14)'],[1,'rgba(255,190,110,0)']]);

/* ---------- road ---------- */
road:function(c,W,H){
  c.fillStyle=grad(c,0,0,0,H*.7,[[0,'#5b7fa8'],[.6,'#9db4c6'],[1,'#e0cdaa']]);
  c.fillRect(0,0,W,H);
  hills(c,W,H,H*.58,34,'#6d7f8c',21);
  hills(c,W,H,H*.66,20,'#5f7a5d',12);
  c.fillStyle='#7d8f5c'; c.fillRect(0,H*.70,W,H*.30);
  poly(c,[[W*.44,H*.70],[W*.56,H*.70],[W*.95,H],[W*.02,H]]);
  c.fillStyle='#a08c66'; c.fill();
  c.globalAlpha=.35; c.fillStyle='#8b7752';
  poly(c,[[W*.47,H*.70],[W*.49,H*.70],[W*.62,H],[W*.50,H]]); c.fill();
  poly(c,[[W*.52,H*.70],[W*.54,H*.70],[W*.80,H],[W*.66,H]]); c.fill(); c.globalAlpha=1;
  /* fence posts, receding */
  var r=seeded(4);
  for(var i=0;i<7;i++){ var p=i/7, ph=18+p*p*90, y=H*(.70+p*.30);
    var x=W*.44 - p*W*.40;
    c.fillStyle='#5b4630'; c.fillRect(x,y-ph,7+p*7,ph);
    c.fillStyle='#6b5439'; c.fillRect(x-4,y-ph*.72,20+p*20,5+p*4);
    var x2=W*.56 + p*W*.40;
    c.fillStyle='#5b4630'; c.fillRect(x2,y-ph,7+p*7,ph);
  }
  tree(c,W*.10,H*.74,120,'#4a3524','#4d7a45',r()*99|0);
  tree(c,W*.88,H*.76,140,'#4a3524','#45703e',33);
},

/* ---------- forest ---------- */
forest:function(c,W,H){
  c.fillStyle=grad(c,0,0,0,H,[[0,'#22331f'],[.5,'#2d4429'],[1,'#1b2a1a']]);
  c.fillRect(0,0,W,H);
  var r=seeded(77), i;
  /* far band */
  for(i=0;i<16;i++){ var x=r()*W; tree(c,x,H*.64,80+r()*36,'#1f2a1b','#25401f',r()*999|0); }
  c.fillStyle='rgba(190,210,190,.16)'; c.fillRect(0,H*.50,W,H*.18);
  /* light shafts, soft */
  c.globalAlpha=.07;
  for(var s=0;s<4;s++){ poly(c,[[W*(.15+s*.22),0],[W*(.20+s*.22),0],[W*(.36+s*.22),H],[W*(.08+s*.22),H]]);
    c.fillStyle='#eef6c8'; c.fill(); }
  c.globalAlpha=1;
  /* mid band */
  for(i=0;i<9;i++){ tree(c,r()*W,H*.78,140+r()*70,'#33261a','#2f5a33',r()*999|0); }
  /* ground */
  c.fillStyle='#243320'; c.fillRect(0,H*.80,W,H*.20);
  c.fillStyle='#2c3d26'; c.beginPath(); c.moveTo(0,H*.84);
  for(i=0;i<=12;i++) c.lineTo(W*i/12, H*(.84+Math.sin(i*1.7)*.012));
  c.lineTo(W,H); c.lineTo(0,H); c.fill();
  /* undergrowth + ferns */
  for(i=0;i<90;i++){ var gx=r()*W, gy=H*(.80+r()*.20), gh=7+r()*18;
    line(c,gx,gy,gx+(r()-.5)*10,gy-gh,'rgba(74,124,62,.9)',2); }
  for(i=0;i<10;i++){ var mx=r()*W, my=H*(.86+r()*.12), ms=10+r()*22;
    ell(c,mx,my,ms,ms*.38,'rgba(52,82,44,.85)'); }
  /* near trunks framing the shot */
  c.fillStyle='#1d150e'; c.fillRect(-10,0,W*.075,H); c.fillRect(W*.94,0,W*.08,H);
  c.fillStyle='rgba(255,255,255,.045)'; c.fillRect(W*.045,0,9,H); c.fillRect(W*.945,0,7,H);
},

  c.fillRect(0,0,W,H);

  c.fillStyle='#6a7080'; c.beginPath(); c.moveTo(0,H*.58);
  for(var x0=0;x0<=W;x0+=W/6){ c.lineTo(x0,H*(.58-(.08+r()*.12))); c.lineTo(x0+W/12,H*.58-r()*14); }

    line(c,gx,gy,gx+(r()-.5)*10,gy-(5+r()*13),'rgba(160,146,104,.7)',1.5); }

/* ---------- castle exterior ---------- */
castle_out:function(c,W,H){
  c.fillStyle=grad(c,0,0,0,H*.8,[[0,'#1d2740'],[.5,'#4a4a6b'],[.85,'#9c6a6a'],[1,'#c98a6a']]);

  hills(c,W,H,H*.70,22,'#2f3547',3);
  var bx=W*.22, bw=W*.56, by=H*.76;
  /* towers */
  function tower(x,w,top){
    c.fillStyle='#48506b'; c.fillRect(x,top,w,by-top);
    c.fillStyle='rgba(0,0,0,.22)'; c.fillRect(x+w*.6,top,w*.4,by-top);

    poly(c,[[x-w*.14,top-10],[x+w*1.14,top-10],[x+w/2,top-w*.85]]);
    c.fillStyle='#5a3a4a'; c.fill();
    c.fillStyle='#d8b45c'; c.fillRect(x+w/2,top-w*.85,1.5,-18);
    poly(c,[[x+w/2,top-w*.85-18],[x+w/2+18,top-w*.85-12],[x+w/2,top-w*.85-6]]);
    c.fillStyle='#a8434a'; c.fill();
    c.fillStyle='#ffcf70'; c.fillRect(x+w*.36,top+w*.5,w*.2,w*.34);

  /* main keep */

  c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(bx+bw*.55,H*.44,bw*.45,by-H*.44);
  for(var k=0;k<12;k++){ c.fillStyle='#333a4e'; c.fillRect(bx+k*(bw/12),H*.44-12,bw/22,12); }

  /* gate */
  c.fillStyle='#2b1f18'; c.beginPath();
  c.moveTo(W*.44,by); c.lineTo(W*.44,H*.62); c.arc(W*.50,H*.62,W*.06,Math.PI,0); c.lineTo(W*.56,by); c.fill();
  c.strokeStyle='#6b5439'; c.lineWidth=3;
  for(i=1;i<5;i++){ line(c,W*(.44+i*.024),H*.60,W*(.44+i*.024),by,'#4d3a26',3); }

/* ---------- castle interior ---------- */
castle_in:function(c,W,H){
  c.fillStyle='#232a3c'; c.fillRect(0,0,W,H);
  /* floor perspective */
  c.fillStyle='#39405a'; c.fillRect(0,H*.62,W,H*.38);
  var i,j;
  for(i=0;i<10;i++){ var p=i/10;
    line(c,0,H*(.62+p*p*.38),W,H*(.62+p*p*.38),'rgba(0,0,0,.22)',1); }
  for(i=-6;i<=6;i++){ line(c,W*.5+i*W*.05,H*.62,W*.5+i*W*.30,H,'rgba(0,0,0,.20)',1); }
  /* back wall */
  c.fillStyle='#2c3348'; c.fillRect(W*.30,H*.18,W*.40,H*.44);
  /* windows */
  for(i=0;i<3;i++){ var wx=W*(.34+i*.12);
    c.fillStyle='#5f7fbf'; c.beginPath();
    c.moveTo(wx,H*.50); c.lineTo(wx,H*.30); c.arc(wx+W*.03,H*.30,W*.03,Math.PI,0); c.lineTo(wx+W*.06,H*.50); c.fill();
    c.fillStyle='rgba(140,180,255,.10)';
    poly(c,[[wx,H*.50],[wx+W*.06,H*.50],[wx+W*.16,H],[wx-W*.10,H]]); c.fill(); }
  /* columns */
  for(i=0;i<2;i++) for(j=0;j<3;j++){
    var p2=j/3, cw=W*(.05+p2*.035), cx=(i? W*(.72+p2*.16) : W*(.28-p2*.16))-cw/2;
    var ct=H*(.16-p2*.10), cb=H*(.66+p2*.22);

    c.fillStyle='rgba(255,255,255,.06)'; c.fillRect(cx,ct,cw*.3,cb-ct);
    c.fillStyle='#525b7a'; c.fillRect(cx-cw*.16,ct,cw*1.32,H*.03);
    c.fillStyle='#525b7a'; c.fillRect(cx-cw*.16,cb-H*.03,cw*1.32,H*.03);
  }
  /* banners */
  for(i=0;i<2;i++){ var bx2=i?W*.62:W*.32;

/* ---------- underworld ---------- */
under:function(c,W,H){
  c.fillStyle=grad(c,0,0,0,H,[[0,'#1a0a0c'],[.42,'#4a1414'],[.62,'#8a2c14'],[1,'#2a0e0c']]);

  c.beginPath(); c.arc(W*.5,H*.62,W*.5,0,6.2832); c.fill();

uwcastle_out:function(c,W,H){

/* ---------- underworld throne ---------- */
uwcastle_in:function(c,W,H){
  c.fillStyle='#160809'; c.fillRect(0,0,W,H);

  for(i=0;i<8;i++){ var p=i/8; line(c,0,H*(.62+p*p*.38),W,H*(.62+p*p*.38),'rgba(255,90,30,.08)',1); }

  for(var s=0;s<2;s++) for(var j=0;j<3;j++){

  for(i=0;i<9;i++){ poly(c,[[tx-W*.10+i*W*.0225,ty-H*.34],[tx-W*.086+i*W*.0225,ty-H*.34],
    [tx-W*.093+i*W*.0225,ty-H*.44]]); c.fillStyle='#0a0405'; c.fill(); }
  c.fillStyle='rgba(255,140,50,.45)'; c.fillRect(tx-W*.09,ty-H*.32,W*.18,H*.28);

  c.fillRect(tx+W*.085,ty-H*.20,W*.03,H*.19);
  /* braziers */
  [-1,1].forEach(function(sg){

    c.fillStyle='#181011'; poly(c,[[bx-W*.028,by],[bx+W*.028,by],[bx+W*.018,by-H*.07],[bx-W*.018,by-H*.07]]); c.fill();
    c.fillStyle='#ff9a3a'; c.beginPath(); c.ellipse(bx,by-H*.07,W*.022,H*.018,0,0,6.2832); c.fill();
    c.fillStyle=rgrad(c,bx,by-H*.08,4,W*.12,[[0,'rgba(255,170,70,.5)'],[1,'rgba(255,170,70,0)']]);

clouds:function(c,W,H){

/* background cache */
var _bg = {};
function bg(key){
  if(_bg[key]) return _bg[key];
  var cv = document.createElement('canvas'); cv.width=960; cv.height=540;
  var c = cv.getContext('2d');
  (SCENES[key]||SCENES.road)(c,960,540);
  /* vignette — ties every scene to the same look */
  c.fillStyle = rgrad(c,480,270,240,700,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.55)']]);
  c.fillRect(0,0,960,540);
  _bg[key]=cv; return cv;
}

/* ---------------- animated overlays ---------------- */
var PARTS = {
  forest:{n:16,col:'rgba(200,255,150,',spd:.25,size:2.4},
  under:{n:34,col:'rgba(255,150,60,',spd:.7,size:2.6},
  uwcastle_out:{n:30,col:'rgba(255,170,70,',spd:.8,size:2.4},
  uwcastle_in:{n:26,col:'rgba(255,160,60,',spd:.6,size:2.4},
  portal:{n:24,col:'rgba(190,150,255,',spd:.5,size:2.2},
  clouds:{n:18,col:'rgba(255,250,210,',spd:.2,size:3.0},
  village:{n:10,col:'rgba(255,220,140,',spd:.15,size:2.0},
  bar:{n:8,col:'rgba(255,210,140,',spd:.12,size:2.0}
};
function overlay(c,key,W,H,t){
  var p = PARTS[key]; if(!p) return;
  var r = seeded(hash(key));
  for(var i=0;i<p.n;i++){
    var bx=r()*W, ph=r()*10, sp=(.4+r())*p.spd;
    var y = H - ((t*40*sp + r()*H*2) % (H*1.15));
    var x = bx + Math.sin(t*sp + ph)*22;
    var a = .25 + .55*Math.abs(Math.sin(t*sp*1.7+ph));
    c.fillStyle = p.col + a.toFixed(2) + ')';
    c.beginPath(); c.arc(x,y,p.size*(.6+r()*.8),0,6.2832); c.fill();
  }
}

/* ============================================================
   FIGURES
   ============================================================ */
function shadow(c,x,y,w){ c.fillStyle='rgba(0,0,0,.34)'; c.beginPath();
  c.ellipse(x,y,w,w*.26,0,0,6.2832); c.fill(); }

/* --- weapons held in hand --- */
function weaponArt(c,id,x,y,s,flip){
  c.save(); c.translate(x,y); c.scale(flip?-1:1,1); c.rotate(-0.45);
  switch(id){
    case 'pocketknife':
      c.fillStyle='#2c2c30'; rr(c,-3,0,6,16*s,2); c.fill();
      c.fillStyle='#cfd6de'; poly(c,[[-2,0],[2,0],[3,-20*s],[0,-26*s],[-3,-20*s]]); c.fill(); break;
    case 'iron_blade':
      c.fillStyle='#4a3524'; c.fillRect(-3,0,6,16*s);
      c.fillStyle='#8f8f98'; c.fillRect(-10,-2,20,5);
      c.fillStyle='#dfe6ee'; poly(c,[[-4,-2],[4,-2],[5,-48*s],[0,-58*s],[-5,-48*s]]); c.fill();
      c.fillStyle='rgba(255,255,255,.6)'; c.fillRect(-1,-46*s,2,44*s); break;
    case 'hunters_bow':
      c.strokeStyle='#7a5a35'; c.lineWidth=4; c.beginPath();
      c.arc(0,-22*s,26*s,-1.25,1.25); c.stroke();
      line(c,25*s*Math.cos(-1.25),-22*s+26*s*Math.sin(-1.25),25*s*Math.cos(1.25),-22*s+26*s*Math.sin(1.25),'#e8dcc0',1.5); break;
    case 'ember_brand':
      c.fillStyle='#3a2418'; c.fillRect(-3,0,6,16*s);
      c.fillStyle='#a8552a'; c.fillRect(-9,-2,18,5);
      c.fillStyle='#ff8a3a'; poly(c,[[-4,-2],[4,-2],[5,-46*s],[0,-56*s],[-5,-46*s]]); c.fill();
      c.fillStyle='rgba(255,220,120,.85)'; poly(c,[[-2,-6],[2,-6],[0,-50*s]]); c.fill(); break;
    case 'war_hammer':
      c.fillStyle='#4a3524'; c.fillRect(-4,0,8,20*s);
      c.fillStyle='#6b6b74'; rr(c,-16,-56*s,32,22*s,4); c.fill();
      c.fillStyle='#8a8a94'; rr(c,-16,-56*s,32,7,3); c.fill();
      c.fillStyle='#4a3524'; c.fillRect(-3,-56*s,6,56*s); break;
    case 'shadow_fang':
      c.fillStyle='#1a1420'; c.fillRect(-3,0,6,16*s);
      c.fillStyle='#4a2f6b'; c.fillRect(-9,-2,18,5);
      c.fillStyle='#2d2140'; poly(c,[[-5,-2],[4,-2],[10,-40*s],[0,-56*s],[-5,-36*s]]); c.fill();
      c.strokeStyle='rgba(180,120,255,.8)'; c.lineWidth=2; c.stroke(); break;
    case 'gods_sword':
      c.fillStyle='#8a6a2a'; c.fillRect(-4,0,8,18*s);
      c.fillStyle='#ffe9a8'; c.fillRect(-16,-3,32,7);
      c.fillStyle='#fffbe8'; poly(c,[[-6,-3],[6,-3],[7,-56*s],[0,-70*s],[-7,-56*s]]); c.fill();
      c.fillStyle=rgrad(c,0,-34*s,2,44,[[0,'rgba(255,244,190,.55)'],[1,'rgba(255,244,190,0)']]);
      c.beginPath(); c.arc(0,-34*s,44,0,6.2832); c.fill(); break;
    default: /* wooden sword */
      c.fillStyle='#5b4630'; c.fillRect(-3,0,6,14*s);
      c.fillStyle='#7a5a35'; c.fillRect(-8,-2,16,4);
      c.fillStyle='#a07f4e'; poly(c,[[-4,-2],[4,-2],[4,-38*s],[0,-46*s],[-4,-38*s]]); c.fill();
  }
  c.restore();
}

/* --- the hero: deliberately gender-neutral --- */
function hero(c,x,y,s,t,opts){
  opts = opts||{};
  var b = Math.sin(t*1.8)*2*s;               /* idle bob */
  var lunge = opts.lunge||0;                  /* 0..1 attack push */
  x += lunge*26*s;
  shadow(c,x,y,30*s);
  var skin='#c9a077', tunic='#3f7f74', cloak='#6b4b32', boot='#3a2b1e', hood='#5a4028';
  /* cloak behind */
  c.fillStyle=cloak;
  poly(c,[[x-16*s,y-60*s+b],[x+16*s,y-60*s+b],[x+24*s,y-2],[x-24*s,y-2]]); c.fill();
  c.fillStyle='rgba(0,0,0,.18)';
  poly(c,[[x+2*s,y-60*s+b],[x+16*s,y-60*s+b],[x+24*s,y-2],[x+6*s,y-2]]); c.fill();
  /* legs */
  c.fillStyle=boot; rr(c,x-13*s,y-32*s,10*s,32*s,4*s); c.fill();
  rr(c,x+3*s,y-32*s,10*s,32*s,4*s); c.fill();
  /* torso (straight, no gendered silhouette) */
  c.fillStyle=tunic; rr(c,x-15*s,y-64*s+b,30*s,36*s,6*s); c.fill();
  c.fillStyle='rgba(0,0,0,.16)'; rr(c,x+2*s,y-64*s+b,13*s,36*s,6*s); c.fill();
  /* belt */
  c.fillStyle='#4a3524'; c.fillRect(x-15*s,y-38*s+b,30*s,7*s);
  c.fillStyle='#d8b45c'; c.fillRect(x-4*s,y-38*s+b,8*s,7*s);
  /* arms */
  c.strokeStyle=tunic; c.lineWidth=8*s; c.lineCap='round';
  c.beginPath(); c.moveTo(x-13*s,y-58*s+b); c.lineTo(x-22*s,y-38*s+b); c.stroke();
  c.beginPath(); c.moveTo(x+13*s,y-58*s+b); c.lineTo(x+24*s,y-44*s+b-lunge*10*s); c.stroke();
  /* head + hood: hood is a solid cowl behind the face, not a floating band */
  var hy = y-77*s+b;
  c.fillStyle=hood;                                     /* cowl */
  c.beginPath(); c.arc(x,hy,14*s,Math.PI,0); c.fill();
  c.fillRect(x-14*s,hy,28*s,12*s);
  c.fillStyle='rgba(0,0,0,.22)'; c.fillRect(x+3*s,hy-6*s,11*s,18*s);
  c.fillStyle=skin;                                     /* face inside the cowl */
  ell(c,x,hy+1*s,9.5*s,10*s,skin);
  c.fillStyle='rgba(0,0,0,.16)'; ell(c,x+3.5*s,hy+1*s,6*s,10*s,'rgba(0,0,0,.13)');
  c.fillStyle=hood;                                     /* cowl brim over the brow */
  c.beginPath(); c.arc(x,hy-1*s,10.5*s,Math.PI,0); c.fill();
  c.fillStyle='#2a2018';                                /* eyes */
  c.beginPath(); c.arc(x-3.8*s,hy+1.5*s,1.6*s,0,6.2832); c.fill();
  c.beginPath(); c.arc(x+3.8*s,hy+1.5*s,1.6*s,0,6.2832); c.fill();
  c.strokeStyle='rgba(0,0,0,.35)'; c.lineWidth=1.3*s;   /* mouth */
  c.beginPath(); c.arc(x,hy+4.5*s,3*s,0.3,Math.PI-0.3); c.stroke();
  c.fillStyle=hood;                                     /* shoulders of the cowl */
  poly(c,[[x-15*s,hy+6*s],[x+15*s,hy+6*s],[x+17*s,hy+14*s],[x-17*s,hy+14*s]]); c.fill();
  /* weapon */

/* ============================================================

function scene(c,W,H,o,t){
  c.clearRect(0,0,W,H);
  c.drawImage(bg(o.art), 0,0, W,H);
  overlay(c,o.art,W,H,t);
  var floor = H*0.87, s = H/540;
  if(o.foe){
    var fn = FOES[o.foe] || FOES.humanoid;
    var fs = s * 1.45 * (o.foeScale||1) * (o.boss?1.12:1);
    c.save(); if(o.foeHurt){ c.globalAlpha=.45; }
    if(o.foeShake) c.translate((Math.random()-.5)*7,(Math.random()-.5)*7);
    fn(c, W*0.72, floor, fs, t); c.restore();
  }
  if(o.hero !== false){
    c.save(); if(o.heroHurt) c.globalAlpha=.45;
    if(o.heroShake) c.translate((Math.random()-.5)*7,(Math.random()-.5)*7);
    hero(c, W*0.25, floor, s*1.5*(o.heroScale||1), t,
      { weapon:o.weapon, defend:o.defend, lunge:o.lunge });
    c.restore();
  }
  if(o.npc){                                   /* opening-scene extras */
    c.save(); FOES.rival(c, W*0.55, floor, s*1.45, t); c.restore();
    /* mysterious stranger */
    s = s*1.45;
    var b=Math.sin(t*1.2)*2*s, x=W*0.83, yy=floor;
    shadow(c,x,yy,28*s);
    c.fillStyle='#2b2438'; poly(c,[[x-22*s,yy],[x-14*s,yy-70*s+b],[x+14*s,yy-70*s+b],[x+22*s,yy]]); c.fill();
    c.fillStyle='#241d30'; c.beginPath(); c.arc(x,yy-74*s+b,15*s,Math.PI,0); c.fill();

    c.fillStyle='#e8b04b'; c.beginPath(); c.arc(x-5*s,yy-70*s+b,1.8*s,0,6.2832); c.fill();
    c.beginPath(); c.arc(x+5*s,yy-70*s+b,1.8*s,0,6.2832); c.fill();
    /* the map in hand */
    c.save(); c.translate(x-20*s,yy-44*s+b); c.rotate(-.3);
    c.fillStyle='#e8dcc0'; c.fillRect(-11*s,-8*s,22*s,16*s);
    c.strokeStyle='#a8894a'; c.lineWidth=1; c.strokeRect(-11*s,-8*s,22*s,16*s); c.restore();

}

function thumb(c,key,W,H){

/* ---------------- map ---------------- */
function shortName(n){
  n = n.replace(/^The /,'');
  var w = n.split(' ');
  while(n.length > 13 && w.length > 1){
    /* keep a distinctive leading word, otherwise drop it */
    if(w[0].length >= 6){ w = [w[0]]; }
    else { w.shift(); while(w.length>1 && /^[a-z]/.test(w[0])) w.shift(); }
    n = w.join(' ');
  }
  return n;
}
function map(c,W,H,P,D){
  c.clearRect(0,0,W,H);
  c.fillStyle='#0d1017'; c.fillRect(0,0,W,H);
  /* parchment */
  c.fillStyle='#e8dcc0'; rr(c,6,6,W-12,H-12,8); c.fill();
  var rr2=seeded(3);
  c.globalAlpha=.07; for(var i=0;i<160;i++){ c.fillStyle='#7a5a35';
    c.fillRect(rr2()*W,rr2()*H,rr2()*30,rr2()*3); } c.globalAlpha=1;

  var realm = D.AREAS[P.area].realm;
  var ids = Object.keys(D.AREAS).filter(function(id){ return D.AREAS[id].realm===realm; });
  if(!ids.length) return;
  var maxX=0,maxY=0;
  ids.forEach(function(id){ maxX=Math.max(maxX,D.AREAS[id].x); maxY=Math.max(maxY,D.AREAS[id].y); });
  var padX=52, padY=44;
  var sx=(W-padX*2)/Math.max(1,maxX), sy=(H-padY*2)/Math.max(1,maxY+.2);
  function pos(a){ return [padX+a.x*sx, padY+a.y*sy]; }

  function known(id){
    if(P.discovered[id]) return 2;
    /* adjacent to a discovered area => rumoured */
    var k=false;
    ids.forEach(function(o){ if(P.discovered[o] && D.AREAS[o].connect.indexOf(id)>=0) k=true; });
    return k?1:0;
  }
  /* links */
  ids.forEach(function(id){
    var a=D.AREAS[id]; if(!P.discovered[id]) return;
    a.connect.forEach(function(o){
      if(!D.AREAS[o] || D.AREAS[o].realm!==realm) return;
      var k=known(o); if(!k) return;
      var p1=pos(a), p2=pos(D.AREAS[o]);
      c.strokeStyle = k===2 ? 'rgba(90,66,38,.85)' : 'rgba(90,66,38,.35)';
      c.lineWidth=3; c.setLineDash(k===2?[]:[5,5]);
      c.beginPath(); c.moveTo(p1[0],p1[1]); c.lineTo(p2[0],p2[1]); c.stroke(); c.setLineDash([]);
    });
  });
  /* nodes */
  ids.forEach(function(id){
    var a=D.AREAS[id], k=known(id); if(!k) return;
    var p=pos(a), here=(id===P.area);
    var col = a.gate ? '#8a2f38' : (a.safe ? '#2f6b8a' : '#5a4a2a');
    c.fillStyle = k===2 ? col : 'rgba(120,105,80,.5)';
    c.beginPath(); c.arc(p[0],p[1], here?13:10, 0, 6.2832); c.fill();
    c.strokeStyle='#3a2b18'; c.lineWidth=2; c.stroke();
    if(here){ c.strokeStyle='#c9302c'; c.lineWidth=3;
      c.beginPath(); c.arc(p[0],p[1],18,0,6.2832); c.stroke(); }
    /* staggered short labels so neighbours never collide */
    var label = k===2 ? shortName(a.name) : '???';
    var above = (a.x % 2) === 0;
    var ly = above ? p[1]-19 : p[1]+27;
    c.font='bold 10px "Trebuchet MS",sans-serif'; c.textAlign='center';
    var tw = c.measureText(label).width;
    c.fillStyle='rgba(232,220,192,.85)';
    rr(c, p[0]-tw/2-3, ly-9, tw+6, 13, 3); c.fill();
    c.fillStyle= here ? '#8a2f2f' : '#3a2b18';
    c.fillText(label, p[0], ly+1);
    if(k===2 && P.cleared[id]){ c.fillStyle='#2f6b3a'; c.font='bold 12px sans-serif';
      c.fillText('✓', p[0]+15, p[1]+5); }
  });
  c.fillStyle='#5a4a2a'; c.font='bold 13px "Trebuchet MS",sans-serif'; c.textAlign='left';
  c.fillText(realm==='underworld'?'THE UNDERWORLD':(realm==='clouds'?'THE CLOUDS':'THE OVERWORLD'), 16, 26);
}

/* ---------------- title art ---------------- */
function title(cv){
  var c=cv.getContext('2d'), W=cv.width, H=cv.height;
  c.clearRect(0,0,W,H);
  var cx=W/2;
  c.fillStyle=rgrad(c,cx,H*.46,10,W*.5,[[0,'rgba(255,232,160,.42)'],[1,'rgba(255,232,160,0)']]);
  c.beginPath(); c.arc(cx,H*.46,W*.5,0,6.2832); c.fill();
  /* stone */
  c.fillStyle='#3a4054'; poly(c,[[cx-W*.30,H*.94],[cx-W*.22,H*.72],[cx+W*.22,H*.72],[cx+W*.30,H*.94]]); c.fill();
  c.fillStyle='#4a5268'; poly(c,[[cx-W*.22,H*.72],[cx+W*.22,H*.72],[cx+W*.17,H*.66],[cx-W*.17,H*.66]]); c.fill();
  /* sword */
  c.fillStyle='#8a6a2a'; c.fillRect(cx-W*.018,H*.30,W*.036,H*.14);
  c.fillStyle='#d8b45c'; c.beginPath(); c.arc(cx,H*.29,W*.028,0,6.2832); c.fill();
  c.fillStyle='#ffe9a8'; c.fillRect(cx-W*.11,H*.43,W*.22,W*.028);
  c.fillStyle='#fffbe8';
  poly(c,[[cx-W*.038,H*.455],[cx+W*.038,H*.455],[cx+W*.030,H*.80],[cx,H*.86],[cx-W*.030,H*.80]]); c.fill();
  c.fillStyle='rgba(255,255,255,.75)'; c.fillRect(cx-W*.006,H*.47,W*.012,H*.32);
  /* rays */
  c.globalAlpha=.22; c.fillStyle='#ffe9a8';
  for(var i=0;i<10;i++){ c.save(); c.translate(cx,H*.46); c.rotate(i*.628+0.1);
    poly(c,[[0,0],[-8,-W*.6],[8,-W*.6]]); c.fill(); c.restore(); }
  c.globalAlpha=1;
}
