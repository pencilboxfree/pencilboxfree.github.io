  if(P.area==='village' && P.flags.sword && !P.flags.returned){
    acts.push({ label:'Present the Sword', cls:'primary wide',
      sub:'The whole village has come out to look at it', on:cloudsSequence });
  }
  if(P.area==='village' && P.flags.secretKnown && !P.flags.trueEnd){
    acts.push({ label:'Ascend to the Clouds', cls:'primary wide',
      sub:'Ask the god about King Arthur', on:secretAscend });
  }
  if(a.gate==='guards'){
    if(!P.flags.g1) acts.push({ label:'Challenge Bram', cls:'danger',
      sub:'Gate guard · blocks the door', on:function(){ fightGuard1(); } });
    else if(!P.flags.g2) acts.push({ label:'Challenge Vesk', cls:'danger',
      sub:'The second, larger guard', on:function(){ fightGuard2(); } });
  }
  if(a.gate==='goblins'){
    if(!P.flags.gob1) acts.push({ label:'Challenge Grask', cls:'danger',
      sub:'The Cleaver · first goblin', on:fightGoblin1 });
    else if(!P.flags.gob2) acts.push({ label:'Challenge Vorrn', cls:'danger',
      sub:'The Unbroken · second goblin', on:fightGoblin2 });
  }
  if(a.gate==='maggle'){
    if(!P.flags.maggle) acts.push({ label:'Challenge MAGGLE', cls:'danger',
      sub:'Requires '+D.GATES.maggle+' unspent XP', on:function(){ challenge('maggle', D.GATES.maggle, onMaggleWin); } });
    else acts.push({ label:'Enter the Portal', cls:'primary',
      sub:'Down into the Underworld', on:enterPortal });
  }
  if(a.gate==='devil'){
    if(!P.flags.devil) acts.push({ label:'Challenge THE DEVIL', cls:'danger',
      sub:'Requires '+D.GATES.devil+' unspent XP', on:function(){ challenge('devil', D.GATES.devil, onDevilWin); } });
    else acts.push({ label:'The throne stands empty', disabled:true, on:function(){} });
  }
  if(P.area==='portal_land'){
    acts.push({ label:'Return through the Portal', sub:'Back to the castle above', on:exitPortal });
  }

  /* ---- the Trade Road shop ---- */
  if(a.shop && P.flags.shop){
    acts.push({ label:'Trade Road Shop', cls:'primary',
      sub:'Buy weapons · '+P.xp+' XP in hand', on:openShop });
  }
  /* ---- gear left behind where you fell ---- */
  var lost = R.lostAt(P, P.area);
  if(lost.length){
    acts.push({ label:'Search the Ground', cls:'danger',
      sub: lost.length+' weapon'+(lost.length>1?'s':'')+' lost here', on:function(){
        if(!tryRecover()) renderExplore(); } });
  }

  /* ---- explore ---- */
  if(a.slots>0 || (a.pool&&a.pool.length)){
    var left = Math.max(0,(a.slots||0) - (P.searched[P.area]||0));
    acts.push({ label:'Explore', cls:'primary',
      sub: (a.danger? '⚠ dangerous · ' : '') +
           (left>0 ? left+' place'+(left>1?'s':'')+' left to search'
                   : 'picked clean — but things still wander here'),
      on:doExplore });
  }
  /* ---- travel ---- */
  a.connect.forEach(function(id){
    var open = gateOpen(P.area, id);
    acts.push({
      label:'Travel', sub: (open? '→ ' : '⛔ ')+areaName(id),
      disabled: !open,
      on:function(){ travel(id); }
    });
  });
  setActions(acts);
}

/* searching the ground where you fell, before anything else */
function tryRecover(){
  if(!R.lostAt(P, P.area).length) return false;
  var res = R.recoverRoll(P, P.area);
  if(!res) return false;
  if(res.type==='found'){
    AU.sfx('chest');
    log('hi','You find your '+D.WEAPONS[res.id].name+' in the dirt where you fell. It is still yours.');
    if(res.left) log('','Still missing here: '+res.left+'.');
    else log('ok','Nothing else of yours is left here.');
  } else if(res.type==='gone'){
    log('bad','Your '+D.WEAPONS[res.id].name+' is gone — someone else got here first. That one is not coming back.');
    if(res.left) log('','Still missing here: '+res.left+'.');
  } else {
    log('','You search the ground where you fell. No sign of your gear yet. ('+res.left+' still missing here.)');
  }
  save(true); renderExplore();
  return true;
}

function doExplore(){
  var a = D.AREAS[P.area];
  /* the Trade Road shop is a discovery, not a menu you start with */
  if(a.shop && !P.flags.shop){
    P.flags.shop = true;
    AU.sfx('chest');
    log('hi','Behind a hedge off the road: a shuttered wagon, a whetstone, and a trader who has clearly been here for years.');
    log('story','"Trade Road Shop," she says, as if the wagon were a building. "I sell steel. You have XP. We understand each other."');
    save(true); renderExplore();
    return;
  }
  if(tryRecover()) return;
  var res = R.rollExplore(P, a);
  if(res.type==='enemy'){
    log('bad','Something was waiting where you were about to put your hand.');
    spawn(P.area, res.id, { onWin:renderExplore, onLose:defeat, from:P.area });
    return;
  }
  if(res.type==='chest'){
    AU.sfx('chest');
    log('hi','A chest, half buried. The lid gives with a crack.');
    var out = R.rollChest(P, a.realm, a.wchance);
    logLines(out.lines);
    if(out.kind==='weapon') equipIfBetter(out.id);
  } else if(res.type==='story'){
    var bits = D.STORY_BITS[a.realm] || D.STORY_BITS.overworld;
    log('story', R.pick(bits));
  } else {
    log('', R.pick(D.NOTHING));
  }
  save(true); renderExplore();
}

function equipIfBetter(id){
  if(R.wpnDamage(P,id) > R.wpnDamage(P,P.equipped)){
    P.equipped = id; log('ok','Equipped the '+D.WEAPONS[id].name+'.');
  }
}

function travel(id){
  if(!gateOpen(P.area,id)){ toast('The way is blocked.'); return; }
  var cameFrom = P.area;
  var fresh = !P.discovered[id];
  P.area = id; P.discovered[id] = true; P.stats.steps++;
  var a = D.AREAS[id];
  setLocation(); hud();
  if(fresh){ log('hi','You arrive at '+a.name+'. A new place for the map.'); if(a.note) log('story',a.note); }
  else log('','You travel to '+a.name+'.');
  /* safe ground: a bed, a fire, and no one trying to kill you */
  if(a.safe && P.hp < P.maxHp){
    P.hp = P.maxHp; hud();
    log('ok','You rest here. Health fully restored.');
  }

  var foe = R.rollEncounter(P, a);
  if(foe || R.woundedAt(P, id).length){
    log('bad','An enemy is standing directly in your path.');
    spawn(id, foe || R.woundedAt(P,id)[0].id, { onWin:renderExplore, onLose:defeat, from:cameFrom });
    return;
  }
  if(id==='village' && P.flags.sword && !P.flags.returned){
    log('hi','Every door in Aldbrook opens at once. They have seen what you are carrying.');
  }
  save(true); renderExplore();
}

/* ---------------- gates / bosses ---------------- */
function challenge(id, need, onWin){
  if(P.xp < need){
    log('bad','You need '+need+' XP to challenge this boss.');
    toast('You need '+need+' XP to challenge this boss.');
    return;
  }
  startBattle(id, { onWin:onWin, onLose:defeat });
}
function fightGuard1(){
  startBattle('guard_bram', { onWin:function(){
    P.flags.g1 = true; log('hi','Bram sits down heavily against the gate and waves you on — to Vesk.');
    save(true); renderExplore();
  }, onLose:defeat });
}
function fightGuard2(){
  startBattle('guard_vesk', { onWin:function(){
    P.flags.g2 = true; P.flags.guards = true; P.cleared.castle_gate = true;
    log('hi','Vesk goes down. The gate is yours. The hall beyond is very quiet.');
    save(true); renderExplore();
  }, onLose:defeat });
}
function fightGoblin1(){
  startBattle('goblin_grask', { onWin:function(){
    P.flags.gob1 = true; log('hi','Grask goes down across his own cleaver. Something bigger is already standing up behind him.');
    save(true); renderExplore();
  }, onLose:defeat });
}
function fightGoblin2(){
  startBattle('goblin_vorrn', { onWin:function(){
    P.flags.gob2 = true; P.flags.goblins = true; P.cleared.uw_gate = true;
    log('hi','Vorrn drops his shield, then follows it down. The black gate swings open.');
    save(true); renderExplore();
  }, onLose:defeat });
}
function onMaggleWin(){
  P.flags.maggle = true; P.cleared.castle_hall = true;
  AU.sfx('portal');
  log('hi','MAGGLE comes apart, and every stolen spark it swallowed goes up at once.');
  log('story','The light does not fade. It gathers behind the throne, turns, and opens.');
  log('hi','A portal to the Underworld stands where the wall used to be.');
  save(true); renderExplore();
}
function enterPortal(){
  AU.sfx('portal');
  P.area = 'portal_land'; P.discovered.portal_land = true;
  clearLog();
  log('hi','You step through. The air on the other side is hot enough to taste.');
  log('story','Ash, red sky, and a black castle somewhere out past the horizon.');
  save(true); renderExplore();
}
function exitPortal(){
  AU.sfx('portal');
  P.area = 'castle_hall';
  log('hi','You climb back through the portal into the throne hall.');
  save(true); renderExplore();
}
function onDevilWin(){
  P.flags.devil = true; P.flags.sword = true; P.cleared.uw_throne = true;
  P.weapons.gods_sword = { owned:true, lvl:0 };
  P.equipped = 'gods_sword';
  AU.sfx('divine');
  log('hi','THE DEVIL falls, and the burning throne goes out like a snuffed candle.');
  log('hi','You take the SWORD OF THE GODS. It is lighter than it should be.');
  log('story','Now the long walk home. The village is a very long way from here.');
  save(true); renderExplore();
}

/* ---------------- defeat ---------------- */
function defeat(){
  AU.sfx('lose');
  var fellAt = P.area, fellName = D.AREAS[fellAt].name;
  var realm = D.AREAS[fellAt].realm;
  var home = realm==='underworld' ? 'portal_land' : 'village';
  if(realm==='clouds') home = 'village';

  var loss = R.applyDeath(P, fellAt);            /* XP gone, some weapons left behind */

  P.hp = P.maxHp;
  P.area = home; P.discovered[home] = true;
  C = null; mode='explore'; busy=false;

  log('bad','You fall at '+fellName+'. You lose '+loss.xpLost+' XP — only '+loss.kept+' XP is still on you.');
  var recovery = '';
  if(loss.dropped.length){
    var names = loss.dropped.map(function(id){ return D.WEAPONS[id].name; }).join(', ');
    log('bad','Left behind at '+fellName+': '+names+'.');
    recovery =
      '<hr class="sep">'+
      '<p class="crim"><b>Some of your weapons were lost at the place where you fell.</b></p>'+
      '<p>'+names+' — still lying at <b>'+fellName+'</b>.</p>'+
      '<p class="dim small">Explore that area to search for them. You may not recover every weapon.</p>';
  }
  showScreen(
    '<h1 style="font-size:1.6em" class="crim">YOU FALL</h1>'+
    '<p>Someone drags you back to '+D.AREAS[home].name+'. Your training, your upgrades and your scars stay with you.</p>'+
    '<p><b class="warn">'+loss.xpLost+' XP lost.</b> <span class="dim">'+loss.kept+' XP remains.</span></p>'+
    recovery+
    '<p class="dim small">Explore, upgrade, and try again — bosses do not get easier, but you do.</p>'+
    '<div id="db"></div>');
  var b=document.createElement('button'); b.className='btn primary wide'; b.textContent='Get up';
  b.onclick=function(){ AU.sfx('ui'); hideScreen(); save(true); renderExplore(); };
  $('db').appendChild(b);
}

/* ============================================================
   COMBAT
   ============================================================ */
/* One place decides who you actually meet: a local you already wounded,
   or the fresh enemy the area rolled. Used by travel AND explore. */
function spawn(areaId, rolledId, opts){
  var pick = R.takeWounded(P, areaId, rolledId);
  opts = opts || {};
  opts.hp = pick.hp; opts.seen = pick.seen; opts.at = areaId;
  if(pick.resumed){
    var e = D.ENEMIES[pick.id];
    log('bad','The '+e.name+' you ran from is still here — and still bleeding ('+pick.hp+'/'+e.hp+' HP).');
  }
  startBattle(pick.id, opts);
}

function startBattle(enemyId, opts){
  opts = opts||{};
  C = R.startCombat(P, enemyId, opts);
  C.onWin = opts.onWin; C.onLose = opts.onLose;
  C.practice = !!opts.practice;
  C.at = opts.at || P.area;              /* where the fight is happening */
  C.from = opts.from || P.area;          /* the section to fall back to */
  mode='combat'; busy=false;
  P.stats.battles++;
  clearBubbles();
  view = { art: opts.bg || D.AREAS[P.area].art, hero:true, foe:C.art, boss:C.boss,
           weapon:P.equipped, defend:false, lunge:0 };
  music();
  if(C.boss) AU.sfx('boss');
  var e = D.ENEMIES[enemyId];
  log('bad', (C.boss?'⚔ BOSS — ':'⚔ ')+C.name+' — '+C.hp+
      (C.resumed? '/'+C.maxHp : '')+' HP.');
  if(e.intro){ log('story', e.intro); bubble(e.intro, '4%', '10%', true); setTimeout(clearBubbles, 3600); }
  else if(e.taunt){ bubble('"'+e.taunt+'"', '4%', '12%', true); setTimeout(clearBubbles, 2600); }
  log('','You move first.');
  hud(); renderCombat();
}

function renderCombat(){
  if(!C) return;
  hud();
  var w = D.WEAPONS[P.equipped], cd = C.cd[P.equipped]||0;
  var np = 0; for(var k in P.potions) np += P.potions[k];
  var dmg = R.wpnDamage(P,P.equipped) + C.buff.might;   /* Might already sits inside the cap */
  var acts = [
    { label:'ATTACK', cls:'primary', disabled: cd>0,
      sub: cd>0 ? (w.name+' — ready in '+cd) : (w.name+' · ~'+dmg+' dmg'+(w.cd?' · '+w.cd+' turn cd':' · no cd')),
      on: actAttack },
    { label:'DEFEND', sub:'Cut the next hit by 60%', on: actDefend },
    { label:'POTION', sub: np? np+' available' : 'none', disabled: !np, on: openItems },
    { label:'WEAPON', sub:'Switch — free action', on: openWeapons }
  ];
  if(R.canFlee(C)){
    acts.push({ label:'↩ RUN AWAY', cls:'flee wide',
      sub:'Back to '+D.AREAS[C.from].name+' · +1 HP, no XP · it keeps its wounds',
      on: actFlee });
  }
  setActions(acts);
}

function step(fn, ms){ setTimeout(fn, ms||480); }

function actAttack(){
  if(busy || !C) return;
  var id = P.equipped;
  var out = R.playerAttack(P, C, id);
  if(out.invalid){ logLines(out.lines); renderCombat(); return; }
  busy = true;
  view.lunge = 1; view.foeShake = true; view.foeHurt = true;
  AU.sfx(out.crit?'crit':'hit');
  fx('-'+out.dmg, out.crit?'#ffd24a':'#ff9a9a', 'foe');
  logLines(out.lines);
  hud();
  step(function(){ view.lunge=0; view.foeShake=false; view.foeHurt=false; afterPlayerAction(); }, 380);
}
/* ---- retreat: immediate, cheap, and it costs the enemy nothing ---- */
function actFlee(){
  if(busy || !C) return;
  if(!R.canFlee(C)){ toast('There is no walking away from this one.'); return; }
  busy = true;
  var where = C.at, back = C.from, foeName = C.name;
  var out = R.fleeCombat(P, C, where);
  AU.sfx('ui');
  C = null; mode='explore'; view.foe=null; view.boss=false;
  P.area = back; P.discovered[back] = true;
  log('ok','You escaped! You gained '+out.gained+' HP and 0 XP.');
  if(out.kept) log('','The '+foeName+' is still at '+D.AREAS[where].name+
    ' with '+out.enemyHp+'/'+out.enemyMax+' HP. It will not have healed when you come back.');
  toast(out.gained ? 'You escaped! You gained 1 HP and 0 XP.'
                   : 'You escaped! Already at full HP, and 0 XP.');
  hud(); save(true);
  busy = false;
  renderExplore();
}

function actDefend(){
  if(busy || !C) return;
  busy = true;
  C.playerDefending = true; view.defend = true;
  log('ok','You set your guard.');
  step(afterPlayerAction, 340);
}
function afterPlayerAction(){
  if(!C) return;
  if(C.hp <= 0){ winBattle(); return; }
  step(function(){
    var out = R.enemyTurn(P, C);
    logLines(out.lines);
    if(out.blocked > 0 && out.thrown){
      var prot = R.armourProt(P);
      var share = prot ? Math.min(prot, out.blocked) : 0;
      log('', 'Enemy attack '+out.thrown+
        (share? ' · armour −'+share : '')+
        (out.blocked-share? ' · guard −'+(out.blocked-share) : '')+
        ' · damage taken '+out.dmg);
    }
    if(out.dmg>0){ AU.sfx('hurt'); fx('-'+out.dmg,'#ff8080','you'); view.heroShake=true; view.heroHurt=true; }
    hud();
    step(function(){
      view.heroShake=false; view.heroHurt=false; view.defend=false;
      if(C.hp <= 0){ winBattle(); return; }
      if(P.hp <= 0){ loseBattle(); return; }
      logLines(R.endRound(P,C));
      busy = false; renderCombat();
    }, 340);
  }, 240);
}

function winBattle(){
  AU.sfx('win');
  var gained = C.xp||0;
  P.stats.wins++;
  if(gained>0){ R.awardXp(P, gained); log('hi','Victory. +'+gained+' XP  (you now hold '+P.xp+' XP).'); }
  else log('hi','Victory.');
  if(P.hp < P.maxHp){                       /* catch your breath */
    var back = Math.round(P.maxHp*0.08);
    P.hp = Math.min(P.maxHp, P.hp + back);
    log('','You catch your breath and recover '+back+' HP.');
  }
  var cb = C.onWin;
  var wasBoss = C.boss;
  C = null; busy=false; mode='explore';
  view.foe=null; view.boss=false;
  hud();
  if(wasBoss) music();
  if(cb) cb(); else renderExplore();
  save(true);
}
function loseBattle(){
  var cb = C.onLose; var practice = C.practice;
  R.rememberWounded(P, C.at, C);      /* it survived you; it stays hurt */
  C = null; busy=false; mode='explore'; view.foe=null;
  hud();
  if(practice){ if(cb) cb(); return; }
  if(cb) cb(); else defeat();
}

/* ============================================================
   MODALS
   ============================================================ */
function sheetHead(title){
  return '<h2>'+title+'<button class="pill close" onclick="GAME.closeSheet()">Close</button></h2>';
}

/* ---- items / potions ---- */
function openItems(){
  var ids = D.POTION_ORDER.filter(function(id){ return P.potions[id]; });
  var html = sheetHead('Items');
  if(!ids.length) html += '<p class="dim">No potions. Chests hold one half the time.</p>';
  ids.forEach(function(id){
    var p = D.POTIONS[id];
    html += '<div class="row"><div class="grow"><div class="t">'+p.name+' ×'+P.potions[id]+'</div>'+
      '<div class="d">'+p.desc+'</div></div>'+
      '<button class="pill" onclick="GAME.drink(\''+id+'\')">Use</button></div>';
  });
  html += '<hr class="sep"><div class="row"><div class="grow"><div class="t">Armour: '+
    (P.armour? D.ARMOURS[P.armour].name : 'none')+'</div>'+
    '<div class="d">Protection: <b class="gold">'+R.armourProt(P)+'</b>'+
    (P.armour? ' — reduces every hit you take by that much.' : ' — buy armour at the Trade Road shop.')+'</div></div></div>';
  html += '<div class="row"><div class="grow"><div class="t">Sword of the Gods</div>'+
    '<div class="d">'+(P.flags.sword?'<span class="gold">In your hands.</span>':'Not yet found.')+'</div></div></div>';
  openSheet(html);
}
function drink(id){
  if(!P.potions[id]) return;
  var out = R.usePotion(P, C, id);
  logLines(out.lines);
  if(!out.invalid){ AU.sfx('potion'); closeSheet(); hud();
    if(C){ busy=true; view.defend=false; step(afterPlayerAction, 320); }
    else { save(true); renderExplore(); }
  } else { hud(); openItems(); }
}

/* ---- weapons ---- */
function openWeapons(){
  var html = sheetHead('Weapons');
  R.ownedWeapons(P).forEach(function(id){
    var w = D.WEAPONS[id], lv = P.weapons[id].lvl, cd = C? (C.cd[id]||0) : 0;
    var sel = id===P.equipped;
    html += '<div class="row'+(sel?' sel':'')+'"><div class="grow">'+
      '<div class="t">'+w.name+(lv?' <span class="gold">+'+lv+'</span>':'')+' '+
        (cd>0? '<span class="badge cd">cooldown '+cd+'</span>' : '<span class="badge rdy">ready</span>')+
        ' <span class="badge'+(R.wpnCapped(P,id)?' cd':'')+'">'+R.wpnDamage(P,id)+' / '+R.wpnCap(P,id)+' dmg</span>'+
        ' <span class="badge">'+(w.cd?w.cd+' turn cd':'no cd')+'</span></div>'+
      '<div class="d">'+w.desc+'</div></div>'+
      (sel? '<button class="pill" disabled>Equipped</button>'
          : '<button class="pill" onclick="GAME.equip(\''+id+'\')">Equip</button>')+
      '</div>';
  });
  html += '<p class="dim small">Switching weapons is free — it never costs you a turn. Cooldowns are cleared at the start of every battle.</p>';
  openSheet(html);
}
function equip(id){
  P.equipped = id; view.weapon = id;
  log('','You ready the '+D.WEAPONS[id].name+'.');
  closeSheet(); hud();
  if(C) renderCombat(); else { save(true); renderExplore(); }
}

/* ---- upgrades ---- */
var upTab = 'weapons';
function openUpgrades(){
  if(C){ toast('Not in the middle of a fight.'); return; }
  var html = sheetHead('Upgrades <span class="chip">XP <b>'+P.xp+'</b></span>');
  html += '<div class="tabs">'+
    '<div class="tab '+(upTab==='weapons'?'on':'')+'" onclick="GAME.tab(\'weapons\')">Weapons</div>'+
    '<div class="tab '+(upTab==='stats'?'on':'')+'" onclick="GAME.tab(\'stats\')">Stats</div></div>';

  if(upTab==='weapons'){
    /* upgrades only — new weapons are found, or bought at the Trade Road shop */
    R.ownedWeapons(P).forEach(function(id){
      var w = D.WEAPONS[id];
      var lv = P.weapons[id].lvl;
      var cost = R.wpnUpgradeCost(P,id);
      var atLimit = R.wpnCapped(P,id);
      var can = cost!==null && P.xp >= cost && !atLimit;
      html += '<div class="row"><div class="grow">'+
        '<div class="t">'+w.name+(lv?' <span class="gold">+'+lv+'</span>':'')+
          ' <span class="badge'+(atLimit?' cd':'')+'">'+R.wpnDamage(P,id)+' / '+R.wpnCap(P,id)+' dmg</span>'+
          ' <span class="badge">'+(w.cd?w.cd+' turn cd':'no cd')+'</span></div>'+
        '<div class="d">'+(atLimit
            ? '<span class="warn">At its damage limit. Reforge it at the Trade Road shop to raise the limit.</span>'
            : w.desc)+'</div></div>'+
        (cost===null? '<button class="pill" disabled>—</button>'
          : '<button class="pill" '+(can?'':'disabled')+' onclick="GAME.buy(\'up\',\''+id+'\')">'+
            'Sharpen · '+cost+' XP</button>')+
        '</div>';
    });
    html += '<p class="dim small">This bench sharpens what you already carry, up to each weapon\'s '+
      '<b>damage limit</b> — and Might counts against that limit too, so a maxed-out weapon gains nothing more. '+
      'Raising a limit (<b>reforging</b>) and buying <b>armour</b> both happen at the Trade Road shop. '+
      '<b>New weapons must be found</b> — in chests while exploring (the Castle and the Bandit Camp hide the most), '+
      'or bought at that same shop.</p>';
  } else {
    ['maxHp','might','guard'].forEach(function(id){
      var s = D.STATS[id], cost = R.statCost(P,id), can = P.xp>=cost;
      var cur = id==='maxHp'? P.maxHp+' max HP' : (id==='might'? '+'+P.might+' attack' : P.guard+' defence');
      html += '<div class="row"><div class="grow"><div class="t">'+s.name+' <span class="badge">'+cur+'</span></div>'+
        '<div class="d">'+s.desc+'</div></div>'+
        '<button class="pill" '+(can?'':'disabled')+' onclick="GAME.buy(\'stat\',\''+id+'\')">'+cost+' XP</button></div>';
    });
    html += '<p class="dim small">Spent so far: '+P.xpSpent+' XP · Earned in total: '+P.xpTotal+' XP</p>';
  }
  openSheet(html);
}
function tab(t){ upTab=t; openUpgrades(); }
function buy(kind, id){
  var ok = kind==='weapon'   ? R.buyWeapon(P,id)
         : kind==='up'       ? R.upgradeWeapon(P,id)
         : kind==='cap'      ? R.reforgeWeapon(P,id)
         : kind==='armour'   ? R.buyArmour(P,id)
         : kind==='armourUp' ? R.upgradeArmour(P,id)
         : R.buyStat(P,id);
  if(!ok){ toast('Not enough XP.'); return; }
  AU.sfx('chest');
  if(kind==='cap'){ log('hi','Reforged. The '+D.WEAPONS[id].name+' can now reach '+R.wpnCap(P,id)+' damage.'); }
  if(kind==='armour'){ log('hi','You buy the '+D.ARMOURS[id].name+'. Protection '+R.armourProt(P)+'.'); }
  if(kind==='armourUp'){ log('hi','Your '+D.ARMOURS[id].name+' is reinforced to +'+P.armours[id].lvl+
    ' (protection '+Math.min(R.ARMOUR_CAP, D.ARMOURS[id].prot + D.ARMOURS[id].gain*P.armours[id].lvl)+').'); }
  if(kind==='weapon'){ log('hi','You acquire the '+D.WEAPONS[id].name+'.'); equipIfBetter(id); }
  if(kind==='up'){
    log('hi','Your '+D.WEAPONS[id].name+' is now +'+P.weapons[id].lvl+
      ' ('+R.wpnDamage(P,id)+'/'+R.wpnCap(P,id)+' damage).');
    if(R.wpnCapped(P,id)) log('','It is at its limit — sharpening and Might do nothing more until it is reforged.');
  }
  if(kind==='stat')   log('hi',D.STATS[id].name+' improved.');
  save(true); hud();
  if(mode==='explore') renderExplore();
  if(kind==='weapon'||kind==='cap'||kind==='armour'||kind==='armourUp') openShop(); else openUpgrades();
}

/* ---- the Trade Road shop: weapons, damage limits and armour ---- */
var shopTab = 'weapons';
function shopTabSet(t){ shopTab = t; openShop(); }
function wear(id){
  if(!P.armours[id] || !P.armours[id].owned) return;
  P.armour = id;
  log('ok','You buckle on the '+D.ARMOURS[id].name+'. Protection '+R.armourProt(P)+'.');
  save(true); hud(); openShop();
}
function openShop(){
  if(!P.flags.shop){ toast('You have not found the shop yet.'); return; }
  if(C){ toast('Not in the middle of a fight.'); return; }
  var html = sheetHead('Trade Road Shop <span class="chip">XP <b>'+P.xp+'</b></span>');
  html += '<div class="tabs">'+
    '<div class="tab '+(shopTab==='weapons'?'on':'')+'" onclick="GAME.shopTab(\'weapons\')">Weapons</div>'+
    '<div class="tab '+(shopTab==='armour'?'on':'')+'" onclick="GAME.shopTab(\'armour\')">Armour</div></div>';

  if(shopTab==='weapons'){
    html += '<p class="dim small">"Steel for XP. No haggling, no credit, no refunds if something eats you."</p>';
    R.shopStock(P).forEach(function(id){
      var w = D.WEAPONS[id];
      var owned = P.weapons[id] && P.weapons[id].owned;
      var lvl = (P.weapons[id] && P.weapons[id].lvl) || 0;
      var dmg = owned ? R.wpnDamage(P,id) : Math.min(w.dmg + P.might, w.cap);
      var cap = owned ? R.wpnCap(P,id) : w.cap;
      html += '<div class="row'+(owned?' sel':'')+'"><div class="grow">'+
        '<div class="t">'+w.name+(owned&&lvl?' <span class="gold">+'+lvl+'</span>':'')+
          ' <span class="badge">'+dmg+' dmg</span>'+
          ' <span class="badge">limit '+cap+(w.capMax>cap?' → '+w.capMax:'')+'</span>'+
          ' <span class="badge">'+(w.cd? w.cd+' turn cd' : 'no cd')+'</span>'+
          (owned? ' <span class="badge rdy">owned</span>' : '')+'</div>'+
        '<div class="d">'+w.desc+'</div></div>'+
        (owned? '<button class="pill" disabled>Owned</button>'
              : '<button class="pill" '+(P.xp>=w.cost?'':'disabled')+' onclick="GAME.buy(\'weapon\',\''+id+'\')">'+
                w.cost+' XP</button>')+
        '</div>';
    });
    html += '<hr class="sep"><h2 style="font-size:1em">Reforging — raise a damage limit</h2>'+
      '<p class="dim small">Sharpening at the upgrade bench raises damage; <b>reforging</b> here raises the ceiling it can be sharpened to. '+
      'Every weapon has one, and Might counts against it.</p>';
    R.ownedWeapons(P).forEach(function(id){
      if(id==='gods_sword') return;
      var w = D.WEAPONS[id], capC = R.wpnCapCost(P,id), atLimit = R.wpnCapped(P,id);
      html += '<div class="row"><div class="grow">'+
        '<div class="t">'+w.name+
          ' <span class="badge'+(atLimit?' cd':' rdy')+'">'+R.wpnDamage(P,id)+' / '+R.wpnCap(P,id)+' dmg</span></div>'+
        '<div class="d">'+(atLimit
            ? '<span class="warn">Maxed out at its limit — reforge to go further.</span>'
            : 'Room to grow: '+(R.wpnCap(P,id)-R.wpnDamage(P,id))+' more damage before the limit.')+'</div></div>'+
        (capC===null? '<button class="pill" disabled>Limit maxed</button>'
                    : '<button class="pill" '+(P.xp>=capC?'':'disabled')+
                      ' onclick="GAME.buy(\'cap\',\''+id+'\')">Reforge +'+w.capStep+' · '+capC+' XP</button>')+
        '</div>';
    });
    if(!P.discovered.portal_land)
      html += '<p class="dim small">"I hear there is blacker steel below the world. Bring me proof you have been there and I will see what I can get."</p>';
  } else {
    var prot = R.armourProt(P);
    html += '<p class="dim small">"Armour will not kill anything for you. It will let you be wrong once."</p>'+
      '<div class="row"><div class="grow"><div class="t">Worn: '+
        (P.armour? D.ARMOURS[P.armour].name : 'nothing but a shirt')+'</div>'+
      '<div class="d">Protection <b class="gold">'+prot+'</b> — that much comes off every hit you take'+
        (prot>=R.ARMOUR_CAP? ' (the hard limit of '+R.ARMOUR_CAP+')':'')+'.<br>'+
        'No armour ever stops more than '+Math.round((1-R.MIN_HIT_FRACTION)*100)+'% of a blow, so bosses always hurt.</div></div></div>';
    R.armourStock(P).forEach(function(id){
      var a = D.ARMOURS[id];
      var owned = P.armours[id] && P.armours[id].owned;
      var lvl = (P.armours[id] && P.armours[id].lvl) || 0;
      var upC = owned ? R.armourUpCost(P,id) : null;
      var worn = P.armour === id;
      html += '<div class="row'+(worn?' sel':'')+'"><div class="grow">'+
        '<div class="t">'+a.name+(owned&&lvl?' <span class="gold">+'+lvl+'</span>':'')+
          ' <span class="badge">'+Math.min(R.ARMOUR_CAP, a.prot + a.gain*lvl)+' protection</span>'+
          (worn? ' <span class="badge rdy">worn</span>' : '')+'</div>'+
        '<div class="d">'+a.desc+'</div></div>'+
        (owned
          ? (worn? '' : '<button class="pill" onclick="GAME.wear(\''+id+'\')">Wear</button>')+
            (upC===null? '<button class="pill" disabled>Maxed</button>'
                       : '<button class="pill" '+(P.xp>=upC?'':'disabled')+
                         ' onclick="GAME.buy(\'armourUp\',\''+id+'\')">Reinforce +'+a.gain+' · '+upC+' XP</button>')
          : '<button class="pill" '+(P.xp>=a.cost?'':'disabled')+
            ' onclick="GAME.buy(\'armour\',\''+id+'\')">'+a.cost+' XP</button>')+
        '</div>';
    });
    if(!P.discovered.portal_land)
      html += '<p class="dim small">"There is better plate than mine, but not on this side of the world."</p>';
  }
  openSheet(html);
}

/* ---- map ---- */
function openMap(){
  var html = sheetHead('Map')+'<canvas id="mapCanvas" width="760" height="470"></canvas>'+
    '<p class="dim small">Solid lines are roads you have walked. Dashed lines lead to places you have only heard of. '+
    'Red markers are guarded. ✓ means cleared.</p>';
  openSheet(html);
  var cv = $('mapCanvas');
  ART.map(cv.getContext('2d'), cv.width, cv.height, P, D);
}

/* ---- menu ---- */
function openMenu(){
  var html = sheetHead('Menu');
  html += '<div class="row"><div class="grow"><div class="t">Save file</div><div class="d">Slot '+slot+'</div></div>'+
    '<button class="pill" onclick="GAME.saveNow()">Save now</button>'+
    '<button class="pill" onclick="GAME.toTitle()">Title screen</button></div>';
  html += '<div class="row"><div class="grow"><div class="t">Sound</div><div class="d">Original chiptune score and effects</div></div>'+
    '<button class="pill" onclick="GAME.sound()">'+(AU.isOn()?'On':'Off')+'</button></div>';
  if(R.woundedCount(P)){
    var hurt = [];
    for(var wid in P.wounded) hurt.push(D.AREAS[wid].name+': '+
      P.wounded[wid].map(function(w){ return D.ENEMIES[w.id].name+' ('+w.hp+'/'+D.ENEMIES[w.id].hp+' HP)'; }).join(', '));
    html += '<div class="row"><div class="grow"><div class="t warn">Unfinished fights</div>'+
      '<div class="d">'+hurt.join('<br>')+'<br><span class="dim">They are waiting exactly as you left them.</span></div></div></div>';
  }
  if(R.lostCount(P)){
    var where = [];
    for(var aid in P.lost) where.push(D.AREAS[aid].name+': '+
      P.lost[aid].map(function(id){ return D.WEAPONS[id].name; }).join(', '));
    html += '<div class="row"><div class="grow"><div class="t crim">Lost gear</div>'+
      '<div class="d">'+where.join('<br>')+'<br><span class="dim">Explore those areas to search for it. '+
      'You may not recover every weapon.</span></div></div></div>';
  }
  html += '<hr class="sep"><div class="row"><div class="grow"><div class="t">Progress</div><div class="d">'+
    'Battles won '+P.stats.wins+'/'+P.stats.battles+' · Chests '+P.stats.chests+' · Steps '+P.stats.steps+'<br>'+
    'XP earned '+P.xpTotal+' · spent '+P.xpSpent+' · held '+P.xp+'<br>'+
    'Bosses defeated: '+([P.flags.g1&&'Bram',P.flags.g2&&'Vesk',P.flags.maggle&&'Maggle',
      P.flags.gob1&&'Grask',P.flags.gob2&&'Vorrn',P.flags.devil&&'The Devil',P.flags.trueEnd&&'Aurex']
      .filter(Boolean).join(', ') || 'none yet')+
    '</div></div></div>';
  openSheet(html);
}
function saveNow(){ save(); closeSheet(); }
function sound(){ AU.toggle(); S.setting('sound', AU.isOn()?'1':'0'); if(AU.isOn()) music(); openMenu(); }
function toTitle(){ save(true); closeSheet(); C=null; titleScreen(); }

/* ============================================================
   ENDINGS
   ============================================================ */
function cloudsSequence(){
  P.flags.returned = true;
  P.area = 'clouds'; P.discovered.clouds = true;
  mode='intro'; C=null;
  setLocation(); hud(); clearLog();
  AU.sfx('divine'); AU.setTrack('ending');
  view = { art:'clouds', hero:true, weapon:'gods_sword' };
  log('story','You hold the sword up in the village square. The sky opens — politely, almost apologetically — and takes you.');
  bubble('"Thank you for returning the sword that belongs to us."', '5%', '12%', true);
  save(true);
  setActions([{ label:'Continue', cls:'primary wide', on:creditsScreen }]);
}

function creditsScreen(){
  clearBubbles();
  P.flags.credits = true;
  showScreen(
    '<h1 style="font-size:1.6em">THE SWORD IS HOME</h1>'+
    '<p class="gold">"Unfortunately right now we are to be anonymous but thanks for playing."</p>'+
    '<hr class="sep">'+
    '<p class="dim small">THE LOST SWORD OF THE GODS · a Pencilbox Games adventure<br>'+
    'All artwork, music and code original.</p>'+
    '<div id="cb"></div>');
  var b=document.createElement('button'); b.className='btn primary wide'; b.textContent='…but wait';
  b.onclick=function(){ AU.sfx('ui'); secretScreen(); }; $('cb').appendChild(b);
}

function secretScreen(){
  P.flags.secretKnown = true; save(true);
  showScreen(
    '<h1 style="font-size:1.35em" class="gold">AN OPTIONAL CONTINUATION</h1>'+
    '<p class="dim small">The story is over. This part is not required — but something about that "thank you" did not sit right.</p>'+
    '<p><b>Return to the clouds because the god in our game stole the sword from King Arthur.</b></p>'+
    '<div class="langbox">'+
      '<div><span class="lg">Español</span>Regresa a las nubes porque el dios de nuestro juego robó la espada del Rey Arturo.</div>'+
      '<div><span class="lg">Français</span>Retourne aux nuages parce que le dieu de notre jeu a volé l\'épée du roi Arthur.</div>'+
      '<div><span class="lg">Português (Brasil)</span>Volte para as nuvens porque o deus do nosso jogo roubou a espada do Rei Arthur.</div>'+
      '<div><span class="lg">日本語</span>私たちのゲームの神がアーサー王の剣を盗んだので、雲へ戻ってください。</div>'+
      '<div><span class="lg">Italiano</span>Torna alle nuvole perché il dio del nostro gioco ha rubato la spada di Re Artù.</div>'+
    '</div>'+
    '<p class="dim small">Prepare first if you want to. The god is stronger than anything in the Underworld.</p>'+
    '<div id="sb"></div>');
  var wrap = $('sb');
  var b=document.createElement('button'); b.className='btn primary wide'; b.textContent='Back to the village';
  b.onclick=function(){
    AU.sfx('ui'); hideScreen();
    P.area='village'; P.hp=P.maxHp; mode='explore';
    /* the gods keep the sword — it is not yours again until Aurex falls */
    delete P.weapons.gods_sword; P.flags.sword = false;
    if(P.equipped==='gods_sword'){
      var own = R.ownedWeapons(P);
      P.equipped = own.reduce(function(best,id){
        return R.wpnDamage(P,id) > R.wpnDamage(P,best) ? id : best; }, own[0]);
    }
    log('hi','You are set down gently in the village square. The sword is gone — the gods kept it.');
    log('story','"Ascend to the Clouds" is now an option whenever you are ready.');
    save(true); renderExplore();
  };
  wrap.appendChild(b);
}

function secretAscend(){
  P.area='clouds'; P.discovered.clouds=true;
  mode='intro'; setLocation(); hud(); clearLog();
  view = { art:'clouds', hero:true, weapon:P.equipped };
  AU.sfx('divine');
  log('story','You go up a second time, uninvited.');
  bubble('"I stole this from him, and you won\'t get it unless you fight me."', '5%', '10%', true);
  setActions([{ label:'Then fight', cls:'danger wide', on:function(){
    clearBubbles();
    startBattle('god_aurex', { onWin:trueEnding, onLose:godDefeat, bg:'clouds' });
  }}]);
}
function godDefeat(){
  AU.sfx('lose');
  /* a god throws you down; a god does not go through your pockets for steel */
  var kept = Math.floor(P.xp*0.15), lostXp = P.xp - kept; P.xp = kept;
  P.hp = P.maxHp; P.area='village'; mode='explore'; busy=false;
  log('bad','Aurex casts you down. '+lostXp+' XP scattered on the way back.');
  showScreen('<h1 style="font-size:1.5em" class="crim">CAST DOWN</h1>'+
    '<p>Aurex drops you back in the village without breaking eye contact.</p>'+
    '<p><b class="warn">'+lostXp+' XP lost.</b> <span class="dim">Your weapons came down with you.</span></p>'+
    '<p class="dim small">Spend XP, upgrade, and climb again. The clouds are not going anywhere.</p>'+
    '<div id="gb"></div>');
  var b=document.createElement('button'); b.className='btn primary wide'; b.textContent='Get up';
  b.onclick=function(){ AU.sfx('ui'); hideScreen(); save(true); renderExplore(); }; $('gb').appendChild(b);
}
function trueEnding(){
  P.flags.trueEnd = true; P.flags.sword = true;
  P.weapons.gods_sword = { owned:true, lvl:0 }; P.equipped='gods_sword';
  P.area='village'; mode='end';
  setLocation(); hud(); save(true);
  AU.setTrack('hero'); AU.sfx('divine');
  clearLog();
  log('hi','Aurex falls out of the sky, and the sword falls after him — into your hand.');
  log('story','A rider comes up the village road at dusk. Old armour, older sword-belt, and an empty scabbard he has clearly been carrying a long time.');
  setActions([{ label:'Continue', cls:'primary wide', on:function(){
    showScreen(
      '<h1 style="font-size:1.5em" class="gold">KING ARTHUR</h1>'+
      '<p>He takes the sword from you in the village square, tests the weight of it, and nods once.</p>'+
      '<hr class="sep">'+
      '<h1 style="font-size:2em">"You are a true hero."</h1>'+
      '<p class="dim small">THE END · true ending unlocked on save slot '+slot+'</p>'+
      '<div id="tb"></div>');
    var w=$('tb');
    var b1=document.createElement('button'); b1.className='btn wide'; b1.textContent='Keep playing';
    b1.onclick=function(){ AU.sfx('ui'); hideScreen(); mode='explore'; renderExplore(); };
    var b2=document.createElement('button'); b2.className='btn primary wide'; b2.textContent='Title screen';
    b2.onclick=function(){ AU.sfx('ui'); save(true); titleScreen(); };
    w.appendChild(b1); w.appendChild(b2);
  }}]);
}

/* ============================================================
   INPUT + BOOT
   ============================================================ */
function keys(e){
  if(e.key==='Escape'){ if(!el.modal.hidden) closeSheet(); return; }
  if(!P || !el.screen.hidden) return;
  var k = e.key.toLowerCase();
  if(k==='m'){ openMap(); return; }
  if(k==='u'){ openUpgrades(); return; }
  if(k==='i'){ openItems(); return; }
  if(!el.modal.hidden) return;
  var n = parseInt(e.key,10);
  if(n>=1 && n<=9){
    var b = el.actions.children[n-1];
    if(b && !b.disabled) b.click();
  }
}

var booted = false;
function boot(){
  if(booted) return; booted = true;
  ['scene','locCanvas','locName','log','actions','modal','sheet','screen','screenCard',
   'bubbles','fxLayer','chipHp','chipXp','chipWpn','chipPot','chipArm','hpYou','hpFoe','hpYouLbl',
   'hpFoeLbl','hpYouBar','hpFoeBar','btnMap','btnUp','btnBag','btnSound','btnMenu']
   .forEach(function(id){ el[id] = $(id); });

  el.btnMap.onclick   = function(){ AU.unlock(); if(P) openMap(); };
  el.btnUp.onclick    = function(){ AU.unlock(); if(P) openUpgrades(); };
  el.btnBag.onclick   = function(){ AU.unlock(); if(P) openItems(); };
  el.btnMenu.onclick  = function(){ AU.unlock(); if(P) openMenu(); };
  el.btnSound.onclick = function(){ AU.unlock(); AU.toggle(); S.setting('sound', AU.isOn()?'1':'0');
    el.btnSound.style.opacity = AU.isOn()?1:.45; if(AU.isOn()) music(); };
  el.modal.onclick = function(e){ if(e.target===el.modal) closeSheet(); };
  document.addEventListener('keydown', keys);

  if(S.setting('sound')==='0'){ AU.setOn(false); el.btnSound.style.opacity=.45; }

  view = { art:'village', hero:false };
  requestAnimationFrame(loop);
  titleScreen();
}

return { boot:boot, closeSheet:closeSheet, drink:drink, equip:equip, buy:buy, tab:tab, shop:openShop,
         saveNow:saveNow, sound:sound, toTitle:toTitle, shopTab:shopTabSet, wear:wear,
         /* exposed for testing */ _state:function(){ return {P:P,C:C,mode:mode}; } };
})(DATA, RULES, SAVE, ART, AUDIO);

document.addEventListener('DOMContentLoaded', GAME.boot);
if(document.readyState !== 'loading') GAME.boot();
</script>
