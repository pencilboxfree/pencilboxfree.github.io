const MapGen = (() => {
  const SOLID = new Set(['#','F','X','x','h','B','Z','b','k','t','c','s','r','L','W','n','P','q','Q','m','j','g','C','T','U','H','e','u','p','v','z','R','M','J','A','I','w','o','V','y']);
  const WALLISH = new Set(['#','X','x','B','Z','R']);

  function blank(w, h, ch) { const g = []; for (let y = 0; y < h; y++) g.push(new Array(w).fill(ch)); return g; }

  function canvas(w, h, ch) {
    const g = blank(w, h, ch);
    const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = c; };
    const fill = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, c); };
    const ring = (x0, y0, x1, y1, c) => { for (let x = x0; x <= x1; x++) { set(x, y0, c); set(x, y1, c); } for (let y = y0; y <= y1; y++) { set(x0, y, c); set(x1, y, c); } };
    const border = () => { for (let x = 0; x < w; x++) { set(x, 0, '='); set(x, 1, '='); set(x, h - 1, '='); set(x, h - 2, '='); } for (let y = 0; y < h; y++) { set(0, y, '='); set(1, y, '='); set(w - 1, y, '='); set(w - 2, y, '='); } };
    const trees = list => { for (const [tx, ty] of list) if (g[ty] && g[ty][tx] === ':') set(tx, ty, 'T'); };
    return { g, set, fill, ring, border, trees, w, h };
  }

  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  function buildMaze(seed, CW, CH) {
    const w = CW * 2 + 1, h = CH * 2 + 1;
    const g = blank(w, h, '#');
    const r = rng(seed);
    const seen = blank(CW, CH, false);
    const stack = [[0, 0]]; seen[0][0] = true; g[1][1] = '.';
    while (stack.length) {
      const [cx, cy] = stack[stack.length - 1];
      const nb = [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy]) => [cx+dx, cy+dy, dx, dy]).filter(([nx,ny]) => nx >= 0 && ny >= 0 && nx < CW && ny < CH && !seen[ny][nx]);
      if (!nb.length) { stack.pop(); continue; }
      const [nx, ny, dx, dy] = nb[Math.floor(r() * nb.length)];
      seen[ny][nx] = true;
      g[cy*2+1+dy][cx*2+1+dx] = '.';
      g[ny*2+1][nx*2+1] = '.';
      stack.push([nx, ny]);
    }
    for (let i = 0; i < Math.round(CW * CH / 9); i++) {
      const x = 1 + Math.floor(r() * (w - 2)), y = 1 + Math.floor(r() * (h - 2));
      if (g[y][x] === '#' && ((g[y][x-1] === '.' && g[y][x+1] === '.') || (g[y-1][x] === '.' && g[y+1][x] === '.'))) g[y][x] = '.';
    }
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) if (g[y][x] === '.' && r() < 0.16) g[y][x] = '~';
    g[1][1] = 'l';
    g[h - 2][w - 2] = 'E';
    const ends = [];
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      if (g[y][x] !== '.' && g[y][x] !== '~') continue;
      const open = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy]) => g[y+dy][x+dx] !== '#').length;
      if (open === 1 && x + y > 10 && !(x > w - 6 && y > h - 6)) ends.push([x, y, (x * 7 + y * 13) % 97]);
    }
    ends.sort((a, b) => a[2] - b[2]);
    for (const [x, y] of ends.slice(0, 4)) g[y][x] = 'v';
    return g;
  }

  function buildSewer() { return buildMaze(1418, 19, 12); }

  function inRect(r, x, y) { return !!r && x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]; }

  const BY = {}; for (const q of LIST) BY[q.id] = q;

  function forGiver(id) { return LIST.filter(q => q.giver === id); }
  function offerable(q) { return !G.quests[q.id] && (!q.req || q.req()); }
  function accept(q) { G.quests[q.id] = 'active'; if (q.onAccept) q.onAccept(); UI.toast('Quest started: ' + q.title, 'info'); Sound.sfx('select'); }
  function complete(q) { G.quests[q.id] = 'done'; Sound.sfx('win'); UI.toast('Quest complete: ' + q.title, 'good'); q.reward(); }
  return { LIST, BY, forGiver, offerable, accept, complete, learn, mark, friends };

const Dialogue = (() => {
  let cur = null;
  function line(n, text) { return { who: n.def.name + (n.def.nick && n.def.role === 'inmate' && n.def.nick !== n.def.name ? ' "' + n.def.nick + '"' : ''), text }; }
  function moodText(n) {
    const o = NPCs.opinion(n);
    const t = o < -20 ? 'Hostile' : o < 10 ? 'Wary' : o < 40 ? 'Neutral' : o < 70 ? 'Friendly' : 'Loyal';
    return t + ' (' + o + ')' + (n.def.persona ? ' &middot; ' + n.def.persona : '');
  }

  function open(n, mode) {
    if (!n || n.ko) return;
    if (n.def.dog) { UI.toast(n.def.name + ' growls and shows its teeth. Best not.', 'warn'); Sound.sfx('fail'); return; }
    cur = n;
    n.wait = Math.max(n.wait, 3);
    n.dir = Math.abs(G.player.x - n.x) > Math.abs(G.player.y - n.y) ? (G.player.x > n.x ? 'right' : 'left') : (G.player.y > n.y ? 'down' : 'up');
    if (mode === 'extort') return extort(n);
    const greet = n.def.greet[Math.min(NPCs.tier(n), n.def.greet.length - 1)];
    show(n, greet, buildOptions(n));
  }

  function show(n, text, opts) { UI.dialog(n, line(n, text), moodText(n), opts); }
  const back = n => buildOptions(n);

  function buildOptions(n) {
    const o = [], def = n.def;
    o.push(['Chat', () => chat(n)]);
    for (const q of Quests.forGiver(n.id)) {
      if (G.quests[q.id] === 'active') {
        if (q.ready()) o.push(['[Quest] ' + q.title + ': hand over', () => { Quests.complete(q); if (Game.state() === 'play') show(n, q.turnIn, back(n)); }]);
        else o.push(['[Quest] ' + q.title, () => show(n, q.goal(), back(n))]);
      } else if (Quests.offerable(q)) {
        o.push(['Need anything?', () => show(n, q.offer, [['Accept: ' + q.title, () => { Quests.accept(q); show(n, 'Good. Come back when it is done.', back(n)); }], ['Not now', () => show(n, 'Suit yourself.', back(n))]])]);
      }
    }
    if ((SHOPS[n.id] || BUYERS[n.id]) && NPCs.opinion(n) > -40) o.push(['Trade', () => { UI.closeDialog(); UI.openTrade(n); }]);
    const sel = World.selected();
    if (sel && def.role !== 'guard' && !(def.watcher && !def.assignsJob)) o.push(['Give ' + itemName(sel.id), () => give(n, sel)]);
    if (def.hint && NPCs.opinion(n) >= 40) o.push(['Any secrets?', () => secret(n)]);
    special(n, o);
    o.push(['Leave', () => UI.closeDialog()]);
    return o;
  }

  function special(n, o) {
    const p = G.player, def = n.def;
    if (def.forger && G.flags[def.forger]) o.push(['Forge a ' + itemName('keycard') + ' (' + itemName('card') + ' + Ink + $20)', () => {
      if (!World.has('card') || !World.has('ink') || p.cash < 20) return show(n, 'I need a blank ' + itemName('card') + ', an Ink Pot and $20. No exceptions.', back(n));
      World.removeItem('card'); World.removeItem('ink'); p.cash -= 20; World.addItem('keycard'); show(n, 'There. Nobody could tell it apart.', back(n));
    }]);
    if (def.assignsJob && p.job !== def.assignsJob) o.push(['Ask for a kitchen job', () => {
      if (NPCs.opinion(n) < 0) return show(n, 'With your record? Improve your conduct first.', back(n));
      p.job = def.assignsJob; show(n, 'Fine! Work shift, 9 to 12, here at the stoves. Do not touch my fridge outside your shift.', back(n));
    }]);
    if (def.bribeKey) { const bk = def.bribeKey; o.push(['Coffee break? (' + itemName(bk.item) + ' + $' + bk.cash + ')', () => {
      if (World.has('guardkey')) return show(n, 'I already... lost my key. To you. Shh.', back(n));
      if (!World.has(bk.item) || p.cash < bk.cash) return show(n, 'I could really use a coffee... and maybe ' + bk.cash + ' bucks for my trouble.', back(n));
      World.removeItem(bk.item); p.cash -= bk.cash; World.addItem('guardkey'); NPCs.addRel(n.id, 20); show(n, '*sip* Ahh. Oops, I seem to have dropped my spare key. Clumsy me.', back(n));
    }]); }
    if (def.driver) { const dr = def.driver; o.push(['Arrange a ride out', () => {
      const spot = FAC.id === 'kestrel' ? 'under the tarp on the convoy truck' : 'in the crate by the roll door';
      if (G.deliveryAgreed) return show(n, 'Get ' + spot + '. Before the loading ends. I never saw you.', back(n));
      if (G.flags[dr.flag] || NPCs.opinion(n) >= 50) { G.deliveryAgreed = true; return show(n, 'A friend of a friend, huh? Fine. Get ' + spot + '. I never saw you.', back(n)); }
      if (dr.items) {
        const need = Object.entries(dr.items);
        return show(n, 'A ride? Ha. Maybe for a friend. Or for ' + need.map(([k, v]) => v + ' ' + itemName(k)).join(', ') + '.', [['Hand them over', () => { if (!need.every(([k, v]) => World.has(k, v))) return show(n, 'You do not have them.', back(n)); need.forEach(([k, v]) => World.removeItem(k, v)); G.deliveryAgreed = true; NPCs.addRel(n.id, 15); show(n, 'Mmm. Fine. Get ' + spot + '.', back(n)); }], ['Never mind', () => show(n, 'Thought so.', back(n))]]);
      }
      show(n, 'A ride? Ha. Maybe for a friend of a friend. Or $' + dr.cash + '.', [['Pay $' + dr.cash, () => { if (p.cash < dr.cash) return show(n, 'You do not have it.', back(n)); p.cash -= dr.cash; G.deliveryAgreed = true; show(n, 'Get ' + spot + '. Before noon.', back(n)); }], ['Never mind', () => show(n, 'Thought so.', back(n))]]);
    }]); }
    if (n.id === 'tiny' && G.quests.tiny_protein === 'done' && !G.tinyProtect && !G.brutusHumbled) o.push(['Brutus keeps hassling me', () => {
      G.tinyProtect = true; G.brutusHate = 0; show(n, 'Tiny will talk to Brutus. He will not bother you again.', back(n));
    }]);
    if (def.bully && !G.brutusHumbled && !G.tinyProtect) { const toll = def.bully.toll; o.push([(def.bully.style === 'hush' ? 'Pay hush money' : 'Pay tribute') + ' ($' + toll + ')', () => {
      if (p.cash < toll) return show(n, 'You are broke? Pathetic.', back(n));
      p.cash -= toll; G.brutusHate = Math.max(0, G.brutusHate - 12); show(n, def.bully.style === 'hush' ? 'My lips are sealed. For now.' : 'Smart. Very smart.', back(n));
    }]); }
    if (def.paroleTalk && G.flags.wardenTalk !== G.day) o.push(['Ask about release', () => { G.flags.wardenTalk = G.day; show(n, def.paroleTalk, back(n)); }]);
    if (def.healer) o.push(['Get patched up', () => {
      if (p.hp >= p.maxHp) return show(n, 'You are fine. Go away.', back(n));
      G.dayFlags.heals = G.dayFlags.heals || 0;
      if (G.dayFlags.heals >= 2) return show(n, 'I have patched you twice today. Rest in a bed.', back(n));
      G.dayFlags.heals++; p.hp = p.maxHp; Sound.sfx('select'); show(n, 'Hold still... There. Good as new. Mostly.', back(n));
    }]);
    if (n.id === 'rook') o.push(['Rate my plan', () => show(n, rookRates(), back(n))]);
    if (n.id === 'nev') nevOptions(n, o);
    if (n.id === 'abara') {
      if (NPCs.serviceOn()) o.push(['Attend the service', () => {
        if (G.dayFlags.service) return show(n, 'You were here today already. Go in peace.', back(n));
        G.dayFlags.service = 1; World.addStat('cond', 3); p.heat = Math.max(0, p.heat - 5); NPCs.addRel('abara', 8);
        show(n, 'A short reading, a long silence. You feel lighter. (Conduct +3, Heat -5)', back(n));

const Combat = (() => {
  function playerAttack() {
    const p = G.player;
    if (p.punchCd > 0 || G.mapId !== 'prison') return;
    p.punchCd = TUNE.PUNCH_CD;
    p.punchAnim = 0.18;
    const f = World.DIRS[p.dir];
    let best = null, bd = 1.35;
    for (const n of G.npcs) {
      if (!n.present || n.ko) continue;
      const dx = n.x - p.x, dy = n.y - p.y, d = Math.hypot(dx, dy);
      if (d > bd) continue;
      if (d > 0.5 && (dx * f[0] + dy * f[1]) / d < 0.3) continue;
      best = n; bd = d;
    }
    if (!best) { Sound.sfx('blip'); return; }
    const n = best;
    const dmg = Math.round(9 + p.str * 1.6 + U.rand(0, 5));
    n.hp -= dmg; n.hitT = 0.2;
    n.x += f[0] * 0.15; n.y += f[1] * 0.15;
    if (!World.passableNPC(n.x, n.y, n)) { n.x -= f[0] * 0.15; n.y -= f[1] * 0.15; }
    Sound.sfx('punch');
    Render.shake(3);
    Render.floatText(n.x, n.y - 1, '-' + dmg, '#ff8a80');
    p.lastPunch = Game.clock();
    p.lastPunchTarget = n.id;
    p.lastPunchSelf = n.hostile > 0 || n.extort;
    G.stats.fights++;
    const role = n.def.role;
    if (role === 'inmate') {
      if (n.hostile <= 0) { NPCs.addRel(n.id, -12); World.addStat('cond', -3); }
      n.hostile = 12; n.extort = false;
      if (n.def.bully) G.brutusHate += 2;
    } else if (role === 'guard') {
      World.addHeat(100, 'You assaulted ' + n.def.name);
    } else {
      World.addHeat(60, 'You attacked ' + n.def.name);
    }
    if (n.hp <= 0) knockOutNPC(n);
  }

  function knockOutNPC(n) {
    n.hp = 0; n.ko = 50; n.hostile = 0; n.chase = false; n.path = null;
    G.stats.ko++;
    Render.floatText(n.x, n.y - 1.2, 'KO!', '#ffd54f');

    if (role === 'inmate') {

      }

    });
  }

  function durHtml(id, u) {
    const it = ITEMS[id]; if (!it.dur) return '';
    const f = U.clamp(u / it.uses, 0, 1), col = f > 0.5 ? '#52d273' : f > 0.25 ? '#ffca28' : '#ff5a5f';
    return ' <span class="durtag" style="color:' + col + '">Durability: ' + World.durText(id, u) + '</span>';
  }
  function itemRow(id, n, right, extra, u) {
    const it = ITEMS[id];
    return '<div class="li" ' + (extra || '') + '><span class="ic" data-ic="' + id + '"></span><span class="grow"><b>' + U.esc(itemName(id)) + '</b>' + (n > 1 ? ' x' + n : '') + ' ' + (it.contra ? '<span class="tag">contraband</span>' : '') + (u != null ? durHtml(id, u) : '') + '<br><span style="color:var(--dim);font-size:11px">' + U.esc(itemDesc(id)) + '</span></span>' + (right || '') + '</div>';
  }
  function fillIcons(s) { s.querySelectorAll('[data-ic]').forEach(el => el.appendChild(Render.iconCanvas(el.dataset.ic, 24))); }

  function storageLine() {
    const cnt = (arr, contra) => arr.reduce((a, s) => a + (s && (!contra || ITEMS[s.id].contra) ? s.n : 0), 0);
    const dname = FAC.cellWord === 'hut' ? 'Footlocker' : 'Desk';
    let h = '<h3>Storage</h3><p>' + dname + ': ' + cnt(G.desk) + ' item(s), ' + cnt(G.desk, true) + ' contraband <span style="color:var(--bad)">(searched in shakedowns)</span>';
    if (G.found.brick) h += '<br>Secret stash: ' + cnt(G.brick) + ' item(s), ' + cnt(G.brick, true) + ' contraband <span style="color:var(--good)">(never searched)</span>';
    return h + '</p>';
  }
  function openInventory() {
    const p = G.player;
    let html = '<div class="box" style="width:640px"><h2>Inventory</h2><div class="list">';
    let any = false;
    p.inv.forEach((s, i) => { if (!s) return; any = true; html += itemRow(s.id, s.n, '<span><button class="btn small" data-sel="' + i + '">Select</button><button class="btn small" data-use="' + i + '">Use</button><button class="btn small" data-drop="' + i + '">Drop</button></span>', '', s.u); });
    if (!any) html += '<div class="li">Empty pockets.</div>';
    html += '</div><p style="font-size:11px;color:var(--dim)">Tools wear down only when used for their purpose. You get a warning before anything wears out.</p><h3>Status</h3><p>Strength ' + p.str + '/10 &middot; Job: ' + (FAC.jobs[p.job] ? FAC.jobs[p.job].name : 'None') + ' &middot; Strikes ' + p.strikes + '/' + TUNE.STRIKES_MAX + ' &middot; Heat ' + Math.round(p.heat) + ' &middot; Notoriety ' + Math.round(p.noto) + ' &middot; Conduct ' + Math.round(p.cond) + '</p>' +
      storageLine() + (G.dummy ? '<p style="color:var(--good)">Your Bed Dummy is in your bunk (' + World.durText('dummy', G.dummyU) + ' left).</p>' : '') + (G.poster ? '<p>A poster hangs on your cell wall.</p>' : '') +
      '<button class="btn" id="ic">Close</button></div>';
    const s = panel(html, 'inv');
    fillIcons(s);
    bind(s, '[data-sel]', el => { p.sel = +el.dataset.sel; refreshHotbar(); closeAll(); });
    bind(s, '[data-use]', el => { p.sel = +el.dataset.use; refreshHotbar(); closeAll(); Game.useSelected(); });
    bind(s, '[data-drop]', el => { const sl = p.inv[+el.dataset.drop]; if (sl) { World.removeItem(sl.id, 1); toast('Dropped ' + itemName(sl.id) + '.'); } openInventory(); });
    s.querySelector('#ic').onclick = closeAll;
  }

  function openCraft(fromDesk) {
    const atDesk = !!fromDesk && World.atOwnDesk();
    const where = FAC.cellWord === 'hut' ? 'footlocker' : 'desk';
    let html = '<div class="box" style="width:640px"><h2>' + (atDesk ? 'Crafting at your ' + where : 'Recipe Book') + '</h2>' +
      '<p style="color:var(--dim)">' + (atDesk ? 'Materials in your pockets and in your ' + where + ' both count. Crafted items go to your pockets.' : 'You can only craft at your own ' + where + '. Recipes are learned by doing favours for other prisoners.') + '</p><div class="list">';
    let knownCount = 0;
    for (const r of RECIPES) {
      const known = Craft.known(r);
      if (!known) { html += '<div class="li"><span class="grow"><b>??? (not learned)</b><br><span style="color:var(--dim);font-size:11px">Do a favour for ' + U.esc(FAC.recipeTeachers[r.id] || r.teach) + ' to learn this.</span></span></div>'; continue; }
      knownCount++;
      const need = Object.entries(r.need).map(([k, v]) => { const h = Craft.have(k, atDesk); return '<span style="color:' + (h >= v ? 'var(--good)' : 'var(--bad)') + '">' + v + 'x ' + itemName(k) + ' (' + h + ')</span>'; }).join(', ');
      const btn = atDesk ? '<button class="btn small" data-r="' + r.id + '"' + (Craft.canCraft(r, true) ? '' : ' disabled') + '>Craft</button>' : '<button class="btn small" disabled>At ' + where + '</button>';
      html += itemRow(r.out, 1, btn, '', ITEMS[r.out].uses || null).replace('<br><span style="color:var(--dim);font-size:11px">', '<br>Needs: ' + need + '<br><span style="color:var(--dim);font-size:11px">');
    }
    html += '</div><p style="font-size:12px">Recipes known: ' + knownCount + '/' + RECIPES.length + '</p>' + (atDesk ? '<button class="btn" id="todesk">' + (FAC.cellWord === 'hut' ? 'Footlocker storage' : 'Desk storage') + '</button>' : '') + '<button class="btn" id="cc">Close</button></div>';
    const s = panel(html, 'craft');
    fillIcons(s);
    bind(s, '[data-r]', el => { Craft.craft(RECIPES.find(r => r.id === el.dataset.r), true); openCraft(true); });
    if (atDesk) s.querySelector('#todesk').onclick = () => openStash('desk');
    s.querySelector('#cc').onclick = closeAll;
  }

  function openJournal(tab) {
    tab = tab || 'quests';
    let body = '';
    if (tab === 'quests') {
      const act = Quests.LIST.filter(q => G.quests[q.id] === 'active'), done = Quests.LIST.filter(q => G.quests[q.id] === 'done');
      body += act.length ? act.map(q => '<div class="q"><b>' + q.title + '</b> (' + NPCs.DEF[q.giver].name + ')<br>' + U.esc(q.goal()) + (q.ready() ? ' <span style="color:var(--good)">Ready to hand in!</span>' : '') + '</div>').join('') : '<p>No active favours. Look for <b style="color:#ffd54f">!</b> above inmates.</p>';
      if (done.length) body += '<h3>Completed</h3>' + done.map(q => '<div class="q done"><b>' + q.title + '</b></div>').join('');
      const leads = [];
      if (G.dexJoined) leads.push('Dex will escape with you.');
      if (G.flags.safeCode) leads.push('Safe code: ' + FAC.safeText.split('...')[0] + '.');
      if (G.flags.ricoIntro) leads.push('Gus will help on delivery days (every 3rd day).');
      if (G.flags.bearIntro) leads.push('Lenny the convoy driver will help on convoy days (every 2nd day).');
      if (G.deliveryAgreed) leads.push(FAC.id === 'kestrel' ? 'Lenny agreed: hide under the convoy tarp during labor detail.' : 'Gus agreed: hide in the dock crate before noon.');
      if (G.flags.grannyForge) leads.push('Granny forges keycards: Plastic Card + Ink + $20.');
      if (G.flags.finchForge) leads.push('Finch forges gate passes: Blank Pass Card + Ink + $20.');
      if (G.nevPromise) leads.push('You promised Big Nev half. He digs one night at a time.');
      if (G.nevBetrayed) leads.push('You broke your word to Big Nev. He remembers.');
      const bully = G.npcs.find(b => b.def.bully);
      if (bully && G.brutusHate >= 50 && !G.brutusHumbled && !G.tinyProtect) leads.push(bully.def.name + ' resents you and may snitch on an escape. Deal with them.');
      if (G.digWall > 0) leads.push(FAC.crackText.progress(Math.floor(G.digWall / TUNE.DIG_WALL * 100)) + (G.poster ? ' (covered)' : ' (uncovered!)'));
      if (leads.length) body += '<h3>Notes</h3>' + leads.map(l => '<div class="q">' + U.esc(l) + '</div>').join('');
    } else if (tab === 'schedule') {
      const cur = World.period().id;
      const rq = s => s.req ? (s.req === 'job' ? 'Your job' : (FAC.reqNames[s.req] || s.req).replace(/^the /, '')) : 'Free';
      body += '<table class="sched"><tr><td><b>Time</b></td><td><b>Period</b></td><td><b>Where</b></td><td><b>Head count</b></td></tr>' + FAC.schedule.filter(s => s.id !== 'lights').map(s => '<tr class="' + (s.id === cur ? 'now' : '') + '"><td>' + U.fmtTime(s.start) + '</td><td>' + s.name + '</td><td>' + rq(s) + '</td><td>' + (s.check ? (G.checked[s.id] ? 'done' : U.fmtTime(World.checkAt(s))) : '-') + '</td></tr>').join('') + '</table>';
      body += '<p>Night check' + (FAC.nightChecks.length > 1 ? 's' : '') + ' at ' + FAC.nightChecks.map(U.fmtTime).join(', ') + '.' + (FAC.snapAppell ? ' Snap appells can be called without warning on even days.' : '') + '</p>';
      body += '<p>Your job: <b>' + (FAC.jobs[G.player.job] ? FAC.jobs[G.player.job].name : 'none') + '</b> (' + (G.dayFlags.tasks || 0) + '/' + TUNE.JOB_TASKS + ' tasks today).</p>';
      body += '<p>' + (FAC.deliveryEvery ? (World.isDeliveryDay() ? (FAC.id === 'kestrel' ? 'Today is a convoy day.' : 'Today is a delivery day.') : 'Next ' + (FAC.id === 'kestrel' ? 'convoy' : 'delivery') + ': day ' + (Math.ceil(G.day / FAC.deliveryEvery) * FAC.deliveryEvery) + '. ') : '') + ' Full-attendance streak: ' + G.attendStreak + ' day(s).</p>';
    } else {
      const st = G.stats;
      body += '<p>Inmate <b>' + U.esc(G.player.name) + '</b> &middot; Day ' + G.day + '</p><table class="sched">' +
        [['Checks attended', st.attended], ['Checks missed', st.missed], ['Job tasks', st.tasks], ['Fights', st.fights], ['Knockouts', st.ko], ['Times caught', st.caught], ['Secrets found', st.secrets], ['Books read', st.books], ['Endings unlocked (all runs)', Profile.endingCount() + '/' + ENDINGS.length]].map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</table>';
      body += '<h3>Relationships</h3><table class="sched">' + G.npcs.filter(n => n.def.role !== 'guard' || n.id === 'pell').map(n => '<tr><td>' + n.def.name + '</td><td>' + NPCs.opinion(n) + '</td></tr>').join('') + '</table>';
    }
    const s = panel('<div class="box" style="width:680px"><h2>Journal</h2><div>' +
      ['quests', 'schedule', 'record'].map(t => '<button class="btn small" data-t="' + t + '" style="' + (t === tab ? 'border-color:var(--accent)' : '') + '">' + t[0].toUpperCase() + t.slice(1) + '</button>').join('') +
      '</div>' + body + '<button class="btn" id="jc">Close</button></div>', 'journal');
    bind(s, '[data-t]', el => openJournal(el.dataset.t));
    s.querySelector('#jc').onclick = closeAll;
  }

  function openMap() {
    const s = panel('<div class="box" style="width:660px;max-height:590px"><h2 style="margin-bottom:4px">' + U.esc(FAC.short) + ' Map</h2><canvas id="mm" width="612" height="450" style="width:612px;height:450px;display:block;margin:0 auto"></canvas><p style="font-size:11px;color:var(--dim)">Orange: you &middot; Dashed: where you should be now &middot; Yellow: leads &middot; Green: discovered secrets</p><button class="btn" id="mc">Close</button></div>', 'map');
    Render.minimap(s.querySelector('#mm'));
    s.querySelector('#mc').onclick = closeAll;
  }

  function openStash(which) {
    const store = which === 'desk' ? G.desk : G.brick, cap = which === 'desk' ? TUNE.DESK_SLOTS : TUNE.BRICK_SLOTS;
    const p = G.player;
    let html = '<div class="box" style="width:760px"><h2>' + (which === 'desk' ? (FAC.cellWord === 'hut' ? 'Your Footlocker' : 'Your Desk') : FAC.brickText[2]) + '</h2><p style="color:var(--dim)">' + (which === 'desk' ? 'Guards search here during noon shakedowns. Contraband found here is confiscated.' : FAC.brickText[3]) + '</p><div class="row"><div class="col"><h3>Pockets (click to store)</h3><div class="list">';
    p.inv.forEach((s, i) => { if (s) html += itemRow(s.id, s.n, '', 'data-put="' + i + '"', ITEMS[s.id].dur ? s.u : null); });
    const dname = FAC.cellWord === 'hut' ? 'Footlocker' : 'Desk';
    html += '</div></div><div class="col"><h3>' + (which === 'desk' ? dname + ' ' + store.length + '/' + cap + ' &middot; <span style="color:var(--bad)">searched in shakedowns</span>' : 'Secret stash ' + store.length + '/' + cap + ' &middot; <span style="color:var(--good)">never searched</span>') + '</h3><div class="list">';
    store.forEach((s, i) => { html += itemRow(s.id, s.n, '', 'data-take="' + i + '"', ITEMS[s.id].dur ? s.u : null); });
    html += '</div></div></div>' + (which === 'desk' ? '<button class="btn" id="tocraft">Crafting</button>' : '') + '<button class="btn" id="sc">Close</button></div>';
    const s = panel(html, 'stash');
    fillIcons(s);
    bind(s, '[data-put]', el => {
      const sl = p.inv[+el.dataset.put]; if (!sl) return;
      const ex = !ITEMS[sl.id].uses && store.find(x => x.id === sl.id);
      if (!ex && store.length >= cap) return toast('No room.', 'bad');
      if (ex) ex.n++; else store.push({ id: sl.id, n: 1, u: sl.u });
      if (ITEMS[sl.id].uses) p.inv[+el.dataset.put] = sl.n > 1 ? Object.assign(sl, { n: sl.n - 1 }) : null; else World.removeItem(sl.id, 1);
      if (sl.id === 'uniform' && !World.has('uniform')) p.wearing = false;
      refreshHotbar(); openStash(which);
    });
    bind(s, '[data-take]', el => {
      const i = +el.dataset.take, sl = store[i];
      if (World.freeSlots() <= 0 && !(!ITEMS[sl.id].uses && World.has(sl.id))) return toast('Pockets full.', 'bad');
      if (ITEMS[sl.id].uses) { const idx = p.inv.findIndex(x => !x); const slot = { id: sl.id, n: 1, u: sl.u }; if (idx >= 0) p.inv[idx] = slot; else p.inv.push(slot); }
      else World.addItem(sl.id, 1, true);
      sl.n--; if (sl.n <= 0) store.splice(i, 1);
      refreshHotbar(); openStash(which);
    });
    if (which === 'desk') s.querySelector('#tocraft').onclick = () => openCraft(true);
    s.querySelector('#sc').onclick = closeAll;
  }

  function buyPrice(n, s) { return Math.max(1, Math.ceil(s.price * (1 - NPCs.opinion(n) / 300))); }
  function sellPrice(n, id, slot) { const wear = slot && ITEMS[id].uses ? U.clamp(slot.u / ITEMS[id].uses, 0.2, 1) : 1; return Math.max(1, Math.floor(ITEMS[id].price * BUYERS[n.id] * (1 + NPCs.opinion(n) / 300) * wear)); }
  function openTrade(n) {
    const p = G.player;
    let html = '<div class="box" style="width:780px"><h2>Trade with ' + U.esc(n.def.name) + '</h2><p>Your cash: <b style="color:var(--accent2)">$' + p.cash + '</b> &middot; Better relationships mean better prices.</p><div class="row"><div class="col"><h3>Buy</h3><div class="list">';
    const stock = n.stock.filter(s => s.n > 0);
    if (!stock.length) html += '<div class="li">Sold out. Restocks every morning.</div>';
    n.stock.forEach((s, i) => { if (s.n > 0) html += itemRow(s.id, s.n, '<button class="btn small" data-buy="' + i + '"' + (p.cash < buyPrice(n, s) ? ' disabled' : '') + '>$' + buyPrice(n, s) + '</button>'); });
    html += '</div></div><div class="col"><h3>Sell</h3><div class="list">';
    if (!BUYERS[n.id]) html += '<div class="li">' + U.esc(n.def.name) + ' is not buying.</div>';
    else p.inv.forEach((s, i) => { if (s) html += itemRow(s.id, s.n, '<button class="btn small" data-sell="' + i + '">$' + sellPrice(n, s.id, s) + '</button>', '', ITEMS[s.id].dur ? s.u : null); });
    html += '</div></div></div><button class="btn" id="tback">Back to talking</button><button class="btn" id="tc">Close</button></div>';
    const s = panel(html, 'trade');
    fillIcons(s);
    bind(s, '[data-buy]', el => { const st = n.stock[+el.dataset.buy]; const pr = buyPrice(n, st); if (p.cash < pr || st.n <= 0) return; if (World.freeSlots() <= 0 && !(!ITEMS[st.id].uses && World.has(st.id))) return toast('Pockets full.', 'bad'); p.cash -= pr; st.n--; World.addItem(st.id, 1, true); Sound.sfx('coin'); NPCs.addRel(n.id, 1); openTrade(n); });
    bind(s, '[data-sell]', el => { const sl = p.inv[+el.dataset.sell]; if (!sl) return; const pr = sellPrice(n, sl.id, sl); if (ITEMS[sl.id].uses) World.takeOne(sl); else World.removeItem(sl.id, 1); p.cash += pr; Sound.sfx('coin'); if (sl.id === 'coin' && n.id === 'vinnie') NPCs.addRel('vinnie', 5); openTrade(n); });
    s.querySelector('#tback').onclick = () => { closeAll(); Dialogue.open(n); };
    s.querySelector('#tc').onclick = closeAll;
  }

  function openJobs() {
    const p = G.player;
    let html = '<div class="box" style="width:480px"><h2>Job Board</h2><p>' + FAC.workText + ' Up to ' + TUNE.JOB_TASKS + ' tasks per shift at $' + TUNE.JOB_PAY + ' each. Current job: <b>' + (FAC.jobs[p.job] ? FAC.jobs[p.job].name : 'none') + '</b></p>';
    for (const k of Object.keys(FAC.boardJobs)) html += '<button class="btn" data-j="' + k + '"' + (p.job === k ? ' disabled' : '') + '>' + FAC.jobs[k].name + ' ' + FAC.boardJobs[k] + '</button>';
    html += '<p style="color:var(--dim)">' + FAC.boardNote + '</p><button class="btn" id="jbc">Close</button></div>';
    const s = panel(html, 'jobs');
    bind(s, '[data-j]', el => { p.job = el.dataset.j; toast('You now work in the ' + FAC.jobs[p.job].name + '.', 'good'); closeAll(); });
    s.querySelector('#jbc').onclick = closeAll;
  }

  function dialog(n, line, mood, opts) {
    root().innerHTML = '';
    open = 'dialog';
    const d = document.createElement('div'); d.className = 'dlg';
    d.innerHTML = '<div class="portrait"></div><div style="flex:1"><div class="who">' + U.esc(line.who) + '</div><div class="mood">' + mood + '</div><div class="txt">' + U.esc(line.text) + '</div><div class="opts"></div></div>';
    d.querySelector('.portrait').appendChild(Render.portrait(n));
    const box = d.querySelector('.opts');
    opts.forEach(([label, fn], i) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = (i + 1) + '. ' + label; b.onclick = () => { Sound.sfx('select'); fn(); }; box.appendChild(b); });
    root().appendChild(d);
    focusIdx = 0; markFocus();
    Input.clear();
  }
  function closeDialog() { if (open === 'dialog') closeAll(); }

  function endingPanel(scene, txt) {
    const auto = Game.slotMeta('auto');
    const e = scene.e;
    const s = panel('<div class="box" style="width:600px;margin-top:230px;background:rgba(27,34,44,.94)"><h2>' + U.esc(e.title) + '</h2><p>' + U.esc(txt) + '</p><p style="color:var(--dim)">Day ' + (G ? G.day : '?') + ' &middot; Endings found: ' + Profile.endingCount() + '/' + ENDINGS.length + '</p>' +
      (auto ? '<button class="btn" data-e="retry">Try again from this morning (Day ' + auto.day + ')</button>' : '') +
      '<button class="btn" data-e="new">New run (keep unlocks)</button><button class="btn" data-e="endings">View endings</button><button class="btn" data-e="menu">Main menu</button></div>', 'ending');
    s.style.background = 'transparent';
    bind(s, '[data-e]', el => {
      const a = el.dataset.e;
      if (a === 'retry') Game.load('auto');
      else if (a === 'new') { Game.toMenu(); openCreator(); }
      else if (a === 'endings') openEndings(() => endingPanel(scene, txt));
      else Game.toMenu();
    });
  }

  return { toast, banner, prompt, progress, showHud, sceneText, skipHint, refreshHotbar, updateHud, isOpen, closeAll, handleKeys,
    openMenu, openCreator, openPause, openInventory, openCraft, openJournal, openMap, openStash, openTrade, openJobs, dialog, closeDialog, endingPanel, openEndings, openSlots,
    wantIntro: () => introWanted, current: () => open };
})();
if (!window.CreatorDNA) window.CreatorDNA = Object.freeze({
  creator: 'Coolbros1418',
  gameId: GAME_ID,
  title: GAME_TITLE,
  version: GAME_VERSION,
  conceptTimestamp: '2026-10-09T15:22:00-04:00',
  status: 'pre-release'
});
(function main() {
  Render.init();
  Input.bindTouch();
  const wrap = document.getElementById('wrap');
  function resize() { const s = Math.min(window.innerWidth / TUNE.VIEW_W, window.innerHeight / TUNE.VIEW_H); wrap.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', resize); resize();
  const advance = () => { Sound.init(); if (Game.state() === 'intro') Input.press('use'); };
  document.getElementById('game').addEventListener('mousedown', advance);
  document.getElementById('game').addEventListener('touchstart', advance, { passive: true });
  Sound.setMood('scene');
  UI.openMenu();
  const STEP = 1 / 60;
  let last = performance.now(), acc = 0, menuT = 0;
  function tick(dt) {
    const st = Game.state();
    if ((st === 'menu' || st === 'ending') && UI.isOpen()) UI.handleKeys();
    Game.update(dt);
    Input.endFrame();
  }
  function draw(dt) {
    const st = Game.state();
    if (st === 'play' || st === 'transition') Render.frame(dt);
    else if ((st === 'intro' || st === 'ending') && Game.scene()) Scenes.draw(Game.scene());
    else { menuT += dt; Scenes.menuBackdrop(menuT); }
  }
  function loop(now) {
    const dt = Math.min(0.25, (now - last) / 1000); last = now; acc += dt;
    let n = 0;
    while (acc >= STEP && n < 5) { tick(STEP); acc -= STEP; n++; }
    if (n >= 5) acc = 0;
    try { draw(dt); } catch (e) { console.error(e); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
