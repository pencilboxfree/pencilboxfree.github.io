    if(isSolid(v))return{x:x*TS,y:y*TS,w:TS,h:TS,v};

function muffle(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1),st=Math.max(1,Math.round(d/14));let solid=0;
  for(let i=1;i<st;i++){const t=i/st;
    if(isSolid(tid(Math.floor((x1+(x2-x1)*t)/TS),Math.floor((y1+(y2-y1)*t)/TS))))solid++}
  return 1/(1+solid*.5);
}
 
function noiseAt(x,y,r,gain,quiet){
  if(!quiet)rings.push({x,y,r:0,max:r,life:.5,t:0});
  for(const e of ents){
    if(e.dead||e.ai!=='warden')continue;
    const ex=e.x+e.w/2,ey=e.y+e.h/2,d=Math.hypot(ex-x,ey-y);
    if(d>r)continue;
    const g=gain*Math.pow(1-d/r,.7)*muffle(x,y,ex,ey);
    if(g<=0)continue;
    const was=e.alert||0;
    e.alert=clamp(was+g,0,1);
    e.heard={x,y};e.calmT=.7;
    if(e.alert>=1){e.hunt=true;e.track=2.4}
    else if(e.alert>.2&&!e.hunt&&was<=.2){SFX.listen();
      if(!S.flags.wardenHint){S.flags.wardenHint=1;
        showMsg('SOMETHING DOWN HERE HEARD YOU. HOLD [CTRL] TO MOVE QUIETLY.',4.2)}}
  }
}

function updEnemy(e,dt){
  if(e.dead)return;
  e.anim+=dt*8;e.flash=Math.max(0,e.flash-dt);e.cd=Math.max(0,e.cd-dt);
  const px=P.x+P.w/2,py=P.y+P.h/2,ex=e.x+e.w/2,ey=e.y+e.h/2;
  const dx=px-ex,dy=py-ey,dist=Math.hypot(dx,dy);
  if(dist>1500&&!e.boss&&e.ai!=='arrow'&&e.ai!=='wave'&&e.ai!=='parrow'){
    if(!e.alarm){e.x=e.home.x-e.w/2;e.y=e.home.y-e.h;e.hp=e.maxhp;e.aggro=false}
    return}
  if(dist<360&&!P.dead&&e.ai!=='warden')e.aggro=true;
  if(e.ai!=='fly'&&e.ai!=='wraith'&&e.ai!=='arrow'&&e.ai!=='wave'&&e.ai!=='parrow'){e.vy+=2000*dt;e.vy=Math.min(e.vy,940)}
  switch(e.ai){
   case 'walk':{
     if(e.aggro)e.face=dx>0?1:-1;
     e.vx=lerp(e.vx,e.face*e.sp*(e.aggro?1:.55),dt*8);
     if(e.bumpX)e.face*=-1;
     const ahead={x:e.x+(e.face>0?e.w+2:-6),y:e.y+e.h+2,w:4,h:6};
     if(e.onGround&&!tileSolidRect(ahead,true))e.face*=-1;
     break}
   case 'shoot':{
     e.face=dx>0?1:-1;e.vx*=.85;
     if(e.aggro&&dist<460&&e.cd<=0&&Math.abs(dy)<110){e.cd=1.5;
       ents.push({t:'arrow',ai:'arrow',x:ex,y:ey-2,w:14,h:6,vx:e.face*300,vy:0,hp:1,dmg:1,col:'#ddd',life:2.4,anim:0,home:{x:ex,y:ey}});
       tone(620,.07,'square',.04,300)}
     break}
   case 'fly':{
     if(e.aggro&&dist<560){e.vx=lerp(e.vx,dx/dist*e.sp,dt*3);e.vy=lerp(e.vy,dy/dist*e.sp*.8+Math.sin(e.anim)*40,dt*3)}
     else{e.vx=lerp(e.vx,Math.cos(e.anim*.4)*60,dt*2);e.vy=lerp(e.vy,Math.sin(e.anim*.6)*45,dt*2)}
     e.face=e.vx>0?1:-1;break}
   case 'charge':{
     e.face=dx>0?1:-1;
     if(e.st===0){e.vx*=.9;if(e.aggro&&Math.abs(dy)<80&&dist<420&&e.cd<=0){e.st=1;e.stT=.45;tone(160,.3,'sawtooth',.05,90)}}
     else if(e.st===1){e.vx*=.8;e.stT-=dt;if(e.stT<=0){e.st=2;e.stT=1;e.vx=e.face*e.sp*2.2}}
     else{e.stT-=dt;if(e.stT<=0||e.bumpX){e.st=0;e.cd=1.1;e.vx*=.3}}
     break}
   case 'captain':{
     e.face=dx>0?1:-1;
     if(e.st===0){e.vx=lerp(e.vx,e.face*e.sp,dt*6);
       if(dist<130&&e.cd<=0){e.st=1;e.stT=.42;e.vx=0;tone(200,.24,'square',.05,120)}
       else if(dist>340&&e.cd<=0&&Math.random()<dt*.8){e.st=2;e.stT=.9;e.vx=e.face*e.sp*2.4}}
     else if(e.st===1){e.stT-=dt;e.vx*=.7;
       if(e.stT<=0){e.st=0;e.cd=1;shake=11;noise(.2,.1,300);boom(e.x+e.w/2,e.y+e.h,12,'#caa',200);
         if(Math.abs(dx)<95&&Math.abs(dy)<80)hurtPlayer(e.dmg,Math.sign(dx))}}
     else{e.stT-=dt;if(e.stT<=0||e.bumpX){e.st=0;e.cd=1.3;e.vx*=.2}}
     break}
   case 'king':{
     e.face=dx>0?1:-1;e.stT-=dt;
     if(e.stT<=0){const r=Math.random();
       if(r<.4){e.st=1;e.stT=1.1;e.vx=e.face*e.sp*2.3;tone(120,.4,'sawtooth',.05,70)}
       else if(r<.75){e.st=2;e.stT=1.2;e.vy=-720;tone(180,.4,'square',.05,90)}
       else{e.st=3;e.stT=1.4;e.vx=0;
         for(let i=0;i<2;i++){const g=spawnEnemy('grunt',e.x+rnd(-160,160),e.y);if(g)g.aggro=true}
         tone(90,.5,'sawtooth',.06,50)}}
     if(e.st===1){if(e.bumpX){e.st=0;e.stT=.7;e.vx*=-.2}}
     else if(e.st===2){if(e.onGround&&e.stT<.9){e.st=0;e.stT=.8;shake=15;noise(.25,.12,220);
       boom(e.x+e.w/2,e.y+e.h,16,'#fd6',260);
       if(Math.abs(dx)<160&&Math.abs(dy)<100)hurtPlayer(e.dmg,Math.sign(dx))}}
     else if(e.st===3)e.vx*=.85;
     else e.vx=lerp(e.vx,e.face*e.sp*.7,dt*4);
     break}
   case 'warden':{
      
     if(e.alert==null){e.alert=0;e.press=0;e.recover=0;e.tele=0;e.mode=0;
       e.heard=null;e.track=0;e.hunt=false;e.calmT=0;e.sweep=0}
     e.recover=Math.max(0,e.recover-dt);e.vuln=e.recover>0;
     e.track=Math.max(0,e.track-dt);
      
     e.calmT=Math.max(0,(e.calmT||0)-dt);
     if(e.calmT<=0)e.alert=clamp(e.alert-dt*(e.hunt?.1:.16),0,1);
     if(e.hunt&&e.alert<.45&&e.track<=0){e.hunt=false;e.mode=0;e.tele=0;e.press=0;
       e.heard=e.heard||{x:e.x+e.w/2,y:e.y+e.h/2};if(dist<900)showMsg('IT LOST YOU.',2)}
     if(e.hunt&&!e.aggro){e.aggro=true;SFX.hunt();shake=Math.max(shake,8);
       if(!S.flags.wardenHunt){S.flags.wardenHunt=1;showMsg('IT HEARD THAT.',2.6)}}
     if(!e.hunt&&e.aggro&&e.alert<.2){e.aggro=false;if(bossBar&&bossBar.e===e)bossBar=null}
      
     let tgt=null;
     if(e.hunt)tgt=e.track>0?{x:px,y:py}:(e.heard||null);
     else if(e.alert>.2)tgt=e.heard;
     const hx=tgt?tgt.x-(e.x+e.w/2):0;
     const near=tgt?Math.hypot(hx,tgt.y-(e.y+e.h/2)):1e9;
     if(tgt&&Math.abs(hx)>16)e.face=hx>0?1:-1;
     if(e.hunt)e.press=(near<150)?e.press+dt:Math.max(0,e.press-dt*1.5);
     else e.press=0;
     if(e.mode===0){
       if(e.hunt){
         e.vx=lerp(e.vx,e.face*e.sp*(near>260?1.3:.85),dt*3);
         if(e.cd<=0){
           if(e.press>2.6){e.mode=3;e.tele=.5;e.vx=0;tone(70,.5,'sawtooth',.06,40);shake=6}
           else if(dist<130&&Math.abs(dy)<70){e.mode=1;e.tele=.55;e.vx=0;tone(120,.45,'square',.05,70)}
           else if(near<620){e.mode=2;e.tele=.7;e.vx=0;tone(90,.6,'sawtooth',.05,55)}
         }
       } else if(e.alert>.2&&tgt){
          
         if(Math.abs(hx)>34){e.vx=lerp(e.vx,e.face*e.sp*.62,dt*3);e.sweep=0}
         else{e.vx*=.82;e.sweep+=dt;
           if(e.sweep>1.1){e.sweep=0;e.face*=-1;tone(150,.18,'sine',.03,110)}}
       } else {
          
         const hb=e.home.x-(e.x+e.w/2);
         if(Math.abs(hb)>40){e.face=hb>0?1:-1;e.vx=lerp(e.vx,e.face*e.sp*.4,dt*2)}
         else e.vx*=.86;
         if(e.alert<=0)e.heard=null;
       }
     } else {
       e.vx*=.8;e.tele-=dt;
       if(e.tele<=0){
         if(e.mode===1){shake=16;noise(.28,.13,240);boom(e.x+e.w/2,e.y+e.h,20,'#7ce0d6',260);
           if(dist<150&&Math.abs(dy)<90)hurtPlayer(e.dmg,Math.sign(dx))}
         if(e.mode===2||e.mode===3){
           const n=e.mode===3?4:2;shake=12;noise(.3,.1,180);
           for(let i=0;i<n;i++){const d2=(i%2)?1:-1,off=(i>1?26:0);
             ents.push({t:'wave',ai:'wave',x:e.x+e.w/2-16,y:e.y+e.h-30-off,w:32,h:30,vx:d2*300,vy:0,
               hp:1,dmg:2,col:'#7ce0d6',life:2.3,anim:0,home:{x:e.x,y:e.y}})}
           if(e.mode===3&&dist<170)hurtPlayer(e.dmg,Math.sign(dx));
         }
         e.mode=0;e.cd=1.7;e.recover=1.25;e.press=0;
       }
     }
      
     if(Math.hypot(e.x-e.home.x,e.y-e.home.y)>900){e.x=e.home.x-e.w/2;e.y=e.home.y-e.h;e.vx=0;e.mode=0;e.tele=0;
       e.hunt=false;e.alert=Math.min(e.alert,.3);e.track=0}
     break}
   case 'wave':{
     e.life-=dt;e.anim+=dt;e.x+=e.vx*dt;
     const probe={x:e.x+(e.vx>0?e.w-6:0),y:e.y+6,w:6,h:e.h-8};
     if(e.life<=0||tileSolidRect(probe))e.dead=true;
      
     const below={x:e.x+8,y:e.y+e.h,w:e.w-16,h:6};
     if(!tileSolidRect(below,true)&&e.y<MH*TS-200)e.y+=190*dt;
     const up={x:e.x+8,y:e.y+e.h-14,w:e.w-16,h:8};
     if(tileSolidRect(up))e.y-=170*dt;
     if(!P.dead&&hit(e,P)){hurtPlayer(e.dmg,Math.sign(e.vx));e.dead=true}
     return}
   case 'wraith':{
     e.face=dx>0?1:-1;e.stT-=dt;
     const tx=P.x+Math.cos(e.anim*.7)*190,ty=P.y-70+Math.sin(e.anim*.9)*80;
     e.vx=lerp(e.vx,(tx-e.x)*1.6,dt*3);e.vy=lerp(e.vy,(ty-e.y)*1.6,dt*3);
     if(e.stT<=0){e.stT=1.4;
       for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2+e.anim;
         ents.push({t:'orb',ai:'arrow',x:ex,y:ey,w:12,h:12,vx:Math.cos(a)*170,vy:Math.sin(a)*170,hp:1,dmg:1,col:'#7ce0d6',life:3,anim:0,home:{x:ex,y:ey}})}
       tone(700,.3,'triangle',.05,300)}
     break}
   case 'parrow':{
     e.life-=dt;e.vy+=330*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.anim+=dt;
     if(e.life<=0){e.dead=true;return}
     if(tileSolidRect(e)){
       e.dead=true;SFX.stick();boom(e.x,e.y,4,'#cdbf9a',90);
        
       noiseAt(e.x,e.y,540,.45);
       const d=PROPW.spentarrow;
       props.push({t:'spentarrow',key:null,x:e.x-d[0]/2,y:e.y-d[1]/2,w:d[0],h:d[1],life:26});
       return}
     for(const o of props){
       if(o.t!=='target'&&o.t!=='bullseye'&&o.t!=='crate'&&o.t!=='statue'&&o.t!=='well')continue;
       if(!hit(e,o))continue;
       hitProp(o);e.dead=true;noiseAt(e.x,e.y,540,.45);break}
     if(e.dead)return;
     for(const q of ents){
       if(q.dead||q===e||q.ai==='wave'||q.ai==='arrow'||q.ai==='parrow'||q.ai==='orb')continue;
       if(!hit(e,q))continue;
       damageEnemy(q,e.dmg,Math.sign(e.vx));e.dead=true;
       if(q.ai!=='warden')noiseAt(e.x,e.y,330,.3);
       break}
     return}
   case 'arrow':{
     e.life-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.anim+=dt;
     if(e.life<=0||tileSolidRect(e))e.dead=true;
     if(!P.dead&&hit(e,P)){hurtPlayer(e.dmg,Math.sign(e.vx));e.dead=true}
     return}
  }
  moveBody(e,e.vx*dt,0);moveBody(e,0,e.vy*dt);
  if(e.y>MH*TS+300)e.dead=true;
  if(!P.dead&&P.inv<=0&&hit(e,P)){
    if(e.ai==='warden'&&!e.hunt){noiseAt(P.x+P.w/2,P.y+P.h/2,120,1);showMsg('YOU TOUCHED IT.',2)}
    else hurtPlayer(e.dmg,Math.sign((P.x+P.w/2)-(e.x+e.w/2)));
  }
  if(e.boss&&e.aggro&&Math.hypot((P.x-e.x),(P.y-e.y))<760)bossBar={e};
  else if(bossBar&&bossBar.e===e&&(e.dead||Math.hypot((P.x-e.x),(P.y-e.y))>900))bossBar=null;
}

 
function endGame(kind){
  let id,title,text;
  const secrets=Object.keys(S.flags).filter(f=>f.startsWith('seen_')).length;
  if(kind==='universe'){id='universe';title='ENDING — THE CONNECTION';
   text='Five worlds, one mark, and a hallway that was never in the castle plans.\nThe castle was only the door.\nSomewhere an archer, a skater, a driver and something very wrapped up\nall looked up at exactly the same moment.';}
  else if(S.flags.signalBeaten){id='true';title='TRUE ENDING — THE SIGNAL';

  ending={id,title,text,time:timeT,kills:S.kills,chaos:S.chaos,marks:S.marks.length,secrets,map:Object.keys(explored).length};

function glyph(cx,cy,r,c){

  X.beginPath();X.moveTo(cx,cy-r);X.lineTo(cx+r*.86,cy+r*.5);X.lineTo(cx-r*.86,cy+r*.5);X.closePath();X.stroke();

function drawTiles(){
  const p=PAL[curArea.pal];
  const x0=Math.max(0,Math.floor((cam.x-W/2)/TS)-1),x1=Math.min(MW-1,Math.floor((cam.x+W/2)/TS)+1);
  const y0=Math.max(0,Math.floor((cam.y-H/2)/TS)-1),y1=Math.min(MH-1,Math.floor((cam.y+H/2)/TS)+1);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const v=tid(x,y);if(v===0)continue;
    const px=x*TS,py=y*TS;
    if(v===3){rect(px,py,TS,6,p.t2);rect(px,py+6,TS,3,p.t3);continue}
    if(v===4){rect(px,py+16,TS,8,p.t3);X.fillStyle='#c9ccd4';
      for(let i=0;i<3;i++){X.beginPath();X.moveTo(px+i*8,py+TS);X.lineTo(px+4+i*8,py+8);X.lineTo(px+8+i*8,py+TS);X.fill()}continue}
    if(v===5){rect(px,py,TS,TS,'rgba(60,150,160,.42)');
      X.fillStyle='rgba(160,240,245,.16)';X.fillRect(px,py+Math.sin(timeT*2+x*.6)*2,TS,3);continue}
    const top=!isSolid(tid(x,y-1));
    rect(px,py,TS,TS,((x+y)%2)?p.t1:p.t3);

    X.fillStyle='rgba(0,0,0,.22)';X.fillRect(px,py+TS-2,TS,2);X.fillRect(px+TS-2,py,2,TS);

}

}

const CARD={
 silent:{big:'HE DIDN\'T EVEN FIGHT?!',sub:'(the guards are still waiting)',c1:'#1b3a5c',c2:'#2a6ea8',art:'silent'},
 chaos:{big:'THE CASTLE IS GONE?!',sub:'(structurally speaking)',c1:'#5c1b1b',c2:'#a83a2a',art:'chaos'},
 crown:{big:'HE JUST SAT DOWN?!',sub:'(and never got up)',c1:'#5c4a1b',c2:'#c9a227',art:'crown'},
 true:{big:'IT WAS UNDER THE CASTLE?!',sub:'(the whole time)',c1:'#123a3a',c2:'#2fa89c',art:'true'},
 universe:{big:'ALL FIVE WERE CONNECTED?!',sub:'(nobody was supposed to notice)',c1:'#15203a',c2:'#7ce0d6',art:'universe'}
};
function drawCardArt(kind,cx,cy){
  X.save();X.translate(cx,cy);
  const t=timeT;
  const stick=(x,y,col,arm)=>{
    X.strokeStyle='#1a1a22';X.lineWidth=5;X.lineCap='round';
    X.beginPath();X.moveTo(x-6,y+18);X.lineTo(x,y+2);X.lineTo(x+6,y+18);X.stroke();
    X.fillStyle=col;X.fillRect(x-8,y-14,16,20);
    X.fillStyle='#f0c9a0';X.beginPath();X.arc(x,y-20,9,0,7);X.fill();
    if(arm){X.strokeStyle='#c9ccd4';X.lineWidth=5;X.beginPath();X.moveTo(x+6,y-8);X.lineTo(x+24,y-24);X.stroke()}
    X.lineWidth=1;
  };
  if(kind==='silent'){
    X.fillStyle='#0f2038';X.fillRect(-150,-70,300,150);
    for(let i=0;i<4;i++){const gx=-100+i*66;
      X.fillStyle='#6a7f8d';X.fillRect(gx-9,10,18,22);
      X.fillStyle='#f0c9a0';X.beginPath();X.arc(gx,2,8,0,7);X.fill();
      txt('z',gx+12,-6-((i*3)%6),13,'rgba(255,255,255,.6)','center',900)}
    stick(0,-16,'#3f6ea8',0);
    txt('...',0,-52,26,'#ffe9a8','center',900);
  } else if(kind==='chaos'){
    X.fillStyle='#2a1010';X.fillRect(-150,-70,300,150);
    for(let i=0;i<12;i++){const rx=-140+((i*37)%280),ry=20+((i*23)%50);
      X.fillStyle=i%2?'#5a4a44':'#3a2e2a';X.fillRect(rx,ry,26,18)}
    for(let i=0;i<5;i++){const fx=-110+i*55,fy=Math.sin(t*8+i)*4;
      X.fillStyle='#ff8a2a';X.beginPath();X.moveTo(fx,-4+fy);X.lineTo(fx+11,26);X.lineTo(fx-11,26);X.closePath();X.fill();
      X.fillStyle='#ffe08a';X.beginPath();X.moveTo(fx,10+fy);X.lineTo(fx+5,26);X.lineTo(fx-5,26);X.closePath();X.fill()}
    stick(0,-24,'#3f6ea8',1);
  } else if(kind==='crown'){
    X.fillStyle='#2a2010';X.fillRect(-150,-70,300,150);
    X.fillStyle='#8a6a2a';X.fillRect(-42,-16,84,96);X.fillStyle='#c9a227';X.fillRect(-52,-40,104,26);
    stick(0,-14,'#3f6ea8',0);
    X.fillStyle='#ffd166';X.beginPath();X.moveTo(-16,-38);X.lineTo(-10,-56);X.lineTo(0,-42);X.lineTo(10,-56);X.lineTo(16,-38);X.fill();
    txt('...',44,-30,20,'rgba(255,255,255,.5)','center',900);
  } else if(kind==='true'){
    X.fillStyle='#08201f';X.fillRect(-150,-70,300,150);
    X.save();X.globalCompositeOperation='lighter';
    const g=X.createRadialGradient(0,-10,0,0,-10,130);
    g.addColorStop(0,'rgba(124,224,214,.35)');g.addColorStop(1,'rgba(124,224,214,0)');
    X.fillStyle=g;X.beginPath();X.arc(0,-10,130,0,7);X.fill();X.restore();
    for(let i=0;i<6;i++){const a=i/6*6.28+t*.6,r=52;
      glyph(Math.cos(a)*r,-10+Math.sin(a)*r*.5,9,'rgba(124,224,214,.7)')}
    glyph(0,-14,26,'#bffcf6');
    stick(-96,26,'#3f6ea8',1);
  } else {
    X.fillStyle='#0a1420';X.fillRect(-150,-70,300,150);
    const items=['bow','board','sword','bike','car'];
    for(let i=0;i<5;i++){const gx=-116+i*58,gy=18;
      X.fillStyle='#16323a';X.fillRect(gx-14,gy,28,22);
      glyph(gx,gy-16+Math.sin(t*2+i)*3,10,'#7ce0d6');
      X.fillStyle='#7ce0d6';
      if(items[i]==='bow'){X.strokeStyle='#c9b58a';X.lineWidth=2;X.beginPath();X.arc(gx,gy+10,8,-1.1,1.1);X.stroke();X.lineWidth=1}
      if(items[i]==='board'){X.fillStyle='#c94a7f';X.fillRect(gx-10,gy+8,20,4)}
      if(items[i]==='sword'){X.fillStyle='#c9ccd4';X.fillRect(gx-2,gy+2,4,16)}
      if(items[i]==='bike'){X.fillStyle='#c93a3a';X.fillRect(gx-9,gy+8,18,5)}
      if(items[i]==='car'){X.fillStyle='#e05a4a';X.fillRect(gx-11,gy+8,22,7)}
    }
    stick(0,-30,'#3f6ea8',0);
    txt('?!',56,-44,26,'#ffe9a8','center',900);
  }
  X.restore();
}
function drawEnding(){
  const cd=CARD[ending.id]||CARD.crown;
  const g=X.createLinearGradient(0,0,W,H);g.addColorStop(0,cd.c1);g.addColorStop(1,'#05070c');
  X.fillStyle=g;X.fillRect(0,0,W,H);
   
  X.save();X.translate(W/2,214);
  X.fillStyle='rgba(255,255,255,.06)';
  for(let i=0;i<16;i++){const a=i/16*6.28+timeT*.15;
    X.beginPath();X.moveTo(0,0);X.lineTo(Math.cos(a)*520,Math.sin(a)*520);
    X.lineTo(Math.cos(a+.16)*520,Math.sin(a+.16)*520);X.fill()}

  X.fillStyle=cd.c2;X.fillText(cd.big,0,0);

  txt(cd.sub,W/2,H-142,13,'rgba(255,255,255,.6)','center',700);

  ending.text.split('\n').slice(0,2).forEach((l,i)=>txt(l,W/2,H-92+i*18,11,'rgba(255,255,255,.55)','center',600));
  txt('TIME '+ending.time.toFixed(1)+'s   KILLS '+ending.kills+'   CHAOS '+ending.chaos+
      '   MARKS '+ending.marks+'/5   SECRET AREAS '+ending.secrets+'   MAP '+ending.map,
      W/2,H-48,11,'rgba(124,224,214,.85)','center',700);
  txt('ENDINGS FOUND '+META.endings.length+'/5'+(META.endings.length<5?'   —   THE OTHERS ARE STILL IN THERE':''),
      W/2,H-30,11,'rgba(255,255,255,.5)','center',700);
  txt('ENTER — NEW RUN',W/2,H-10,14,Math.sin(timeT*4)>0?'#ffe9a8':'rgba(255,233,168,.4)','center',900);
}

 
const INTRO=[
 {d:3.0,art:'castle',t:['A LETTER CAME FROM THE CASTLE.']},
 {d:3.2,art:'letter',t:['IT SAID: COME AT ONCE.','IT DID NOT SAY WHY.']},
 {d:3.2,art:'gate',t:['THE GATE WAS ALREADY OPEN.','THE GUARDS WERE ALREADY GONE.']},
 {d:3.4,art:'mark',t:['SOMEBODY HAS BEEN CUTTING THE SAME MARK','INTO THE WALLS. FIVE TIMES.']},
 {d:3.0,art:'hero',t:['YOU HAVE A SWORD, NO PLAN,','AND the whole castle to yourself.']}
];
let introI=0,introT=0;
function updIntro(dt){
  introT+=dt;
  if(press.start||press.jump||press.atk){introI=INTRO.length}
  if(introI<INTRO.length&&introT>=INTRO[introI].d){introI++;introT=0;if(introI<INTRO.length)SFX.door()}
  if(introI>=INTRO.length){state='play';SFX.mark();showMsg('FIND OUT WHY YOU WERE CALLED.',3.4)}
}
function drawIntro(){
  X.fillStyle='#05060a';X.fillRect(0,0,W,H);
  const sc=INTRO[Math.min(introI,INTRO.length-1)];
  const a=clamp(Math.min(introT*2.2,(sc.d-introT)*2.2),0,1);
  X.globalAlpha=a;
  X.save();X.translate(W/2,H/2-40);
  const t=timeT;
  if(sc.art==='castle'){
    X.fillStyle='#141a2c';X.fillRect(-190,-10,380,120);
    X.fillStyle='#1d2540';X.fillRect(-150,-70,60,180);X.fillRect(90,-70,60,180);X.fillRect(-30,-110,60,220);
    X.fillStyle='#0d1020';for(let i=0;i<7;i++)X.fillRect(-170+i*50,20,18,26);
    X.fillStyle='#ffb03a';X.fillRect(-14,60,28,50);
    X.fillStyle='rgba(255,180,80,.10)';X.beginPath();X.arc(0,80,120,0,7);X.fill();
    for(let i=0;i<3;i++){X.fillStyle='#2a3350';
      X.beginPath();X.moveTo(-150+i*120,-70);X.lineTo(-120+i*120,-110);X.lineTo(-90+i*120,-70);X.fill()}
  } else if(sc.art==='letter'){
    X.save();X.rotate(Math.sin(t*.8)*.04);
    X.fillStyle='#e6dcc0';X.fillRect(-130,-80,260,170);
    X.fillStyle='#8a7f66';for(let i=0;i<6;i++)X.fillRect(-100+((i%2)*20),-40+i*22,180-((i*13)%60),5);
    X.fillStyle='#a33048';X.beginPath();X.arc(90,60,20,0,7);X.fill();
    glyph(90,60,10,'rgba(255,233,168,.8)');X.restore();
  } else if(sc.art==='gate'){
    X.fillStyle='#12162a';X.fillRect(-200,-100,400,220);
    X.fillStyle='#05060a';X.fillRect(-70,-60,140,180);
    X.fillStyle='#2a3350';X.fillRect(-92,-70,24,190);X.fillRect(68,-70,24,190);
    X.fillStyle='#5a5a66';for(let i=0;i<5;i++)X.fillRect(-66+i*28,-60,6,60);
    X.fillStyle='#ffb03a';X.beginPath();X.arc(-120,10,7,0,7);X.arc(120,10,7,0,7);X.fill();
    X.fillStyle='rgba(255,180,80,.08)';X.beginPath();X.arc(-120,10,70,0,7);X.arc(120,10,70,0,7);X.fill();
  } else if(sc.art==='mark'){
    X.fillStyle='#10141f';X.fillRect(-200,-110,400,230);
    X.fillStyle='rgba(255,255,255,.04)';
    for(let y=-110;y<120;y+=28)for(let x=-200;x<200;x+=56)X.fillRect(x+((y/28|0)%2)*28,y,52,24);
    for(let i=0;i<5;i++){const gx=-140+i*70,gy=Math.sin(t*1.4+i)*6;
      X.save();X.globalCompositeOperation='lighter';
      const g=X.createRadialGradient(gx,gy,0,gx,gy,54);
      g.addColorStop(0,'rgba(124,224,214,.30)');g.addColorStop(1,'rgba(124,224,214,0)');
      X.fillStyle=g;X.beginPath();X.arc(gx,gy,54,0,7);X.fill();X.restore();
      glyph(gx,gy,17,'#7ce0d6')}
  } else {
    X.fillStyle='#12162a';X.fillRect(-200,-110,400,230);
    X.fillStyle='#0d1020';X.fillRect(-200,90,400,30);
    const bx=-20,by=10;
    X.strokeStyle='#2b2f4a';X.lineWidth=6;X.lineCap='round';
    X.beginPath();X.moveTo(bx+8,by+30);X.lineTo(bx+2,by+60);X.moveTo(bx+22,by+30);X.lineTo(bx+30,by+60);X.stroke();
    X.fillStyle='#7a2436';X.beginPath();X.moveTo(bx+4,by-14);X.lineTo(bx-24,by+40+Math.sin(t*2)*5);X.lineTo(bx+8,by+34);X.fill();
    X.fillStyle='#3f6ea8';X.fillRect(bx+2,by-14,26,44);
    X.fillStyle='#f0c9a0';X.beginPath();X.arc(bx+15,by-26,13,0,7);X.fill();
    X.fillStyle='#c9ccd4';X.fillRect(bx-2,by-40,34,7);
    X.strokeStyle='#c9ccd4';X.lineWidth=6;X.beginPath();X.moveTo(bx+30,by+2);X.lineTo(bx+60,by-34);X.stroke();X.lineWidth=1;
  }
  X.restore();
  const lines=sc.t;
  lines.forEach((l,i)=>txt(l.toUpperCase(),W/2,H-118+i*28,17,'#ffe9a8','center',800));
  X.globalAlpha=1;
  for(let i=0;i<INTRO.length;i++){X.fillStyle=i<=introI?'rgba(255,233,168,.8)':'rgba(255,255,255,.15)';
    X.fillRect(W/2-INTRO.length*9+i*18,H-46,12,3)}
  txt('SPACE — SKIP',W/2,H-24,11,'rgba(255,255,255,.35)','center',700);
}

 
let last=performance.now();
state='title';cam={x:0,y:0};timeT=0;
newGame();state='title';

function update(dt){
  timeT+=dt;
  if(press.mute){musicOn=!musicOn;showMsg(musicOn?'MUSIC ON':'MUSIC OFF',1.2)}
  if(state==='title'){
    if(press.cont){if(loadGame()){state='play';SFX.door();showMsg('RUN RESTORED',2)}else showMsg('NO SAVED RUN',2)}
    else if(press.start){newGame();state='intro';introI=0;introT=0;SFX.door()}
    return}
  if(state==='intro'){updIntro(dt);return}
  if(state==='dead'){if(press.start){P.hp=S.maxhp;respawn(false);state='play'}return}
  if(state==='ending'){if(press.start){newGame();state='play'}return}
  if(press.map)state=state==='map'?'play':'map';
  if(state==='map')return;
  if(press.pause)state=state==='pause'?'play':'pause';
  if(state==='pause')return;
  if(press.respawn){respawn(false);showMsg('RETURNED TO THE LAST BRAZIER',2)}
  S.time=timeT;
  music(dt,curArea.mood);
  fade=lerp(fade,fadeTo,Math.min(1,dt*8));
  if(hitstop>0){hitstop-=dt;return}
  if(shake>0)shake=Math.max(0,shake-40*dt);
  if(flash.t>0)flash.t-=dt;
  if(msgT>0)msgT-=dt;
  if(bannerT>0)bannerT-=dt;
  updPlayer(dt);
  for(const e of ents)updEnemy(e,dt);
  ents=ents.filter(e=>!e.dead);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life)parts.splice(i,1)}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt;r.r=r.max*clamp(r.t/r.life,0,1);if(r.t>r.life)rings.splice(i,1)}
  for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.life+=dt;p.y-=30*dt;if(p.life>1.2)popups.splice(i,1)}
  const tx=P.x+P.w/2+P.face*30,ty=P.y+P.h/2-30;
  cam.x=lerp(cam.x,tx,Math.min(1,dt*6));cam.y=lerp(cam.y,ty,Math.min(1,dt*5));
  cam.x=clamp(cam.x,W/2,MW*TS-W/2);cam.y=clamp(cam.y,H/2,MH*TS-H/2);
}
function render(){
  X.setTransform(1,0,0,1,0,0);
  if(state==='title'){drawTitle();return}
  if(state==='intro'){drawIntro();return}
  const p=PAL[curArea.pal];
  const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,p.bg);g.addColorStop(1,p.bg2);
  X.fillStyle=g;X.fillRect(0,0,W,H);
  X.globalAlpha=.2;X.fillStyle=p.t3;
  const ox=-cam.x*.25%96,oy=-cam.y*.25%48;
  for(let y=-48;y<H+48;y+=48)for(let x=-96;x<W+96;x+=96)X.fillRect(x+ox+((y/48|0)%2)*48,y+oy,88,42);
  X.globalAlpha=1;
  X.save();
  if(shake>0)X.translate(rnd(-shake,shake)*.4,rnd(-shake,shake)*.4);
  X.translate(W/2-cam.x,H/2-cam.y);
  drawTiles();
  const L=cam.x-W/2-160,R=cam.x+W/2+160,T=cam.y-H/2-160,B=cam.y+H/2+160;
  for(const o of props)if(o.x<R&&o.x+o.w>L&&o.y<B&&o.y+o.h>T)drawProp(o);
  for(const e of ents)if(e.x<R&&e.x+e.w>L&&e.y<B&&e.y+e.h>T)drawEnemy(e);
  drawPlayer();
  for(const q of parts){X.globalAlpha=clamp(1-q.t/q.life,0,1);rect(q.x,q.y,q.s,q.s,q.c)}
  X.globalAlpha=1;
  for(const r of rings){const a=clamp(1-r.t/r.life,0,1)*.34;
    X.strokeStyle='rgba(255,255,255,'+a.toFixed(3)+')';X.lineWidth=r.max>450?1:1.4;
    X.beginPath();X.arc(r.x,r.y,Math.max(2,r.r),0,7);X.stroke()}
  X.lineWidth=1;
  X.globalAlpha=1;X.restore();
  const vg=X.createRadialGradient(W/2,H/2,190,W/2,H/2,540);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');
  X.fillStyle=vg;X.fillRect(0,0,W,H);
  if(flash.t>0){X.fillStyle=flash.c;X.globalAlpha=clamp(flash.t*2,0,.5);X.fillRect(0,0,W,H);X.globalAlpha=1}
  if(fade>.01){X.fillStyle='rgba(0,0,0,'+clamp(fade,0,1)+')';X.fillRect(0,0,W,H)}
  ui();
  if(state==='map')drawMap();
  if(state==='pause'){X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,0,W,H);
    txt('PAUSED',W/2,H/2,34,'#fff','center',900);txt('P to resume',W/2,H/2+28,12,'rgba(255,255,255,.6)','center',700)}
  if(state==='dead')drawDead();
  if(state==='ending')drawEnding();
}
function loop(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  update(dt);render();press={};
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
