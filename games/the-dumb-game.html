function ambientLines(n){
  const a=ARCH[n.arch];
  if(Math.random()<.32){const r=reactLine();if(r)return r}
  const l=a[2];
  return l.map(x=>[n.name,x[0]]);
}
function reactLine(){
  const o=[];
  if(F.crowdSeen)o.push([['Person','"Wasn\'t that the guy who just stood there?"'],['Greg','"..."']]);
  if(F.crash)o.push([['Person','"I saw what you did to that trash can."'],['Greg','"It moved first."']]);
  if(F.jobsDone>0)o.push([['Person','"You have a job now?"'],['Greg','"Several."'],['Person','"Wow."']]);
  if(Q.count()>=3)o.push([['Person','"You\'re the one who helps people."'],['Greg','"Apparently."']]);
  if(F.projectdumb&&Math.random()<.5)o.push([['Person','"Hey, weren\'t you supposed to be filming something?"'],['Greg','"...No."'],['Person','"Okay."']]);
  if(F.stole)o.push([['Person','"That\'s not your car."'],['Greg','"It is now."'],['Person','"Fair."']]);
  const eq=eqList();
  if(eq.length){
    const c=COSI[pick(eq)];
    if(c.c==='hat')o.push([['Person','"Nice hat."'],['Greg','"Thanks."'],['Person','"Why?"'],['Greg','"It was $'+c.p+'."'],['Person','"Fair enough."']]);
    if(c.id==='floatsand')o.push([['Person','"Is that a sandwich?"'],['Greg','"..."'],['Person','"Okay."']]);
    if(c.id==='sh_npc')o.push([['Person','"Are you one of us?"'],['Greg','"No."'],['Person','"Okay."']]);
    if(c.c==='shoes')o.push([['Person','"Those are shoes."'],['Greg','"Yes."']]);
    if(c.c==='acc')o.push([['Person','"Why are you carrying that?"'],['Greg','"It came with the outfit."']]);
  }
  return o.length?pick(o):null;
}
(function populate(){
  let i=0;
  SPOTS.forEach(sp=>{
    const n=sp[4]||6;
    for(let k=0;k<n;k++,i++){
      const a=ri(0,ARCH.length-1);
      const npc={id:'amb'+i,name:ARCH[a][0],map:'town',arch:a,col:ARCH[a][1],
        x:sp[0]+rnd(0,sp[2]),y:sp[1]+rnd(0,sp[3]),
        beh:pick(['wander','stand','stand','phone','sit','walk2','pair']),ambient:1,
        cos:Math.random()<.45?[pick(NPC_COS)].concat(Math.random()<.3?[pick(NPC_COS)]:[]):null};
      npc.talk=()=>ambientLines(npc);
      NPCS.push(npc);
    }
  });
})();

function moveBox(e,dx,dy,sol){

  if(dx)for(const s of sol)if(hit(e,s))e.x=dx>0?s.x-e.w/2-.02:s.x+s.w+e.w/2+.02;
  e.y+=dy;
  if(dy)for(const s of sol)if(hit(e,s))e.y=dy>0?s.y-e.h/2-.02:s.y+s.h+e.h/2+.02;
  const m=MAPS[map];
  e.x=clamp(e.x,10,m.w-10);e.y=clamp(e.y,10,m.h-10);
}
function hit(e,s){return e.x-e.w/2<s.x+s.w&&e.x+e.w/2>s.x&&e.y-e.h/2<s.y+s.h&&e.y+e.h/2>s.y}
function near(a,b,r){return dist2(a,b)<r*r}

 
function talk(lines,onEnd,auto){
  const l=lines.filter(x=>{if(x[2]&&!x[0]){x[2]();return false}return true});
  if(!l.length){if(onEnd)onEnd();return}
  dlg={l,i:0,t:0,onEnd,auto:auto||null};sfx.talk();
}
function dlgAdvance(){
  if(!dlg)return;
  if(dlg.t<.15)return;
  dlg.i++;sfx.talk();dlg.t=0;
  if(dlg.i>=dlg.l.length){const f=dlg.onEnd;dlg=null;if(f)f()}
  else{const cur=dlg.l[dlg.i];if(cur[2])cur[2]()}
}

 
function cut(acts,onEnd){cs={a:acts,i:-1,t:0,onEnd};nextAct()}
function nextAct(){
  if(!cs)return;
  cs.i++;cs.t=0;
  if(cs.i>=cs.a.length){const f=cs.onEnd;cs=null;cam.focus=null;cam.fp=null;cam.tz=1;fadeTo=0;
    X.globalAlpha=1;if(f)f();return}
  const a=cs.a[cs.i];
  switch(a.a){
    case 'say':talk([[a.w,a.t]],()=>nextAct());break;
    case 'lines':talk(a.l,()=>nextAct(),a.auto);break;
    case 'cam':cam.focus=a.on?find(a.on):null;cam.tz=a.z||1;if(a.p)cam.fp={x:a.p[0],y:a.p[1]};else cam.fp=null;nextAct2(a.d||.6);break;
    case 'wait':nextAct2(a.d||1);break;
    case 'move':{const e=find(a.who);if(e){e.mt={x:a.x,y:a.y,sp:a.sp||90}}nextAct2(a.d||0);break}
    case 'sfx':(sfx[a.s]||(()=>{}))();nextAct();break;
    case 'shake':cam.shake=a.v||10;nextAct();break;
    case 'do':a.f();nextAct();break;
    case 'fade':fadeTo=a.to;nextAct2(a.d||.8);break;
    default:nextAct();
  }
}
function nextAct2(d){cs.wait=d;cs.t=0}
function find(id){if(id==='greg')return P;return npcs.find(n=>n.id===id)||cars.find(c=>c.id===id)}
function updCut(dt){
  if(!cs)return;
  cs.t+=dt;
  if(cs.wait!=null&&cs.t>=cs.wait){cs.wait=null;nextAct()}
}

function fireEvent(pool){
  const ok=pool.filter(e=>(evCD[e.id]||0)<=tt);
  if(!ok.length)return;
  const tot=ok.reduce((s,a)=>s+(a.w||1),0);let r=Math.random()*tot,e=ok[0];
  for(const a of ok){r-=(a.w||1);if(r<=0){e=a;break}}
  evCD[e.id]=tt+(e.cd||60);e.f();

function push(o,dx,dy,f){
  const m=Math.hypot(dx,dy)||1;const w=(K[o.k].p||1);
  o.vx=(o.vx||0)+dx/m*f*w;o.vy=(o.vy||0)+dy/m*f*w;
  o.spin=(o.spin||0)+rnd(-3,3)*w;sfx.bump();
}
function physUpdate(dt){
  const sol=solids();
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];
    if(o.ttl!=null){o.ttl-=dt;if(o.ttl<=0){objs.splice(i,1);continue}}}
  for(const o of objs){
    const kk=K[o.k];if(!kk||!kk.p)continue;
    if(Math.abs(o.x-P.x)>1100||Math.abs(o.y-P.y)>800)continue;
    if(!o.ox){o.ox=o.x;o.oy=o.y}
    if(o.vx||o.vy){
      const nx=o.x+o.vx*dt,ny=o.y+o.vy*dt;
      const b={x:nx+o.w/2,y:ny+o.h/2,w:o.w,h:o.h};
      let blocked=false;
      for(const s of sol)if(s!==o&&hit(b,s)){blocked=true;break}
      if(blocked){o.vx*=-.35;o.vy*=-.35;o.rot=(o.rot||0)+1.2;sfx.bump()}
      else{o.x=nx;o.y=ny;o.rot=(o.rot||0)+(o.spin||0)*dt}
      const m=MAPS[map];o.x=clamp(o.x,4,m.w-40);o.y=clamp(o.y,4,m.h-40);
      const d=Math.pow(.09,dt);o.vx*=d;o.vy*=d;o.spin*=d;
      if(Math.hypot(o.vx,o.vy)<6){o.vx=0;o.vy=0;o.spin=0;
        if(Math.hypot(o.x-o.ox,o.y-o.oy)>90){o.ox=o.x;o.oy=o.y;objMoved(o)}}
    }
     
    if(!P.inCar&&hit(P,{x:o.x,y:o.y,w:o.w,h:o.h}))push(o,o.x+o.w/2-P.x,o.y+o.h/2-P.y,150);
  }
}

        setTimeout(()=>{npcs=npcs.filter(x=>x!==c);const k=NPCS.indexOf(c);if(k>=0)NPCS.splice(k,1)},4000)}
      if(crowdN===0){crowdStage=0;idleT=0}
    }
    return;
  }
   
  const st=CROWD_STAGES.findIndex(s=>idleT<s[0]);
  const want=st<0?CROWD_STAGES[CROWD_STAGES.length-1][1]:(st===0?0:CROWD_STAGES[st-1][1]);
  while(crowdN<want){
    const i=crowdN++;

    const arch=ri(0,ARCH.length-1);
    const n={id:'cr'+i+'_'+tt,name:i>22?'Reporter':i>18?'Snack Seller':ARCH[arch][0],map:'town',crowd:1,
      col:ARCH[arch][1],x:crowdAnchor.x+Math.cos(a)*900,y:crowdAnchor.y+Math.sin(a)*700,
      tx:crowdAnchor.x+Math.cos(a)*r,ty:crowdAnchor.y+Math.sin(a)*r,w:18,h:26,t:0,
      beh:'crowd',pose:pick(['stand','stand','sit','photo']),prop:i>26?'sign':i>22?'cam':i>18?'snack':null,
      cos:Math.random()<.5?[pick(NPC_COS)]:null};
    n.talk=()=>pick(CROWD_LINES);
    npcs.push(n);NPCS.push(n);
  }
  const nowStage=CROWD_STAGES.filter(s=>idleT>=s[0]).length;
  if(nowStage>crowdStage){
    crowdStage=nowStage;F.crowdSeen=1;saveF();
    if(!dlg&&!cs)talk(CROWD_LINES[Math.min(crowdStage-1,CROWD_LINES.length-1)]);
    if(crowdStage>=4){cam.shake=4;cars.forEach(c=>{if(c.traffic&&Math.hypot(c.x-crowdAnchor.x,c.y-crowdAnchor.y)<600)c.stopT=6})}
    if(crowdStage===CROWD_STAGES.length&&!F.crowdMax){F.crowdMax=1;saveF();give('Public Figure');cut(CUT.crowd)}
  }
}

function updCar(c,dt){
  if(c.traffic){
    const tgt=c.traffic[c.ti%c.traffic.length];
    const dx=tgt[0]-c.x,dy=tgt[1]-c.y,d=Math.hypot(dx,dy);
    if(d<20){c.ti++;if(c.slowpoke&&Math.random()<.5)c.stopT=2.5}
    if(c.stopT>0){c.stopT-=dt;return}
    c.ang=Math.atan2(dy,dx);
    c.x+=dx/d*c.sp*dt;c.y+=dy/d*c.sp*dt;
    if(near(c,P,40)&&!P.inCar&&!cs){sfx.horn();cam.shake=6;P.x-=Math.cos(c.ang)*10;P.y-=Math.sin(c.ang)*10}
    return;
  }
  if(c!==drive)return;
  const busy=!!(dlg||cs);
  const a=busy?{x:0,y:0}:axis();
  const fwd=-a.y,turn=a.x;
  c.vel+=fwd*c.ac*dt;
  c.vel*=(1-1.2*dt);
  c.vel=clamp(c.vel,-c.sp*.4,c.sp);
  if(Math.abs(c.vel)>6)c.ang+=turn*c.hd*dt*(c.vel>0?1:-1)*clamp(Math.abs(c.vel)/80,.3,1.4);
  const nx=c.x+Math.cos(c.ang)*c.vel*dt, ny=c.y+Math.sin(c.ang)*c.vel*dt;
  const bb={x:nx,y:ny,w:Math.max(c.w,c.h)*.72,h:Math.max(c.w,c.h)*.72};
  let blocked=false;
  for(const s of solids())if(hit(bb,s)){blocked=true;break}
  const m=MAPS[map];
  if(nx<20||ny<20||nx>m.w-20||ny>m.h-20)blocked=true;
  if(blocked){
    if(Math.abs(c.vel)>60){cam.shake=Math.min(16,Math.abs(c.vel)/12);sfx.bump();
      if(!F.crash){F.crash=1;saveF();notify('"Nice."')}
      for(let i=0;i<8;i++)parts.push({x:c.x,y:c.y,vx:rnd(-80,80),vy:rnd(-80,80),life:.5,t:0,col:'#ccc',s:3});}
    c.vel=-c.vel*.25;
  } else {c.x=nx;c.y=ny}
   
  for(const n of npcs)if(near(n,c,34)&&Math.abs(c.vel)>40){n.x-=Math.cos(c.ang)*40*dt*4;n.y-=Math.sin(c.ang)*40*dt*4;
    n.panic=1.4;
    if(!n.yelled){n.yelled=2.5;notify(pick(['"HEY."','"Watch it."','"That\'s my leg."','"Nice parking."','"I was walking there."']))}}
   
  const cb={x:c.x,y:c.y,w:c.w+10,h:c.h+10};
  for(const o of objs){const kk=K[o.k];if(!kk||!kk.p)continue;
    if(Math.abs(o.x-c.x)>200||Math.abs(o.y-c.y)>200)continue;
    if(hit(cb,{x:o.x,y:o.y,w:o.w,h:o.h})){
      push(o,Math.cos(c.ang)*100+(o.x-c.x),Math.sin(c.ang)*100+(o.y-c.y),Math.min(900,Math.abs(c.vel)*(c.heavy?2.4:1.8)));
      o.rot=(o.rot||0)+1.4;cam.shake=Math.min(12,Math.abs(c.vel)/26);c.vel*=c.heavy?.96:.86;
      if(!F.crash){F.crash=1;saveF();notify('"That was there before."')}
      if(!F.firstHit){F.firstHit=1;saveF();setTimeout(()=>{if(!dlg&&!cs)cut(CUT.trashcan)},300)}
    }}
  engine(true,clamp(Math.abs(c.vel)/c.sp,0,1));
  if(c.smoke&&Math.random()<.3)parts.push({x:c.x-Math.cos(c.ang)*20,y:c.y-Math.sin(c.ang)*20,vx:rnd(-8,8),vy:rnd(-14,-4),life:.9,t:0,col:'#9aa',s:4});
}

 
function updNpc(n,dt){
  n.t+=dt;
  if(n.yelled>0)n.yelled-=dt;
  if(n.frozen>0){n.frozen-=dt;return}
  if(n.panic>0){n.panic-=dt;n.x+=Math.cos(n.t*6+n.rx)*160*dt;n.y+=Math.sin(n.t*5+n.ry)*120*dt;n.anim=(n.anim||0)+dt*14;return}
  if(n.mt){const dx=n.mt.x-n.x,dy=n.mt.y-n.y,d=Math.hypot(dx,dy);
    if(d<4)n.mt=null;else{n.x+=dx/d*n.mt.sp*dt;n.y+=dy/d*n.mt.sp*dt;n.anim=(n.anim||0)+dt*10}return}
  switch(n.beh){
   case 'wander':{
     if(!n.wt||n.wt<=0){n.wt=rnd(1,3);n.wa=rnd(0,6.28)}
     n.wt-=dt;n.x+=Math.cos(n.wa)*26*dt;n.y+=Math.sin(n.wa)*26*dt;n.anim=(n.anim||0)+dt*8;
     n.x=clamp(n.x,n.rx-140,n.rx+140);n.y=clamp(n.y,n.ry-110,n.ry+110);break}
   case 'walk':{
     const p=n.path[n.pi%n.path.length],dx=p[0]-n.x,dy=p[1]-n.y,d=Math.hypot(dx,dy);
     if(d<8)n.pi++;else{n.x+=dx/d*46*dt;n.y+=dy/d*46*dt;n.anim=(n.anim||0)+dt*10}break}
   case 'circle':{n.x=n.rx+Math.cos(n.t*1.4)*70;n.y=n.ry+Math.sin(n.t*1.4)*50;n.anim=(n.anim||0)+dt*12;break}
   case 'follow':{const d=Math.hypot(P.x-n.x,P.y-n.y);
     if(d>70&&d<900){n.x+=(P.x-n.x)/d*70*dt;n.y+=(P.y-n.y)/d*70*dt;n.anim=(n.anim||0)+dt*9}break}
   case 'flee':{const d=Math.hypot(P.x-n.x,P.y-n.y);
     if(d<160){n.x+=(n.x-P.x)/d*120*dt;n.y+=(n.y-P.y)/d*120*dt;n.anim=(n.anim||0)+dt*16}
     n.x=clamp(n.x,5320,6880);n.y=clamp(n.y,200,1280);break}
   case 'look':n.face=Math.sin(n.t)>0?1:-1;break;
   case 'phone':n.face=1;n.anim=lerp(n.anim||0,0,dt*6);break;
   case 'walk2':{
     if(!n.wa)n.wa=rnd(0,6.28);
     n.x+=Math.cos(n.wa)*34*dt;n.y+=Math.sin(n.wa)*34*dt;n.anim=(n.anim||0)+dt*9;
     if(Math.hypot(n.x-n.rx,n.y-n.ry)>230)n.wa=Math.atan2(n.ry-n.y,n.rx-n.x)+rnd(-.6,.6);break}
   case 'pair':{n.face=Math.sin(n.t*.7)>0?1:-1;n.anim=lerp(n.anim||0,0,dt*5);break}
   case 'crowd':{
     const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);
     if(d>6){n.x+=dx/d*130*dt;n.y+=dy/d*130*dt;n.anim=(n.anim||0)+dt*11}
     else{n.anim=lerp(n.anim||0,0,dt*6);n.face=P.x>n.x?1:-1}break}
   case 'leave':{n.x+=Math.cos(n.la)*150*dt;n.y+=Math.sin(n.la)*150*dt;n.anim=(n.anim||0)+dt*12;break}
  }
}

 
function drawPerson(e,col,opt){
  opt=opt||{};
  const bob=Math.sin((e.anim||0))*1.6, sit=opt.sit?6:0;
  shadow(e.x,e.y+13,10);
  X.strokeStyle='#2b2d42';X.lineWidth=3;X.lineCap='round';
  const sw=Math.sin(e.anim||0)*4;
  X.beginPath();
  if(opt.sit){X.moveTo(e.x-4,e.y+6);X.lineTo(e.x+7,e.y+8);X.moveTo(e.x+3,e.y+6);X.lineTo(e.x+9,e.y+12)}
  else{X.moveTo(e.x-3,e.y+4);X.lineTo(e.x-3+sw,e.y+13);X.moveTo(e.x+3,e.y+4);X.lineTo(e.x+3-sw,e.y+13)}
  X.stroke();
  box(e.x-7,e.y-8+bob-sit,14,15,col,4);
  if(opt.apron){X.fillStyle='#fff';X.fillRect(e.x-5,e.y-2+bob-sit,10,9)}
  if(opt.coat){X.fillStyle='#fff';X.fillRect(e.x-7,e.y-8+bob-sit,14,15)}
  X.beginPath();X.moveTo(e.x-6,e.y-5+bob-sit);X.lineTo(e.x-9-sw*.5,e.y+3+bob-sit);
  X.moveTo(e.x+6,e.y-5+bob-sit);X.lineTo(e.x+9+sw*.5,e.y+3+bob-sit);X.stroke();
  X.fillStyle='#f2cc8f';X.beginPath();X.arc(e.x,e.y-15+bob-sit,7,0,7);X.fill();
  X.fillStyle='#4a3728';X.beginPath();X.arc(e.x,e.y-18+bob-sit,7,Math.PI,0);X.fill();
  X.fillStyle='#2b2d42';const f=(e.face||1);
  X.beginPath();X.arc(e.x+f*2.5,e.y-15+bob-sit,1.5,0,7);X.arc(e.x-f*.5,e.y-15+bob-sit,1.5,0,7);X.fill();
  X.lineWidth=1;
  if(opt.cos)drawCos(e,opt.cos,bob,sit);
}

  X.fillStyle=col||'#f6f6f6';X.beginPath();X.ellipse(e.x,e.y,10,8,0,0,7);X.fill();
  X.beginPath();X.arc(e.x+8,e.y-6,5,0,7);X.fill();
  X.fillStyle='#f4a300';X.beginPath();X.moveTo(e.x+12,e.y-6);X.lineTo(e.x+18,e.y-4);X.lineTo(e.x+12,e.y-3);X.fill();
  X.fillStyle='#d33';X.beginPath();X.arc(e.x+7,e.y-11,3,0,7);X.fill();
  X.fillStyle='#111';X.beginPath();X.arc(e.x+10,e.y-7,1.3,0,7);X.fill();
  X.strokeStyle='#e58e26';X.lineWidth=2;X.beginPath();X.moveTo(e.x-2,e.y+7);X.lineTo(e.x-2,e.y+11+f*.2);X.moveTo(e.x+4,e.y+7);X.lineTo(e.x+4,e.y+11-f*.2);X.stroke();X.lineWidth=1;
}

  X.beginPath();X.arc(e.x-13,e.y-6,7,0,7);X.fill();

  X.fillStyle='#111';X.beginPath();X.arc(e.x-16,e.y-6,1.5,0,7);X.fill();

function drawCar(c){
  X.save();X.translate(c.x,c.y);X.rotate(c.ang);
  X.fillStyle='rgba(0,0,0,.2)';rr(-c.w/2+3,-c.h/2+5,c.w,c.h,6);X.fill();
  box(-c.w/2,-c.h/2,c.w,c.h,c.col,6);
  X.fillStyle='rgba(255,255,255,.75)';rr(-c.w*.1,-c.h/2+3,c.w*.34,c.h-6,3);X.fill();
  X.fillStyle='rgba(0,0,0,.25)';rr(-c.w*.42,-c.h/2+4,c.w*.22,c.h-8,3);X.fill();
  X.fillStyle='#222';X.fillRect(-c.w*.34,-c.h/2-3,c.w*.2,3);X.fillRect(-c.w*.34,c.h/2,c.w*.2,3);
  X.fillRect(c.w*.16,-c.h/2-3,c.w*.2,3);X.fillRect(c.w*.16,c.h/2,c.w*.2,3);
  X.fillStyle='#ffe9a8';X.fillRect(c.w/2-3,-c.h/2+3,3,5);X.fillRect(c.w/2-3,c.h/2-8,3,5);
  if(c.top){box(-14,-12,28,24,'#a5643c',3);txt('?',0,5,14,'#fff','center')}
  if(c.npc){X.fillStyle='#f2cc8f';X.beginPath();X.arc(0,0,5,0,7);X.fill();txt('z',6,-4,10,'#fff')}
  X.restore();
}
function drawTmp(o){
  switch(o.k){
   case 'bird':drawBird(o,o.col);break;
   case 'goat':drawGoat(o);break;
   case 'person':drawPerson(o,o.col||'#e07a5f',{cos:o.cos});
     if(o.say)txt(o.say,o.x,o.y-34,12,'#fff','center',800);break;
   case 'runner':drawPerson(o,'#c1121f',{});if(o.say)txt(o.say,o.x,o.y-34,12,'#fff','center',800);break;
   case 'car':drawCar({x:o.x,y:o.y,ang:o.back?3.14:(o.vx<0?3.14:0),w:58,h:30,col:o.col});break;
   case 'ufo':{X.fillStyle='rgba(140,255,180,.14)';X.beginPath();X.moveTo(o.x-30,o.y+10);X.lineTo(o.x+30,o.y+10);X.lineTo(o.x+60,o.y+190);X.lineTo(o.x-60,o.y+190);X.closePath();X.fill();
     X.fillStyle='#9ad1d4';X.beginPath();X.ellipse(o.x,o.y,44,13,0,0,7);X.fill();
     X.fillStyle='#cfe8f5';X.beginPath();X.arc(o.x,o.y-6,20,Math.PI,0);X.fill();break}
   case 'piano':{shadow(o.x,o.y+22,26);box(o.x-32,o.y-20,64,44,'#1d1d20',4);X.fillStyle='#f6f6f6';X.fillRect(o.x-26,o.y+8,52,12);
     X.fillStyle='#111';for(let i=0;i<7;i++)X.fillRect(o.x-24+i*7,o.y+8,3,7);break}
   case 'box':{shadow(o.x,o.y+16,16);box(o.x-18,o.y-18,36,36,'#c08b52',3);break}
   case 'stoneface':{K.face.d({x:o.x-80,y:o.y,w:160,h:150});break}
  }
}

function update(dt){
  tt+=dt;
  if(mapToggle){bigmap=!bigmap;mapToggle=false}
  if(respawnPress){respawnPress=false;respawnHome()}
  if(quitPress){quitPress=false;if(job)quitAsk=quitAsk?false:'job'}
  if(questQuitPress){questQuitPress=false;if(aq)quitAsk=quitAsk?false:'quest'}
  if(quitAsk){
    if(yesPress){if(quitAsk==='quest')questQuit();else jobQuit()}
    if(noPress||closePress){quitAsk=false;closePress=false}
    yesPress=noPress=false;actPress=false;
    hint=null;return;
  }
  yesPress=noPress=false;
  if(closePress&&!shop){bigmap=false;closePress=false}
  if(fadeTo===1&&!cs){fadeStuck=(fadeStuck||0)+dt;if(fadeStuck>2.5){fadeTo=0;fadeStuck=0}}else fadeStuck=0;
  fade=lerp(fade,fadeTo,Math.min(1,dt*6));
  if(cam.shake>0)cam.shake=Math.max(0,cam.shake-40*dt);
  if(noticeT>0)noticeT-=dt;
  if(F.rain>0)F.rain-=dt;
  if(F.bossT>0)F.bossT-=dt;
  if(dlg){dlg.t+=dt;if(dlg.auto&&dlg.t>=dlg.auto)dlgAdvance()}
  updCut(dt);

  if(shop){
    if(navT>0)navT-=dt;
    const a=axis();
    if(navT<=0&&Math.abs(a.y)>.5){shopNav(a.y>0?1:-1);navT=.18}
    if(actPress){shopAct();actPress=false}
    if(closePress){shop=null;closePress=false}
    hint=null;return;
  }
  if(actPress){
    if(dlg)dlgAdvance();
    else if(!cs){
      if(drive){if(Math.abs(drive.vel)<40)exitCar();else notify('Stop first.')}
      else{const t=interactTarget();if(t)t.f()}
    }
    actPress=false;
  }
  actPress=false;

  const busy=!!(dlg||cs);
   
  let moving=false;
  if(!busy&&!drive){
    const a=axis();
    const sp=165;
    if(a.x||a.y){
      moving=true;
      moveBox(P,a.x*sp*dt,a.y*sp*dt,solids());
      P.anim+=dt*10;if(a.x)P.face=a.x>0?1:-1;
      if(!P.step||tt-P.step>.32){P.step=tt;snd(120+Math.random()*30,.04,'square',.012)}
    } else P.anim=lerp(P.anim,0,dt*8);
    edgeCheck(dt,a);
  } else if(drive) edgeT=Math.max(0,edgeT-dt);
  if(drive&&Math.abs(drive.vel)>20)moving=true;
  if(cs&&P.mt){const dx=P.mt.x-P.x,dy=P.mt.y-P.y,d=Math.hypot(dx,dy);
    if(d<4)P.mt=null;else{P.x+=dx/d*P.mt.sp*dt;P.y+=dy/d*P.mt.sp*dt;P.anim+=dt*10}}

  for(const n of npcs){
    if(!n.crowd&&!n.mt&&Math.abs(n.x-P.x)>1400)continue;
    if(!busy||n.mt||n.crowd)updNpc(n,dt);
  }
  for(const c of cars){if(c!==drive&&Math.abs(c.x-P.x)>2200&&Math.abs(c.y-P.y)>1500)continue;updCar(c,dt)}
  physUpdate(dt);
  crowdUpdate(dt,moving||busy&&!dlg);
  jobCheck(dt);
  questTick(dt);
  if(map==='set'&&!F.pdSeen&&!cs&&!dlg){
    const cm=npcs.find(n=>n.id==='cameraman');
    if(cm&&Math.hypot(P.x-cm.x,P.y-cm.y)<110){F.pdSeen=1;saveF();cut(CUT.projectdumb)}
  }
  if(drive){P.x=drive.x;P.y=drive.y}

  for(let i=tmps.length-1;i>=0;i--){const o=tmps[i];o.t+=dt;o.anim=(o.anim||0)+dt*10;
    if(o.fall&&o.t<.6){continue}
    if(o.fall&&!o.landed){o.landed=1;cam.shake=10;sfx.bump()}
    o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.follow){const d=Math.hypot(P.x-o.x,P.y-o.y);if(d>60){o.x+=(P.x-o.x)/d*90*dt;o.y+=(P.y-o.y)/d*90*dt}}
    if(o.boss&&F.bossT<=0&&!o.done){o.done=1;o.ttl=Math.min(o.ttl,o.t+.2);
      if(!dlg&&!cs)talk([['Guy','"Hi."'],['Narrator','"The boss bar disappears."']])}
    if(o.t>o.ttl)tmps.splice(i,1)}

  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;if(p.t>p.life)parts.splice(i,1)}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.life+=dt;p.y-=26*dt;if(p.life>1.2)pops.splice(i,1)}

   
  if(!busy&&map==='town'){
    evT-=dt;
    if(evT<=0){evT=rnd(11,20);
      fireEvent(Math.random()<.07?RARE:EVENTS);}
  }
   
  const tgt=cam.focus||(cam.fp?cam.fp:(drive||P));
  cam.tx=tgt.x;cam.ty=tgt.y;
  cam.x=lerp(cam.x,cam.tx,Math.min(1,dt*(drive?3.4:6)));
  cam.y=lerp(cam.y,cam.ty,Math.min(1,dt*(drive?3.4:6)));
  cam.z=lerp(cam.z,cam.tz,Math.min(1,dt*4));
  const m=MAPS[map],vw=W/cam.z,vh=H/cam.z;
  if(m.w>vw)cam.x=clamp(cam.x,vw/2,m.w-vw/2);else cam.x=m.w/2;
  if(m.h>vh)cam.y=clamp(cam.y,vh/2,m.h-vh/2);else cam.y=m.h/2;
  hint=(!busy&&!drive)?interactTarget():null;
}

const ICON={JOB:['!','#ffca3a'],CAR:['CAR','#4cc9f0'],PIZ:['PIZZA','#e63946'],WRN:['FIX','#8d99ae'],
 CD:['WAIT','#8d99ae'],BLD:['BUILD','#ff924c'],CHK:['CHICK','#f6f6f6'],BOX:['BOX','#c08b52'],QST:['?','#8ac926'],SHOP:['$','#8ac926']};
function npcIcon(n){
  if(n.shop)return ICON.SHOP;
  if(n.j){const J=JOBS[n.j];if(job&&job.id===n.j)return null;if(job)return null;
    if((jobCD[n.j]||0)>tt)return ICON.CD;return ICON[J.icon||'JOB']||ICON.JOB}
