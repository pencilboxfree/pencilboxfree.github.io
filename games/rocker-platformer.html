<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rock N' Roll Rumble</title>
<style>
  html,body{margin:0;height:100%;background:#0c0c12;color:#eee;font-family:"Courier New",monospace;
    display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(96vw,960px)}
  canvas{width:100%;height:auto;display:block;image-rendering:pixelated;
    border:3px solid #333;border-radius:6px;background:#1a1230;box-shadow:0 12px 40px rgba(0,0,0,.6)}
  /* Name-entry overlay (used instead of prompt() so it works in sandboxes) */
  #entry{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(6,4,14,.86);border-radius:6px;text-align:center}
  #entry.show{display:flex}
  #entry .box{background:#181030;border:2px solid #e2b13c;border-radius:10px;padding:22px 26px}
  #entry h3{margin:0 0 10px;color:#e2b13c;letter-spacing:2px}
  #entry input{font-family:inherit;font-size:18px;padding:8px 10px;width:200px;text-align:center;
    background:#0e0a1e;border:2px solid #555;color:#fff;border-radius:6px;text-transform:uppercase}
  #entry button{margin-top:12px;font-family:inherit;font-weight:bold;letter-spacing:1px;cursor:pointer;
    background:#e2b13c;color:#111;border:none;border-radius:6px;padding:9px 22px}
  .hint{margin-top:8px;font-size:12px;color:#aaa;letter-spacing:1px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="270"></canvas>
  <div id="entry">
    <div class="box">
      <h3 id="entryTitle">NEW HIGH SCORE!</h3>
      <input id="entryName" maxlength="10" placeholder="YOUR NAME" />
      <div><button id="entrySave">SAVE</button></div>
    </div>
  </div>
  <div class="hint">←→ move &nbsp;·&nbsp; SPACE jump &nbsp;·&nbsp; X sword &nbsp;·&nbsp; Z shield &nbsp;·&nbsp; M mute</div>
</div>

<script>
"use strict";
/* =====================================================================
   ROCK N' ROLL RUMBLE — single-file HTML5 platformer (no libraries)
   Sections:
     1  Config & level data          6  Enemy & boss AI
     2  Input                         7  Combat, powerups, scoring
     3  High-score storage            8  Player update & physics
     4  Utilities & world            9  Rendering (rect pixel art)
     5  Entity factories            10  State machine & main loop
   ===================================================================== */

/* ---------- 1. CONFIG & LEVEL DATA ---------- */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const VW = 480, VH = 270;                 // virtual resolution
const GRAV = 0.5, JUMP_V = -8.6, MOVE = 1.7, MAX_ENEMIES = 5;
const GROUND_TOP = VH - 22;               // y of the ground surface
const P1COL = { skin:"#e0b083", hair:"#141414", shirt:"#111", logo:"#e23b3b", jeans:"#2b4a8b", shoe:"#0a0a0a" };

// Per-level boss configuration. bossHP 7,9,11,13 · bossScore 5,6,7,8 · rate = seconds between attacks.
const LEVELS = [
  { name:"LEVEL 1", boss:"RONEY",  full:"Roney the Zombie Bunny", threshold:13, hp:7,  reward:5, bonus:10, atk:"carrots", rate:2.0 },
  { name:"LEVEL 2", boss:"$NAKE",  full:"$nake the Mummy Snake",  threshold:17, hp:9,  reward:6, bonus:13, atk:"poison",  rate:1.7 },
  { name:"LEVEL 3", boss:"OWL",    full:"The Owl",                threshold:21, hp:11, reward:7, bonus:15, atk:"eggs",    rate:1.5 },
  { name:"LEVEL 4", boss:"OVERLORD",full:"The Final Overlord",    threshold:25, hp:13, reward:8, bonus:20, atk:"lasers",  rate:1.1 },
];
// Regular-enemy fire frequency scales by level: L1 fires ~15% as often as L4,
// increasing each level (interval = L4 baseline / factor).
const ENEMY_FIRE_FACTOR = [0.15, 0.43, 0.72, 1.0];
const enemyFireFactor = ()=>ENEMY_FIRE_FACTOR[game.level] || 1;

/* ---------- 2. INPUT ---------- */
const held = { left:false, right:false, jump:false, shield:false };
let justJump = false, justSword = false;   // edge-triggered actions, consumed each step
const KEYMAP = { ArrowLeft:"left", ArrowRight:"right", Space:"jump", KeyZ:"shield" };
addEventListener("keydown", e=>{
  Chip.resume();                                    // unlock/resume audio on first gesture
  if (e.code === "KeyM"){ Chip.toggleMute(); }
  if (["ArrowLeft","ArrowRight","Space","KeyX","KeyZ","ArrowUp"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code in KEYMAP) held[KEYMAP[e.code]] = true;
  if (e.code === "Space" || e.code === "ArrowUp") justJump = true;
  if (e.code === "KeyX") justSword = true;
  if (e.code === "Space" && (game.state === "TITLE" || game.state === "END")) startOrTitleAction();
});
addEventListener("keyup", e=>{ if (e.code in KEYMAP) held[KEYMAP[e.code]] = false; });
addEventListener("pointerdown", ()=>Chip.resume());

/* ---------- 3. HIGH-SCORE STORAGE (try/catch + in-memory fallback) ---------- */
const HS_KEY = "rnr_highscores_v1";
let memScores = [];
function loadScores(){ try { return JSON.parse(localStorage.getItem(HS_KEY)) || []; } catch(e){ return memScores.slice(); } }
function saveScores(list){ try { localStorage.setItem(HS_KEY, JSON.stringify(list)); } catch(e){ memScores = list.slice(); } }
function qualifies(v){ const s = loadScores(); return s.length < 3 || v > s[s.length-1].score; }
function submitScore(name, v){
  const s = loadScores();
  s.push({ name:(name||"ROCKER").slice(0,10).toUpperCase(), score:v });
  s.sort((a,b)=>b.score-a.score);
  saveScores(s.slice(0,3));
}
const HS_TITLES = ["Highest Scorer of All Time", "2nd Loser", "3rd Loser"];

/* ---------- 3.5 AUDIO — original chiptune engine (Web Audio API, no files) ----------
   Square lead + triangle bass + noise drums, driven by a lookahead scheduler.
   Three original loops (gameplay / boss / victory) + lightweight SFX. All tones are
   synthesized live, so there are no audio assets to download. */
const Chip = (function(){
  let ctx=null, master=null, noiseBuf=null, started=false, muted=false;
  let song=null, sceneName=null, step=0, nextTime=0, stepDur=0, timer=null, playing=false;

  const NOTE = {C:0,"C#":1,D:2,"D#":3,E:4,"F":5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
  function nf(name){                                   // note name -> frequency
    if(!name || name==="." || name==="_") return 0;
    const m=/^([A-G]#?)(\d)$/.exec(name); if(!m) return 0;
    const semis = NOTE[m[1]] + (+m[2]+1)*12;           // MIDI number
    return 440 * Math.pow(2, (semis-69)/12);
  }
  const toks = s => s.trim().split(/\s+/);
  function onsets(arr){                                // expand ties ('_') into note durations
    const N=arr.length, out=new Array(N).fill(null);
    for(let i=0;i<N;i++){ const v=arr[i];
      if(v && v!=="." && v!=="_"){ let d=1,j=i+1; while(j<N && arr[j]==="_"){d++;j++;} out[i]={note:v,dur:d}; } }
    return out;
  }
  function build(def){
    const lead=toks(def.lead), bass=toks(def.bass), drums=toks(def.drums);
    return { bpm:def.bpm, loop:def.loop!==false, N:Math.max(lead.length,bass.length,drums.length),
             lead:onsets(lead), bass:onsets(bass), drums:drums };
  }

  /* ----- Original songs (hand-written, not derived from any existing game) ----- */
  const SONGS = {
    // Gameplay: bright C-major hook, C–Am–F–G bass.
    game: { bpm:150, loop:true,
      lead:"E5 . E5 . G5 . A5 _ A5 . G5 . E5 . D5 . C5 . D5 . E5 . G5 _ E5 . D5 . C5 _ . .",
      bass:"C3 . . . C3 . . . A2 . . . A2 . . . F2 . . . F2 . . . G2 . . . G2 . . .",
      drums:"K . H . S . H . K . H . S . H . K . H . S . H . K . H . S . H ." },
    // Boss: darker, driving A-minor loop, straight-eighth bass (Am–F–G–E).
    boss: { bpm:172, loop:true,
      lead:"A4 . C5 . E5 . A5 _ G5 . E5 . D5 . C5 . A4 . B4 . C5 . E5 _ D5 . C5 . B4 _ . .",
      bass:"A2 . A2 . A2 . A2 . F2 . F2 . F2 . F2 . G2 . G2 . G2 . G2 . E2 . E2 . E2 . E2 .",
      drums:"K . H H S . H H K . H H S . H H K . H H S . H H K . H H S . H H" },
    // Victory: short rising major fanfare, plays once.
    win: { bpm:140, loop:false,
      lead:"G5 C6 E6 G6 _ E6 G6 _ _ _ _ _ . . . .",
      bass:"C3 . G3 . C3 . E3 . C3 _ _ _ . . . .",
      drums:"K . . . K . . . K . K . K . . ." }
  };

  /* ----- Synthesis primitives ----- */
  function voice(freq,t,dur,type,g){
    if(!freq) return;
    const o=ctx.createOscillator(), a=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    a.gain.setValueAtTime(0,t);
    a.gain.linearRampToValueAtTime(g,t+0.008);
    a.gain.setValueAtTime(g, t+Math.max(0.03,dur*0.55));
    a.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(a); a.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function slide(type,f0,f1,t,dur,g){
    const o=ctx.createOscillator(), a=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(a); a.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function noiseHit(t,dur,g,hp){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf;
    const a=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type=hp?"highpass":"lowpass"; f.frequency.value=hp?3800:2200;
    a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(a); a.connect(master); s.start(t); s.stop(t+dur+0.02);
  }
  function kick(t){ const o=ctx.createOscillator(), a=ctx.createGain(); o.type="sine";
    o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(48,t+0.11);
    a.gain.setValueAtTime(0.5,t); a.gain.exponentialRampToValueAtTime(0.001,t+0.13);
    o.connect(a); a.connect(master); o.start(t); o.stop(t+0.15); }
  function snare(t){ noiseHit(t,0.12,0.26,true); }
  function hat(t){ noiseHit(t,0.035,0.10,true); }

  /* ----- Sequencer (lookahead scheduler) ----- */
  function schedule(t){
    const s=song, st=step % s.N;
    const lo=s.lead[st]; if(lo) voice(nf(lo.note), t, lo.dur*stepDur*0.9, "square", 0.13);
    const bo=s.bass[st]; if(bo) voice(nf(bo.note), t, bo.dur*stepDur*0.95, "triangle", 0.2);
    const d=s.drums[st % s.drums.length];
    if(d==="K") kick(t); else if(d==="S") snare(t); else if(d==="H") hat(t);
  }
  function tick(){
    if(!playing || !ctx) return;
    while(nextTime < ctx.currentTime + 0.1){
      schedule(nextTime); nextTime += stepDur; step++;
      if(!song.loop && step >= song.N){ playing=false; break; }   // one-shot: let it ring out
    }
    if(playing) timer=setTimeout(tick,25);
  }
  function start(def){
    song=build(def); stepDur=15/def.bpm;                          // 16th note = (60/bpm)/4
    step=0; nextTime=ctx.currentTime+0.06; playing=true;
    clearTimeout(timer); tick();
  }
  function stop(){ playing=false; clearTimeout(timer); }

  /* ----- Public API ----- */
  function init(){
    if(started) return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=0.42; master.connect(ctx.destination);
      noiseBuf=ctx.createBuffer(1, (ctx.sampleRate*0.3)|0, ctx.sampleRate);
      const ch=noiseBuf.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
      started=true;
    }catch(e){ started=false; }
  }
  function resume(){ init(); if(ctx && ctx.state==="suspended") ctx.resume(); }
  function setScene(name){
    if(!started) return;
    const target = (name==="menu"||name==="play") ? "game" : name;   // keep menu↔play seamless
    if(target===sceneName) return;
    sceneName=target;
    if(target==="game") start(SONGS.game);
    else if(target==="boss") start(SONGS.boss);
    else if(target==="win") start(SONGS.win);
    else if(target==="gameover"){ stop(); sfx("lose"); }
  }
  function sfx(name){
    if(!started || muted || !ctx) return;
    const t=ctx.currentTime;
    if(name==="jump")       slide("square",300,660,t,0.12,0.14);
    else if(name==="sword"){ slide("square",900,320,t,0.09,0.12); noiseHit(t,0.05,0.08,true); }
    else if(name==="hit"){   slide("sawtooth",260,70,t,0.18,0.2); noiseHit(t,0.12,0.12,false); }
    else if(name==="defeat") slide("square",520,120,t,0.14,0.13);
    else if(name==="power")  ["C5","E5","G5","C6"].forEach((n,i)=>voice(nf(n),t+i*0.06,0.12,"square",0.15));
    else if(name==="life")   ["C5","G5","C6","E6"].forEach((n,i)=>voice(nf(n),t+i*0.07,0.13,"square",0.15));
    else if(name==="lose")   ["C5","B4","A4","G4","E4"].forEach((n,i)=>voice(nf(n),t+i*0.13,0.16,"triangle",0.16));
  }
  function toggleMute(){ if(!started) return muted; muted=!muted; master.gain.value=muted?0:0.42; return muted; }

  return { resume, setScene, sfx, toggleMute, isMuted:()=>muted, isOn:()=>started };
})();

/* ---------- 4. UTILITIES & WORLD ---------- */
const rnd  = (a,b)=>a + Math.random()*(b-a);
const irnd = (a,b)=>Math.floor(rnd(a,b+1));
const coin = ()=>Math.random() < 0.5;
const clamp= (v,a,b)=>Math.max(a,Math.min(b,v));
function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
// Combat hitbox: ~15% smaller than the sprite (7.5% inset per side). Sprite/physics unchanged.
function hitbox(e){ const ix = e.w*0.075, iy = e.h*0.075; return { x:e.x+ix, y:e.y+iy, w:e.w-ix*2, h:e.h-iy*2 }; }

// One-way platforms (land only when falling onto the top). Ground spans full width.
const PLATFORMS = [
  { x:0,   y:GROUND_TOP, w:VW, h:22 },              // ground
  { x:96,  y:GROUND_TOP-58, w:76, h:6 },            // reachable dodge platform
  { x:300, y:GROUND_TOP-58, w:76, h:6 },            // reachable dodge platform
  { x:VW-96, y:56, w:96, h:6 },                     // high spawn ledge (unreachable)
];
const LEDGE = PLATFORMS[3];

// Generic gravity + one-way platform landing for any entity with x,y,w,h,vy.
function stepPhysics(e){
  e.vy += GRAV; if (e.vy > 12) e.vy = 12;
  const prevBottom = e.y + e.h;
  e.y += e.vy; e.grounded = false;
  for (const pl of PLATFORMS){
    if (e.x + e.w > pl.x && e.x < pl.x + pl.w){
      const bottom = e.y + e.h;
      if (prevBottom <= pl.y + 2 && bottom >= pl.y){ e.y = pl.y - e.h; e.vy = 0; e.grounded = true; }
    }
  }
}

/* ---------- 5. ENTITY FACTORIES ---------- */
function makePlayer(){
  return { x:40, y:GROUND_TOP-19, w:12, h:19, vx:0, vy:0, dir:1, grounded:false,
           hp:2, iframe:0, swing:0, swordCd:0, hitSet:[], shielding:false };
}
function makeEnemy(type){
  const zombie = type === "zombie";
  return { kind:"enemy", type, x:LEDGE.x + LEDGE.w - 18, y:LEDGE.y - 16, w:14, h:16, vx:0, vy:0, dir:-1,
           hp: zombie ? 2 : 1, pts: zombie ? 3 : 1, phase:"ledge", grounded:false,
           atkTimer: rnd(1.0,2.2)/enemyFireFactor(), flash:0, stun:0 };
}
function makeBoss(levelIdx){
  const L = LEVELS[levelIdx];
  return { kind:"boss", level:levelIdx, name:L.boss, x:VW-70, y:GROUND_TOP-90, w:30, h:26, vx:0.6, vy:0,
           hp:L.hp, maxHp:L.hp, atk:L.atk, rate:L.rate, atkTimer:1.2, bob:0, flash:0,
           swoop:0, swoopCd:rnd(3,5), burst:0 };
}
function makeProjectile(x,y,vx,vy,kind,dmg){ return { x, y, w:6, h:6, vx, vy, kind, dmg:dmg||1, life:5 }; }
function makePowerup(x,y,type){ return { x, y, w:11, h:11, vy:0, type }; }        // "invincible" | "sword"
function makeFloat(x,y,text,col){ return { x, y, text, col, life:1 }; }

/* ---------- GAME STATE ---------- */
const game = {
  state:"TITLE",                 // TITLE | PLAY | END
  level:0, levelDefeats:0,
  lives:3, score:0, best:0,
  swordKills:0, jumpedEnemies:0, // lifetime stats (feed the Final Treasure)
  consec:0,                      // consecutive head-bounces
  powerMark:0, pendingDrop:false,// score-gated powerup drops (every 7)
  power:null,                    // { type, timer }
  player:null, enemies:[], shots:[], drops:[], floats:[], boss:null,
  spawnTimer:0, banner:"", bannerT:0, pendingRespawn:false, atBoss:false,
  won:false, finalValue:0, entered:false
};

function resetGame(){
  Object.assign(game, { level:0, levelDefeats:0, lives:3, score:0, best:0,
    swordKills:0, jumpedEnemies:0, consec:0, powerMark:0, pendingDrop:false, power:null,
    enemies:[], shots:[], drops:[], floats:[], boss:null, spawnTimer:0, won:false, entered:false, pendingRespawn:false, atBoss:false });
  startLevel(0);
}
function startLevel(idx){
  game.level = idx; game.levelDefeats = 0; game.atBoss = false;   // checkpoint not yet reached
  game.enemies = []; game.shots = []; game.drops = []; game.boss = null;
  game.player = makePlayer();
  banner(LEVELS[idx].name + " — BEAT " + LEVELS[idx].threshold + " FOES", 150);
  game.state = "PLAY";
}
function banner(t,frames){ game.banner = t; game.bannerT = frames; }

/* ---------- 6. ENEMY & BOSS AI ---------- */
function spawnLogic(){
  if (game.boss) return;                                   // bosses are 1v1
  if (game.levelDefeats >= LEVELS[game.level].threshold){  // time for the boss
    game.enemies = []; game.shots = [];
    game.boss = makeBoss(game.level);
    game.atBoss = true;                                    // checkpoint: reached the boss
    banner(LEVELS[game.level].full + " APPEARS!", 150);
    return;
  }
  game.spawnTimer--;
  if (game.spawnTimer <= 0 && game.enemies.length < MAX_ENEMIES){
    game.enemies.push(makeEnemy(coin() ? "mummy" : "zombie"));  // 50/50
    game.spawnTimer = irnd(70, 130) - game.level*6;             // faster on later levels
  }
}
function updateEnemy(e){
  const p = game.player;
  if (e.flash > 0) e.flash--;
  if (e.phase === "ledge"){                 // walk to the left edge of the ledge, then drop
    e.x -= 0.9;
    if (e.x <= LEDGE.x - 2) e.phase = "fall";
    e.y = LEDGE.y - e.h;
  } else {
    if (e.phase === "fall"){ stepPhysics(e); if (e.grounded) e.phase = "chase"; }
    else { // chase: walk toward the player and throw projectiles
      stepPhysics(e);
      if (e.stun > 0){ e.stun--; }                  // knocked back: briefly can't advance/attack
      else {
        e.dir = p.x < e.x ? -1 : 1;
        e.x += e.dir * (0.55 + game.level*0.05);
        e.atkTimer -= 1/60;
        if (e.atkTimer <= 0 && e.x < VW && e.x > -10){
          const kind = e.type === "zombie" ? "brain" : "tp";
          const sx = e.x + (e.dir>0 ? e.w : -6), sy = e.y + 5;
          const dx = (p.x - sx), dy = (p.y - sy);
          const sp = 2.2, mag = Math.hypot(dx,dy) || 1;
          game.shots.push(makeProjectile(sx, sy, dx/mag*sp, dy/mag*sp - 0.4, kind, 1));
          e.atkTimer = rnd(1.6, 2.8) / enemyFireFactor();
        }
      }
    }
  }
  e.x = clamp(e.x, -20, VW+20);
}
function updateBoss(b){
  const p = game.player, L = LEVELS[b.level];
  if (b.flash > 0) b.flash--;
  b.bob += 0.05;
  // Hover/patrol across the right half; owl also swoops toward the player.
  b.x += b.vx;
  if (b.x < VW*0.42 || b.x > VW - b.w - 4) b.vx *= -1;
  let targetY = GROUND_TOP - 90 + Math.sin(b.bob)*10;
  if (b.atk === "eggs"){
    b.swoopCd -= 1/60;
    if (b.swoop > 0){ b.swoop -= 1/60; targetY = GROUND_TOP - 34; b.x += (p.x - b.x) * 0.02; }
    else if (b.swoopCd <= 0){ b.swoop = 1.1; b.swoopCd = rnd(3.5,5.5); }
  }
  b.y += (targetY - b.y) * 0.08;

  // Attacks (rate rises per level but stays fair).
  b.atkTimer -= 1/60;
  if (b.atkTimer <= 0){
    const cx = b.x + b.w/2, cy = b.y + b.h;
    if (b.atk === "carrots"){                  // L1: 2 carrots / 2s
      for (let i=0;i<2;i++){ const a = i? -0.6 : 0.6; game.shots.push(makeProjectile(cx, cy, -2.2, a, "carrot", 1)); }
      b.atkTimer = b.rate;
    } else if (b.atk === "poison"){            // L2: 3-shot poison burst, then a ~2s safe pause
      if (b.burst <= 0) b.burst = 3;           // start a new burst
      const dx = p.x-cx, dy = p.y-cy, m = Math.hypot(dx,dy) || 1;
      const spread = (b.burst - 2) * 0.35;     // slight vertical fan across the 3 shots
      game.shots.push(makeProjectile(cx, cy, dx/m*2.7, dy/m*2.7 + spread, "poison", 1));
      b.burst--;
      b.atkTimer = (b.burst > 0) ? 0.20 : 2.0; // quick within the burst, ~2s pause after it
    } else if (b.atk === "eggs"){              // L3: drop eggs
      game.shots.push(makeProjectile(cx, cy, rnd(-1,1), 1.4, "egg", 1));
      b.atkTimer = b.rate*0.8;
    } else {                                   // L4: frequent lasers
      game.shots.push(makeProjectile(b.x, b.y+b.h/2, -3.4, 0, "laser", 1));
      b.atkTimer = b.rate*0.6;
    }
  }
}

/* ---------- 7. COMBAT, POWERUPS, SCORING ---------- */
function swordRect(p){
  const power = game.power && game.power.type === "sword";
  const len = power ? 13 : 8;   // normal sword range +~15% (was 7)
  const h   = power ? 7  : 8;   // normal sword hitbox a touch taller too
  const y = p.y + 5;
  const x = p.dir > 0 ? p.x + p.w : p.x - len;
  return { x, y, w:len, h };
}
function doSwordHits(){
  const p = game.player;
  if (p.swing <= 0) return;
  const rect = swordRect(p);
  const dmg = (game.power && game.power.type==="sword") ? 2 : 1;
  // Enemies
  for (const e of game.enemies){
    if (p.hitSet.includes(e) || e.phase === "ledge") continue;
    if (aabb(rect, hitbox(e))){
      e.hp -= dmg; e.flash = 6; p.hitSet.push(e);
      if (e.hp <= 0){ defeatEnemy(e); }
      else if (e.type === "zombie"){                 // first hit: knock back ~2 body lengths
        e.x = clamp(e.x + p.dir * e.w * 2, -20, VW+20);
        e.stun = 14;                                 // brief stun so the knockback reads
      }
    }
  }
  // Boss
  const b = game.boss;
  if (b && !p.hitSet.includes(b) && aabb(rect, b)){ b.hp -= dmg; b.flash = 8; p.hitSet.push(b);
    if (b.hp <= 0) defeatBoss(b); }
}
function defeatEnemy(e){
  Chip.sfx("defeat");
  const i = game.enemies.indexOf(e); if (i>=0) game.enemies.splice(i,1);
  game.swordKills++;
  game.levelDefeats++;
  addScore(e.pts, e.x, e.y);
  if (game.pendingDrop){ game.pendingDrop = false; dropPowerup(e.x, e.y); }
}
function defeatBoss(b){
  Chip.sfx("defeat");
  const L = LEVELS[b.level];
  game.boss = null;
  addScore(L.reward + L.bonus, b.x, b.y);
  game.floats.push(makeFloat(b.x, b.y-10, "BOSS DOWN +"+(L.reward+L.bonus), "#ffd24a"));
  if (b.level >= LEVELS.length-1) winGame();
  else startLevel(b.level+1);
}
function addScore(pts, x, y){
  game.score += pts;
  if (game.score > game.best) game.best = game.score;
  game.floats.push(makeFloat(x, y-6, "+"+pts, "#9be34a"));
  // Every 7 score, arm the next enemy to drop a powerup.
  while (game.score - game.powerMark >= 7){ game.powerMark += 7; game.pendingDrop = true; }
}
function dropPowerup(x,y){ game.drops.push(makePowerup(x, y, coin() ? "invincible" : "sword")); }
function activatePower(type){                       // only 1 active at once (replaces)
  Chip.sfx("power");
  game.power = { type, timer: 5 };
  game.floats.push(makeFloat(game.player.x, game.player.y-12, type==="invincible"?"INVINCIBLE!":"POWER SWORD!", "#4ad2ff"));
}
function hurtPlayer(source){
  const p = game.player;
  if (p.iframe > 0) return;
  if (game.power && game.power.type === "invincible") return;
  Chip.sfx("hit");
  p.hp--; p.iframe = 70; game.consec = 0;
  p.vx = (source && source.x > p.x) ? -2.5 : 2.5; p.vy = -3;
  if (p.hp <= 0) killPlayer();
}
function respawn(){                         // score already 0 (reset in killPlayer)
  if (game.atBoss) respawnBoss();          // boss checkpoint: rematch the reset boss
  else respawnPlayer();                    // otherwise: only the player respawns
}
function respawnPlayer(){
  // Keep levelDefeats: already-defeated enemies stay defeated and are not respawned.
  // Clear the live field (so the player isn't instantly re-hit); kill progress is preserved.
  game.enemies = []; game.shots = []; game.drops = [];
  game.player = makePlayer();
  game.spawnTimer = 60;                     // brief grace before enemies resume
  const L = LEVELS[game.level];
  banner(L.name + " — " + game.levelDefeats + "/" + L.threshold + " DEFEATED", 100);
  game.state = "PLAY";
}
function respawnBoss(){
  game.enemies = []; game.shots = []; game.drops = [];
  game.player = makePlayer();
  game.boss = makeBoss(game.level);        // fresh boss: full HP + initial attack state
  banner(LEVELS[game.level].full + " — REMATCH!", 120);
  game.state = "PLAY";
}
function killPlayer(){
  // Death: subtract a life immediately, wipe score/power-ups, then either end or respawn.
  game.lives--;
  game.score = 0; game.powerMark = 0; game.pendingDrop = false; game.power = null; game.consec = 0;
  if (game.lives <= 0){ gameOver(); return; }                 // end the game at 0 lives
  game.floats.push(makeFloat(game.player.x, game.player.y-10, "LIFE LOST", "#ff5a5a"));
  game.pendingRespawn = true;                                 // auto-respawn at level start next step
}

/* ---------- 8. PLAYER UPDATE & PHYSICS ---------- */
// When i-frames end, silently shove off any enemies still overlapping the player's
// hitbox: they are removed with NO score, kill, drop, or combo progress, so a
// pinning enemy can't land a free hit the moment invincibility wears off.
function clearPinningEnemies(){
  const p = game.player;
  for (let i = game.enemies.length-1; i>=0; i--){
    const e = game.enemies[i];
    if (e.phase === "ledge") continue;
    if (aabb(p, hitbox(e))){
      game.enemies.splice(i, 1);
      game.floats.push(makeFloat(e.x, e.y-6, "SHOVED OFF", "#cfd8ff"));
    }
  }
}
function updatePlayer(){
  const p = game.player;
  p.shielding = held.shield && p.grounded;      // shield is a grounded stance
  const spd = p.shielding ? MOVE*0.35 : MOVE;
  p.vx = (held.left?-spd:0) + (held.right?spd:0);
  if (held.left) p.dir = -1; else if (held.right) p.dir = 1;

  if (justJump && p.grounded && !p.shielding){ p.vy = JUMP_V; Chip.sfx("jump"); }
  p.x += p.vx;
  p.x = clamp(p.x, 0, VW - p.w);
  stepPhysics(p);

  // Sword
  if (p.swordCd > 0) p.swordCd--;
  if (justSword && p.swordCd <= 0 && !p.shielding){ p.swing = 12; p.swordCd = 20; p.hitSet = []; Chip.sfx("sword"); }
  if (p.swing > 0){ doSwordHits(); p.swing--; }
  if (p.iframe > 0){ p.iframe--; if (p.iframe === 0) clearPinningEnemies(); }

  // Head-bounce (dodge) vs enemies: bounce, no kill, feed the life streak.
  for (const e of game.enemies){
    if (e.phase === "ledge") continue;
    const hb = hitbox(e);
    if (aabb(p, hb)){
      const falling = p.vy > 0 && (p.y + p.h) - hb.y < 8;
      if (falling){
        p.vy = JUMP_V*0.7; game.consec++; game.jumpedEnemies++;
        game.floats.push(makeFloat(e.x, e.y-6, "JUMP "+game.consec+"/5", "#c9a2ff"));
        if (game.consec >= 5){ game.lives++; game.consec = 0; Chip.sfx("life");
          game.floats.push(makeFloat(p.x, p.y-14, "+1 LIFE!", "#ffd24a")); }
      } else if (!p.shielding || Math.sign(e.x - p.x) !== p.dir){
        hurtPlayer(e);
      }
    }
    if (game.pendingRespawn || game.state !== "PLAY") return;   // died this frame
  }
  // Boss contact damage.
  if (game.boss && aabb(p, game.boss)){ hurtPlayer(game.boss);
    if (game.pendingRespawn || game.state !== "PLAY") return; }

  // Powerup pickups.
  for (let i=game.drops.length-1;i>=0;i--){ const d = game.drops[i]; stepPhysics(d);
    if (aabb(p, d)){ activatePower(d.type); game.drops.splice(i,1); } }

  // Active powerup timer.
  if (game.power){ game.power.timer -= 1/60; if (game.power.timer <= 0) game.power = null; }
}
function updateShots(){
  const p = game.player;
  for (let i=game.shots.length-1;i>=0;i--){
    const s = game.shots[i]; s.x += s.vx; s.y += s.vy;
    if (s.kind === "brain" || s.kind === "carrot" || s.kind === "poison" || s.kind === "egg") s.vy += 0.03;
    s.life -= 1/60;
    if (s.life <= 0 || s.x < -12 || s.x > VW+12 || s.y > VH+12){ game.shots.splice(i,1); continue; }
    if (aabb(s, p)){
      const blocked = p.shielding && Math.sign(s.x - p.x) === p.dir;  // frontal block
      if (blocked){ game.shots.splice(i,1); game.floats.push(makeFloat(p.x, p.y-8,"BLOCK","#cfd8ff")); }
      else { hurtPlayer(s); game.shots.splice(i,1); }
    }
  }
}
function updateFloats(){ for (let i=game.floats.length-1;i>=0;i--){ const f=game.floats[i]; f.y-=0.5; f.life-=0.02; if (f.life<=0) game.floats.splice(i,1); } }

/* ---------- 9. RENDERING (rect pixel art) ---------- */
function R(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w,h); }
function text(str,x,y,c,size){ ctx.fillStyle=c||"#fff"; ctx.font=(size||8)+"px 'Courier New', monospace"; ctx.textAlign="left"; ctx.fillText(str,x,y); }
function ctext(str,x,y,c,size){ ctx.fillStyle=c||"#fff"; ctx.font=(size||8)+"px 'Courier New', monospace"; ctx.textAlign="center"; ctx.fillText(str,x,y); ctx.textAlign="left"; }

function drawWorld(){
  // sky
  const g = ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,"#241640"); g.addColorStop(1,"#3a1c4e");
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // platforms
  for (const pl of PLATFORMS){
    if (pl===PLATFORMS[0]){ R(0,pl.y,VW,pl.h,"#20182f"); R(0,pl.y,VW,3,"#3a2d55"); }
    else if (pl===LEDGE){ R(pl.x,pl.y,pl.w,pl.h,"#4a3a2a"); R(pl.x,pl.y,pl.w,2,"#6b573c"); }
    else { R(pl.x,pl.y,pl.w,pl.h,"#37507a"); R(pl.x,pl.y,pl.w,2,"#5f7fbf"); }
  }
}
function drawPlayer(p){
  if (p.iframe>0 && (p.iframe>>2)%2===0) {} else {
    const x=p.x|0, y=p.y|0, C=P1COL;
    R(x+2,y+13,3,5,C.jeans); R(x+7,y+13,3,5,C.jeans);   // jeans
    R(x+1,y+18,4,2,C.shoe);  R(x+7,y+18,4,2,C.shoe);    // shoes
    R(x+1,y+6,10,8,C.shirt);                            // black shirt
    R(x+3,y+8,6,3,C.logo);                              // "RNR" logo patch
    R(x,y+6,1,6,C.shirt); R(x+11,y+6,1,6,C.shirt);      // arms
    R(x+3,y,6,6,C.skin);                                // head
    R(x+2,y-1,8,3,C.hair); R(x+2,y+2,1,5,C.hair); R(x+9,y+2,1,5,C.hair); // rocker hair
    if (game.power && game.power.type==="invincible"){ ctx.strokeStyle="#ffe27a"; ctx.strokeRect(x-1.5,y-2.5,p.w+3,p.h+3); }
  }
  // shield
  if (p.shielding){ const sx = p.dir>0 ? p.x+p.w+1 : p.x-3; R(sx,p.y+5,2,9,"#c9a227"); R(sx,p.y+5,2,2,"#efd27a"); }
  // sword
  if (p.swing>0){ const r=swordRect(p); R(r.x, r.y+2, r.w, 2, "#e8e8ef"); R(r.x, r.y, r.w, 1, "#fff"); }
}
function drawEnemy(e){
  const x=e.x|0, y=e.y|0, hit = e.flash>0;
  if (e.type==="mummy"){ R(x+2,y,10,14, hit?"#fff":"#dcdccb"); R(x+2,y+4,10,2,"#b9b9a6"); R(x+2,y+9,10,2,"#b9b9a6");
    R(x+4,y+3,2,2,"#333"); R(x+8,y+3,2,2,"#333"); }
  else { R(x+2,y,10,14, hit?"#fff":"#5fae5f"); R(x+3,y+3,2,2,"#123"); R(x+7,y+3,2,2,"#123"); R(x+3,y+8,6,1,"#1c3a1c");
    R(x+1,y+6,2,5,"#4d924d"); R(x+11,y+6,2,5,"#4d924d"); }
  if (e.type==="zombie" && e.hp>=2) R(x+2,y-2,10,1,"#8f8"); // full-hp tick
}
function drawBoss(b){
  const x=b.x|0, y=b.y|0, hit=b.flash>0;
  const base = hit ? "#fff" : ["#e9e9e9","#d9c27a","#8a5a2b","#3a3050"][b.level];
  R(x,y,b.w,b.h,base);
  if (b.level===0){ R(x+4,y-8,5,9,base); R(x+b.w-9,y-8,5,9,base); R(x+6,y+8,4,4,"#e33"); R(x+b.w-10,y+8,4,4,"#e33"); } // bunny ears + eyes
  if (b.level===1){ R(x,y+b.h,6,6,base); R(x-6,y+b.h,6,6,base); R(x+6,y+7,5,5,"#333"); R(x+b.w-11,y+7,5,5,"#333"); }   // snake tail
  if (b.level===2){ R(x+3,y+6,7,7,"#ffcf4a"); R(x+b.w-10,y+6,7,7,"#ffcf4a"); R(x+5,y+8,3,3,"#111"); R(x+b.w-8,y+8,3,3,"#111"); R(x+b.w/2-2,y+13,4,4,"#ff8a3d"); } // owl eyes+beak
  if (b.level===3){ R(x+5,y+7,6,4,"#ff3b6b"); R(x+b.w-11,y+7,6,4,"#ff3b6b"); R(x+2,y-4,b.w-4,3,"#6a5aa0"); }           // overlord visor
  // health bar
  R(x-2, y-8, b.w+4, 4, "#331"); R(x-2, y-8, (b.w+4)*(b.hp/b.maxHp), 4, "#ff4d6a");
}
function drawShot(s){
  const x=s.x|0,y=s.y|0;
  const col = { tp:"#f2f2ee", brain:"#e77", carrot:"#ff8a2b", poison:"#7be04a", egg:"#f5efdc", laser:"#ff3b6b" }[s.kind] || "#fff";
  if (s.kind==="laser"){ R(x-4,y+1,12,3,col); } else R(x,y,6,6,col);
  if (s.kind==="carrot") R(x+1,y-2,4,2,"#3fae3f");
}
function drawHUD(){
  R(0,0,VW,14,"rgba(8,6,18,.72)");
  text("LIVES "+game.lives, 4, 10, "#ffd24a");
  text("HP "+(game.player?game.player.hp:0)+"/2", 62, 10, game.player&&game.player.hp<2?"#ff6a6a":"#9be34a");
  text("SCORE "+game.score, 120, 10, "#fff");
  text("BEST "+game.best, 200, 10, "#bbb");
  const L = LEVELS[game.level];
  if (!game.boss) text(L.name+"  "+game.levelDefeats+"/"+L.threshold, 262, 10, "#c9a2ff");
  else text(L.name+"  BOSS", 262, 10, "#ff6a9a");
  text("JUMP "+game.consec+"/5", 372, 10, "#c9a2ff");
  if (game.power){ const bar = Math.max(0, game.power.timer/5);
    R(430,4,44,7,"#222"); R(430,4,44*bar, 7, game.power.type==="invincible"?"#ffe27a":"#4ad2ff");
    ctext(game.power.type==="invincible"?"INV":"SWD", 452, 10, "#111", 7); }
}
function drawBanner(){ if (game.bannerT>0){ ctx.globalAlpha = Math.min(1, game.bannerT/40);
  R(0,VH/2-14,VW,22,"rgba(0,0,0,.55)"); ctext(game.banner, VW/2, VH/2+1, "#ffd24a", 11); ctx.globalAlpha=1; } }

function drawTitle(){
  drawWorld();
  ctext("ROCK N' ROLL", VW/2, 70, "#ff4d6a", 26);
  ctext("RUMBLE", VW/2, 96, "#e2b13c", 22);
  ctext("←→ move   SPACE jump   X sword   Z shield", VW/2, 130, "#cfd", 9);
  ctext("Stomp 5 foes in a row for +1 life. Sword is your only kill.", VW/2, 146, "#9ab", 8);
  const s = loadScores();
  ctext("— HIGH SCORES —", VW/2, 172, "#fff", 9);
  for (let i=0;i<3;i++){ const e=s[i];
    ctext((i+1)+". "+(e?e.name+"  "+e.score:"---"), VW/2, 188+i*14, i===0?"#ffd24a":"#bbb", 9); }
  ctext("PRESS SPACE TO START", VW/2, 250, (Date.now()>>8)%2?"#fff":"#ff4d6a", 11);
}
function drawEnd(){
  drawWorld();
  if (game.won){ ctext("YOU BEAT THE OVERLORD!", VW/2, 60, "#ffd24a", 16);
    ctext("FINAL TREASURE", VW/2, 88, "#fff", 11);
    ctext(game.finalValue.toLocaleString(), VW/2, 112, "#9be34a", 24);
    ctext("score×100 + 4×sword("+game.swordKills+") + jumps("+game.jumpedEnemies+")", VW/2, 130, "#9ab", 8);
  } else { ctext("GAME OVER", VW/2, 74, "#ff4d6a", 26);
    ctext("BEST SCORE  "+game.finalValue, VW/2, 104, "#fff", 12); }
  const s = loadScores();
  ctext("— HIGH SCORES —", VW/2, 156, "#fff", 9);
  for (let i=0;i<3;i++){ const e=s[i];
    ctext((i+1)+". "+(e?e.name+"  "+e.score+"  ("+HS_TITLES[i]+")":"---"), VW/2, 172+i*15, i===0?"#ffd24a":"#bbb", 8); }
  if (game.entered || !qualifies(game.finalValue)) ctext("PRESS SPACE FOR TITLE", VW/2, 250, (Date.now()>>8)%2?"#fff":"#ff4d6a", 10);
}

function render(){
  ctx.clearRect(0,0,VW,VH);
  if (game.state==="TITLE"){ drawTitle(); return; }
  if (game.state==="END"){ drawEnd(); return; }
  drawWorld();
  for (const d of game.drops){ R(d.x,d.y,d.w,d.h, d.type==="invincible"?"#ffe27a":"#4ad2ff"); ctext(d.type==="invincible"?"I":"S", d.x+d.w/2, d.y+d.h-2, "#111", 8); }
  for (const e of game.enemies) drawEnemy(e);
  if (game.boss) drawBoss(game.boss);
  for (const s of game.shots) drawShot(s);
  if (game.player) drawPlayer(game.player);
  for (const f of game.floats){ ctx.globalAlpha=Math.max(0,f.life); ctext(f.text, f.x, f.y, f.col, 8); ctx.globalAlpha=1; }
  drawHUD(); drawBanner();
}

/* ---------- 10. STATE MACHINE & MAIN LOOP ---------- */
function gameOver(){ game.finalValue = game.best; endRun(false); }
function winGame(){
  game.won = true;
  game.finalValue = game.score*100 + 4*game.swordKills + 1*game.jumpedEnemies;
  endRun(true);
}
function endRun(won){
  game.state = "END"; game.entered = false;
  if (qualifies(game.finalValue)) openEntry(won);   // ask for a name via overlay
}
function openEntry(won){
  const box = document.getElementById("entry");
  document.getElementById("entryTitle").textContent = won ? "NEW TREASURE RECORD!" : "NEW HIGH SCORE!";
  const inp = document.getElementById("entryName"); inp.value = "";
  box.classList.add("show"); setTimeout(()=>inp.focus(), 30);
}
document.getElementById("entrySave").addEventListener("click", commitEntry);
document.getElementById("entryName").addEventListener("keydown", e=>{ if (e.key==="Enter") commitEntry(); });
function commitEntry(){
  const name = document.getElementById("entryName").value.trim() || "ROCKER";
  submitScore(name, game.finalValue);
  game.entered = true;
  document.getElementById("entry").classList.remove("show");
}
function startOrTitleAction(){
  if (game.state==="TITLE"){ resetGame(); }
  else if (game.state==="END"){ if (!document.getElementById("entry").classList.contains("show")) game.state="TITLE"; }
}

function stepGame(){
  if (game.state !== "PLAY") return;
  if (game.pendingRespawn){ game.pendingRespawn = false; respawn(); return; }
  if (game.bannerT > 0) game.bannerT--;
  spawnLogic();
  for (const e of game.enemies) updateEnemy(e);
  if (game.boss) updateBoss(game.boss);
  updatePlayer();
  updateShots();
  updateFloats();
}

// Pick the music intensity from the current game state.
function sceneFor(){
  if (game.state==="TITLE") return "menu";
  if (game.state==="END")   return game.won ? "win" : "gameover";
  if (game.state==="PLAY")  return game.boss ? "boss" : "play";
  return "menu";
}

// Fixed-timestep loop (deterministic physics, frame-rate independent).
let acc = 0, last = performance.now();
function loop(now){
  let dt = (now - last)/1000; last = now; if (dt > 0.1) dt = 0.1;
  acc += dt;
  while (acc >= 1/60){ stepGame(); justJump = false; justSword = false; acc -= 1/60; }
  Chip.setScene(sceneFor());     // swap gameplay / boss / victory music as state changes
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
